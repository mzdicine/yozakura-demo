<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- 真琴徽记：细框眼镜 + 镜片反光 + 快 5 分钟的表针（反差感：摘下眼镜＝开关） -->
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8ecff" stop-opacity=".55"/><stop offset=".5" stop-color="#8fb3e8" stop-opacity=".12"/><stop offset="1" stop-color="#8fb3e8" stop-opacity=".3"/></linearGradient></defs>
  <circle cx="48" cy="48" r="45" fill="#141a33" fill-opacity=".72" stroke="#8fb3e8" stroke-width="1.5" stroke-opacity=".8"/>
  <circle cx="48" cy="48" r="40" fill="none" stroke="#d9bf8a" stroke-opacity=".35" stroke-dasharray="1 4"/>
  <!-- 表盘（淡） -->
  <circle cx="48" cy="48" r="30" fill="none" stroke="#8fb3e8" stroke-opacity=".18"/>
  <g stroke="#8fb3e8" stroke-opacity=".35" stroke-width="1.4"><path d="M48 20v4M48 72v4M20 48h4M72 48h4"/></g>
  <path d="M48 48 L53 27" stroke="#d9bf8a" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/>
  <!-- 眼镜 -->
  <g fill="url(#g)" stroke="#e8ecff" stroke-width="2.2">
    <rect x="17" y="40" width="26" height="19" rx="7"/><rect x="53" y="40" width="26" height="19" rx="7"/>
  </g>
  <path d="M43 46 Q48 42 53 46" stroke="#e8ecff" stroke-width="2.2" fill="none"/>
  <path d="M17 44 L10 41 M79 44 L86 41" stroke="#e8ecff" stroke-width="2" stroke-linecap="round"/>
  <!-- 反光 -->
  <path d="M21 52 L29 43 M25 54 L31 47" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".85"/>
  <path d="M67 37 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6-4 -4-1.6 4-1.6z" fill="#ffffff" fill-opacity=".9"/>
