<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- 隐藏线 demo_trio 徽记（结衣）：眼镜（真琴）＋铃兰（雪乃）＋三滴雨（「同一场雨」）。只在解锁后/通关后出现，锁定态绝不使用。 -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fb3e8"/><stop offset=".5" stop-color="#d9bf8a"/><stop offset="1" stop-color="#c97a8a"/></linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8ecff" stop-opacity=".5"/><stop offset="1" stop-color="#8fb3e8" stop-opacity=".15"/></linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8ecff"/><stop offset="1" stop-color="#8fb3e8" stop-opacity=".6"/></linearGradient>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#141a33" fill-opacity=".74" stroke="url(#ring)" stroke-width="1.8"/>
  <circle cx="48" cy="48" r="40" fill="none" stroke="#d9bf8a" stroke-opacity=".35" stroke-dasharray="1 4"/>
  <!-- 雨：三滴，一样大小 -->
  <g fill="url(#drop)" fill-opacity=".9">
    <path d="M30 14 q3 5 3 7.5 a3 3 0 0 1 -6 0 q0 -2.5 3 -7.5z"/>
    <path d="M48 10 q3 5 3 7.5 a3 3 0 0 1 -6 0 q0 -2.5 3 -7.5z"/>
    <path d="M66 14 q3 5 3 7.5 a3 3 0 0 1 -6 0 q0 -2.5 3 -7.5z"/>
  </g>
  <!-- 眼镜（摘下、横放） -->
  <g fill="url(#lens)" stroke="#e8ecff" stroke-width="2">
    <rect x="20" y="33" width="22" height="16" rx="6"/><rect x="54" y="33" width="22" height="16" rx="6"/>
  </g>
  <path d="M42 38 Q48 34.5 54 38" stroke="#e8ecff" stroke-width="2" fill="none"/>
  <path d="M24 44 L31 36" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".8"/>
  <!-- 铃兰：一枝横过镜框下方 -->
  <path d="M18 74 C34 62 54 58 78 60" stroke="#8fa36a" stroke-width="1.8" fill="none"/>
  <path d="M22 78 C36 70 50 70 60 74 C46 78 34 80 22 78z" fill="#6f8a55" fill-opacity=".85"/>
  <g fill="#fbf5ec">
    <path d="M40 60 q-4 0 -4 5 q2 -1.5 4 0 q2 -1.5 4 0 q0 -5 -4 -5z"/>
    <path d="M52 57.5 q-4 0 -4 5 q2 -1.5 4 0 q2 -1.5 4 0 q0 -5 -4 -5z"/>
    <path d="M64 58 q-4 0 -4 5 q2 -1.5 4 0 q2 -1.5 4 0 q0 -5 -4 -5z"/>
  </g>
  <circle cx="74" cy="58.5" r="2.4" fill="#c97a8a"/>
</svg>
