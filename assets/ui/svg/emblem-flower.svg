  <circle cx="48" cy="48" r="45" fill="#141a33" fill-opacity=".72" stroke="#c97a8a" stroke-width="1.5" stroke-opacity=".85"/>
  <circle cx="48" cy="48" r="40" fill="none" stroke="#d9bf8a" stroke-opacity=".35" stroke-dasharray="1 4"/>
  <!-- 空花瓶 -->
  <path d="M26 46 h12 v3 q-2 2 -2 4 q7 6 6 14 q-1 7 -10 7 q-9 0 -10 -7 q-1 -8 6 -14 q0 -2 -2 -4z" fill="#c97a8a" fill-opacity=".22" stroke="#c97a8a" stroke-width="1.6"/>
