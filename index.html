yukino","disp":null,"br":"「","text":"养死了的话，要来店里赔罪哦。","src":"script/scene_03.txt:30","rid":"scene_03_start#14","expr":"smile","voice":"yukino_c03_0005"},{"t":"say","who":"hero","disp":null,"br":"「","text":"赔罪……是要赔多少钱？","src":"script/scene_03.txt:31","rid":"scene_03_start#15"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"不要钱。陪姐姐喝一杯就好。","src":"script/scene_03.txt:32","rid":"scene_03_start#16","voice":"yukino_c03_0006"},{"t":"say","who":null,"disp":null,"br":null,"text":"她把花盆放进我手里。左手无名指上，一枚细细的银戒指。","src":"script/scene_03.txt:33","rid":"scene_03_start#17"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……这栋楼的女性，怎么都戴着戒指。","src":"script/scene_03.txt:34","rid":"scene_03_start#18"},{"t":"say","who":null,"disp":null,"br":null,"text":"她顺势凑近，盯着我的脸。","src":"script/scene_03.txt:35","rid":"scene_03_start#19"},{"t":"say","who":null,"disp":null,"br":null,"text":"她半垂着眼，嘴角只扬起一边。","src":"script/scene_03.txt:36","rid":"scene_03_start#20"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……哎呀。脸红了？","src":"script/scene_03.txt:37","rid":"scene_03_start#21","expr":"smile","voice":"yukino_c03_0007"},{"t":"say","who":"hero","disp":null,"br":"（","text":"太近了，这个人……！","src":"script/scene_03.txt:38","rid":"scene_03_start#22"},{"t":"choice","src":"script/scene_03.txt:40","opts":[{"text":"「我会好好养的。一定不让它死。」","fx":[{"n":"aff_yukino","op":"+=","val":2},{"n":"f_lily","op":"=","val":true}],"target":null,"cond":null,"body":193,"src":"script/scene_03.txt:41"},{"text":"「……脸红？没有吧。」","fx":[{"n":"aff_yukino","op":"+=","val":1},{"n":"f_lily","op":"=","val":true}],"target":null,"cond":null,"body":197,"src":"script/scene_03.txt:45"},{"text":"「我养什么死什么，还是算了吧……」","fx":null,"target":null,"cond":null,"body":200,"src":"script/scene_03.txt:48"}],"end":203},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……","src":"script/scene_03.txt:42","rid":"scene_03_start#23","expr":"surprised","voice":"yukino_c03_0008"},{"t":"say","who":null,"disp":null,"br":null,"text":"她眨了眨眼，好像没想到我会认真回答。","src":"script/scene_03.txt:43","rid":"scene_03_start#24"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯。那就拜托你了。","src":"script/scene_03.txt:44","rid":"scene_03_start#25","expr":"smile","voice":"yukino_c03_0009"},{"t":"goto","to":203,"src":"script/scene_03.txt:45"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"有哦。耳朵都红了。真可爱。","src":"script/scene_03.txt:46","rid":"scene_03_start#26","expr":"smile","voice":"yukino_c03_0010"},{"t":"say","who":"hero","disp":null,"br":"（","text":"越否认越输……","src":"script/scene_03.txt:47","rid":"scene_03_start#27"},{"t":"goto","to":203,"src":"script/scene_03.txt:48"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那就更要养了。","src":"script/scene_03.txt:49","rid":"scene_03_start#28","expr":"smile","voice":"yukino_c03_0011"},{"t":"say","who":null,"disp":null,"br":null,"text":"她不由分说，把花盆按进我怀里。","src":"script/scene_03.txt:50","rid":"scene_03_start#29"},{"t":"goto","to":203,"src":"script/scene_03.txt:52"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"铃兰的花语，是『幸福归来』。","src":"script/scene_03.txt:54","rid":"scene_03_start#30","expr":"normal","voice":"yukino_c03_0012"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"刚搬家的人，最适合了。","src":"script/scene_03.txt:55","rid":"scene_03_start#31","voice":"yukino_c03_0013"},{"t":"say","who":null,"disp":null,"br":null,"text":"我环顾店里。柜台旁边的架子上，放着一个细长的玻璃花瓶。","src":"script/scene_03.txt:56","rid":"scene_03_start#32"},{"t":"say","who":null,"disp":null,"br":null,"text":"满屋子都是花，只有它是空的。","src":"script/scene_03.txt:57","rid":"scene_03_start#33"},{"t":"say","who":"hero","disp":null,"br":"「","text":"那个花瓶，不插花吗？","src":"script/scene_03.txt:58","rid":"scene_03_start#34"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……","src":"script/scene_03.txt:59","rid":"scene_03_start#35","expr":"sad","voice":"yukino_c03_0014"},{"t":"chara","src":"script/scene_03.txt:60","id":"yukino","expr":"smile","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那个呀，是在等合适的花。","src":"script/scene_03.txt:61","rid":"scene_03_start#36","voice":"yukino_c03_0015"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"好啦，小哥快回去，天要黑了。","src":"script/scene_03.txt:62","rid":"scene_03_start#37","voice":"yukino_c03_0016"},{"t":"say","who":null,"disp":null,"br":null,"text":"她把我推出门的时候，柜台上一本厚厚的本子被碰开了。","src":"script/scene_03.txt:63","rid":"scene_03_start#38"},{"t":"say","who":null,"disp":null,"br":null,"text":"封面写着「预订簿」。翻开的那页上，有一行“藤花”。","src":"script/scene_03.txt:64","rid":"scene_03_start#39"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……刚才那一瞬间，她的表情。","src":"script/scene_03.txt:65","rid":"scene_03_start#40"},{"t":"say","who":"hero","disp":null,"br":"（","text":"是我看错了吗。","src":"script/scene_03.txt:66","rid":"scene_03_start#41"},{"t":"bgmfade","src":"script/scene_03.txt:68","time":2},{"t":"jump","src":"script/scene_03.txt:69","label":"scene_04_start"},{"t":"eof","src":"script/scene_03.txt:70"},{"t":"prefetch","se":["office_amb","door_open","phone_vibe"],"src":"script/scene_04.txt:1"},{"t":"label","src":"script/scene_04.txt:7","name":"scene_04_start"},{"t":"bg","src":"script/scene_04.txt:8","id":"office_day","trans":"black","time":null,"hold":1,"keep":false},{"t":"bgm","src":"script/scene_04.txt:9","name":"daily","vol":1,"fade":1.5},{"t":"ambient","src":"script/scene_04.txt:10","name":"office_amb","vol":0.4,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"四月六日，星期一。","src":"script/scene_04.txt:12","rid":"scene_04_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"株式会社水濑文具，商品企划部，企划一课。","src":"script/scene_04.txt:13","rid":"scene_04_start#1"},{"t":"say","who":null,"disp":null,"br":null,"text":"我的社会人生活，从一句话开始。","src":"script/scene_04.txt:14","rid":"scene_04_start#2"},{"t":"chara","src":"script/scene_04.txt:15","id":"bucho","expr":"normal","outfit":"suit","pos":"center","trans":"fade","time":null},{"t":"say","who":"bucho","disp":null,"br":"「","text":"早川。","src":"script/scene_04.txt:16","rid":"scene_04_start#3","voice":"bucho_c04_0001"},{"t":"say","who":"hero","disp":null,"br":"「","text":"是、是！","src":"script/scene_04.txt:17","rid":"scene_04_start#4"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"结论先说。","src":"script/scene_04.txt:18","rid":"scene_04_start#5","voice":"bucho_c04_0002"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……诶？","src":"script/scene_04.txt:19","rid":"scene_04_start#6"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"你要说的话，先说结论。理由放后面。","src":"script/scene_04.txt:20","rid":"scene_04_start#7","voice":"bucho_c04_0003"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"这个课，没有时间听开场白。以上。","src":"script/scene_04.txt:21","rid":"scene_04_start#8","voice":"bucho_c04_0004"},{"t":"say","who":null,"disp":null,"br":null,"text":"白石恭一郎部长。四十六岁。","src":"script/scene_04.txt:22","rid":"scene_04_start#9"},{"t":"say","who":null,"disp":null,"br":null,"text":"深灰色的三件套，细金属框眼镜，眉间一道很深的竖纹。","src":"script/scene_04.txt:23","rid":"scene_04_start#10"},{"t":"say","who":null,"disp":null,"br":null,"text":"他转身走回座位，整个课的空气才重新开始流动。","src":"script/scene_04.txt:24","rid":"scene_04_start#11"},{"t":"hide","src":"script/scene_04.txt:25","id":"bucho","trans":"fade","time":null},{"t":"say","who":"oomori","disp":null,"br":"「","text":"……新人，活下来了？","src":"script/scene_04.txt:26","rid":"scene_04_start#12"},{"t":"say","who":null,"disp":null,"br":null,"text":"隔壁座位的大森前辈，从隔板上面探出半张脸。","src":"script/scene_04.txt:27","rid":"scene_04_start#13"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"放心，部长对谁都那样。我第一年被『结论先说』了四十七次。","src":"script/scene_04.txt:28","rid":"scene_04_start#14"},{"t":"say","who":"hero","disp":null,"br":"「","text":"您还数了……","src":"script/scene_04.txt:29","rid":"scene_04_start#15"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"还有个情报。","src":"script/scene_04.txt:30","rid":"scene_04_start#16"},{"t":"say","who":null,"disp":null,"br":null,"text":"他压低声音，像在交接国家机密。","src":"script/scene_04.txt:31","rid":"scene_04_start#17"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"部长夫人，据说是超——级大美人。","src":"script/scene_04.txt:32","rid":"scene_04_start#18"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"可是，课里没有一个人见过真人。","src":"script/scene_04.txt:33","rid":"scene_04_start#19"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……前辈，比起这个，能先教我怎么用复印机吗。","src":"script/scene_04.txt:34","rid":"scene_04_start#20"},{"t":"bg","src":"script/scene_04.txt:36","id":"office_evening","trans":"black","time":null,"hold":0.6,"keep":false},{"t":"say","who":null,"disp":null,"br":null,"text":"四月八日，晚上八点。","src":"script/scene_04.txt:37","rid":"scene_04_start#21"},{"t":"say","who":null,"disp":null,"br":null,"text":"我第一次交上去的企划书，被红笔改得像一张地图。","src":"script/scene_04.txt:38","rid":"scene_04_start#22"},{"t":"chara","src":"script/scene_04.txt:39","id":"bucho","expr":"normal","outfit":"suit","pos":"center","trans":"fade","time":null},{"t":"say","who":"bucho","disp":null,"br":"「","text":"早川。","src":"script/scene_04.txt:40","rid":"scene_04_start#23","voice":"bucho_c04_0005"},{"t":"say","who":"hero","disp":null,"br":"（","text":"又来了……","src":"script/scene_04.txt:41","rid":"scene_04_start#24"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"很笨拙。","src":"script/scene_04.txt:42","rid":"scene_04_start#25","voice":"bucho_c04_0006"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"……但是，是认真用过文具的人写的。","src":"script/scene_04.txt:43","rid":"scene_04_start#26","voice":"bucho_c04_0007"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"这份，我拿去开会。","src":"script/scene_04.txt:44","rid":"scene_04_start#27","expr":"smile","voice":"bucho_c04_0008"},{"t":"say","who":null,"disp":null,"br":null,"text":"他只笑了一下，短得几乎看不见。","src":"script/scene_04.txt:45","rid":"scene_04_start#28"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……这个人，原来会笑啊。","src":"script/scene_04.txt:46","rid":"scene_04_start#29"},{"t":"hide","src":"script/scene_04.txt:47","id":"bucho","trans":"fade","time":null},{"t":"bg","src":"script/scene_04.txt:49","id":"office_day","trans":"black","time":null,"hold":0.6,"keep":false},{"t":"say","who":null,"disp":null,"br":null,"text":"四月九日。和广告代理商的第一次会议。","src":"script/scene_04.txt:50","rid":"scene_04_start#30"},{"t":"se","src":"script/scene_04.txt:51","name":"door_open","vol":1,"loop":false},{"t":"chara","src":"script/scene_04.txt:52","id":"makoto","expr":"normal","outfit":"suit","pos":"center","trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"初次见面。我是负责本次项目的椎名。","src":"script/scene_04.txt:53","rid":"scene_04_start#31","voice":"makoto_c04_0001"},{"t":"say","who":"hero","disp":null,"br":"（","text":"——202 的！","src":"script/scene_04.txt:54","rid":"scene_04_start#32"},{"t":"chara","src":"script/scene_04.txt:55","id":"makoto","expr":"surprised","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她的视线和我对上，停了零点五秒。","src":"script/scene_04.txt:56","rid":"scene_04_start#33"},{"t":"chara","src":"script/scene_04.txt:57","id":"makoto","expr":"normal","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，像什么也没发生一样，开始讲方案。","src":"script/scene_04.txt:58","rid":"scene_04_start#34"},{"t":"say","who":null,"disp":null,"br":null,"text":"声音清楚，数字精准，一个“嗯”都没有。","src":"script/scene_04.txt:59","rid":"scene_04_start#35"},{"t":"say","who":null,"disp":null,"br":null,"text":"会议桌上，大家面前都放着一杯加了糖的罐装咖啡。","src":"script/scene_04.txt:60","rid":"scene_04_start#36"},{"t":"say","who":null,"disp":null,"br":null,"text":"她喝了一口，眉头动了一下，就再也没碰过。","src":"script/scene_04.txt:61","rid":"scene_04_start#37"},{"t":"bg","src":"script/scene_04.txt:63","id":"office_day","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"say","who":null,"disp":null,"br":null,"text":"中场休息。我去了楼层角落的茶水间。","src":"script/scene_04.txt:64","rid":"scene_04_start#38"},{"t":"chara","src":"script/scene_04.txt:65","id":"makoto","expr":"tired","outfit":"suit","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她一个人站在窗边，悄悄揉了揉眉心。","src":"script/scene_04.txt:66","rid":"scene_04_start#39"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……该怎么办。","src":"script/scene_04.txt:67","rid":"scene_04_start#40"},{"t":"choice","src":"script/scene_04.txt:69","opts":[{"text":"递黑咖啡（她刚才只喝了一口加糖的就放下了）","fx":[{"n":"aff_makoto","op":"+=","val":2},{"n":"f_makoto_coffee","op":"=","val":true}],"target":null,"cond":null,"body":278,"src":"script/scene_04.txt:70"},{"text":"递拿铁（大家都喝这个）","fx":[{"n":"aff_makoto","op":"+=","val":1}],"target":null,"cond":null,"body":282,"src":"script/scene_04.txt:74"},{"text":"装作不认识邻居","fx":null,"target":null,"cond":null,"body":286,"src":"script/scene_04.txt:78"}],"end":290},{"t":"say","who":"hero","disp":null,"br":"「","text":"……那个，这个是黑的。","src":"script/scene_04.txt:71","rid":"scene_04_start#41"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……","src":"script/scene_04.txt:72","rid":"scene_04_start#42","expr":"surprised","voice":"makoto_c04_0002"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看看纸杯，又看看我，接了过去。","src":"script/scene_04.txt:73","rid":"scene_04_start#43"},{"t":"goto","to":290,"src":"script/scene_04.txt:74"},{"t":"say","who":"hero","disp":null,"br":"「","text":"椎名小姐，喝点东西吧。","src":"script/scene_04.txt:75","rid":"scene_04_start#44"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……谢谢。","src":"script/scene_04.txt:76","rid":"scene_04_start#45","expr":"normal","voice":"makoto_c04_0003"},{"t":"say","who":null,"disp":null,"br":null,"text":"她客气地接过去，放在了窗台上。","src":"script/scene_04.txt:77","rid":"scene_04_start#46"},{"t":"goto","to":290,"src":"script/scene_04.txt:78"},{"t":"say","who":"hero","disp":null,"br":"（","text":"公司里还是保持距离吧……","src":"script/scene_04.txt:79","rid":"scene_04_start#47"},{"t":"say","who":null,"disp":null,"br":null,"text":"我接了杯水，从她身后走过。","src":"script/scene_04.txt:80","rid":"scene_04_start#48"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……","src":"script/scene_04.txt:81","rid":"scene_04_start#49","expr":"normal","voice":"makoto_c04_0004"},{"t":"goto","to":290,"src":"script/scene_04.txt:82"},{"t":"se","src":"script/scene_04.txt:84","name":"phone_vibe","vol":1,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手机震了一下。看了一眼屏幕，她把它扣在窗台上。","src":"script/scene_04.txt:85","rid":"scene_04_start#50"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……早川先生。","src":"script/scene_04.txt:86","rid":"scene_04_start#51","expr":"annoyed","voice":"makoto_c04_0005"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"在公司，请不要跟我搭话。","src":"script/scene_04.txt:87","rid":"scene_04_start#52","voice":"makoto_c04_0006"},{"t":"if","src":"script/scene_04.txt:88","c":{"v":"f_makoto_coffee"},"f":298},{"t":"say","who":null,"disp":null,"br":null,"text":"她走到门口，停下来，侧过半张脸。","src":"script/scene_04.txt:89","rid":"scene_04_start#53"},{"t":"say","who":null,"disp":null,"br":null,"text":"眼镜后面，一边嘴角很克制地扬了一下。","src":"script/scene_04.txt:90","rid":"scene_04_start#54"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……谢谢。下次也要黑的。","src":"script/scene_04.txt:91","rid":"scene_04_start#55","expr":"smile","voice":"makoto_c04_0007"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"还有——你们部长。","src":"script/scene_04.txt:93","rid":"scene_04_start#56","expr":"normal","voice":"makoto_c04_0008"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"像一台不会休息的机器。你也小心别被传染。","src":"script/scene_04.txt:94","rid":"scene_04_start#57","voice":"makoto_c04_0009"},{"t":"bg","src":"script/scene_04.txt:96","id":"office_evening","trans":"black","time":null,"hold":0.6,"keep":false},{"t":"ambientstop","src":"script/scene_04.txt:97","name":"office_amb","fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"傍晚。部长在白板上写下一行字。","src":"script/scene_04.txt:98","rid":"scene_04_start#58"},{"t":"chara","src":"script/scene_04.txt:99","id":"bucho","expr":"normal","outfit":"suit","pos":"center","trans":"fade","time":null},{"t":"say","who":"bucho","disp":null,"br":"「","text":"明天，新人欢迎会。七点，站前『鸟吉』。","src":"script/scene_04.txt:100","rid":"scene_04_start#59","voice":"bucho_c04_0009"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"……不想喝的人，不用喝。以上。","src":"script/scene_04.txt:101","rid":"scene_04_start#60","voice":"bucho_c04_0010"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"……部长居然说了第二句话。","src":"script/scene_04.txt:102","rid":"scene_04_start#61"},{"t":"bgmfade","src":"script/scene_04.txt:104","time":2},{"t":"jump","src":"script/scene_04.txt:105","label":"scene_05_start"},{"t":"eof","src":"script/scene_04.txt:106"},{"t":"prefetch","se":["car_door","chime","door_open","cloth_rustle","clock_tick","door_close"],"src":"script/scene_05.txt:1"},{"t":"label","src":"script/scene_05.txt:8","name":"scene_05_start"},{"t":"bg","src":"script/scene_05.txt:9","id":"street_night","trans":"black","time":null,"hold":1,"keep":false},{"t":"bgm","src":"script/scene_05.txt:10","name":"daily","vol":1,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"四月十日，晚上十一点半。站前，居酒屋「鸟吉」门口。","src":"script/scene_05.txt:12","rid":"scene_05_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"欢迎会刚散场。主角是我，可是，我几乎没喝。","src":"script/scene_05.txt:13","rid":"scene_05_start#1"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"新人，第二家！今晚第一杯你还没干——","src":"script/scene_05.txt:14","rid":"scene_05_start#2"},{"t":"chara","src":"script/scene_05.txt:15","id":"bucho","expr":"tired","outfit":"suit","pos":"center","trans":"fade","time":null},{"t":"say","who":"bucho","disp":null,"br":"「","text":"大森。","src":"script/scene_05.txt:16","rid":"scene_05_start#3","voice":"bucho_c05_0001"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"我说过，不想喝的人不用喝。","src":"script/scene_05.txt:17","rid":"scene_05_start#4","voice":"bucho_c05_0002"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"……是。","src":"script/scene_05.txt:18","rid":"scene_05_start#5"},{"t":"say","who":null,"disp":null,"br":null,"text":"于是，整晚被灌酒的，变成了部长自己。","src":"script/scene_05.txt:19","rid":"scene_05_start#6"},{"t":"chara","src":"script/scene_05.txt:20","id":"bucho","expr":"drunk","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"oomori","disp":null,"br":"「","text":"……奇怪。部长每年只有今天这天会喝醉。","src":"script/scene_05.txt:21","rid":"scene_05_start#7"},{"t":"say","who":"hero","disp":null,"br":"「","text":"每年？","src":"script/scene_05.txt:22","rid":"scene_05_start#8"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"嗯。新人欢迎会这天。问他为什么，他也不说。","src":"script/scene_05.txt:23","rid":"scene_05_start#9"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"……早川。","src":"script/scene_05.txt:24","rid":"scene_05_start#10","voice":"bucho_c05_0003","blip":"off"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"结论……先说。{w=0.5}我，走不动了。","src":"script/scene_05.txt:25","rid":"scene_05_start#11","voice":"bucho_c05_0004"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"新人，你家和部长家同一个方向吧？拜托了！","src":"script/scene_05.txt:26","rid":"scene_05_start#12"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……第一周就要护送部长回家吗。","src":"script/scene_05.txt:27","rid":"scene_05_start#13"},{"t":"bg","src":"script/scene_05.txt:29","id":"black","trans":"fade","time":null,"hold":null,"keep":false},{"t":"se","src":"script/scene_05.txt:30","name":"car_door","vol":1,"loop":false},{"t":"bgmfade","src":"script/scene_05.txt:31","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"出租车里，部长一句话也没说。","src":"script/scene_05.txt:32","rid":"scene_05_start#14"},{"t":"say","who":null,"disp":null,"br":null,"text":"窗外的路灯一盏一盏往后退。他一直看着窗外。","src":"script/scene_05.txt:33","rid":"scene_05_start#15"},{"t":"bg","src":"script/scene_05.txt:35","id":"shirogane_house_night","trans":"fade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_05.txt:36","name":"night","vol":1,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"一栋安静的独栋住宅。门灯是暖黄色的。","src":"script/scene_05.txt:37","rid":"scene_05_start#16"},{"t":"se","src":"script/scene_05.txt:38","name":"chime","vol":1,"loop":false},{"t":"say","who":"hero","disp":null,"br":"（","text":"深夜十二点按别人家的门铃……好有罪恶感。","src":"script/scene_05.txt:39","rid":"scene_05_start#17"},{"t":"se","src":"script/scene_05.txt:40","name":"door_open","vol":1,"loop":false},{"t":"chara","src":"script/scene_05.txt:41","id":"ayaka","expr":"surprised","outfit":"kimono","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"门开了。","src":"script/scene_05.txt:42","rid":"scene_05_start#18"},{"t":"say","who":null,"disp":null,"br":null,"text":"淡藤色的和服，盘起的黑发。和那天夜里一模一样。","src":"script/scene_05.txt:43","rid":"scene_05_start#19"},{"t":"say","who":null,"disp":null,"br":null,"text":"只是今晚，她的颈间多了一串珍珠项链。左手的婚戒，在门灯下亮了一下。","src":"script/scene_05.txt:44","rid":"scene_05_start#20"},{"t":"say","who":"hero","disp":null,"br":"（","text":"——！","src":"script/scene_05.txt:45","rid":"scene_05_start#21"},{"t":"say","who":null,"disp":null,"br":null,"text":"樱花树下的那个人。","src":"script/scene_05.txt:46","rid":"scene_05_start#22"},{"t":"say","who":"ayaka","disp":"？？？","br":"「","text":"……","src":"script/scene_05.txt:47","rid":"scene_05_start#23","voice":"ayaka_c05_0001"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看见我的瞬间，睫毛轻轻颤了一下。","src":"script/scene_05.txt:48","rid":"scene_05_start#24"},{"t":"chara","src":"script/scene_05.txt:49","id":"bucho","expr":"drunk","outfit":"suit","pos":"left","trans":"fade","time":null},{"t":"say","who":"bucho","disp":null,"br":"「","text":"……绫香。这是，新人。早川。","src":"script/scene_05.txt:50","rid":"scene_05_start#25","voice":"bucho_c05_0005"},{"t":"chara","src":"script/scene_05.txt:51","id":"ayaka","expr":"normal","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……给您添麻烦了。我是白石的妻子，绫香。","src":"script/scene_05.txt:52","rid":"scene_05_start#26","voice":"ayaka_c05_0002"},{"t":"say","who":null,"disp":null,"br":null,"text":"她深深地鞠了一躬。好像从来没有见过我一样。","src":"script/scene_05.txt:53","rid":"scene_05_start#27"},{"t":"bg","src":"script/scene_05.txt:55","id":"shirogane_living_night","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"se","src":"script/scene_05.txt:56","name":"cloth_rustle","vol":1,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我们一左一右，把部长扶到客厅的沙发上。","src":"script/scene_05.txt:57","rid":"scene_05_start#28"},{"t":"say","who":null,"disp":null,"br":null,"text":"客厅收拾得一尘不染。茶几上的花瓶里，插着一枝快开败的樱花。","src":"script/scene_05.txt:58","rid":"scene_05_start#29"},{"t":"chara","src":"script/scene_05.txt:59","id":"ayaka","expr":"normal","outfit":"kimono","pos":"center","trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"早川さん，请喝杯茶再走吧。","src":"script/scene_05.txt:60","rid":"scene_05_start#30","voice":"ayaka_c05_0003"},{"t":"say","who":null,"disp":null,"br":null,"text":"她去厨房的时候，我把手伸进外套口袋。","src":"script/scene_05.txt:61","rid":"scene_05_start#31"},{"t":"say","who":null,"disp":null,"br":null,"text":"珍珠发夹。这一周，我一直带在身上。","src":"script/scene_05.txt:62","rid":"scene_05_start#32"},{"t":"choice","src":"script/scene_05.txt:64","opts":[{"text":"（悄悄把发夹放在茶几上，装作初次见面）","fx":[{"n":"aff_ayaka","op":"+=","val":2},{"n":"f_ayaka_secret","op":"=","val":true},{"n":"f_hairpin","op":"=","val":"ayaka"},{"n":"risk_ayaka","op":"+=","val":1}],"target":null,"cond":null,"body":363,"src":"script/scene_05.txt:65"},{"text":"「我们……在樱见町见过。」","fx":[{"n":"aff_ayaka","op":"+=","val":1},{"n":"f_hairpin","op":"=","val":"ayaka"}],"target":null,"cond":null,"body":372,"src":"script/scene_05.txt:75"},{"text":"（……现在拿出来，好像不太对。先收着吧）","fx":[{"n":"aff_ayaka","op":"+=","val":0}],"target":null,"cond":null,"body":378,"src":"script/scene_05.txt:81"}],"end":383},{"t":"say","who":null,"disp":null,"br":null,"text":"她端着茶回来，看见了茶几上的发夹。","src":"script/scene_05.txt:66","rid":"scene_05_start#33"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……","src":"script/scene_05.txt:67","rid":"scene_05_start#34","expr":"surprised","voice":"ayaka_c05_0004"},{"t":"say","who":null,"disp":null,"br":null,"text":"她把它拾起来，握在掌心里。很久，才开口。","src":"script/scene_05.txt:68","rid":"scene_05_start#35"},{"t":"se","src":"script/scene_05.txt:69","name":"cloth_rustle","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"沙发上，部长翻了个身。","src":"script/scene_05.txt:70","rid":"scene_05_start#36"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的肩膀僵了一下。我们谁也没有动，等那阵呼吸重新变得平稳。","src":"script/scene_05.txt:72","rid":"scene_05_start#37"},{"t":"wait","src":"script/scene_05.txt:73","time":0.8},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……谢谢您。{w=0.4}什么都没有说。","src":"script/scene_05.txt:74","rid":"scene_05_start#38","expr":"lonely","voice":"ayaka_c05_0005","blip":"off"},{"t":"goto","to":383,"src":"script/scene_05.txt:75"},{"t":"say","who":null,"disp":null,"br":null,"text":"我把发夹递过去。","src":"script/scene_05.txt:76","rid":"scene_05_start#39"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……","src":"script/scene_05.txt:77","rid":"scene_05_start#40","expr":"surprised","voice":"ayaka_c05_0006"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"原来，是被您捡到了。","src":"script/scene_05.txt:78","rid":"scene_05_start#41","expr":"smile","voice":"ayaka_c05_0007"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的视线，很快地往沙发那边飘了一下。","src":"script/scene_05.txt:79","rid":"scene_05_start#42"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"那天的事……请当作没看见吧。","src":"script/scene_05.txt:80","rid":"scene_05_start#43","expr":"normal","voice":"ayaka_c05_0008"},{"t":"goto","to":383,"src":"script/scene_05.txt:81"},{"t":"say","who":null,"disp":null,"br":null,"text":"我把手从口袋里抽了出来。","src":"script/scene_05.txt:82","rid":"scene_05_start#44"},{"t":"say","who":"hero","disp":null,"br":"（","text":"部长就睡在旁边。这枚发夹，下次再说吧。","src":"script/scene_05.txt:83","rid":"scene_05_start#45"},{"t":"say","who":null,"disp":null,"br":null,"text":"她端着茶回来，看了一眼我空着的手，什么也没问。","src":"script/scene_05.txt:84","rid":"scene_05_start#46"},{"t":"say","who":"hero","disp":null,"br":"（","text":"发夹，还在我外套的口袋里。","src":"script/scene_05.txt:85","rid":"scene_05_start#47"},{"t":"goto","to":383,"src":"script/scene_05.txt:86"},{"t":"hide","src":"script/scene_05.txt:88","id":"ayaka","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她去拿毛毯了。客厅里只剩下我，和部长的呼吸声。","src":"script/scene_05.txt:89","rid":"scene_05_start#48"},{"t":"ambient","src":"script/scene_05.txt:90","name":"clock_tick","vol":0.4,"fade":1},{"t":"say","who":null,"disp":null,"br":null,"text":"墙上挂着一本日历。","src":"script/scene_05.txt:91","rid":"scene_05_start#49"},{"t":"say","who":null,"disp":null,"br":null,"text":"四月二十九日那一格，被铅笔轻轻地圈了起来。","src":"script/scene_05.txt:92","rid":"scene_05_start#50"},{"t":"say","who":null,"disp":null,"br":null,"text":"没有写字。只是一个很淡的圈。","src":"script/scene_05.txt:93","rid":"scene_05_start#51"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……什么日子？黄金周的第一天？","src":"script/scene_05.txt:94","rid":"scene_05_start#52"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"……对不起……","src":"script/scene_05.txt:95","rid":"scene_05_start#53","voice":"bucho_c05_0006","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"沙发上，部长闭着眼睛，含糊地说。","src":"script/scene_05.txt:96","rid":"scene_05_start#54"},{"t":"say","who":null,"disp":null,"br":null,"text":"不知道是在对谁说。","src":"script/scene_05.txt:97","rid":"scene_05_start#55"},{"t":"ambientstop","src":"script/scene_05.txt:99","name":"clock_tick","fade":1},{"t":"chara","src":"script/scene_05.txt:100","id":"ayaka","expr":"smile","outfit":"kimono","pos":"center","trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"今天真的谢谢您了。路上请小心。","src":"script/scene_05.txt:101","rid":"scene_05_start#56","voice":"ayaka_c05_0009"},{"t":"say","who":null,"disp":null,"br":null,"text":"走到路口，我回头看了一眼。","src":"script/scene_05.txt:102","rid":"scene_05_start#57"},{"t":"say","who":null,"disp":null,"br":null,"text":"暖黄色的门灯下，她还站在那里，没有进去。","src":"script/scene_05.txt:103","rid":"scene_05_start#58"},{"t":"se","src":"script/scene_05.txt:104","name":"door_close","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"过了很久，才传来很轻的关门声。","src":"script/scene_05.txt:105","rid":"scene_05_start#59"},{"t":"bgmfade","src":"script/scene_05.txt:107","time":2},{"t":"jump","src":"script/scene_05.txt:108","label":"scene_06_start"},{"t":"eof","src":"script/scene_05.txt:109"},{"t":"prefetch","se":["office_amb","footsteps","shop_bell","cat_meow","door_open","door_close","wall_voices"],"src":"script/scene_06.txt:1"},{"t":"label","src":"script/scene_06.txt:7","name":"scene_06_start"},{"t":"bg","src":"script/scene_06.txt:8","id":"office_day","trans":"black","time":null,"hold":1,"keep":false},{"t":"bgm","src":"script/scene_06.txt:9","name":"daily","vol":1,"fade":1.5},{"t":"ambient","src":"script/scene_06.txt:10","name":"office_amb","vol":0.4,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"四月十四日，星期二。午休前。","src":"script/scene_06.txt:12","rid":"scene_06_start#0"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"……新人。新人！","src":"script/scene_06.txt:13","rid":"scene_06_start#1"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"门口，有个穿开衫的美女，说要找你。","src":"script/scene_06.txt:14","rid":"scene_06_start#2"},{"t":"say","who":"hero","disp":null,"br":"「","text":"找我？","src":"script/scene_06.txt:15","rid":"scene_06_start#3"},{"t":"se","src":"script/scene_06.txt:16","name":"footsteps","vol":1,"loop":false},{"t":"chara","src":"script/scene_06.txt:17","id":"ayaka","expr":"smile","outfit":"day","pos":"center","trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"早川さん，打扰了。","src":"script/scene_06.txt:18","rid":"scene_06_start#4","voice":"ayaka_c06_0001"},{"t":"say","who":null,"disp":null,"br":null,"text":"她手里捧着一个包袱，淡紫色的布上，染着一串藤花。","src":"script/scene_06.txt:19","rid":"scene_06_start#5"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"主人说要慰劳新人，做好了便当，却忘了带。","src":"script/scene_06.txt:20","rid":"scene_06_start#6","voice":"ayaka_c06_0002"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……就当是这样吧。","src":"script/scene_06.txt:21","rid":"scene_06_start#7","expr":"teasing","voice":"ayaka_c06_0003"},{"t":"say","who":"hero","disp":null,"br":"「","text":"可是，部长今天去大阪出差……","src":"script/scene_06.txt:22","rid":"scene_06_start#8"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"是呀。所以，只好交给您了。","src":"script/scene_06.txt:23","rid":"scene_06_start#9","expr":"smile","voice":"ayaka_c06_0004"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"……真、真人……！","src":"script/scene_06.txt:24","rid":"scene_06_start#10"},{"t":"say","who":null,"disp":null,"br":null,"text":"大森前辈僵在原地，像一尊刚出土的兵马俑。","src":"script/scene_06.txt:25","rid":"scene_06_start#11"},{"t":"set","src":"script/scene_06.txt:26","fx":[{"n":"f_ayaka_bento","op":"=","val":true}]},{"t":"hide","src":"script/scene_06.txt:27","id":"ayaka","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她走后，我们把便当分给了课里的大家。","src":"script/scene_06.txt:28","rid":"scene_06_start#12"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"……奇怪。大家的里面都没有玉子烧。","src":"script/scene_06.txt:29","rid":"scene_06_start#13"},{"t":"say","who":"oomori","disp":null,"br":"「","text":"只有你的有。","src":"script/scene_06.txt:30","rid":"scene_06_start#14"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……碰巧吧。","src":"script/scene_06.txt:31","rid":"scene_06_start#15"},{"t":"say","who":null,"disp":null,"br":null,"text":"甜的。是老家母亲做的那种，加了砂糖的玉子烧。","src":"script/scene_06.txt:32","rid":"scene_06_start#16"},{"t":"ambientstop","src":"script/scene_06.txt:33","name":"office_amb","fade":1.5},{"t":"bg","src":"script/scene_06.txt:35","id":"flower_shop_day","trans":"black","time":null,"hold":0.8,"keep":false},{"t":"se","src":"script/scene_06.txt:36","name":"shop_bell","vol":1,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"四月十八日，星期六。","src":"script/scene_06.txt:37","rid":"scene_06_start#17"},{"t":"chara","src":"script/scene_06.txt:38","id":"yukino","expr":"smile","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀，铃兰还活着？","src":"script/scene_06.txt:39","rid":"scene_06_start#18","voice":"yukino_c06_0001"},{"t":"say","who":"hero","disp":null,"br":"「","text":"活着。还开了新的一串。","src":"script/scene_06.txt:40","rid":"scene_06_start#19"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……真的？小哥，有天分嘛。","src":"script/scene_06.txt:41","rid":"scene_06_start#20","expr":"surprised","voice":"yukino_c06_0002"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"作为奖励，送你一枝花摆在公司桌上。挑吧。","src":"script/scene_06.txt:42","rid":"scene_06_start#21","expr":"smile","voice":"yukino_c06_0003"},{"t":"choice","src":"script/scene_06.txt:44","opts":[{"text":"「桐谷小姐选的就好。」","fx":[{"n":"aff_yukino","op":"+=","val":1},{"n":"f_yukino_flower","op":"=","val":"none"}],"target":null,"cond":null,"body":439,"src":"script/scene_06.txt:45"},{"text":"毛茛（「像您店里的颜色。」）","fx":[{"n":"aff_yukino","op":"+=","val":2},{"n":"f_yukino_flower","op":"=","val":"ranunculus"}],"target":null,"cond":null,"body":442,"src":"script/scene_06.txt:48"},{"text":"铃兰（「和家里那盆是一对。」）","fx":[{"n":"aff_yukino","op":"+=","val":2},{"n":"f_yukino_flower","op":"=","val":"lily"}],"target":null,"cond":null,"body":445,"src":"script/scene_06.txt:51"},{"text":"「办公桌就不用了吧，被前辈看见会被笑的。」","fx":[{"n":"aff_yukino","op":"+=","val":0},{"n":"f_yukino_flower","op":"=","val":"none"},{"n":"f_yukino_noflower","op":"=","val":true}],"target":null,"cond":null,"body":448,"src":"script/scene_06.txt:54"}],"end":451},{"t":"say","who":"yukino","disp":null,"br":"「","text":"把选择交给女人，可是很危险的哦？","src":"script/scene_06.txt:46","rid":"scene_06_start#22","expr":"smile","voice":"yukino_c06_0004"},{"t":"say","who":null,"disp":null,"br":null,"text":"她挑了一枝白色的小雏菊，插进细细的玻璃瓶里。","src":"script/scene_06.txt:47","rid":"scene_06_start#23"},{"t":"goto","to":451,"src":"script/scene_06.txt:48"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……店里的颜色？","src":"script/scene_06.txt:49","rid":"scene_06_start#24","expr":"shy","voice":"yukino_c06_0005"},{"t":"say","who":"yukino","disp":null,"br":"「" "pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她坐在 202 门口的台阶上。脚边，三个空的能量饮料罐。","src":"script/scene_06.txt:70","rid":"scene_06_start#35"},{"t":"se","src":"script/scene_06.txt:71","name":"cat_meow","vol":0.6,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"おはぎ趴在她的膝盖上。她的手，一下一下地摸着猫背。","src":"script/scene_06.txt:72","rid":"scene_06_start#36"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……椎名小姐？","src":"script/scene_06.txt:73","rid":"scene_06_start#37"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……！","src":"script/scene_06.txt:74","rid":"scene_06_start#38","expr":"surprised","voice":"makoto_c06_0001"},{"t":"chara","src":"script/scene_06.txt:75","id":"makoto","expr":"annoyed","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……没事。钥匙找不到了而已。","src":"script/scene_06.txt:76","rid":"scene_06_start#39","voice":"makoto_c06_0002"},{"t":"say","who":null,"disp":null,"br":null,"text":"钥匙就挂在她的公文包拉链上。","src":"script/scene_06.txt:77","rid":"scene_06_start#40"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……说不出口。","src":"script/scene_06.txt:78","rid":"scene_06_start#41"},{"t":"say","who":"hero","disp":null,"br":"「","text":"那个，我煮了味噌汤，煮多了。要不要——","src":"script/scene_06.txt:79","rid":"scene_06_start#42"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"不用。","src":"script/scene_06.txt:80","rid":"scene_06_start#43","expr":"normal","voice":"makoto_c06_0003"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……这不是什么大事。","src":"script/scene_06.txt:81","rid":"scene_06_start#44","voice":"makoto_c06_0004"},{"t":"say","who":null,"disp":null,"br":null,"text":"她站起来，把猫轻轻放下，“找到”了钥匙。","src":"script/scene_06.txt:82","rid":"scene_06_start#45"},{"t":"se","src":"script/scene_06.txt:83","name":"door_open","vol":1,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"门开了一半。她停在那里，背对着我。","src":"script/scene_06.txt:84","rid":"scene_06_start#46"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……味噌汤。","src":"script/scene_06.txt:85","rid":"scene_06_start#47","expr":"shy","voice":"makoto_c06_0005","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……没什么。晚安。","src":"script/scene_06.txt:86","rid":"scene_06_start#48","expr":"annoyed","voice":"makoto_c06_0006"},{"t":"se","src":"script/scene_06.txt:87","name":"door_close","vol":1,"loop":false},{"t":"hide","src":"script/scene_06.txt:88","id":"makoto","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"门关上了。","src":"script/scene_06.txt:89","rid":"scene_06_start#49"},{"t":"ambient","src":"script/scene_06.txt:90","name":"wall_voices","vol":0.22,"fade":0.6,"muffle":"wall"},{"t":"say","who":null,"disp":null,"br":null,"text":"隔着墙，又传来那一句很轻的「我回来了」。","src":"script/scene_06.txt:91","rid":"scene_06_start#50"},{"t":"ambientstop","src":"script/scene_06.txt:92","name":"wall_voices","fade":2},{"t":"bgmfade","src":"script/scene_06.txt:94","time":2},{"t":"jump","src":"script/scene_06.txt:95","label":"scene_06b_start"},{"t":"eof","src":"script/scene_06.txt:96"},{"t":"prefetch","se":["shop_bell","footsteps","spark","cat_meow"],"src":"script/scene_06b.txt:1"},{"t":"label","src":"script/scene_06b.txt:8","name":"scene_06b_start"},{"t":"bg","src":"script/scene_06b.txt:9","id":"apt_front_evening","trans":"black","time":null,"hold":0.8,"keep":false},{"t":"bgm","src":"script/scene_06b.txt:10","name":"daily","vol":1,"fade":1.5},{"t":"se","src":"script/scene_06b.txt:11","name":"shop_bell","vol":1,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"四月二十三日，星期四。难得准时下班的傍晚。","src":"script/scene_06b.txt:13","rid":"scene_06b_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪月花的门口，摆满了刚到货的芍药。","src":"script/scene_06b.txt:14","rid":"scene_06b_start#1"},{"t":"chara","src":"script/scene_06b.txt:15","id":"yukino","expr":"smile","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"b ll,"br":null,"text":"雪乃的视线，在她的婚戒上停了一拍。很快又笑了。","src":"script/scene_06b.txt:31","rid":"scene_06b_start#13"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"欢迎光临。小哥平时，也很照顾我们店哦。","src":"script/scene_06b.txt:32","rid":"scene_06b_start#14","expr":"smile","voice":"yukino_c06_0015"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"每周都来。来看——花。","src":"script/scene_06b.txt:33","rid":"scene_06b_start#15","voice":"yukino_c06_0016"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"是吗。早川さん，喜欢花呢。","src":"script/scene_06b.txt:34","rid":"scene_06b_start#16","expr":"smile","voice":"ayaka_c06_0008"},{"t":"say","who":"hero","disp":null,"br":"（","text":"为什么两个人都在笑，空气却越来越冷……","src":"script/scene_06b.txt:35","rid":"scene_06b_start#17"},{"t":"se","src":"script/scene_06b.txt:37","name":"footsteps","vol":1,"loop":false},{"t":"bgm","src":"script/scene_06b.txt:38","name":"shuraba","vol":1,"fade":0.8},{"t":"chara","src":"script/scene_06b.txt:39","id":"yukino","expr":"smile","outfit":"apron","pos":"right","trans":"fade","time":null},{"t":"chara","src":"script/scene_06b.txt:40","id":"makoto","expr":"annoyed","outfit":"suit","pos":"center","trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……挡路了。","src":"script/scene_06b.txt:41","rid":"scene_06b_start#18","voice":"makoto_c06_0007"},{"t":"say","who":"hero","disp":null,"br":"（","text":"这句话，好耳熟……！","src":"script/scene_06b.txt:42","rid":"scene_06b_start#19"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"早川。门口站三个人，自行车过不去。","src":"script/scene_06b.txt:43","rid":"scene_06b_start#20","voice":"makoto_c06_0008"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了一眼手表。我知道，那块表快了五分钟。","src":"script/scene_06b.txt:44","rid":"scene_06b_start#21"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……白石部长的，夫人？","src":"script/scene_06b.txt:45","rid":"scene_06b_start#22","expr":"normal","voice":"makoto_c06_0009"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"椎名さん。上次的企划会，外子提过您。","src":"script/scene_06b.txt:46","rid":"scene_06b_start#23","expr":"smile","voice":"ayaka_c06_0009"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……承蒙关照。","src":"script/scene_06b.txt:47","rid":"scene_06b_start#24","voice":"makoto_c06_0010"},{"t":"say","who":null,"disp":null,"br":null,"text":"两个人同时鞠躬。角度，分毫不差。","src":"script/scene_06b.txt:48","rid":"scene_06b_start#25"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀，原来大家都认识小哥呀。","src":"script/scene_06b.txt:49","rid":"scene_06b_start#26","expr":"smile","voice":"yukino_c06_0017"},{"t":"say","who":null,"disp":null,"br":null,"text":"她半垂着眼，嘴角扬起一边，看着我。","src":"script/scene_06b.txt:50","rid":"scene_06b_start#27"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……哎呀。脸红了？","src":"script/scene_06b.txt:51","rid":"scene_06b_start#28","voice":"yukino_c06_0018"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"他一直都这样。隔着墙都听得见他打喷嚏。","src":"script/scene_06b.txt:52","rid":"scene_06b_start#29","expr":"annoyed","voice":"makoto_c06_0011"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……隔着墙？","src":"script/scene_06b.txt:53","rid":"scene_06b_start#30","expr":"surprised","voice":"ayaka_c06_0010"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……！住、住隔壁而已。没有别的意思。","src":"script/scene_06b.txt:54","rid":"scene_06b_start#31","expr":"surprised","voice":"makoto_c06_0012"},{"t":"say","who":"hero","disp":null,"br":"（","text":"椎名小姐，你越解释越糟……！","src":"script/scene_06b.txt:55","rid":"scene_06b_start#32"},{"t":"se","src":"script/scene_06b.txt:57","name":"spark","vol":0.55,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"三个人，同时看向我。","src":"script/scene_06b.txt:58","rid":"scene_06b_start#33"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"小哥，芍药还没搬呢。","src":"script/scene_06b.txt:59","rid":"scene_06b_start#34","expr":"smile","voice":"yukino_c06_0019"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"早川さん，车站往哪边走……能告诉我吗？","src":"script/scene_06b.txt:60","rid":"scene_06b_start#35","expr":"smile","voi
