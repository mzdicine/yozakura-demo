"scene_16_start#8","expr":"annoyed","voice":"makoto_t01_0003"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了一眼手表。我知道，那块表快了五分钟。","src":"script/scene_16.txt:27","rid":"scene_16_start#9"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"九点前到。……我的表，是八点五十五。","src":"script/scene_16.txt:28","rid":"scene_16_start#10","expr":"normal","voice":"makoto_t01_0004"},{"t":"say","who":"hero","disp":null,"br":"（","text":"——这就是，答应了吧。","src":"script/scene_16.txt:29","rid":"scene_16_start#11"},{"t":"bg","src":"script/scene_16.txt:31","id":"flower_shop_day","trans":"crossfade","time":1,"hold":null,"keep":false},{"t":"se","src":"script/scene_16.txt:32","name":"shop_bell","vol":0.5,"loop":false},{"t":"chara","src":"script/scene_16.txt:33","id":"makoto","expr":"normal","outfit":"suit","pos":"left","trans":"fade","time":null},{"t":"chara","src":"script/scene_16.txt:34","id":"yukino","expr":"surprised","outfit":"apron","pos":"right","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。说好的壮丁，是一个人吧？","src":"script/scene_16.txt:35","rid":"scene_16_start#12","expr":"surprised","voice":"yukino_t01_0001"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"怎么还带了个……这么漂亮的。","src":"script/scene_16.txt:36","rid":"scene_16_start#13","expr":"smile","voice":"yukino_t01_0002"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……椎名。202 的。我们在门口见过。","src":"script/scene_16.txt:37","rid":"scene_16_start#14","expr":"annoyed","voice":"makoto_t01_0005"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"记得哦。站得笔直、说「挡路了」的那位。真琴酱。","src":"script/scene_16.txt:38","rid":"scene_16_start#15","expr":"smile","voice":"yukino_t01_0003"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……请不要那样叫我。","src":"script/scene_16.txt:39","rid":"scene_16_start#16","expr":"surprised","voice":"makoto_t01_0006"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"来，真琴酱。西装会弄脏的，围裙借你。手，抬起来。","src":"script/scene_16.txt:40","rid":"scene_16_start#17","expr":"smug","voice":"yukino_t01_0004"},{"t":"chara","src":"script/scene_16.txt:41","id":"yukino","expr":"smile","outfit":"apron","pos":"center","trans":"fade","time":0.4},{"t":"say","who":null,"disp":null,"br":null,"text":"她绕到真琴身后，把墨绿色的带子绕过她的腰。","src":"script/scene_16.txt:42","rid":"scene_16_start#18"},{"t":"cg","src":"script/scene_16.txt:43","id":"trio_04","diff":null,"trans":"fade","time":0.8},{"t":"hide","src":"script/scene_16.txt:44","id":"all","trans":"none","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"系得很慢。慢到真琴的耳朵，一点一点红了。","src":"script/scene_16.txt:45","rid":"scene_16_start#19"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"腰，要系紧一点哦。……嗯，好细。抱起来，一定刚刚好。","src":"script/scene_16.txt:46","rid":"scene_16_start#20","expr":"smile","voice":"yukino_t01_0005"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……桐谷小姐。你的呼吸，在我耳朵上。","src":"script/scene_16.txt:47","rid":"scene_16_start#21","expr":"shy","voice":"makoto_t01_0007"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。脸红了？","src":"script/scene_16.txt:48","rid":"scene_16_start#22","expr":"smile","voice":"yukino_t01_0006"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"没有。是这家店太热。","src":"script/scene_16.txt:49","rid":"scene_16_start#23","expr":"annoyed","voice":"makoto_t01_0008"},{"t":"say","who":"hero","disp":null,"br":"（","text":"店里开着门。四月的风，凉飕飕的。","src":"script/scene_16.txt:50","rid":"scene_16_start#24"},{"t":"chara","src":"script/scene_16.txt:51","id":"makoto","expr":"annoyed","outfit":"suit","pos":"left","trans":"none","time":null},{"t":"chara","src":"script/scene_16.txt:52","id":"yukino","expr":"smile","outfit":"apron","pos":"center","trans":"none","time":null},{"t":"cghide","src":"script/scene_16.txt:53","trans":"fade","time":0.8},{"t":"chara","src":"script/scene_16.txt:54","id":"yukino","expr":"smile","outfit":"apron","pos":"right","trans":"fade","time":0.4},{"t":"say","who":null,"disp":null,"br":null,"text":"墙上的挂钟，指着八点五十分。","src":"script/scene_16.txt:55","rid":"scene_16_start#25"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……这个钟，慢了吧。","src":"script/scene_16.txt:56","rid":"scene_16_start#26","expr":"normal","voice":"makoto_t01_0009"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"慢五分钟。花又不赶时间。","src":"script/scene_16.txt:57","rid":"scene_16_start#27","expr":"smile","voice":"yukino_t01_0007"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"我的表快五分钟。","src":"script/scene_16.txt:58","rid":"scene_16_start#28","expr":"annoyed","voice":"makoto_t01_0010"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那我们两个，岂不是永远差十分钟？","src":"script/scene_16.txt:59","rid":"scene_16_start#29","expr":"smile","voice":"yukino_t01_0008"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……一上午，她们为了「现在几点」吵了三次。","src":"script/scene_16.txt:60","rid":"scene_16_start#30"},{"t":"hide","src":"script/scene_16.txt:62","id":"all","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"午后，天一下子暗了。","src":"script/scene_16.txt:63","rid":"scene_16_start#31"},{"t":"bg","src":"script/scene_16.txt:64","id":"flower_shop_storm_night","trans":"crossfade","time":1.5,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_16.txt:65","name":"tension","vol":1,"fade":1},{"t":"ambient","src":"script/scene_16.txt:66","name":"heavy_rain_loop","vol":0.55,"fade":1},{"t":"se","src":"script/scene_16.txt:67","name":"thunder","vol":0.7,"loop":false},{"t":"flash","src":"script/scene_16.txt:68","color":"white","time":0.12,"count":2},{"t":"shake","src":"script/scene_16.txt:69","power":"weak","time":0.3,"target":"screen"},{"t":"say","who":null,"disp":null,"br":null,"text":"雷声落下来的瞬间，两只手，同时抓住了我的袖子。","src":"script/scene_16.txt:70","rid":"scene_16_start#32"},{"t":"say","who":null,"disp":null,"br":null,"text":"左边，是真琴。右边，是她自己也吓了一跳的雪乃。","src":"script/scene_16.txt:71","rid":"scene_16_start#33"},{"t":"if","src":"script/scene_16.txt:72","c":{"v":"f_trio_ok"},"f":3772},{"t":"cg","src":"script/scene_16.txt:73","id":"trio_05","diff":null,"trans":"crossfade","time":0.6},{"t":"chara","src":"script/scene_16.txt:75","id":"makoto","expr":"surprised","outfit":"suit","pos":"left","trans":"fade","time":null},{"t":"chara","src":"script/scene_16.txt:76","id":"yukino","expr":"surprised","outfit":"apron","pos":"right","trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不、不是怕。手滑了。","src":"script/scene_16.txt:77","rid":"scene_16_start#34","expr":"surprised","voice":"makoto_t01_0011"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"姐姐不怕打雷哦。怕的是——花架！","src":"script/scene_16.txt:78","rid":"scene_16_start#35","expr":"surprised","voice":"yukino_t01_0009"},{"t":"if","src":"script/scene_16.txt:79","c":{"v":"f_trio_ok"},"f":3778},{"t":"cghide","src":"script/scene_16.txt:80","trans":"fade","time":0.8},{"t":"say","who":null,"disp":null,"br":null,"text":"店外的花架，被风吹得一晃一晃。刚到的白玫瑰，全在上面。","src":"script/scene_16.txt:82","rid":"scene_16_start#36"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我去左边！","src":"script/scene_16.txt:83","rid":"scene_16_start#37"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"真琴酱右边。卷帘门归姐姐。……快！","src":"script/scene_16.txt:84","rid":"scene_16_start#38","expr":"serious","voice":"yukino_t01_0010"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……用不着你命令。","src":"script/scene_16.txt:85","rid":"scene_16_start#39","expr":"annoyed","voice":"makoto_t01_0012"},{"t":"hide","src":"script/scene_16.txt:86","id":"all","trans":"fade","time":null},{"t":"se","src":"script/scene_16.txt:87","name":"box_drop","vol":0.6,"loop":false},{"t":"shake","src":"script/scene_16.txt:88","power":"weak","time":0.2,"target":"screen"},{"t":"se","src":"script/scene_16.txt:89","name":"thunder_distant","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"三个人，在雨里搬了十几分钟。","src":"script/scene_16.txt:90","rid":"scene_16_start#40"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴的眼镜全是水。雪乃的卷发贴在脸上。","src":"script/scene_16.txt:91","rid":"scene_16_start#41"},{"t":"say","who":null,"disp":null,"br":null,"text":"最后一桶百合抱进门的时候，我们三个，同时笑了出来。","src":"script/scene_16.txt:92","rid":"scene_16_start#42"},{"t":"recall","src":"script/scene_16.txt:94","id":"trio_r01","title":"雪月花的雨宿","chara":"trio","type":"event","thumb":"trio_01","end":3868},{"t":"bg","src":"script/scene_16.txt:96","id":"flower_shop_storm_inside_night","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_16.txt:97","name":"yukino_theme","vol":1,"fade":2},{"t":"ambient","src":"script/scene_16.txt:98","name":"heavy_rain_loop","vol":0.4,"fade":1.5,"muffle":"door"},{"t":"se","src":"script/scene_16.txt:99","name":"door_close","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"卷帘门拉下来，雨声一下子远了。","src":"script/scene_16.txt:100","rid":"scene_16_start#43"},{"t":"say","who":null,"disp":null,"br":null,"text":"湿透的衬衫贴在身上。三个人的呼吸，在小小的店里白蒙蒙的。","src":"script/scene_16.txt:101","rid":"scene_16_start#44"},{"t":"chara","src":"script/scene_16.txt:102","id":"makoto","expr":"tired","outfit":"suit","pos":"left","trans":"fade","time":null},{"t":"chara","src":"script/scene_16.txt:103","id":"yukino","expr":"smile","outfit":"apron","pos":"right","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"毛巾，毛巾……哎呀。只剩一条了。","src":"script/scene_16.txt:104","rid":"scene_16_start#45","expr":"smile","voice":"yukino_t01_0011"},{"t":"say","who":null,"disp":null,"br":null,"text":"她把那条干毛巾，放进我手里。","src":"script/scene_16.txt:105","rid":"scene_16_start#46"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"小哥来决定吧。先给谁？","src":"script/scene_16.txt:106","rid":"scene_16_start#47","expr":"smile","voice":"yukino_t01_0012"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……为什么要他决定。","src":"script/scene_16.txt:107","rid":"scene_16_start#48","expr":"annoyed","voice":"makoto_t01_0013"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"因为这样，比较有趣。","src":"script/scene_16.txt:108","rid":"scene_16_start#49","expr":"smile","voice":"yukino_t01_0013"},{"t":"if","src":"script/scene_16.txt:109","c":{"o":"==","a":{"v":"rb_towel"},"b":{"c":"makoto"}},"f":3806},{"t":"set","src":"script/scene_16.txt:110","fx":[{"n":"f_trio_towel","op":"=","val":"makoto"}]},{"t":"goto","to":3812,"src":"script/scene_16.txt:111"},{"t":"if","c":{"o":"==","a":{"v":"rb_towel"},"b":{"c":"yukino"}},"f":3809,"src":"script/scene_16.txt:111"},{"t":"set","src":"script/scene_16.txt:112","fx":[{"n":"f_trio_towel","op":"=","val":"yukino"}]},{"t":"goto","to":3812,"src":"script/scene_16.txt:113"},{"t":"choice","src":"script/scene_16.txt:114","opts":[{"text":"「椎名小姐先。……你在发抖。」","fx":[{"n":"f_trio_towel","op":"=","val":"makoto"}],"target":null,"cond":null,"body":3810,"src":"script/scene_16.txt:115"},{"text":"「桐谷小姐先。这是您的店。」","fx":[{"n":"f_trio_towel","op":"=","val":"yukino"}],"target":null,"cond":null,"body":3811,"src":"script/scene_16.txt:116"}],"end":3812},{"t":"goto","to":3812,"src":"script/scene_16.txt:116"},{"t":"goto","to":3812,"src":"script/scene_16.txt:117"},{"t":"hide","src":"script/scene_16.txt:119","id":"all","trans":"fade","time":null},{"t":"window","src":"script/scene_16.txt:120","on":false},{"t":"if","src":"script/scene_16.txt:121","c":{"o":"==","a":{"v":"f_trio_towel"},"b":{"c":"makoto"}},"f":3826},{"t":"set","src":"script/scene_16.txt:122","fx":[{"n":"g_seen_trio_r01_makoto","op":"=","val":true}]},{"t":"cg","src":"script/scene_16.txt:123","id":"trio_01","diff":null,"trans":"fade","time":1.2},{"t":"wait","src":"script/scene_16.txt:124","time":0.6},{"t":"window","src":"script/scene_16.txt:125","on":true},{"t":"say","who":null,"disp":null,"br":null,"text":"我把毛巾罩在她头上。她没躲，只是把眼镜摘了下来。","src":"script/scene_16.txt:126","rid":"scene_16_start#50"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……自己会擦。","src":"script/scene_16.txt:127","rid":"scene_16_start#51","expr":"shy","voice":"makoto_t01_0014","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"嘴上这么说，头却往我手心里，靠了一点点。","src":"script/scene_16.txt:128","rid":"scene_16_start#52"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀呀。姐姐也在发抖哦？","src":"script/scene_16.txt:129","rid":"scene_16_start#53","expr":"smile","voice":"yukino_t01_0014","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"她从真琴背后探过身来，按住毛巾的另一角，笑着低头看她。","src":"script/scene_16.txt:130","rid":"scene_16_start#54"},{"t":"say","who":null,"disp":null,"br":null,"text":"晚香玉的味道，混着雨水，从她们两个之间，凉凉地飘过来。","src":"script/scene_16.txt:131","rid":"scene_16_start#55"},{"t":"goto","to":3837,"src":"script/scene_16.txt:132"},{"t":"set","src":"script/scene_16.txt:133","fx":[{"n":"g_seen_trio_r01_yukino","op":"=","val":true}]},{"t":"cg","src":"script/scene_16.txt:134","id":"trio_01","diff":"b","trans":"fade","time":1.2},{"t":"wait","src":"script/scene_16.txt:135","time":0.6},{"t":"window","src":"script/scene_16.txt:136","on":true},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃接过毛巾，抖开——然后，一半罩在自己头上，一半罩在真琴头上。","src":"script/scene_16.txt:137","rid":"scene_16_start#56"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"这样就公平了。","src":"script/scene_16.txt:138","rid":"scene_16_start#57","expr":"smile","voice":"yukino_t01_0015","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……太、太近了，桐谷小姐。","src":"script/scene_16.txt:139","rid":"scene_16_start#58","expr":"surprised","voice":"makoto_t01_0015","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"两个人的额头，几乎碰在一起。湿掉的头发，缠在一块儿。","src":"script/scene_16.txt:140","rid":"scene_16_start#59"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"真琴酱身上，是咖啡的味道呢。","src":"script/scene_16.txt:141","rid":"scene_16_start#60","expr":"smile","voice":"yukino_t01_0016","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你身上，是花的。……很浓。","src":"script/scene_16.txt:142","rid":"scene_16_start#61","expr":"shy","voice":"makoto_t01_0016","blip":"off"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……我好像，被晾在一边了。","src":"script/scene_16.txt:143","rid":"scene_16_start#62"},{"t":"cghide","src":"script/scene_16.txt:145","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃从后间拿来一件酒红色的缎面长袍，塞进真琴怀里。眼睛，一直落在她湿透、贴在身上的衬衫上。","src":"script/scene_16.txt:146","rid":"scene_16_start#63"},{"t":"say","who":null,"disp":null,"br":null,"text":"五分钟后，真琴从后间出来。腰带系得死紧，领口拢到了下巴。","src":"script/scene_16.txt:147","rid":"scene_16_start#64"},{"t":"say","who":null,"disp":null,"br":null,"text":"眼镜擦不干，她索性摘了，捏在手里。","src":"script/scene_16.txt:148","rid":"scene_16_start#65"},{"t":"chara","src":"script/scene_16.txt:149","id":"makoto","expr":"annoyed","outfit":"robe","pos":"left","trans":"fade","time":null},{"t":"chara","src":"script/scene_16.txt:150","id":"yukino","expr":"smile","outfit":"apron","pos":"right","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"袖子长了一截。胸口那里，却松松地空出了一点。","src":"script/scene_16.txt:151","rid":"scene_16_start#66"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……这句，我绝对不说出口。","src":"script/scene_16.txt:152","rid":"scene_16_start#67"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"胸口松了一点呢。姐姐的尺寸嘛。……小哥，后面有厨房。煮点热的，三人份。","src":"script/scene_16.txt:153","rid":"scene_16_start#68","expr":"smile","voice":"yukino_t01_0017"},{"t":"say","who":"hero","disp":null,"br":"「","text":"味噌汤可以吗。","src":"script/scene_16.txt:154","rid":"scene_16_start#69"},{"t":"hide","src":"script/scene_16.txt:155","id":"all","trans":"fade","time":null},{"t":"bg","src":"script/scene_16.txt:156","id":"flower_shop_backroom_storm_night","trans":"crossfade","time":1,"hold":null,"keep":false},{"t":"ambient","src":"script/scene_16.txt:157","name":"heavy_rain_loop","vol":0.3,"fade":1,"muffle":"wall"},{"t":"chara","src":"script/scene_16.txt:158","id":"makoto","expr":"normal","outfit":"robe","pos":"left","trans":"fade","time":null},{"t":"chara","src":"script/scene_16.txt:159","id":"yukino","expr":"smile","outfit":"apron","pos":"right","trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……我来帮忙。切葱。","src":"script/scene_16.txt:160","rid":"scene_16_start#70","expr":"normal","voice":"makoto_t01_0017"},{"t":"se","src":"script/scene_16.txt:161","name":"dish_clink","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"五分钟后，砧板上的葱，连成了长长的一整串。","src":"script/scene_16.txt:162","rid":"scene_16_start#71"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。这是……项链？","src":"script/scene_16.txt:163","rid":"scene_16_start#72","expr":"smile","voice":"yukino_t01_0018"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……我说过，我不做饭。","src":"script/scene_16.txt:164","rid":"scene_16_start#73","expr":"annoyed","voice":"makoto_t01_0018"},{"t":"say","who":"hero","disp":null,"br":"「","text":"您没说过。","src":"script/scene_16.txt:165","rid":"scene_16_start#74"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……现在说了。","src":"script/scene_16.txt:166","rid":"scene_16_start#75","expr":"shy","voice":"makoto_t01_0019"},{"t":"say","who":null,"disp":null,"br":null,"text":"三个人挤在后屋的工作台边上，捧着碗。手指，碰到彼此的手指。","src":"script/scene_16.txt:167","rid":"scene_16_start#76"},{"t":"chara","src":"script/scene_16.txt:168","id":"yukino","expr":"tender","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……上次，姐姐说过吧。下次，要一个一个来。","src":"script/scene_16.txt:169","rid":"scene_16_start#77","expr":"tender","voice":"yukino_t01_0019"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了看我，又看了看真琴。","src":"script/scene_16.txt:170","rid":"scene_16_start#78"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……一起来，好像也不坏？","src":"script/scene_16.txt:171","rid":"scene_16_start#79","expr":"smile","voice":"yukino_t01_0020"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……请、请不要用那种说法。","src":"script/scene_16.txt:172","rid":"scene_16_start#80","expr":"shy","voice":"makoto_t01_0020"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哪种说法？……嗯，真琴酱想的那种，姐姐也不讨厌哦。","src":"script/scene_16.txt:173","rid":"scene_16_start#81","expr":"smile","voice":"yukino_t01_0021"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你。","src":"script/scene_16.txt:174","rid":"scene_16_start#82","expr":"annoyed","voice":"makoto_t01_0021"},{"t":"say","who":null,"disp":null,"br":null,"text":"她抬手去推眼镜。指尖扑了个空——眼镜还捏在另一只手里。","src":"script/scene_16.txt:175","rid":"scene_16_start#83"},{"t":"endrecall","id":"trio_r01","src":"script/scene_16.txt:176"},{"t":"bg","src":"script/scene_16.txt:178","id":"flower_shop_storm_inside_night_lily","trans":"crossfade","time":1,"hold":null,"keep":false},{"t":"ambient","src":"script/scene_16.txt:179","name":"heavy_rain_loop","vol":0.4,"fade":1,"muffle":"door"},{"t":"chara","src":"script/scene_16.txt:180","id":"makoto","expr":"normal","outfit":"robe","pos":"left","trans":"fade","time":null},{"t":"chara","src":"script/scene_16.txt:181","id":"yukino","expr":"normal","outfit":"apron","pos":"right","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃从救下来的花桶里，抽出一小枝铃兰。","src":"script/scene_16.txt:182","rid":"scene_16_start#84"},{"t":"say","who":null,"disp":null,"br":null,"text":"插进了柜台旁边，那个细长的玻璃花瓶。","src":"script/scene_16.txt:183","rid":"scene_16_start#85"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"第一枝。……空了五年了。","src":"script/scene_16.txt:184","rid":"scene_16_start#86","expr":"normal","voice":"yukino_t01_0022"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……我家里，连花瓶都没有。","src":"script/scene_16.txt:185","rid":"scene_16_start#87","expr":"normal","voice":"makoto_t01_0022"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那就去买一个。花，姐姐送。","src":"script/scene_16.txt:186","rid":"scene_16_start#88","expr":"smile","voice":"yukino_t01_0023"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……考虑一下。","src":"script/scene_16.txt:187","rid":"scene_16_start#89","expr":"shy","voice":"makoto_t01_0023"},{"t":"hide","src":"script/scene_16.txt:188","id":"all","trans":"fade","time":null},{"t":"ambientstop","src":"script/scene_16.txt:189","name":"all","fade":2},{"t":"bgmfade","src":"script/scene_16.txt:190","time":2},{"t":"jump","src":"script/scene_16.txt:191","label":"scene_17_start"},{"t":"eof","src":"script/scene_16.txt:192"},{"t":"prefetch","se":["knock","dish_clink","pen_write"],"src":"script/scene_17.txt:1"},{"t":"label","src":"script/scene_17.txt:14","name":"scene_17_start"},{"t":"chapter","src":"script/scene_17.txt:15","title":"真琴 × 雪乃","sub":"证人栏"},{"t":"bg","src":"script/scene_17.txt:16","id":"room_yukino_night_green","trans":"black","time":null,"hold":1,"keep":false},{"t":"bgm","src":"script/scene_17.txt:17","name":"night","vol":1,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"四月二十八日，星期二。晚上八点。","src":"script/scene_17.txt:18","rid":"scene_17_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"说好的「报酬」——雪乃亲手做的晚饭。被拖到了今天。","src":"script/scene_17.txt:19","rid":"scene_17_start#1"},{"t":"se","src":"script/scene_17.txt:20","name":"knock","vol":0.5,"loop":false},{"t":"chara","src":"script/scene_17.txt:21","id":"yukino","expr":"smile","outfit":"robering","pos":"right","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"来了来了。……哎呀，两个人一起？","src":"script/scene_17.txt:22","rid":"scene_17_start#2","expr":"smile","voice":"yukino_t01_0024"},{"t":"chara","src":"script/scene_17.txt:23","id":"makoto","expr":"normal","outfit":"suit","pos":"left","trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……在楼梯口碰到的。不是一起来的。","src":"script/scene_17.txt:24","rid":"scene_17_start#3","expr":"normal","voice":"makoto_t01_0024"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"七点五十分。真琴酱又早到了十分钟呢。","src":"script/scene_17.txt:25","rid":"scene_17_start#4","expr":"smile","voice":"yukino_t01_0025"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"是你家的钟慢。我是准时的。","src":"script/scene_17.txt:26","rid":"scene_17_start#5","expr":"annoyed","voice":"makoto_t01_0025"},{"t":"say","who":null,"disp":null,"br":null,"text":"酒红色的缎面长袍，头发放下来。和店里的她，不太一样。","src":"script/scene_17.txt:27","rid":"scene_17_start#6"},{"t":"say","who":null,"disp":null,"br":null,"text":"晚香玉的香味，比平时淡一点。像是刚洗过澡。","src":"script/scene_17.txt:28","rid":"scene_17_start#7"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……桐谷小姐。领口。","src":"script/scene_17.txt:29","rid":"scene_17_start#8","expr":"normal","voice":"makoto_t01_0026"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"嗯？真琴酱在看哪里呀。","src":"script/scene_17.txt:30","rid":"scene_17_start#9","expr":"smile","voice":"yukino_t01_0026"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……我是在提醒你。","src":"script/scene_17.txt:31","rid":"scene_17_start#10","expr":"shy","voice":"makoto_t01_0027"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那，谢谢提醒。……不过，不改哦。今晚，就是想被看的。","src":"script/scene_17.txt:32","rid":"scene_17_start#11","expr":"smile","voice":"yukino_t01_0027"},{"t":"hide","src":"script/scene_17.txt:34","id":"all","trans":"fade","time":null},{"t":"se","src":"script/scene_17.txt:35","name":"dish_clink","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"筑前煮、腌菜、味噌汤。小小的矮桌，挤着三个人。","src":"script/scene_17.txt:36","rid":"scene_17_start#12"},{"t":"chara","src":"script/scene_17.txt:37","id":"makoto","expr":"normal","outfit":"suit","pos":"left","trans":"fade","time":null},{"t":"chara","src":"script/scene_17.txt:38","id":"yukino","expr":"normal","outfit":"robering","pos":"right","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃从柜子里拿出一瓶梅酒。看了一会儿，又放了回去。","src":"script/scene_17.txt:39","rid":"scene_17_start#13"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"今晚，喝茶吧。","src":"script/scene_17.txt:40","rid":"scene_17_start#14","expr":"normal","voice":"yukino_t01_0028"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你不是很能喝吗。","src":"script/scene_17.txt:41","rid":"scene_17_start#15","expr":"surprised","voice":"makoto_t01_0028"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"醉了说的话，算不得数的。","src":"script/scene_17.txt:42","rid":"scene_17_start#16","expr":"serious","voice":"yukino_t01_0029"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"今晚，姐姐想说的，都想算数。","src":"script/scene_17.txt:43","rid":"scene_17_start#17","expr":"tender","voice":"yukino_t01_0030"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴放下了筷子。我也放下了。","src":"script/scene_17.txt:44","rid":"scene_17_start#18"},{"t":"bgm","src":"script/scene_17.txt:45","name":"makoto_theme","vol":1,"fade":2},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……那，我先说。","src":"script/scene_17.txt:46","rid":"scene_17_start#19","expr":"normal","voice":"makoto_t01_0029"},{"t":"say","who":null,"disp":null,"br":null,"text":"她推了一下眼镜。手指，有一点抖。","src":"script/scene_17.txt:47","rid":"scene_17_start#20"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"我在那个房间里，等了一年多。等一个不会回来的人。","src":"script/scene_17.txt:48","rid":"scene_17_start#21","expr":"normal","voice":"makoto_t01_0030"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"每天晚上说「我回来了」。没有人回答。","src":"script/scene_17.txt:49","rid":"scene_17_start#22","expr":"sad","voice":"makoto_t01_0031"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……现在，墙的那边有人会回答了。可是，楼下也有人。","src":"script/scene_17.txt:50","rid":"scene_17_start#23","expr":"normal","voice":"makoto_t01_0032"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了雪乃一眼。很快，又移开。","src":"script/scene_17.txt:51","rid":"scene_17_start#24"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"我不想再等谁。……也不想去抢。","src":"script/scene_17.txt:52","rid":"scene_17_start#25","expr":"normal","voice":"makoto_t01_0033"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……真琴酱。","src":"script/scene_17.txt:53","rid":"scene_17_start#26","expr":"serious","voice":"yukino_t01_0031"},{"t":"bgm","src":"script/scene_17.txt:54","name":"yukino_theme","vol":1,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃握着茶杯。左手无名指上，那枚细银戒指，还在。","src":"script/scene_17.txt:55","rid":"scene_17_start#27"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"姐姐呢，一直都是先出手的那个。","src":"script/scene_17.txt:56","rid":"scene_17_start#28","expr":"tender","voice":"yukino_t01_0032"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"先逗人，先笑，先说「哎呀」。先出手，就不会受伤。","src":"script/scene_17.txt:57","rid":"scene_17_start#29","expr":"tender","voice":"yukino_t01_0033"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……所以这次，我想被选。说清楚了哦。","src":"script/scene_17.txt:58","rid":"scene_17_start#30","expr":"serious","voice":"yukino_t01_0034"},{"t":"say","who":null,"disp":null,"br":null,"text":"两个人，都看着我。","src":"script/scene_17.txt:59","rid":"scene_17_start#31"},{"t":"cg","src":"script/scene_17.txt:60","id":"trio_06","diff":null,"trans":"fade","time":0.8},{"t":"hide","src":"script/scene_17.txt:61","id":"all","trans":"none","time":null},{"t":"say","who":"hero","disp":null,"br":"（","text":"……不能装傻。也不能，替谁做决定。","src":"script/scene_17.txt:62","rid":"scene_17_start#32"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我喜欢椎名小姐。也喜欢桐谷小姐。","src":"script/scene_17.txt:63","rid":"scene_17_start#33"},{"t":"say","who":"hero","disp":null,"br":"「","text":"哪一边都不是「顺便」。……这句话，我想清醒地说。","src":"script/scene_17.txt:64","rid":"scene_17_start#34"},{"t":"say","who":"hero","disp":null,"br":"「","text":"如果两位觉得这样不行，就直说。我不会勉强谁。","src":"script/scene_17.txt:65","rid":"scene_17_start#35"},{"t":"say","who":null,"disp":null,"br":null,"text":"很长的一段安静。茶，凉了一点。","src":"script/scene_17.txt:66","rid":"scene_17_start#36"},{"t":"chara","src":"script/scene_17.txt:67","id":"makoto","expr":"normal","outfit":"suit","pos":"left","trans":"none","time":null},{"t":"chara","src":"script/scene_17.txt:68","id":"yukino","expr":"serious","outfit":"robering","pos":"right","trans":"none","time":null},{"t":"cghide","src":"script/scene_17.txt:69","trans":"fade","time":0.8},{"t":"chara","src":"script/scene_17.txt:70","id":"makoto","expr":"shy","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……那就，都不抢。","src":"script/scene_17.txt:71","rid":"scene_17_start#37","expr":"shy","voice":"makoto_t01_0034"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"三个人。……这是我自己想的。不是被谁说服的。","src":"script/scene_17.txt:72","rid":"scene_17_start#38","expr":"normal","voice":"makoto_t01_0035"},{"t":"say","who":null,"disp":null,"br":null,"text":"她转向雪乃，挺直了背。像在开会。","src":"script/scene_17.txt:73","rid":"scene_17_start#39"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"桐谷小姐。我其实……不讨厌你。是怕你。","src":"script/scene_17.txt:74","rid":"scene_17_start#40","expr":"normal","voice":"makoto_t01_0036"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"你总是一眼就看穿我。……被看穿，好像也不坏。","src":"script/scene_17.txt:75","rid":"scene_17_start#41","expr":"shy","voice":"makoto_t01_0037"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。这算是，告白吗？……姐姐收下了哦。","src":"script/scene_17.txt:76","rid":"scene_17_start#42","expr":"smile","voice":"yukino_t01_0035"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"不、不是对你的——","src":"script/scene_17.txt:77","rid":"scene_17_start#43","expr":"shy","voice":"makoto_t01_0038"},{"t":"say","who":null,"disp":null,"br":null,"text":"她推了一下眼镜。推得太用力，镜框歪了。","src":"script/scene_17.txt:78","rid":"scene_17_start#44"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"姐姐可不怕你。只是你那么认真，让人很想逗到你认输。","src":"script/scene_17.txt:79","rid":"scene_17_start#45","expr":"smile","voice":"yukino_t01_0036"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……三个人。嗯。我也想要。是我自己想要的。","src":"script/scene_17.txt:80","rid":"scene_17_start#46","expr":"smile","voice":"yukino_t01_0037"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"被选了呢。一次被两个人选——姐姐可是很贪心的哦。","src":"script/scene_17.txt:81","rid":"scene_17_start#47","expr":"smile","voice":"yukino_t01_0038"},{"t":"say","who":"hero","disp":null,"br":"（","text":"——先开口的，是她，和我。","src":"script/scene_17.txt:82","rid":"scene_17_start#48"},{"t":"hide","src":"script/scene_17.txt:84","id":"all","trans":"fade","time":null},{"t":"bgm","src":"script/scene_17.txt:85","name":"night","vol":1,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴从包里，拿出一个牛皮纸信封。","src":"script/scene_17.txt:86","rid":"scene_17_start#49"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……离婚申请书。抽屉里放了一个月。","src":"script/scene_17.txt:87","rid":"scene_17_start#50","expr":"normal","voice":"makoto_t01_0039"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"证人栏，要两个人。","src":"script/scene_17.txt:88","rid":"scene_17_start#51","expr":"normal","voice":"makoto_t01_0040"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……真巧。","src":"script/scene_17.txt:89","rid":"scene_17_start#52","expr":"serious","voice":"yukino_t01_0039"},{"t":"say","who":null,"disp":null,"br":null,"text":"她起身，从抽屉里也拿出一个信封。","src":"script/scene_17.txt:90","rid":"scene_17_start#53"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"律师上个月寄来的。修司那一栏，已经签好了。","src":"script/scene_17.txt:91","rid":"scene_17_start#54","expr":"normal","voice":"yukino_t01_0040"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"姐姐的这一栏……一直，没敢写。","src":"script/scene_17.txt:92","rid":"scene_17_start#55","expr":"sad","voice":"yukino_t01_0041"},{"t":"say","who":null,"disp":null,"br":null,"text":"两张一样的纸，并排摊在矮桌上。","src":"script/scene_17.txt:93","rid":"scene_17_start#56"},{"t":"recall","src":"script/scene_17.txt:95","id":"trio_r02","title":"证人栏","chara":"trio","type":"event","thumb":"trio_02","end":4004},{"t":"bg","src":"script/scene_17.txt:97","id":"room_yukino_night_green","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_17.txt:98","name":"night","vol":1,"fade":2},{"t":"chara","src":"script/scene_17.txt:99","id":"makoto","expr":"normal","outfit":"suit","pos":"left","trans":"fade","time":null},{"t":"chara","src":"script/scene_17.txt:100","id":"yukino","expr":"normal","outfit":"robering","pos":"right","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"两张申请书。四个证人栏。三个人。","src":"script/scene_17.txt:101","rid":"scene_17_start#57"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"小哥，两张都签。真琴酱签我的，我签真琴酱的。","src":"script/scene_17.txt:102","rid":"scene_17_start#58","expr":"smile","voice":"yukino_t01_0042"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……我正要这么说。……顺序呢？","src":"script/scene_17.txt:103","rid":"scene_17_start#59","expr":"normal","voice":"makoto_t01_0041"},{"t":"if","src":"script/scene_17.txt:104","c":{"o":"==","a":{"v":"rb_sign"},"b":{"c":"hero"}},"f":3974},{"t":"set","src":"script/scene_17.txt:105","fx":[{"n":"f_trio_sign","op":"=","val":"hero"}]},{"t":"goto","to":3980,"src":"script/scene_17.txt:106"},{"t":"if","c":{"o":"==","a":{"v":"rb_sign"},"b":{"c":"each"}},"f":3977,"src":"script/scene_17.txt:106"},{"t":"set","src":"script/scene_17.txt:107","fx":[{"n":"f_trio_sign","op":"=","val":"each"}]},{"t":"goto","to":3980,"src":"script/scene_17.txt:108"},{"t":"choice","src":"script/scene_17.txt:109","opts":[{"text":"「我先签。两位，慢慢来。」","fx":[{"n":"f_trio_sign","op":"=","val":"hero"}],"target":null,"cond":null,"body":3978,"src":"script/scene_17.txt:110"},{"text":"「两位先签彼此的吧。」","fx":[{"n":"f_trio_sign","op":"=","val":"each"}],"target":null,"cond":null,"body":3979,"src":"script/scene_17.txt:111"}],"end":3980},{"t":"goto","to":3980,"src":"script/scene_17.txt:111"},{"t":"goto","to":3980,"src":"script/scene_17.txt:112"},{"t":"hide","src":"script/scene_17.txt:114","id":"all","trans":"fade","time":null},{"t":"if","src":"script/scene_17.txt:115","c":{"o":"==","a":{"v":"f_trio_sign"},"b":{"c":"hero"}},"f":3990},{"t":"set","src":"script/scene_17.txt:116","fx":[{"n":"g_seen_trio_r02_hero","op":"=","val":true}]},{"t":"cg","src":"script/scene_17.txt:117","id":"trio_02","diff":null,"trans":"fade","time":1},{"t":"se","src":"script/scene_17.txt:118","name":"pen_write","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我先在两张纸上，写下自己的名字。","src":"script/scene_17.txt:119","rid":"scene_17_start#60"},{"t":"say","who":null,"disp":null,"br":null,"text":"她们一左一右，凑过来看。两边的肩膀，都贴着我的胳膊。","src":"script/scene_17.txt:120","rid":"scene_17_start#61"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"字写得好端正。……耳朵也好红。","src":"script/scene_17.txt:121","rid":"scene_17_start#62","expr":"smile","voice":"yukino_t01_0043","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……别动。会写歪的。","src":"script/scene_17.txt:122","rid":"scene_17_start#63","expr":"normal","voice":"makoto_t01_0042","blip":"off"},{"t":"goto","to":3997,"src":"script/scene_17.txt:123"},{"t":"set","src":"script/scene_17.txt:124","fx":[{"n":"g_seen_trio_r02_each","op":"=","val":true}]},{"t":"cg","src":"script/scene_17.txt:125","id":"trio_02","diff":"b","trans":"fade","time":1},{"t":"se","src":"script/scene_17.txt:126","name":"pen_write","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"她们交换了申请书。肩并着肩，低着头，在对方的证人栏里写字。","src":"script/scene_17.txt:127","rid":"scene_17_start#64"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃的卷发，垂到了真琴的手背上。真琴没有拂开。","src":"script/scene_17.txt:128","rid":"scene_17_start#65"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"椎名、真琴。……好看的名字。","src":"script/scene_17.txt:129","rid":"scene_17_start#66","expr":"tender","voice":"yukino_t01_0044","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你写我名字的时候，声音不要那么轻。","src":"script/scene_17.txt:130","rid":"scene_17_start#67","expr":"shy","voice":"makoto_t01_0043","blip":"off"},{"t":"se","src":"script/scene_17.txt:132","name":"pen_write","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，她们在各自的本人栏里，签下了名字。","src":"script/scene_17.txt:133","rid":"scene_17_start#68"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴放下笔，摘下左手的戒指，放在自己的名字旁边。","src":"script/scene_17.txt:134","rid":"scene_17_start#69"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃看着那枚戒指。自己的，没有动。","src":"script/scene_17.txt:135","rid":"scene_17_start#70"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"姐姐的，等到我自己想摘的那天。","src":"script/scene_17.txt:136","rid":"scene_17_start#71","expr":"tender","voice":"yukino_t01_0045","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不会很久的。","src":"script/scene_17.txt:137","rid":"scene_17_start#72","expr":"smile","voice":"yukino_t01_0046","blip":"off"},{"t":"cghide","src":"script/scene_17.txt:138","trans":"fade","time":null},{"t":"endrecall","id":"trio_r02","src":"script/scene_17.txt:139"},{"t":"chara","src":"script/scene_17.txt:141","id":"makoto","expr":"soft","outfit":"suitnoring","pos":"left","trans":"fade","time":null},{"t":"chara","src":"script/scene_17.txt:142","id":"yukino","expr":"smile","outfit":"robering","pos":"right","trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"区役所，星期五。午休的时候去。","src":"script/scene_17.txt:143","rid":"scene_17_start#73","expr":"normal","voice":"makoto_t01_0044"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那姐姐也星期五。店，关一个小时。","src":"script/scene_17.txt:144","rid":"scene_17_start#74","expr":"smile","voice":"yukino_t01_0047"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"十二点十分，区役所门口。……按我的表。","src":"script/scene_17.txt:145","rid":"scene_17_start#75","expr":"normal","voice":"makoto_t01_0045"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"按姐姐的钟，是十二点。","src":"script/scene_17.txt:146","rid":"scene_17_start#76","expr":"smile","voice":"yukino_t01_0048"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……那就会差十分钟。","src":"script/scene_17.txt:147","rid":"scene_17_start#77","expr":"annoyed","voice":"makoto_t01_0046"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那就，小哥站在中间。就这么定了。","src":"script/scene_17.txt:148","rid":"scene_17_start#78","expr":"smile","voice":"yukino_t01_0049"},{"t":"chara","src":"script/scene_17.txt:149","id":"makoto","expr":"soft","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯。","src":"script/scene_17.txt:150","rid":"scene_17_start#79","expr":"soft","voice":"makoto_t01_0047"},{"t":"say","who":null,"disp":null,"br":null,"text":"她笑了。眼镜后面，不是那种克制的半笑。","src":"script/scene_17.txt:151","rid":"scene_17_start#80"},{"t":"hide","src":"script/scene_17.txt:152","id":"all","trans":"fade","time":null},{"t":"bgmfade","src":"script/scene_17.txt:153","time":2},{"t":"jump","src":"script/scene_17.txt:154","label":"scene_18_start"},{"t":"eof","src":"script/scene_17.txt:155"},{"t":"prefetch","se":["rain_loop","knock","door_open","cloth_rustle","cloth_rustle_a","kiss_a","cloth_off_a","kiss_b","cloth_rustle_c","cloth_rustle_b","kiss_c","touch_c","sheets_rustle","touch_a","sheets_b","rhythm_creak_l1","rhythm_creak_l2","sheets_c","sheets_a","thunder_distant","rhythm_creak_l3"],"src":"script/scene_18.txt:1"},{"t":"label","src":"script/scene_18.txt:19","name":"scene_18_start"},{"t":"chapter","src":"script/scene_18.txt:20","title":"真琴 × 雪乃","sub":"两只花瓶"},{"t":"bg","src":"script/scene_18.txt:21","id":"flower_shop_night_green","trans":"black","time":null,"hold":1,"keep":false},{"t":"bgm","src":"script/scene_18.txt:22","name":"daily","vol":1,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"五月二日，星期六。傍晚。","src":"script/scene_18.txt:23","rid":"scene_18_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"昨天中午，十二点零五分。区役所门口，我站在两个人中间。","src":"script/scene_18.txt:24","rid":"scene_18_start#1"},{"t":"say","who":null,"disp":null,"br":null,"text":"两张申请书，一起递了进去。","src":"script/scene_18.txt:25","rid":"scene_18_start#2"},{"t":"chara","src":"script/scene_18.txt:26","id":"makoto","expr":"normal","outfit":"suitnoring","pos":"left","trans":"fade","time":null},{"t":"chara","src":"script/scene_18.txt:27","id":"yukino","expr":"smile","outfit":"apron","pos":"right","trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……买来了。","src":"script/scene_18.txt:28","rid":"scene_18_start#3","expr":"normal","voice":"makoto_t01_0048"},{"t":"say","who":null,"disp":null,"br":null,"text":"她把一个纸盒放在柜台上。里面，是一只小小的白瓷花瓶。","src":"script/scene_18.txt:29","rid":"scene_18_start#4"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"人生第一个。……店员问我送谁，我说送自己。","src":"script/scene_18.txt:30","rid":"scene_18_start#5","expr":"shy","voice":"makoto_t01_0049"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯。那，花是姐姐送的。","src":"script/scene_18.txt:31","rid":"scene_18_start#6","expr":"tender","voice":"yukino_t01_0050"},{"t":"say","who":null,"disp":null,"br":null,"text":"她从桶里挑了三枝铃兰，插了进去。","src":"script/scene_18.txt:32","rid":"scene_18_start#7"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"今晚八点，来 102。两只花瓶，放在一起。","src":"script/scene_18.txt:33","rid":"scene_18_start#8","expr":"smug","voice":"yukino_t01_0051"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……两位都来。迟到的，要罚哦。","src":"script/scene_18.txt:34","rid":"scene_18_start#9","expr":"smug","voice":"yukino_t01_0052"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你说「两位」的时候，看着我干什么。","src":"script/scene_18.txt:35","rid":"scene_18_start#10","expr":"annoyed","voice":"makoto_t01_0050"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"因为真琴酱的耳朵，一下子就红了。","src":"script/scene_18.txt:36","rid":"scene_18_start#11","expr":"smile","voice":"yukino_t01_0053"},{"t":"hide","src":"script/scene_18.txt:37","id":"all","trans":"fade","time":null},{"t":"bgmfade","src":"script/scene_18.txt:38","time":1.5},{"t":"label","src":"script/scene_18.txt:40","name":"scene_18_rh01"},{"t":"recall","src":"script/scene_18.txt:41","id":"trio_rh01","title":"两只花瓶","chara":"trio","type":"h","thumb":"trio_h01","end":4376},{"t":"bg","src":"script/scene_18.txt:44","id":"room_yukino_night_twovases_green","trans":"crossfade","time":1,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_18.txt:45","name":"night","vol":1,"fade":2},{"t":"ambient","src":"script/scene_18.txt:46","name":"rain_loop","vol":0.25,"fade":2,"muffle":"wall"},{"t":"say","who":null,"disp":null,"br":null,"text":"晚上八点。102 室。窗外，下着很细的雨。","src":"script/scene_18.txt:47","rid":"scene_18_rh01#0"},{"t":"zoom","src":"script/scene_18.txt:48","target":"bg","time":2.5,"ease":"soft","wait":true,"scale":1.25,"x":0.62,"y":0.55},{"t":"say","who":null,"disp":null,"br":null,"text":"柜子上，两只花瓶并排站着。细长的玻璃瓶，和矮矮的白瓷瓶。","src":"script/scene_18.txt:49","rid":"scene_18_rh01#1"},{"t":"zoom","src":"script/scene_18.txt:50","target":"bg","time":1,"ease":"inout","wait":true,"reset":true,"all":false},{"t":"chara","src":"script/scene_18.txt:51","id":"yukino","expr":"smile","outfit":"robering","pos":"right","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"焙茶，和气泡水。今晚，一滴酒都没有哦。","src":"script/scene_18.txt:52","rid":"scene_18_rh01#2","expr":"smile","voice":"yukino_t01_0054"},{"t":"se","src":"script/scene_18.txt:53","name":"knock","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"敲门声。八点差十分。","src":"script/scene_18.txt:54","rid":"scene_18_rh01#3"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……按她的表，也还早五分钟呢。","src":"script/scene_18.txt:55","rid":"scene_18_rh01#4","expr":"smile","voice":"yukino_t01_0055"},{"t":"se","src":"script/scene_18.txt:56","name":"door_open","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"进门的真琴，还穿着下午那身西装。肩上落着细雨，眼镜上一层薄雾。","src":"script/scene_18.txt:57","rid":"scene_18_rh01#5"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"上次那件长袍，洗好了哦。……换上吧。西装，今晚用不着。","src":"script/scene_18.txt:58","rid":"scene_18_rh01#6","expr":"smile","voice":"yukino_t01_0056"},{"t":"say","who":null,"disp":null,"br":null,"text":"五分钟后，浴室的门开了。","src":"script/scene_18.txt:59","rid":"scene_18_rh01#7"},{"t":"say","who":null,"disp":null,"br":null,"text":"酒红色的缎面长袍。和雪乃身上那件，一模一样。","src":"script/scene_18.txt:60","rid":"scene_18_rh01#8"},{"t":"say","who":null,"disp":null,"br":null,"text":"镜片被水汽糊住了，她摘下来，捏在手里擦。","src":"script/scene_18.txt:61","rid":"scene_18_rh01#9"},{"t":"chara","src":"script/scene_18.txt:62","id":"makoto","expr":"annoyed","outfit":"robe","pos":"left","trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……撞衫了。而且你的带子系得那么松，是故意的吧。","src":"script/scene_18.txt:63","rid":"scene_18_rh01#10","expr":"annoyed","voice":"makoto_t01_0051"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"是故意的哦。……真琴酱要帮姐姐系紧？还是，帮姐姐解开？","src":"script/scene_18.txt:64","rid":"scene_18_rh01#11","expr":"smile","voice":"yukino_t01_0057"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不系。也、也不解。","src":"script/scene_18.txt:65","rid":"scene_18_rh01#12","expr":"shy","voice":"makoto_t01_0052"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"嗯。那就留到待会儿。","src":"script/scene_18.txt:66","rid":"scene_18_rh01#13","expr":"smile","voice":"yukino_t01_0058"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴把眼镜擦干净，又戴了回去。推了一下。耳朵，还是红的。","src":"script/scene_18.txt:67","rid":"scene_18_rh01#14"},{"t":"hide","src":"script/scene_18.txt:68","id":"all","trans":"fade","time":null},{"t":"window","src":"script/scene_18.txt:69","on":false},{"t":"cg","src":"script/scene_18.txt:70","id":"trio_h01","diff":null,"trans":"crossfade","time":1.4},{"t":"wait","src":"script/scene_18.txt:71","time":0.8},{"t":"window","src":"script/scene_18.txt:72","on":true},{"t":"say","who":null,"disp":null,"br":null,"text":"三个人，并排坐在床沿。中间，是我。","src":"script/scene_18.txt:73","rid":"scene_18_rh01#15"},{"t":"say","who":null,"disp":null,"br":null,"text":"左边是咖啡和肥皂的味道。右边是晚香玉。","src":"script/scene_18.txt:74","rid":"scene_18_rh01#16"},{"t":"say","who":null,"disp":null,"br":null,"text":"两边的体温，隔着一点点距离，慢慢地传过来。","src":"script/scene_18.txt:75","rid":"scene_18_rh01#17"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……开始之前，我想先问清楚。","src":"script/scene_18.txt:76","rid":"scene_18_rh01#18"},{"t":"say","who":"hero","disp":null,"br":"「","text":"椎名小姐。今天，您是清醒的，对吧。","src":"script/scene_18.txt:77","rid":"scene_18_rh01#19"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"一口酒都没喝。……你也是。","src":"script/scene_18.txt:78","rid":"scene_18_rh01#20","voice":"makoto_t01_0053","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"是我自己想要的。不是被谁说服的。是我自己敲的门。","src":"script/scene_18.txt:79","rid":"scene_18_rh01#21","voice":"makoto_t01_0054","blip":"off"},{"t":"say","who":"hero","disp":null,"br":"「","text":"桐谷小姐呢。","src":"script/scene_18.txt:80","rid":"scene_18_rh01#22"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"清醒得很哦。","src":"script/scene_18.txt:81","rid":"scene_18_rh01#23","voice":"yukino_t01_0059","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……是我自己想要的。这一次，不是姐姐先出手。","src":"script/scene_18.txt:82","rid":"scene_18_rh01#24","voice":"yukino_t01_0060","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"她转过身，越过我，看向真琴。声音放低了——不是玩笑，也不是逗人。是在问。","src":"script/scene_18.txt:83","rid":"scene_18_rh01#25"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"真琴。……我可以碰你吗？","src":"script/scene_18.txt:84","rid":"scene_18_rh01#26","voice":"yukino_t01_0061","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……可以。我想让你碰。","src":"script/scene_18.txt:85","rid":"scene_18_rh01#27","voice":"makoto_t01_0055","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"雪乃小姐呢。……我也，可以吗。","src":"script/scene_18.txt:86","rid":"scene_18_rh01#28","voice":"makoto_t01_0056","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"嗯。我也想。……第一次被你叫名字呢。","src":"script/scene_18.txt:87","rid":"scene_18_rh01#29","voice":"yukino_t01_0062","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……就这一次。","src":"script/scene_18.txt:88","rid":"scene_18_rh01#30","voice":"makoto_t01_0057","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"骗人。","src":"script/scene_18.txt:89","rid":"scene_18_rh01#31","voice":"yukino_t01_0063","blip":"off"},{"t":"say","who":"hero","disp":null,"br":"「","text":"还有一件事。任何人觉得不对，随时说一声，就停。不用理由。","src":"script/scene_18.txt:90","rid":"scene_18_rh01#32"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"嗯。随时都可以喊停。三个人都是。","src":"script/scene_18.txt:91","rid":"scene_18_rh01#33","voice":"yukino_t01_0064","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……同意。","src":"script/scene_18.txt:92","rid":"scene_18_rh01#34","voice":"makoto_t01_0058","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……又像在开会了。","src":"script/scene_18.txt:93","rid":"scene_18_rh01#35","voice":"makoto_t01_0059","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"三个人，同时笑了出来。","src":"script/scene_18.txt:94","rid":"scene_18_rh01#36"},{"t":"bgm","src":"script/scene_18.txt:95","name":"night","vol":0.5,"fade":2},{"t":"cghide","src":"script/scene_18.txt:96","trans":"fade","time":0.8},{"t":"zoom","src":"script/scene_18.txt:97","target":"bg","time":3,"ease":"soft","wait":false,"scale":1.35,"x":0.62,"y":0.55},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃站起来，走到柜子前面。","src":"script/scene_18.txt:99","rid":"scene_18_rh01#37"},{"t":"say","who":null,"disp":null,"br":null,"text":"慢慢地，把那枚细银戒指，从无名指上摘了下来。","src":"script/scene_18.txt:100","rid":"scene_18_rh01#38"},{"t":"say","who":null,"disp":null,"br":null,"text":"放在她的玻璃瓶旁边。","src":"script/scene_18.txt:101","rid":"scene_18_rh01#39"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……这次，是我自己选的。","src":"script/scene_18.txt:102","rid":"scene_18_rh01#40","voice":"yukino_t01_0065","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴看着那枚戒指，看了很久。然后，伸手摘下了眼镜。","src":"script/scene_18.txt:103","rid":"scene_18_rh01#41"},{"t":"say","who":null,"disp":null,"br":null,"text":"折好，放在白瓷瓶的旁边。","src":"script/scene_18.txt:104","rid":"scene_18_rh01#42"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……那，我也是。","src":"script/scene_18.txt:105","rid":"scene_18_rh01#43","voice":"makoto_t01_0060","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"两只花瓶旁边，一枚戒指，一副眼镜。","src":"script/scene_18.txt:106","rid":"scene_18_rh01#44"},{"t":"wait","src":"script/scene_18.txt:107","time":1},{"t":"say","who":null,"disp":null,"br":null,"text":"没有了眼镜的她，眼神一下子软了下来。","src":"script/scene_18.txt:108","rid":"scene_18_rh01#45"},{"t":"zoom","src":"script/scene_18.txt:110","target":"bg","time":1,"ease":"inout","wait":true,"reset":true,"all":false},{"t":"if","src":"script/scene_18.txt:112","c":{"o":"==","a":{"v":"rb_lead"},"b":{"c":"yukino"}},"f":4111},{"t":"set","src":"script/scene_18.txt:113","fx":[{"n":"f_trio_ylead","op":"=","val":true}]},{"t":"goto","to":4117,"src":"script/scene_18.txt:114"},{"t":"if","c":{"o":"==","a":{"v":"rb_lead"},"b":{"c":"you"}},"f":4114,"src":"script/scene_18.txt:114"},{"t":"set","src":"script/scene_18.txt:115","fx":[{"n":"f_trio_you","op":"=","val":true}]},{"t":"goto","to":4117,"src":"script/scene_18.txt:116"},{"t":"choice","src":"script/scene_18.txt:117","opts":[{"text":"「……桐谷小姐，先带路吧。」","fx":[{"n":"f_trio_ylead","op":"=","val":true}],"target":null,"cond":null,"body":4115,"src":"script/scene_18.txt:118"},{"text":"「今晚，让我来照顾两位。」","fx":[{"n":"f_trio_you","op":"=","val":true}],"target":null,"cond":null,"body":4116,"src":"script/scene_18.txt:119"}],"end":4117},{"t":"goto","to":4117,"src":"script/scene_18.txt:119"},{"t":"goto","to":4117,"src":"script/scene_18.txt:120"},{"t":"if","src":"script/scene_18.txt:122","c":{"v":"f_trio_ylead"},"f":4125},{"t":"set","src":"script/scene_18.txt:123","fx":[{"n":"g_seen_trio_rh01_yukino","op":"=","val":true}]},{"t":"cg","src":"script/scene_18.txt:124","id":"trio_h01","diff":"a","trans":"crossfade","time":1.4},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。被点名了。","src":"script/scene_18.txt:125","rid":"scene_18_rh01#46","voice":"yukino_t01_0066","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"她先牵起真琴的手，再牵起我的。像在花店里，教新来的人系围裙。","src":"script/scene_18.txt:126","rid":"scene_18_rh01#47"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……慢慢来哦。谁先脸红，谁就输。","src":"script/scene_18.txt:127","rid":"scene_18_rh01#48","voice":"yukino_t01_0067","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……那我已经输了。……不许笑。","src":"script/scene_18.txt:128","rid":"scene_18_rh01#49","voice":"makoto_t01_0061","blip":"off"},{"t":"goto","to":4130,"src":"script/scene_18.txt:129"},{"t":"set","src":"script/scene_18.txt:130","fx":[{"n":"g_seen_trio_rh01_you","op":"=","val":true}]},{"t":"cg","src":"script/scene_18.txt:131","id":"trio_h01","diff":"a2","trans":"crossfade","time":1.4},{"t":"say","who":"yukino","disp":null,"br":"「","text":"照顾两位？……好呀。姐姐倒要看看，你照顾得过来吗。","src":"script/scene_18.txt:132","rid":"scene_18_rh01#50","voice":"yukino_t01_0068","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不要争。今晚，听他的。","src":"script/scene_18.txt:133","rid":"scene_18_rh01#51","voice":"makoto_t01_0062","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。真琴酱，这句话，好大胆。","src":"script/scene_18.txt:134","rid":"scene_18_rh01#52","voice":"yukino_t01_0069","blip":"off"},{"t":"bgm","src":"script/scene_18.txt:136","name":"h_scene","vol":0.55,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"两条一模一样的长袍带子。灯，暗了一格。","src":"script/scene_18.txt:137","rid":"scene_18_rh01#53"},{"t":"hb_begin","id":"trio_h01_01","src":"script/scene_18.txt:139","stages":[{"stage":"intro","label":"前戏","pc":4134}]},{"t":"se","src":"script/h_blocks/trio_h01_01.txt:15","name":"cloth_rustle","vol":0.4,"loop":false},{"t":"hstage","src":"script/h_blocks/trio_h01_01.txt:17","stage":"intro","char":"trio","fade":null},{"t":"bgm","src":"script/h_blocks/trio_h01_01.txt:18","name":"h_scene","vol":0.45,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃先动了。她没有碰我，而是侧过身，指尖勾住了真琴长袍的衣领。","src":"script/h_blocks/trio_h01_01.txt:19","rid":"hb:trio_h01_01#0","hb":"trio_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"真琴酱。借你的这件，姐姐可以收回来吗？","src":"script/h_blocks/trio_h01_01.txt:20","rid":"hb:trio_h01_01#1","expr":"smile","voice":"yukino_th1_0001","blip":"off","hb":"trio_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……问一次就够了。……可以。","src":"script/h_blocks/trio_h01_01.txt:21","rid":"hb:trio_h01_01#2","expr":"shy","voice":"makoto_th1_0001","blip":"off","hb":"trio_h01_01"},{"t":"se","src":"script/h_blocks/trio_h01_01.txt:22","name":"cloth_rustle_a","vol":0.35,"loop":false,"pan":-0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"酒红的缎面从她肩上慢慢滑下来。锁骨，然后是被黑色内衣裹住的胸口。","src":"script/h_blocks/trio_h01_01.txt:23","rid":"hb:trio_h01_01#3","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"没有了眼镜的真琴眯着眼想看清我们，眼神却怎么也聚不起焦。","src":"script/h_blocks/trio_h01_01.txt:24","rid":"hb:trio_h01_01#4","hb":"trio_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"看不清吧？那就别看了。用别的地方感觉。","src":"script/h_blocks/trio_h01_01.txt:25","rid":"hb:trio_h01_01#5","expr":"smile","voice":"yukino_th1_0002","blip":"off","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃从背后抱住她，下巴搁在她肩上，朝我抬了抬眼。","src":"script/h_blocks/trio_h01_01.txt:26","rid":"hb:trio_h01_01#6","hb":"trio_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"来呀。前面，是留给你的。","src":"script/h_blocks/trio_h01_01.txt:27","rid":"hb:trio_h01_01#7","expr":"smile","voice":"yukino_th1_0003","blip":"off","hb":"trio_h01_01"},{"t":"breath","src":"script/h_blocks/trio_h01_01.txt:28","level":2,"fade":4},{"t":"se","src":"script/h_blocks/trio_h01_01.txt:29","name":"kiss_a","vol":0.22,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻上真琴。咖啡和肥皂的味道。她的嘴唇抖了一下，然后用力吻了回来。","src":"script/h_blocks/trio_h01_01.txt:30","rid":"hb:trio_h01_01#8","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"身后，雪乃的手指沿着她的腰线往上爬，解开了背后的搭扣。","src":"script/h_blocks/trio_h01_01.txt:31","rid":"hb:trio_h01_01#9","hb":"trio_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……等、两个人一起……不公平……","src":"script/h_blocks/trio_h01_01.txt:32","rid":"hb:trio_h01_01#10","expr":"surprised","voice":"makoto_th1_0002","blip":"off","hb":"trio_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"嗯，不公平哦。要停吗？","src":"script/h_blocks/trio_h01_01.txt:33","rid":"hb:trio_h01_01#11","expr":"smile","voice":"yukino_th1_0004","blip":"off","hb":"trio_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不停。……别笑。","src":"script/h_blocks/trio_h01_01.txt:34","rid":"hb:trio_h01_01#12","expr":"shy","voice":"makoto_th1_0003","blip":"off","hb":"trio_h01_01"},{"t":"se","src":"script/h_blocks/trio_h01_01.txt:35","name":"cloth_off_a","vol":0.28,"loop":false,"pan":-0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"沉甸甸的乳房从布料里滑出来。雪乃从下面托住，像托着刚剪下的花。","src":"script/h_blocks/trio_h01_01.txt:36","rid":"hb:trio_h01_01#13","hb":"trio_h01_01"},{"t":"se","src":"script/h_blocks/trio_h01_01.txt:37","name":"kiss_b","vol":0.2,"loop":false,"pan":0.1},{"t":"say","who":null,"disp":null,"br":null,"text":"我低头含住一边。另一边，被雪乃的指尖慢慢捻着。","src":"script/h_blocks/trio_h01_01.txt:38","rid":"hb:trio_h01_01#14","hb":"trio_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯、……啊……！不、两边……同时……","src":"script/h_blocks/trio_h01_01.txt:39","rid":"hb:trio_h01_01#15","expr":"shy","voice":"makoto_th1_0004","blip":"off","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那个在会议室里一句话就让所有人闭嘴的声音，碎成了一截一截的喘息。","src":"script/h_blocks/trio_h01_01.txt:40","rid":"hb:trio_h01_01#16","hb":"trio_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"好硬了呢。……他舔得好，还是姐姐捏得好？","src":"script/h_blocks/trio_h01_01.txt:41","rid":"hb:trio_h01_01#17","expr":"smile","voice":"yukino_th1_0005","blip":"off","hb":"trio_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……这种问题，不回答……","src":"script/h_blocks/trio_h01_01.txt:42","rid":"hb:trio_h01_01#18","expr":"annoyed","voice":"makoto_th1_0005","blip":"off","hb":"trio_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那，就让身体回答吧。","src":"script/h_blocks/trio_h01_01.txt:43","rid":"hb:trio_h01_01#19","expr":"smile","voice":"yukino_th1_0006","blip":"off","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃的另一只手滑过她平坦的小腹，勾住了长袍松垮的腰带。","src":"script/h_blocks/trio_h01_01.txt:44","rid":"hb:trio_h01_01#20","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了我一眼。我点头。真琴自己抬起了腰。","src":"script/h_blocks/trio_h01_01.txt:45","rid":"hb:trio_h01_01#21","hb":"trio_h01_01"},{"t":"se","src":"script/h_blocks/trio_h01_01.txt:46","name":"cloth_rustle_c","vol":0.3,"loop":false,"pan":-0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"腰带一抽，长袍彻底散开。最后那一片薄薄的黑色，已湿出一小块深色。","src":"script/h_blocks/trio_h01_01.txt:47","rid":"hb:trio_h01_01#22","hb":"trio_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。……明明，还什么都没开始呢。","src":"script/h_blocks/trio_h01_01.txt:48","rid":"hb:trio_h01_01#23","expr":"smile","voice":"yukino_th1_0007","blip":"off","hb":"trio_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……都、都怪你们……！","src":"script/h_blocks/trio_h01_01.txt:49","rid":"hb:trio_h01_01#24","expr":"shy","voice":"makoto_th1_0006","blip":"off","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她想并起腿。雪乃从身后用膝盖轻轻抵住，没有用力，只是等着。","src":"script/h_blocks/trio_h01_01.txt:50","rid":"hb:trio_h01_01#25","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴咬着嘴唇，看了我很久。然后，自己把腿分开了。","src":"script/h_blocks/trio_h01_01.txt:51","rid":"hb:trio_h01_01#26","hb":"trio_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……看吧。……反正，我也看不清你们的脸。","src":"script/h_blocks/trio_h01_01.txt:52","rid":"hb:trio_h01_01#27","expr":"shy","voice":"makoto_th1_0007","blip":"off","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃笑着，把自己那条一模一样的腰带，递到我手里。","src":"script/h_blocks/trio_h01_01.txt:53","rid":"hb:trio_h01_01#28","hb":"trio_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"这个，你来拉。……姐姐的，也要你亲手拆。","src":"script/h_blocks/trio_h01_01.txt:54","rid":"hb:trio_h01_01#29","expr":"smile","voice":"yukino_th1_0008","blip":"off","hb":"trio_h01_01"},{"t":"se","src":"script/h_blocks/trio_h01_01.txt:55","name":"cloth_rustle_b","vol":0.35,"loop":false,"pan":0.25},{"t":"say","who":null,"disp":null,"br":null,"text":"墨绿色的腰带一松，酒红的缎面就从她肩上流了下去。底下，什么都没有穿。","src":"script/h_blocks/trio_h01_01.txt:56","rid":"hb:trio_h01_01#30","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"丰满的胸口，柔软的腰，赤着的脚尖。晚香玉的香气一下子浓了起来。","src":"script/h_blocks/trio_h01_01.txt:57","rid":"hb:trio_h01_01#31","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她把头发拨到肩后，大大方方地让我们看。","src":"script/h_blocks/trio_h01_01.txt:58","rid":"hb:trio_h01_01#32","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴眯着眼看她，喉咙动了一下。","src":"script/h_blocks/trio_h01_01.txt:59","rid":"hb:trio_h01_01#33","hb":"trio_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……雪乃小姐，好漂亮。……不公平。","src":"script/h_blocks/trio_h01_01.txt:60","rid":"hb:trio_h01_01#34","expr":"shy","voice":"makoto_th1_0008","blip":"off","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃正要笑着回一句。我没等她开口，低头含住了她的乳尖。","src":"script/h_blocks/trio_h01_01.txt:61","rid":"hb:trio_h01_01#35","hb":"trio_h01_01"},{"t":"se","src":"script/h_blocks/trio_h01_01.txt:62","name":"kiss_c","vol":0.22,"loop":false,"pan":0.2},{"t":"breath","src":"script/h_blocks/trio_h01_01.txt:63","level":3,"fade":0.4},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……哎？等、现在是真琴的……呀、啊……！","src":"script/h_blocks/trio_h01_01.txt:64","rid":"hb:trio_h01_01#36","expr":"shy","voice":"yukino_th1_0009","blip":"off","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那声惊叫，比刚才的真琴还要高半个调。","src":"script/h_blocks/trio_h01_01.txt:65","rid":"hb:trio_h01_01#37","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴凑近，眯着眼看清了她的脸，愣住了。","src":"script/h_blocks/trio_h01_01.txt:66","rid":"hb:trio_h01_01#38","hb":"trio_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……雪乃小姐。……脸，红了。","src":"script/h_blocks/trio_h01_01.txt:67","rid":"hb:trio_h01_01#39","expr":"shy","voice":"makoto_th1_0023","blip":"off","hb":"trio_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……没、没有。是灯……灯太暖了。","src":"script/h_blocks/trio_h01_01.txt:68","rid":"hb:trio_h01_01#40","expr":"shy","voice":"yukino_th1_0025","blip":"off","hb":"trio_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……骗人。……原来，你也会这样。","src":"script/h_blocks/trio_h01_01.txt:69","rid":"hb:trio_h01_01#41","expr":"shy","voice":"makoto_th1_0024","blip":"off","hb":"trio_h01_01"},{"t":"breath","src":"script/h_blocks/trio_h01_01.txt:70","level":2,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"三个人，都停了一拍。","src":"script/h_blocks/trio_h01_01.txt:71","rid":"hb:trio_h01_01#42","hb":"trio_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"只剩下呼吸，和雨声。","src":"script/h_blocks/trio_h01_01.txt:72","rid":"hb:trio_h01_01#43","hb":"trio_h01_01"},{"t":"ambient","src":"script/h_blocks/trio_h01_01.txt:73","name":"rain_loop","vol":0.35,"fade":3,"muffle":"wall"},{"t":"hstage","src":"script/h_blocks/trio_h01_01.txt:75","stage":"end","char":"trio","fade":2},{"t":"hb_end","id":"trio_h01_01","src":"script/scene_18.txt:139"},{"t":"ambient","src":"script/scene_18.txt:141","name":"rain_loop","vol":0.4,"fade":2,"muffle":"wall"},{"t":"say","who":null,"disp":null,"br":null,"text":"窗外的雨，大了一点。","src":"script/scene_18.txt:142","rid":"scene_18_rh01#54"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴的手，先找到了雪乃的手。雪乃愣了一下——没有躲。","src":"script/scene_18.txt:143","rid":"scene_18_rh01#55"},{"t":"wait","src":"script/scene_18.txt:144","time":0.6},{"t":"flash","src":"script/scene_18.txt:147","color":"white","time":0.25,"count":1},{"t":"cg","src":"script/scene_18.txt:148","id":"trio_h01","diff":"b","trans":"crossfade","time":1.4},{"t":"hb_begin","id":"trio_h01_02","src":"script/scene_18.txt:149","stages":[{"stage":"build","label":"渐入","pc":4200}]},{"t":"hstage","src":"script/h_blocks/trio_h01_02.txt:12","stage":"build","char":"trio","fade":null},{"t":"bgm","src":"script/h_blocks/trio_h01_02.txt:13","name":"h_scene","vol":0.5,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴握着雪乃的手，没有松开。","src":"script/h_blocks/trio_h01_02.txt:14","rid":"hb:trio_h01_02#0","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，她用那只手，把雪乃拉了过来。","src":"script/h_blocks/trio_h01_02.txt:15","rid":"hb:trio_h01_02#1","hb":"trio_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……哎呀。真琴，想做什么？","src":"script/h_blocks/trio_h01_02.txt:16","rid":"hb:trio_h01_02#2","expr":"smile","voice":"yukino_th1_0010","blip":"off","hb":"trio_h01_02"},{"t":"se","src":"script/h_blocks/trio_h01_02.txt:17","name":"kiss_b","vol":0.22,"loop":false,"pan":-0.1},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴吻了她。不是试探，是开会时一锤定音那样，毫不犹豫的吻。","src":"script/h_blocks/trio_h01_02.txt:18","rid":"hb:trio_h01_02#3","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃想笑着把这个吻接过去。真琴却没给她机会，吻得更深。","src":"script/h_blocks/trio_h01_02.txt:19","rid":"hb:trio_h01_02#4","hb":"trio_h01_02"},{"t":"shake","src":"script/h_blocks/trio_h01_02.txt:21","power":"weak","time":0.2,"target":"screen"},{"t":"se","src":"script/h_blocks/trio_h01_02.txt:23","name":"touch_c","vol":0.3,"loop":false,"pan":-0.15},{"t":"breath","src":"script/h_blocks/trio_h01_02.txt:24","level":3,"fade":0.3},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……一直都是你先出手。今天，换我。","src":"script/h_blocks/trio_h01_02.txt:25","rid":"hb:trio_h01_02#5","expr":"normal","voice":"makoto_th1_0009","blip":"off","hb":"trio_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……可以吗。不行就说。","src":"script/h_blocks/trio_h01_02.txt:26","rid":"hb:trio_h01_02#6","expr":"shy","voice":"makoto_th1_0010","blip":"off","hb":"trio_h01_02"},{"t":"breath","src":"script/h_blocks/trio_h01_02.txt:27","level":2,"fade":1.5},{"t":"say","who":"yukino","disp":null,"br":"「","text":"可、可以哦。……来，让姐姐看看你有多认真——","src":"script/h_blocks/trio_h01_02.txt:28","rid":"hb:trio_h01_02#7","expr":"smile","voice":"yukino_th1_0011","blip":"off","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"话没说完，她就被真琴按倒在了枕上。","src":"script/h_blocks/trio_h01_02.txt:29","rid":"hb:trio_h01_02#8","hb":"trio_h01_02"},{"t":"se","src":"script/h_blocks/trio_h01_02.txt:30","name":"sheets_rustle","vol":0.35,"loop":false},{"t":"zoom","src":"script/h_blocks/trio_h01_02.txt:31","target":"cg","time":8,"ease":"inout","wait":false,"scale":1.04,"x":0.5,"y":0.5},{"t":"say","who":null,"disp":null,"br":null,"text":"两个人散开的长发，在枕上缠在一起。","src":"script/h_blocks/trio_h01_02.txt:32","rid":"hb:trio_h01_02#9","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"十指扣着，压在枕边。两只无名指上，同样一圈浅浅的戒痕，贴在了一起。","src":"script/h_blocks/trio_h01_02.txt:33","rid":"hb:trio_h01_02#10","hb":"trio_h01_02"},{"t":"se","src":"script/h_blocks/trio_h01_02.txt:34","name":"kiss_c","vol":0.2,"loop":false,"pan":0.1},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴低下头，吻她的颈侧，锁骨，然后是丰满的胸口。","src":"script/h_blocks/trio_h01_02.txt:35","rid":"hb:trio_h01_02#11","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"动作还有点生涩。可每一下，都认真得像在批改文件。","src":"script/h_blocks/trio_h01_02.txt:36","rid":"hb:trio_h01_02#12","hb":"trio_h01_02"},{"t":"breath","src":"script/h_blocks/trio_h01_02.txt:37","level":3,"fade":2},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯、等……真琴，你、什么时候学会的……","src":"script/h_blocks/trio_h01_02.txt:38","rid":"hb:trio_h01_02#13","expr":"shy","voice":"yukino_th1_0012","blip":"off","hb":"trio_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……刚才，你也是这样捏我的。还给你。","src":"script/h_blocks/trio_h01_02.txt:39","rid":"hb:trio_h01_02#14","expr":"annoyed","voice":"makoto_th1_0011","blip":"off","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她含住雪乃的乳尖，轻轻一咬。","src":"script/h_blocks/trio_h01_02.txt:40","rid":"hb:trio_h01_02#15","hb":"trio_h01_02"},{"t":"se","src":"script/h_blocks/trio_h01_02.txt:41","name":"touch_a","vol":0.22,"loop":false},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……呀啊……！？","src":"script/h_blocks/trio_h01_02.txt:42","rid":"hb:trio_h01_02#16","expr":"shy","voice":"yukino_th1_0026","blip":"off","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃的腰一下子弹了起来。她自己都愣住了，睁大眼睛看着真琴。","src":"script/h_blocks/trio_h01_02.txt:43","rid":"hb:trio_h01_02#17","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴回过头。脸红到耳根，眼神却很直。","src":"script/h_blocks/trio_h01_02.txt:44","rid":"hb:trio_h01_02#18","hb":"trio_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你也来。……她想要你。我看得出来。","src":"script/h_blocks/trio_h01_02.txt:45","rid":"hb:trio_h01_02#19","expr":"shy","voice":"makoto_th1_0012","blip":"off","hb":"trio_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……等、两个人一起……姐姐、会接不住的……","src":"script/h_blocks/trio_h01_02.txt:47","rid":"hb:trio_h01_02#20","expr":"shy","voice":"yukino_th1_0013","blip":"off","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我跪到雪乃的腿间。那里早已湿得一塌糊涂，在台灯下泛着光。","src":"script/h_blocks/trio_h01_02.txt:48","rid":"hb:trio_h01_02#21","hb":"trio_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"雪乃小姐。可以吗？","src":"script/h_blocks/trio_h01_02.txt:49","rid":"hb:trio_h01_02#22","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看看我，又看看真琴。咬住嘴唇，轻轻点了头。","src":"script/h_blocks/trio_h01_02.txt:50","rid":"hb:trio_h01_02#23","hb":"trio_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……想要。……不是逗你，是真的想要。","src":"script/h_blocks/trio_h01_02.txt:51","rid":"hb:trio_h01_02#24","expr":"shy","voice":"yukino_th1_0014","blip":"off","hb":"trio_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……我在这里。不舒服，就捏我的手。","src":"script/h_blocks/trio_h01_02.txt:52","rid":"hb:trio_h01_02#25","expr":"soft","voice":"makoto_th1_0013","blip":"off","hb":"trio_h01_02"},{"t":"se","src":"script/h_blocks/trio_h01_02.txt:53","name":"sheets_b","vol":0.26,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我抵上去，一点一点地推进。湿热的内里，一寸一寸地把我吞了下去。","src":"script/h_blocks/trio_h01_02.txt:54","rid":"hb:trio_h01_02#26","hb":"trio_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……啊……嗯……！好满……太、太满了……！","src":"script/h_blocks/trio_h01_02.txt:55","rid":"hb:trio_h01_02#27","expr":"tender","voice":"yukino_th1_0015","blip":"off","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手在真琴掌心里死死收紧。真琴回握，俯下身吻她。","src":"script/h_blocks/trio_h01_02.txt:56","rid":"hb:trio_h01_02#28","hb":"trio_h01_02"},{"t":"breath","src":"script/h_blocks/trio_h01_02.txt:57","level":2,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"我开始动。很慢，很深。每一次都退到快要离开，再整根没进去。","src":"script/h_blocks/trio_h01_02.txt:58","rid":"hb:trio_h01_02#29","hb":"trio_h01_02"},{"t":"ambient","src":"script/h_blocks/trio_h01_02.txt:59","name":"rhythm_creak_l1","vol":0.18,"fade":2,"muffle":2500},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴的手指沿着雪乃的小腹往下，找到我们相连处上方，那最敏感的一点。","src":"script/h_blocks/trio_h01_02.txt:60","rid":"hb:trio_h01_02#30","hb":"trio_h01_02"},{"t":"breath","src":"script/h_blocks/trio_h01_02.txt:61","level":3,"fade":2},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……那、那里……两个人一起……会坏掉的……可是、别停……！","src":"script/h_blocks/trio_h01_02.txt:62","rid":"hb:trio_h01_02#31","expr":"shy","voice":"yukino_th1_0016","blip":"off","hb":"trio_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……刚才，是谁说『不公平哦』的。","src":"script/h_blocks/trio_h01_02.txt:63","rid":"hb:trio_h01_02#32","expr":"annoyed","voice":"makoto_th1_0014","blip":"off","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"嘴上这么说，耳朵却红透了。她的手指，一点都没有停。","src":"script/h_blocks/trio_h01_02.txt:64","rid":"hb:trio_h01_02#33","hb":"trio_h01_02"},{"t":"ambient","src":"script/h_blocks/trio_h01_02.txt:65","name":"rhythm_creak_l2","vol":0.22,"fade":2,"xfade":"rhythm_creak_l1","muffle":3500},{"t":"bgm","src":"script/h_blocks/trio_h01_02.txt:66","name":"h_scene","vol":0.55,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"指腹轻轻打着圈。每一圈，雪乃的内里都绞紧一次。","src":"script/h_blocks/trio_h01_02.txt:67","rid":"hb:trio_h01_02#34","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃仰起脖子，眼神完全散了。那张从容的脸，一点都不剩。","src":"script/h_blocks/trio_h01_02.txt:68","rid":"hb:trio_h01_02#35","hb":"trio_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……雪乃小姐，也会露出这种表情啊。","src":"script/h_blocks/trio_h01_02.txt:69","rid":"hb:trio_h01_02#36","expr":"shy","voice":"makoto_th1_0025","blip":"off","hb":"trio_h01_02"},{"t":"breath","src":"script/h_blocks/trio_h01_02.txt:70","level":4,"fade":2},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不、不许看……呜……求你们……再、再快一点……","src":"script/h_blocks/trio_h01_02.txt:71","rid":"hb:trio_h01_02#37","expr":"shy","voice":"yukino_th1_0017","blip":"off","hb":"trio_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……您说了算？","src":"script/h_blocks/trio_h01_02.txt:72","rid":"hb:trio_h01_02#38","hb":"trio_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不、不是我……你们说了算……我、听话……","src":"script/h_blocks/trio_h01_02.txt:73","rid":"hb:trio_h01_02#39","expr":"tender","voice":"yukino_th1_0027","blip":"off","hb":"trio_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……雪乃小姐，在求人。……真是的，好可爱。","src":"script/h_blocks/trio_h01_02.txt:74","rid":"hb:trio_h01_02#40","expr":"shy","voice":"makoto_th1_0015","blip":"off","hb":"trio_h01_02"},{"t":"se","src":"script/h_blocks/trio_h01_02.txt:75","name":"sheets_c","vol":0.26,"loop":false,"pan":0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"我再快一点。真琴吻她的泪痣。雪乃的脚趾蜷起，腰一下一下迎上来。","src":"script/h_blocks/trio_h01_02.txt:76","rid":"hb:trio_h01_02#41","hb":"trio_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……输了……姐姐，输给你们两个了……","src":"script/h_blocks/trio_h01_02.txt:77","rid":"hb:trio_h01_02#42","expr":"tender","voice":"yukino_th1_0018","blip":"off","hb":"trio_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……好喜欢。……两个人，都好喜欢。","src":"script/h_blocks/trio_h01_02.txt:78","rid":"hb:trio_h01_02#43","expr":"tender","voice":"yukino_th1_0028","blip":"off","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她不再笑了。只是红着眼睛，一遍一遍地说。","src":"script/h_blocks/trio_h01_02.txt:79","rid":"hb:trio_h01_02#44","hb":"trio_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"没有半句玩笑。那是她第一次，把自己整个交出来的真心。","src":"script/h_blocks/trio_h01_02.txt:80","rid":"hb:trio_h01_02#45","hb":"trio_h01_02"},{"t":"breath","src":"script/h_blocks/trio_h01_02.txt:81","level":2,"fade":3},{"t":"ambientstop","src":"script/h_blocks/trio_h01_02.txt:82","name":"rhythm_creak_l2","fade":3},{"t":"bgm","src":"script/h_blocks/trio_h01_02.txt:83","name":"h_scene","vol":0.5,"fade":3},{"t":"zoom","src":"script/h_blocks/trio_h01_02.txt:84","target":"cg","time":1.5,"ease":"inout","wait":true,"reset":true,"all":false},{"t":"hstage","src":"script/h_blocks/trio_h01_02.txt:86","stage":"end","char":"trio","fade":2},{"t":"hb_end","id":"trio_h01_02","src":"script/scene_18.txt:149"},{"t":"flash","src":"script/scene_18.txt:151","color":"#fbe3b4","time":0.3,"count":1},{"t":"cg","src":"script/scene_18.txt:152","id":"trio_h01","diff":"c","trans":"crossfade","time":1.4},{"t":"hb_begin","id":"trio_h01_03","src":"script/scene_18.txt:153","stages":[{"stage":"build","label":"渐入","pc":4275},{"stage":"climax","label":"高潮","pc":4312},{"stage":"after","label":"余韵","pc":4330}]},{"t":"hstage","src":"script/h_blocks/trio_h01_03.txt:11","stage":"build","char":"trio","fade":null},{"t":"bgm","src":"script/h_blocks/trio_h01_03.txt:12","name":"h_scene","vol":0.55,"fade":2},{"t":"breath","src":"script/h_blocks/trio_h01_03.txt:13","level":2,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃抬起手，摸了摸真琴的脸。那只手，还在微微发抖。","src":"script/h_blocks/trio_h01_03.txt:14","rid":"hb:trio_h01_03#0","hb":"trio_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……真琴也要。一个人等着，不可以哦。","src":"script/h_blocks/trio_h01_03.txt:15","rid":"hb:trio_h01_03#1","expr":"tender","voice":"yukino_th1_0019","blip":"off","hb":"trio_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……我、我没在等……","src":"script/h_blocks/trio_h01_03.txt:16","rid":"hb:trio_h01_03#2","expr":"shy","voice":"makoto_th1_0016","blip":"off","hb":"trio_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……我的腿，已经没力气了。……真琴，趴到我身上来。","src":"script/h_blocks/trio_h01_03.txt:17","rid":"hb:trio_h01_03#3","expr":"shy","voice":"yukino_th1_0020","blip":"off","hb":"trio_h01_03"},{"t":"se","src":"script/h_blocks/trio_h01_03.txt:18","name":"sheets_a","vol":0.24,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我慢慢退出来。真琴伏到雪乃身上，两对丰满的胸口贴在一起。","src":"script/h_blocks/trio_h01_03.txt:19","rid":"hb:trio_h01_03#4","hb":"trio_h01_03"},{"t":"filter","src":"script/h_blocks/trio_h01_03.txt:20","name":"softglow","strength":0.4,"time":1.2},{"t":"zoom","src":"script/h_blocks/trio_h01_03.txt:22","target":"cg","time":14,"ease":"soft","wait":false,"scale":1.06,"x":0.5,"y":0.45},{"t":"say","who":null,"disp":null,"br":null,"text":"两颗心跳，隔着汗湿的皮肤，互相撞着。","src":"script/h_blocks/trio_h01_03.txt:23","rid":"hb:trio_h01_03#5","hb":"trio_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"真琴。可以吗？","src":"script/h_blocks/trio_h01_03.txt:24","rid":"hb:trio_h01_03#6","hb":"trio_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……是我自己想要的。……快点。","src":"script/h_blocks/trio_h01_03.txt:25","rid":"hb:trio_h01_03#7","expr":"shy","voice":"makoto_th1_0017","blip":"off","hb":"trio_h01_03"},{"t":"se","src":"script/h_blocks/trio_h01_03.txt:26","name":"sheets_b","vol":0.26,"loop":false,"pan":0.15},{"t":"say","who":null,"disp":null,"br":null,"text":"我从后面握住她的腰，慢慢地进去。她比想象中更紧，更烫。","src":"script/h_blocks/trio_h01_03.txt:27","rid":"hb:trio_h01_03#8","hb":"trio_h01_03"},{"t":"ambient","src":"script/h_blocks/trio_h01_03.txt:28","name":"rhythm_creak_l1","vol":0.18,"fade":2,"muffle":2500},{"t":"breath","src":"script/h_blocks/trio_h01_03.txt:29","level":3,"fade":2},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……啊……！嗯、……{hero}……","src":"script/h_blocks/trio_h01_03.txt:30","rid":"hb:trio_h01_03#9","expr":"shy","voice":"makoto_th1_0018","blip":"off","nameCall":["hero"],"hb":"trio_h01_03"},{"t":"se","src":"script/h_blocks/trio_h01_03.txt:31","name":"kiss_a","vol":0.2,"loop":false,"pan":-0.1},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃在下面捧住她的脸，吻她。每当我顶进去，真琴就被推得贴向雪乃一下。","src":"script/h_blocks/trio_h01_03.txt:32","rid":"hb:trio_h01_03#10","hb":"trio_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"两个人的身体一起晃。雪乃也跟着，漏出细细的声音。","src":"script/h_blocks/trio_h01_03.txt:33","rid":"hb:trio_h01_03#11","hb":"trio_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃的手滑进两人之间，同时拨弄着真琴，和她自己。","src":"script/h_blocks/trio_h01_03.txt:34","rid":"hb:trio_h01_03#12","hb":"trio_h01_03"},{"t":"ambient","src":"script/h_blocks/trio_h01_03.txt:35","name":"rhythm_creak_l2","vol":0.22,"fade":2,"xfade":"rhythm_creak_l1","muffle":3500},{"t":"bgm","src":"script/h_blocks/trio_h01_03.txt:36","name":"h_scene","vol":0.58,"fade":2},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……好、好厉害……前后……都……脑子要……","src":"script/h_blocks/trio_h01_03.txt:37","rid":"hb:trio_h01_03#13","expr":"shy","voice":"makoto_th1_0019","blip":"off","hb":"trio_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不用想。……我刚才，也什么都想不了。……交给他。","src":"script/h_blocks/trio_h01_03.txt:38","rid":"hb:trio_h01_03#14","expr":"tender","voice":"yukino_th1_0021","blip":"off","hb":"trio_h01_03"},{"t":"se","src":"script/h_blocks/trio_h01_03.txt:39","name":"thunder_distant","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"远处响了一声雷。没有人在意。","src":"script/h_blocks/trio_h01_03.txt:40","rid":"hb:trio_h01_03#15","hb":"trio_h01_03"},{"t":"breath","src":"script/h_blocks/trio_h01_03.txt:41","level":4,"fade":3},{"t":"ambient","src":"script/h_blocks/trio_h01_03.txt:42","name":"rhythm_creak_l3","vol":0.26,"fade":2,"xfade":"rhythm_creak_l2"},{"t":"bgm","src":"script/h_blocks/trio_h01_03.txt:43","name":"h_scene","vol":0.62,"fade":2,"intensity":"high"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴的嘴硬，一句也没剩下。只剩下短短的、诚实的字。","src":"scr
