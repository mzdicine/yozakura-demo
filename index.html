":null,"br":null,"text":"手指拨开布料滑进去的一瞬间，她整个人缩了一下，抓住我的手腕——不是推开，是按住。","src":"script/h_blocks/makoto_h01_01.txt:57","rid":"hb:makoto_h01_01#32","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那么软，那么湿。指腹轻轻碾过最敏感的那一点，她的膝盖就开始发抖。","src":"script/h_blocks/makoto_h01_01.txt:58","rid":"hb:makoto_h01_01#33","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那个在会议上一句话就能让整个房间安静下来的人，此刻把脸埋进我的肩膀，一声一声地，压着气喘。","src":"script/h_blocks/makoto_h01_01.txt:59","rid":"hb:makoto_h01_01#34","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……{hero}。……{hero}……","src":"script/h_blocks/makoto_h01_01.txt:60","rid":"hb:makoto_h01_01#35","expr":"shy","voice":"makoto_h01_0039","blip":"off","nameCall":["hero"],"hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她伸手来解我的皮带。手指抖得对不准，她低声骂了自己一句。","src":"script/h_blocks/makoto_h01_01.txt:61","rid":"hb:makoto_h01_01#36","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……平时，明明什么都做得好……","src":"script/h_blocks/makoto_h01_01.txt:62","rid":"hb:makoto_h01_01#37","expr":"annoyed","voice":"makoto_h01_0040","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我握住她的手，和她一起解开。","src":"script/h_blocks/makoto_h01_01.txt:63","rid":"hb:makoto_h01_01#38","hb":"makoto_h01_01"},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:64","name":"cloth_off_c","vol":0.3,"loop":false,"pan":-0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"衣服一件一件落在地上。赤裸的胸口贴在一起，她的心跳快得像要撞破那层薄薄的皮肤。","src":"script/h_blocks/makoto_h01_01.txt:65","rid":"hb:makoto_h01_01#39","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，我们都停了下来。","src":"script/h_blocks/makoto_h01_01.txt:66","rid":"hb:makoto_h01_01#40","hb":"makoto_h01_01"},{"t":"breath","src":"script/h_blocks/makoto_h01_01.txt:67","level":1,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"窗外的天空，无声地白了一瞬。","src":"script/h_blocks/makoto_h01_01.txt:68","rid":"hb:makoto_h01_01#41","hb":"makoto_h01_01"},{"t":"hstage","src":"script/h_blocks/makoto_h01_01.txt:70","stage":"end","char":"makoto","fade":1.5},{"t":"hb_end","id":"makoto_h01_01","src":"script/scene_11.txt:127"},{"t":"se","src":"script/scene_11.txt:129","name":"thunder","vol":1,"loop":false},{"t":"flash","src":"script/scene_11.txt:130","color":"white","time":0.3,"count":1},{"t":"say","who":null,"disp":null,"br":null,"text":"雷声，近得像就在窗外。","src":"script/scene_11.txt:131","rid":"scene_11_rh01#44"},{"t":"say","who":null,"disp":null,"br":null,"text":"她攥紧了我的手。","src":"script/scene_11.txt:132","rid":"scene_11_rh01#45"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不是怕打雷。","src":"script/scene_11.txt:133","rid":"scene_11_rh01#46","expr":"shy","voice":"makoto_h01_0019","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"是怕，你停下来。","src":"script/scene_11.txt:134","rid":"scene_11_rh01#47","expr":"shy","voice":"makoto_h01_0020","blip":"off"},{"t":"hb_begin","id":"makoto_h01_02","src":"script/scene_11.txt:136","stages":[{"stage":"build","label":"渐入","pc":2959}]},{"t":"ambient","src":"script/h_blocks/makoto_h01_02.txt:13","name":"storm_loop","vol":0.15,"fade":3,"muffle":"corridor"},{"t":"hstage","src":"script/h_blocks/makoto_h01_02.txt:14","stage":"build","char":"makoto","fade":null},{"t":"bgm","src":"script/h_blocks/makoto_h01_02.txt:16","name":"h_scene","vol":0.5,"fade":3},{"t":"say","who":"hero","disp":null,"br":"「","text":"我不会停。","src":"script/h_blocks/makoto_h01_02.txt:17","rid":"hb:makoto_h01_02#0","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"除非你说停。","src":"script/h_blocks/makoto_h01_02.txt:18","rid":"hb:makoto_h01_02#1","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不会说的。","src":"script/h_blocks/makoto_h01_02.txt:19","rid":"hb:makoto_h01_02#2","expr":"shy","voice":"makoto_h01_0041","blip":"off","hb":"makoto_h01_02"},{"t":"se","src":"script/h_blocks/makoto_h01_02.txt:20","name":"sheets_rustle","vol":0.35,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"她躺下去，黑发散在我的枕头上。没有眼镜，没有扣到顶的衬衫。灰蓝色的眼睛湿漉漉的，直直地看着我。","src":"script/h_blocks/makoto_h01_02.txt:21","rid":"hb:makoto_h01_02#3","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她勾住我的脖子，把我拉下去。","src":"script/h_blocks/makoto_h01_02.txt:22","rid":"hb:makoto_h01_02#4","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……快点。……不要让我，说第二遍。","src":"script/h_blocks/makoto_h01_02.txt:23","rid":"hb:makoto_h01_02#5","expr":"annoyed","voice":"makoto_h01_0042","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我抵上去。前端碰到那片湿热的时候，她的呼吸停了一拍。","src":"script/h_blocks/makoto_h01_02.txt:24","rid":"hb:makoto_h01_02#6","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，慢慢地推进去。","src":"script/h_blocks/makoto_h01_02.txt:25","rid":"hb:makoto_h01_02#7","hb":"makoto_h01_02"},{"t":"se","src":"script/h_blocks/makoto_h01_02.txt:26","name":"sheets_b","vol":0.3,"loop":false},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯、……啊……","src":"script/h_blocks/makoto_h01_02.txt:27","rid":"hb:makoto_h01_02#8","expr":"shy","voice":"makoto_h01_0043","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"很紧。她的身体像是忘了该怎么接纳一个人，又像是记得太清楚。","src":"script/h_blocks/makoto_h01_02.txt:28","rid":"hb:makoto_h01_02#9","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我停在一半，吻她的眼角。","src":"script/h_blocks/makoto_h01_02.txt:29","rid":"hb:makoto_h01_02#10","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"疼吗？","src":"script/h_blocks/makoto_h01_02.txt:30","rid":"hb:makoto_h01_02#11","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不疼。……只是、太满了……","src":"script/h_blocks/makoto_h01_02.txt:31","rid":"hb:makoto_h01_02#12","expr":"shy","voice":"makoto_h01_0044","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的腿缠上来，脚跟抵着我的腰，往里压。","src":"script/h_blocks/makoto_h01_02.txt:32","rid":"hb:makoto_h01_02#13","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……别停在那里。……全部。","src":"script/h_blocks/makoto_h01_02.txt:33","rid":"hb:makoto_h01_02#14","expr":"shy","voice":"makoto_h01_0045","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"直到完全进去。她长长地、颤抖地吐出一口气。","src":"script/h_blocks/makoto_h01_02.txt:34","rid":"hb:makoto_h01_02#15","hb":"makoto_h01_02"},{"t":"cg","src":"script/h_blocks/makoto_h01_02.txt:35","id":"makoto_h01","diff":"b","trans":"crossfade","time":1.2,"hb":"makoto_h01_02"},{"t":"zoom","src":"script/h_blocks/makoto_h01_02.txt:36","target":"cg","time":5,"ease":"inout","wait":false,"scale":1.05,"x":0.5,"y":0.5},{"t":"say","who":null,"disp":null,"br":null,"text":"外套还落在地上。她的手找到我的手，十指扣紧，按在枕头上。","src":"script/h_blocks/makoto_h01_02.txt:37","rid":"hb:makoto_h01_02#16","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"枕边，她的眼镜折好放着，镜片映着窗外的雨。旁边是她的手表。","src":"script/h_blocks/makoto_h01_02.txt:38","rid":"hb:makoto_h01_02#17","hb":"makoto_h01_02"},{"t":"ambient","src":"script/h_blocks/makoto_h01_02.txt:39","name":"clock_tick","vol":0.18,"fade":0.8},{"t":"say","who":null,"disp":null,"br":null,"text":"雨声里，秒针一格一格地走。调准了的，一秒也不快。","src":"script/h_blocks/makoto_h01_02.txt:40","rid":"hb:makoto_h01_02#18","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"而她的心跳，快得根本追不上它。","src":"script/h_blocks/makoto_h01_02.txt:41","rid":"hb:makoto_h01_02#19","hb":"makoto_h01_02"},{"t":"ambient","src":"script/h_blocks/makoto_h01_02.txt:42","name":"rhythm_creak_l1","vol":0.2,"fade":2,"muffle":2500},{"t":"breath","src":"script/h_blocks/makoto_h01_02.txt:43","level":3,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"我开始动。很慢。每一次退出来，她的内里都绞着不放；每一次深入，她的背就离开床单一点。","src":"script/h_blocks/makoto_h01_02.txt:44","rid":"hb:makoto_h01_02#20","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯……嗯、……{hero}……","src":"script/h_blocks/makoto_h01_02.txt:45","rid":"hb:makoto_h01_02#21","expr":"shy","voice":"makoto_h01_0046","blip":"off","nameCall":["hero"],"hb":"makoto_h01_02"},{"t":"cg","src":"script/h_blocks/makoto_h01_02.txt:46","id":"makoto_h01","diff":"b_e1","trans":"crossfade","time":1.4,"hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不许、看我的脸……","src":"script/h_blocks/makoto_h01_02.txt:47","rid":"hb:makoto_h01_02#22","expr":"annoyed","voice":"makoto_h01_0047","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"想看。","src":"script/h_blocks/makoto_h01_02.txt:48","rid":"hb:makoto_h01_02#23","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……讨厌。……讨厌你……","src":"script/h_blocks/makoto_h01_02.txt:49","rid":"hb:makoto_h01_02#24","expr":"shy","voice":"makoto_h01_0048","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"嘴上这样说，扣着我的手指却收得更紧了。","src":"script/h_blocks/makoto_h01_02.txt:50","rid":"hb:makoto_h01_02#25","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我顶得更深。湿润的声音混进雨声里，她自己也听见了，耳朵一路红到脖子。","src":"script/h_blocks/makoto_h01_02.txt:51","rid":"hb:makoto_h01_02#26","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她别过脸，咬住自己的手背，把声音咽回去。","src":"script/h_blocks/makoto_h01_02.txt:52","rid":"hb:makoto_h01_02#27","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我把那只手轻轻拿开，扣回枕边。","src":"script/h_blocks/makoto_h01_02.txt:53","rid":"hb:makoto_h01_02#28","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"不用忍。这里，只有我听得见。","src":"script/h_blocks/makoto_h01_02.txt:54","rid":"hb:makoto_h01_02#29","hb":"makoto_h01_02"},{"t":"breath","src":"script/h_blocks/makoto_h01_02.txt:55","level":4,"fade":2},{"t":"ambient","src":"script/h_blocks/makoto_h01_02.txt:56","name":"rhythm_creak_l2","vol":0.24,"fade":2,"xfade":"rhythm_creak_l1","muffle":3500},{"t":"bgm","src":"script/h_blocks/makoto_h01_02.txt:57","name":"h_scene","vol":0.55,"fade":2},{"t":"cg","src":"script/h_blocks/makoto_h01_02.txt:58","id":"makoto_h01","diff":"b_e2","trans":"crossfade","time":1.3,"hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的腰开始跟着我的节奏抬起来。先是犹豫的，然后越来越诚实。","src":"script/h_blocks/makoto_h01_02.txt:59","rid":"hb:makoto_h01_02#30","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"丰满的胸口随着每一次撞击摇晃，汗湿的发丝贴在额头上。那个永远一丝不乱的椎名真琴，此刻乱得一塌糊涂。","src":"script/h_blocks/makoto_h01_02.txt:60","rid":"hb:makoto_h01_02#31","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……那里……再、……再一下……","src":"script/h_blocks/makoto_h01_02.txt:61","rid":"hb:makoto_h01_02#32","expr":"shy","voice":"makoto_h01_0049","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"这里？","src":"script/h_blocks/makoto_h01_02.txt:62","rid":"hb:makoto_h01_02#33","hb":"makoto_h01_02"},{"t":"se","src":"script/h_blocks/makoto_h01_02.txt:63","name":"sheets_c","vol":0.3,"loop":false,"pan":0.2},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯！……就是、那里……","src":"script/h_blocks/makoto_h01_02.txt:64","rid":"hb:makoto_h01_02#34","expr":"shy","voice":"makoto_h01_0050","blip":"off","hb":"makoto_h01_02"},{"t":"cg","src":"script/h_blocks/makoto_h01_02.txt:65","id":"makoto_h01","diff":"b_e3","trans":"crossfade","time":1.2,"hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她仰起脖子。喉咙里漏出来的，再也不是会议室里那种干脆的短句，而是又软又甜、拖着尾音的呜咽。","src":"script/h_blocks/makoto_h01_02.txt:66","rid":"hb:makoto_h01_02#35","hb":"makoto_h01_02"},{"t":"se","src":"script/h_blocks/makoto_h01_02.txt:67","name":"thunder_distant","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"雷声滚过去。她连眼睛都没有眨。","src":"script/h_blocks/makoto_h01_02.txt:68","rid":"hb:makoto_h01_02#36","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……我说谎了。","src": ":"after","label":"余韵","pc":3059}]},{"t":"say","who":null,"disp":null,"br":null,"text":"她不再忍了。","src":"script/h_blocks/makoto_h01_03.txt:12","rid":"hb:makoto_h01_03#0","hb":"makoto_h01_03"},{"t":"hstage","src":"script/h_blocks/makoto_h01_03.txt:14","stage":"build","char":"makoto","fade":null},{"t":"breath","src":"script/h_blocks/makoto_h01_03.txt:15","level":5,"fade":1.5},{"t":"ambient","src":"script/h_blocks/makoto_h01_03.txt:16","name":"rhythm_creak_l3","vol":0.26,"fade":1.5,"xfade":"rhythm_creak_l2"},{"t":"bgm","src":"script/h_blocks/makoto_h01_03.txt:17","name":"h_scene","vol":0.62,"fade":1.5,"intensity":"high"},{"t":"say","who":null,"disp":null,"br":null,"text":"双腿紧紧缠着我。每一次我顶进去，她就迎上来，像是要把这些年空掉的时间，一口气全部补回来。","src":"script/h_blocks/makoto_h01_03.txt:18","rid":"hb:makoto_h01_03#1","hb":"makoto_h01_03"},{"t":"zoom","src":"script/h_blocks/makoto_h01_03.txt:20","target":"cg","time":14,"ease":"soft","wait":false,"scale":1.06,"x":0.5,"y":0.45},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……{hero}、……{hero}……","src":"script/h_blocks/makoto_h01_03.txt:21","rid":"hb:makoto_h01_03#2","expr":"soft","voice":"makoto_h01_0054","blip":"off","nameCall":["hero"],"hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她一遍一遍地叫这个名字。明明不久之前，连「早川」都叫得那么生硬。","src":"script/h_blocks/makoto_h01_03.txt:22","rid":"hb:makoto_h01_03#3","hb":"makoto_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"真琴……我快要……","src":"script/h_blocks/makoto_h01_03.txt:23","rid":"hb:makoto_h01_03#4","hb":"makoto_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯。……不要出去。","src":"script/h_blocks/makoto_h01_03.txt:24","rid":"hb:makoto_h01_03#5","expr":"shy","voice":"makoto_h01_0055","blip":"off","hb":"makoto_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"就这样，在我里面……我要清醒地、记住。","src":"script/h_blocks/makoto_h01_03.txt:25","rid":"hb:makoto_h01_03#6","expr":"soft","voice":"makoto_h01_0056","blip":"off","hb":"makoto_h01_03"},{"t":"say","who":null,"disp "voice":"makoto_h01_0027","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了一眼枕边的表。指针，走得一秒都不差。","src":"script/scene_11.txt:172","rid":"scene_11_rh01#58"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"现在的时间，是我们两个人的。","src":"script/scene_11.txt:173","rid":"scene_11_rh01#59","expr":"soft","voice":"makoto_h01_0028"},{"t":"filter","src":"script/scene_11.txt:174","name":"none","strength":0.8,"time":1},{"t":"cghide","src":"script/scene_11.txt:175","trans":"fade","time":null},{"t":"endrecall","id":"makoto_rh01","src":"script/scene_11.txt:176"},{"t":"ambientstop","src":"script/scene_11.txt:178","name":"all","fade":2},{"t":"bgmfade","src":"script/scene_11.txt:179","time":2},{"t":"jump","src":"script/scene_11.txt:180","label":"scene_14_start"},{"t":"eof","src":"script/scene_11.txt:181"},{"t":"prefetch","se":["knock","shop_bell","box_drop","storm_loop","thunder","window_rattle","thunder_distant","dish_clink"],"src":"script/scene_12.txt:1"},{"t":"label","src":"script/scene_12.txt:11","name":"scene_12_start"},{"t":"chapter","src":"script/scene_12.txt:12","title":"雪乃","sub":"空了五年的花瓶"},{"t":"bg","src":"script/scene_12.txt:13","id":"room_hero_day","trans":"black","time":null,"hold":0.8,"keep":false},{"t":"bgm","src":"script/scene_12.txt:14","name":"daily","vol":1,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"四月二十五日，星期六。早上九点。","src":"script/scene_12.txt:15","rid":"scene_12_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"楼下传来卷帘门哗啦啦拉起的声音。","src":"script/scene_12.txt:16","rid":"scene_12_start#1"},{"t":"if","src":"script/scene_12.txt:18","c":{"v":"f_lily"},"f":3142},{"t":"recall","src":"script/scene_12.txt:19","id":"yukino_r02","title":"还活着的铃兰","chara":"yukino","type":"event","thumb":"yukino_01","end":3141},{"t":"bg","src":"script/scene_12.txt:20","id":"room_hero_day","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_12.txt:21","name":"yukino_theme","vol":1,"fade":1.5},{"t":"se","src":"scri ime":null},{"t":"endrecall","id":"yukino_r02","src":"script/scene_12.txt:38"},{"t":"bg","src":"script/scene_12.txt:41","id":"flower_shop_day","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"se","src":"script/scene_12.txt:42","name":"shop_bell","vol":0.5,"loop":false},{"t":"bgm","src":"script/scene_12.txt:43","name":"daily","vol":1,"fade":1.5},{"t":"chara","src":"script/scene_12.txt:44","id":"yukino","expr":"smile","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"店门口停着一辆小货车。车斗里，塞满了白色的花。","src":"script/scene_12.txt:45","rid":"scene_12_start#12"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"婚礼会场的花。两百枝玫瑰，八十枝百合。","src":"script/scene_12.txt:46","rid":"scene_12_start#13","voice":"yukino_e01_0005"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"来，小哥。玫瑰搬左边，百合搬右边。报酬是晚饭。","src":"script/scene_12.txt:47","rid":"scene_12_start#14","expr":"smug","voice":"yukino_e01_0006"},{"t":"se","src":"script/scene_12.txt:48","name":"box_drop","vol":0.5,"loop":false},{"t":"shake","src":"script/scene_12.txt:49","power":"weak","time":0.2,"target":"screen"},{"t":"say","who":null,"disp":null,"br":null,"text":"第一箱就差点脱手。花比想象的重得多。","src":"script/scene_12.txt:50","rid":"scene_12_start#15"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"腰要用力，不是手。……哎呀，好笨拙。","src":"script/scene_12.txt:51","rid":"scene_12_start#16","expr":"smile","voice":"yukino_e01_0007"},{"t":"if","src":"script/scene_12.txt:52","c":{"o":"!=","a":{"v":"f_yukino_flower"},"b":{"c":"none"}},"f":3157},{"t":"say","who":"yukino","disp":null,"br":"「","text":"公司桌上那枝，还活着吗？","src":"script/scene_12.txt:53","rid":"scene_12_start#17","voice":"yukino_e01_0008"},{"t":"say","who":"hero","disp":null,"br":"「","text":"每天换水。被前辈笑了三次。","src":"script/scene_12.txt:54","rid":"scene_12_start#18"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"三次呀。那就是，被羡慕了三次。","src":"script/scene_12.txt:55","rid":"scene_12_start#19","expr":"smile","voice":"yukino_e01_0009"},{"t":"say","who":null,"disp":null,"br":null,"text":"中午，我们坐在花桶中间，吃她做的饭团。","src":"script/scene_12.txt:57","rid":"scene_12_start#20"},{"t":"say","who":null,"disp":null,"br":null,"text":"柜台旁边，那个细长的花瓶，还是空的。","src":"script/scene_12.txt:58","rid":"scene_12_start#21"},{"t":"bg","src":"script/scene_12.txt:60","id":"flower_shop_storm_night","trans":"crossfade","time":1.5,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_12.txt:61","name":"night","vol":1,"fade":2},{"t":"ambient","src":"script/scene_12.txt:62","name":"storm_loop","vol":0.6,"fade":2},{"t":"se","src":"script/scene_12.txt:63","name":"thunder","vol":1,"loop":false},{"t":"flash","src":"script/scene_12.txt:64","color":"white","time":0.3,"count":1},{"t":"say","who":null,"disp":null,"br":null,"text":"晚上七点。天气预报没说的暴风雨，忽然来了。","src":"script/scene_12.txt:65","rid":"scene_12_start#22"},{"t":"chara","src":"script/scene_12.txt:66","id":"yukino","expr":"serious","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"——外面的花架！","src":"script/scene_12.txt:67","rid":"scene_12_start#23","expr":"serious","voice":"yukino_e01_0010"},{"t":"say","who":null,"disp":null,"br":null,"text":"门口，明天要送的花，还摆在雨里。","src":"script/scene_12.txt:68","rid":"scene_12_start#24"},{"t":"choice","src":"script/scene_12.txt:69","opts":[{"text":"（冲进雨里，把花架抱回来）","fx":[{"n":"aff_yukino","op":"+=","val":2},{"n":"f_yukino_rescue","op":"=","val":true}],"target":null,"cond":null,"body":3169,"src":"script/scene_12.txt:70"},{"text":"（先帮她拉下卷帘门，再从里面一桶桶搬）","fx":[{"n":"aff_yukino","op":"+=","val":1},{"n":"f_yukino_shutter","op":"=","val":true}],"target":null,"cond":null,"body":3175,"src":"script/scene_12.txt:76"}],"end":3180},{"t":"se","src":"script/scene_12.txt:71","name":"window_rattle","vol":0.6,"loop":false},{"t":"shake","src":"script/scene_12.txt:72","power":"normal","time":0.4,"target":"screen"},{"t":"say","who":null,"disp":null,"br":null,"text":"风把雨水横着打在脸上。我抱起花桶，一趟，两趟。","src":"script/scene_12.txt:73","rid":"scene_12_start#25"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"小哥！先回来——","src":"script/scene_12.txt:74","rid":"scene_12_start#26","expr":"surprised","voice":"yukino_e01_0011"},{"t":"say","who":null,"disp":null,"br":null,"text":"最后一桶抱进门的时候，我浑身都湿透了。","src":"script/scene_12.txt:75","rid":"scene_12_start#27"},{"t":"goto","to":3180,"src":"script/scene_12.txt:76"},{"t":"se","src":"script/scene_12.txt:78","name":"window_rattle","vol":0.6,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"卷帘门哗啦啦落下一半。我们从缝隙里，把花桶拖进来。","src":"script/scene_12.txt:79","rid":"scene_12_start#28"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……冷静的男人，不讨厌哦。","src":"script/scene_12.txt:80","rid":"scene_12_start#29","expr":"serious","voice":"yukino_e01_0012"},{"t":"say","who":null,"disp":null,"br":null,"text":"可最后，我们两个还是都湿透了。","src":"script/scene_12.txt:81","rid":"scene_12_start#30"},{"t":"goto","to":3180,"src":"script/scene_12.txt:82"},{"t":"recall","src":"script/scene_12.txt:84","id":"yukino_r01","title":"空了五年的花瓶","chara":"yukino","type":"event","thumb":"yukino_01","end":3208},{"t":"bg","src":"script/scene_12.txt:85","id":"flower_shop_storm_inside_night","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_12.txt:86","name":"yukino_theme","vol":1,"fade":2},{"t":"ambient","src":"script/scene_12.txt:88","name":"storm_loop","vol":0.4,"fade":1.5,"muffle":"door"},{"t":"chara","src":"script/scene_12.txt:89","id":"yukino","expr":"normal","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"店里的灯，只开了柜台那一盏。雨敲着卷帘门。","src":"script/scene_12.txt:90","rid":"scene_12_start#31"},{"t":"se","src":"script/scene_12.txt:91","name":"window_rattle","vol":0.35,"loop":false},{"t":"cg","src":"script/scene_12.txt:92","id":"yukino_01","diff":null,"trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她拿毛巾给我擦头发。左手的无名指上，银戒指闪了一下。","src":"script/scene_12.txt:93","rid":"scene_12_start#32"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……傻瓜。花倒了就倒了。","src":"script/scene_12.txt:94","rid":"scene_12_start#33","voice":"yukino_e01_0013"},{"t":"say","who":"hero","disp":null,"br":"「","text":"可您会难过吧。","src":"script/scene_12.txt:95","rid":"scene_12_start#34"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手，停了。","src":"script/scene_12.txt:96","rid":"scene_12_start#35"},{"t":"se","src":"script/scene_12.txt:97","name":"thunder_distant","vol":0.4,"loop":false},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……我丈夫，以前是做摄影的。","src":"script/scene_12.txt:98","rid":"scene_12_start#36","expr":"sad","voice":"yukino_e01_0014"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"海边的小工作室。五年前的夏天，他没有回来。","src":"script/scene_12.txt:99","rid":"scene_12_start#37","expr":"sad","voice":"yukino_e01_0015"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那个花瓶，是他送的。说要插第一枝……就走了。","src":"script/scene_12.txt:100","rid":"scene_12_start#38","voice":"yukino_e01_0016"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"所以啊，姐姐总是先出手。逗别人，宠别人。","src":"script/scene_12.txt:101","rid":"scene_12_start#39","expr":"smile","voice":"yukino_e01_0017"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"被别人看穿之前，先把人推开一点点。","src":"script/scene_12.txt:102","rid":"scene_12_start#40","expr":"sad","voice":"yukino_e01_0018"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……预订簿上那行『藤花』，也是吗？","src":"script/scene_12.txt:103","rid":"scene_12_start#41"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那位客人呀，每年都只付钱、不取花。","src":"script/scene_12.txt:104","rid":"scene_12_start#42","voice":"yukino_e01_0019"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"我每年都照样扎好，等着有人来取。然后，自己看着它谢掉。","src":"script/scene_12.txt:105","rid":"scene_12_start#43","expr":"sad","voice":"yukino_e01_0020"},{"t":"say","who":null,"disp":null,"br":null,"text":"我站起来。柜台上散着抢救回来的铃兰，我拢起一小把。","src":"script/scene_12.txt:106","rid":"scene_12_start#44"},{"t":"say","who":null,"disp":null,"br":null,"text":"放进了那个空着的玻璃花瓶。","src":"script/scene_12.txt:107","rid":"scene_12_start#45"},{"t":"cg","src":"script/scene_12.txt:108","id":"yukino_01","diff":"b","trans":"fade","time":null},{"t":"bg","src":"script/scene_12.txt:109","id":"flower_shop_storm_inside_night_lily","trans":"none","time":null,"hold":null,"keep":false},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……","src":"script/scene_12.txt:110","rid":"scene_12_start#46","expr":"surprised","voice":"yukino_e01_0021","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看着那枝花。看了很久，很久。","src":"script/scene_12.txt:111","rid":"scene_12_start#47"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……五年了。第一次，有花。","src":"script/scene_12.txt:112","rid":"scene_12_start#48","expr":"tender","voice":"yukino_e01_0022"},{"t":"endrecall","id":"yukino_r01","src":"script/scene_12.txt:113"},{"t":"cghide","src":"script/scene_12.txt:115","trans":"fade","time":null},{"t":"chara","src":"script/scene_12.txt:116","id":"yukino","expr":"smile","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"choice","src":"script/scene_12.txt:117","opts":[{"text":"「下次，让我来约您。」","fx":[{"n":"aff_yukino","op":"+=","val":2},{"n":"f_yukino_promise","op":"=","val":true}],"target":null,"cond":null,"body":3212,"src":"script/scene_12.txt:118"},{"text":"「……今天的晚饭，我很期待。」","fx":[{"n":"aff_yukino","op":"+=","val":1},{"n":"f_yukino_dinner","op":"=","val":true}],"target":null,"cond":null,"body":3216,"src":"script/scene_12.txt:122"}],"end":3219},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……约姐姐？","src":"script/scene_12.txt:119","rid":"scene_12_start#49","expr":"surprised","voice":"yukino_e01_0023"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。被小哥抢先了呢。……好，准了。日子，姐姐来挑。","src":"script/scene_12.txt:120","rid":"scene_12_start#50","expr":"smug","voice":"yukino_e01_0024"},{"t":"say","who":null,"disp":null,"br":null,"text":"她没有移开视线，托着腮，慢慢地把我看了一遍。","src":"script/scene_12.txt:121","rid":"scene_12_start#51"},{"t":"goto","to":3219,"src":"script/scene_12.txt:122"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"对哦。报酬还没付呢。","src":"script/scene_12.txt:123","rid":"scene_12_start#52","expr":"smile","voice":"yukino_e01_0025"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"姐姐说话，向来算数的。","src":"script/scene_12.txt:124","rid":"scene_12_start#53","expr":"smile","voice":"yukino_e01_0026"},{"t":"goto","to":3219,"src":"script/scene_12.txt:125"},{"t":"ambient","src":"script/scene_12.txt:127","name":"storm_loop","vol":0.25,"fade":2,"muffle":"door"},{"t":"say","who":null,"disp":null,"br":null,"text":"晚饭是店里后间的小锅。土锅里煮着豆腐和蛤蜊。","src":"script/scene_12.txt:128","rid":"scene_12_start#54"},{"t":"se","src":"script/scene_12.txt:129","name":"dish_clink","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"她倒了一小杯梅酒。抿了一口，就放下了。","src":"script/scene_12.txt:130","rid":"scene_12_start#55"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……醉了说的话，算不得数。","src":"script/scene_12.txt:131","rid":"scene_12_start#56","expr":"normal","voice":"yukino_e01_0027"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"所以今晚，不说。","src":"script/scene_12.txt:132","rid":"scene_12_start#57","expr":"tender","voice":"yukino_e01_0028"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……那，下次呢？","src":"script/scene_12.txt:133","rid":"scene_12_start#58"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"下次呀。姐姐清醒的时候，再说给你听。","src":"script/scene_12.txt:134","rid":"scene_12_start#59","expr":"smile","voice":"yukino_e01_0029"},{"t":"if","src":"script/scene_12.txt:135","c":{"v":"f_yukino_promise"},"f":3229},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……是小哥约的那天哦。","src":"script/scene_12.txt:136","rid":"scene_12_start#60","expr":"smile","voice":"yukino_e01_0030"},{"t":"say","who":null,"disp":null,"br":null,"text":"她把我送到楼梯口。雨，小了很多。","src":"script/scene_12.txt:138","rid":"scene_12_start#61"},{"t":"ambientstop","src":"script/scene_12.txt:139","name":"all","fade":2},{"t":"hide","src":"script/scene_12.txt:140","id":"all","trans":"fade","time":null},{"t":"bgmfade","src":"script/scene_12.txt:141","time":2},{"t":"jump","src":"script/scene_12.txt:142","label":"scene_13_start"},{"t":"eof","src":"script/scene_12.txt:143"},{"t":"prefetch","se":["heavy_rain_loop","thunder_distant","phone_vibe","footsteps","cloth_rustle","touch_a","cloth_rustle_b","touch_b","kiss_a","kiss_c","touch_c","cloth_rustle_a","sheets_a","sheets_c","sheets_rustle","rhythm_creak_l1","rhythm_creak_l2","kiss_b","sheets_d","rhythm_creak_l3"],"src":"script/scene_13.txt:1"},{"t":"label","src":"script/scene_13.txt:14","name":"scene_13_start"},{"t":"chapter","src":"script/scene_13.txt:15","title":"雪乃","sub":"这次，让我来说"},{"t":"bg","src":"script/scene_13.txt:16","id":"flower_shop_storm_inside_night_lily","trans":"black","time":null,"hold":1,"keep":false},{"t":"bgm","src":"script/scene_13.txt:17","name":"night","vol":1,"fade":2},{"t":"ambient","src":"script/scene_13.txt:18","name":"heavy_rain_loop","vol":0.45,"fade":2,"muffle":"door"},{"t":"say","who":null,"disp":null,"br":null,"text":"五月二日，星期六。晚上八点。又是一场大雨。","src":"script/scene_13.txt:19","rid":"scene_13_start#0"},{"t":"se","src":"script/scene_13.txt:20","name":"thunder_distant","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"打烊后的店里。花瓶里的铃兰，已经换过三次水。","src":"script/scene_13.txt:21","rid":"scene_13_start#1"},{"t":"chara","src":"script/scene_13.txt:22","id":"yukino","expr":"normal","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她在柜台后面讲电话。声音，比平时低。","src":"script/scene_13.txt:23","rid":"scene_13_start#2"},{"t":"say","who":null,"disp":"律师（电话）","br":"「","text":"……那么，海边工作室的转让手续，下周就能办完了。","src":"script/scene_13.txt:24","rid":"scene_13_start#3"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"嗯。麻烦您了。……是的，我想好了。","src":"script/scene_13.txt:25","rid":"scene_13_start#4","expr":"serious","voice":"yukino_h01_0001"},{"t":"se","src":"script/scene_13.txt:26"," ease":"inout","wait":true,"reset":true,"all":true},{"t":"say","who":"hero","disp":null,"br":"「","text":"我喜欢您。不是被逗的那种喜欢。","src":"script/scene_13.txt:47","rid":"scene_13_rh01#6"},{"t":"say","who":"hero","disp":null,"br":"「","text":"是想站在您旁边，替您看着这些花的那种。","src":"script/scene_13.txt:48","rid":"scene_13_rh01#7"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……犯规。明明一直是姐姐先出手的。","src":"script/scene_13.txt:49","rid":"scene_13_rh01#8","expr":"smile","voice":"yukino_h01_0004","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……好。这一次，姐姐不先出手。……让着你哦。","src":"script/scene_13.txt:50","rid":"scene_13_rh01#9","expr":"smile","voice":"yukino_h01_0038","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"她低下头，看着自己的左手。","src":"script/scene_13.txt:51","rid":"scene_13_rh01#10"},{"t":"zoom","src":"script/scene_13.txt:52","target":"yukino","time":1.2,"ease":"soft","wait":true,"scale":1.74,"x":0.565,"y":0.755},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，慢慢地，把那枚银戒指摘了下来。","src":"script/scene_13.txt:53","rid":"scene_13_rh01#11"},{"t":"zoom","src":"script/scene_13.txt:54","target":"stage","time":1,"ease":"inout","wait":true,"reset":true,"all":true},{"t":"say","who":null,"disp":null,"br":null,"text":"放在花瓶旁边。那个曾经空了五年的玻璃花瓶，插着铃兰。","src":"script/scene_13.txt:55","rid":"scene_13_rh01#12"},{"t":"filter","src":"script/scene_13.txt:56","name":"softglow","strength":0.4,"time":1},{"t":"say","who":"yukino","disp":null,"br":"「","text":"这次，是我自己选的。","src":"script/scene_13.txt:57","rid":"scene_13_rh01#13","expr":"tender","voice":"yukino_h01_0005","emph":"zoom"},{"t":"filter","src":"script/scene_13.txt:58","name":"none","strength":0.8,"time":1},{"t":"bg","src":"script/scene_13.txt:60","id":"room_yukino_night_green","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"se","src":"script/scene_13.txt:61","name":"footsteps","vol":0.4,"loop":false},{"t":"ambient","src":"script/scene_13.txt:62","name":"heavy_rain_loop","vol":0.3,"fade":1.5,"muffle":"wall"},{"t":"chara","src":"script/scene_13.txt:63","id":"yukino","expr":"tender","outfit":"robe","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"店楼上的小房间。窗外是雨。枕边的小瓶里，插着一枝铃兰。","src":"script/scene_13.txt:64","rid":"scene_13_rh01#14"},{"t":"say","who":null,"disp":null,"br":null,"text":"她在床沿坐下，习惯性地朝我伸出手——","src":"script/scene_13.txt:65","rid":"scene_13_rh01#15"},{"t":"say","who":null,"disp":null,"br":null,"text":"我又一次，轻轻握住了她的手腕。","src":"script/scene_13.txt:66","rid":"scene_13_rh01#16"},{"t":"cg","src":"script/scene_13.txt:67","id":"yukino_h01","diff":null,"trans":"crossfade","time":1.4},{"t":"hide","src":"script/scene_13.txt:68","id":"yukino","trans":"none","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"我今晚，没碰酒。","src":"script/scene_13.txt:69","rid":"scene_13_rh01#17","expr":"normal","voice":"yukino_h01_0006"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"醉了说的话不算数——所以，现在说的都算。","src":"script/scene_13.txt:70","rid":"scene_13_rh01#18","voice":"yukino_h01_0007"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……请你，好好地看着我。","src":"script/scene_13.txt:71","rid":"scene_13_rh01#19","expr":"tender","voice":"yukino_h01_0008"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我也很清醒。我想要您。……可以吗？","src":"script/scene_13.txt:72","rid":"scene_13_rh01#20"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯。我想要。","src":"script/scene_13.txt:73","rid":"scene_13_rh01#21","expr":"tender","voice":"yukino_h01_0009"},{"t":"if","src":"script/scene_13.txt:76","c":{"o":"==","a":{"v":"rb_style"},"b":{"c":"spoil"}},"f":3294},{"t":"set","src":"script/scene_13.txt:77","fx":[{"n":"f_yukino_spoil","op":"=","val":true}]},{"t":"goto","to":3300,"src":"script/scene_13.txt:78"},{"t":"if","c":{"o":"==","a":{"v":"rb_style"},"b":{"c":"lead"}},"f":3297,"src":"script/scene_13.txt:78"},{"t":"set","src":"script/scene_13.txt:79","fx":[{"n":"f_yukino_lead","op":"=","val":true}]},{"t":"goto","to":3300,"src":"script/scene_13.txt:80"},{ h01_01.txt:17","name":"softglow","strength":0.2,"time":1.2},{"t":"se","src":"script/h_blocks/yukino_h01_01.txt:18","name":"cloth_rustle","vol":0.4,"loop":false},{"t":"hstage","src":"script/h_blocks/yukino_h01_01.txt:20","stage":"intro","char":"yukino","fade":null},{"t":"bgm","src":"script/h_blocks/yukino_h01_01.txt:21","name":"h_scene","vol":0.45,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"酒红色的缎面，顺着她的肩头滑开了一半。","src":"script/h_blocks/yukino_h01_01.txt:22","rid":"hb:yukino_h01_01#0","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"晚香玉的香气混着雨的湿气，一下子浓了起来。","src":"script/h_blocks/yukino_h01_01.txt:23","rid":"hb:yukino_h01_01#1","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"睡袍底下，什么也没有穿。","src":"script/h_blocks/yukino_h01_01.txt:24","rid":"hb:yukino_h01_01#2","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。……小哥的眼睛，不知道往哪里放了？","src":"script/h_blocks/yukino_h01_01.txt:25","rid":"hb:yukino_h01_01#3","expr":"smile","voice":"yukino_h01_0018","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她半垂着眼看我，嘴角只扬起一边。是那个熟悉的、逗人的坏笑。","src":"script/h_blocks/yukino_h01_01.txt:26","rid":"hb:yukino_h01_01#4","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"刚说完「不先出手」，嘴上却还是先逗了一句。改不掉的习惯。","src":"script/h_blocks/yukino_h01_01.txt:27","rid":"hb:yukino_h01_01#5","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她攥着前襟的手指，慢慢地、故意地，松开了一根。","src":"script/h_blocks/yukino_h01_01.txt:28","rid":"hb:yukino_h01_01#6","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"知道往哪里放。","src":"script/h_blocks/yukino_h01_01.txt:29","rid":"hb:yukino_h01_01#7","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"放在您身上。","src":"script/h_blocks/yukino_h01_01.txt:30","rid":"hb:yukino_h01_01#8","hb":"yukino_h01_01"},{"t":"se","src":"script/h_blocks/yukino_h01_01.txt:31","name":"touch_a","vol":0.2,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"她握住我的手，引到前襟上。剩下的，留给我自己来拉。","src":"script/h_blocks/yukino_h01_01.txt:32","rid":"hb:yukino_h01_01#9","hb":"yukino_h01_01"},{"t":"se","src":"script/h_blocks/yukino_h01_01.txt:33","name":"cloth_rustle_b","vol":0.35,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"缎面滑落到腰间。台灯下，她的身体完全展开。","src":"script/h_blocks/yukino_h01_01.txt:34","rid":"hb:yukino_h01_01#10","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"饱满得沉甸甸的乳房，柔软的腰线，丰腴的臀和大腿。","src":"script/h_blocks/yukino_h01_01.txt:35","rid":"hb:yukino_h01_01#11","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"每一处，都像被细心养护过、开到最好时候的花。","src":"script/h_blocks/yukino_h01_01.txt:36","rid":"hb:yukino_h01_01#12","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……怎么样？姐姐的身体，还拿得出手吧。","src":"script/h_blocks/yukino_h01_01.txt:37","rid":"hb:yukino_h01_01#13","expr":"smile","voice":"yukino_h01_0019","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"很美。","src":"script/h_blocks/yukino_h01_01.txt:38","rid":"hb:yukino_h01_01#14","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯，收下了。来，姐姐教你，先碰哪里——","src":"script/h_blocks/yukino_h01_01.txt:39","rid":"hb:yukino_h01_01#15","expr":"smile","voice":"yukino_h01_0020","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她伸手想来牵我的手腕。我反过来，先一步握住了她的。","src":"script/h_blocks/yukino_h01_01.txt:40","rid":"hb:yukino_h01_01#16","hb":"yukino_h01_01"},{"t":"flash","src":"script/h_blocks/yukino_h01_01.txt:42","color":"#eef4ff","time":0.12,"count":1},{"t":"se","src":"script/h_blocks/yukino_h01_01.txt:44","name":"touch_b","vol":0.3,"loop":false,"pan":-0.1},{"t":"breath","src":"script/h_blocks/yukino_h01_01.txt:45","level":2,"fade":0.3},{"t":"say","who":null,"disp":null,"br":null,"text":"她的指尖停在半空。那双总是半垂着的眼睛，微微睁大了。","src":"script/h_blocks/yukino_h01_01.txt:46","rid":"hb:yukino_h01_01#17","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"左手的无名指上，只剩一圈比别处略白的皮肤。","src":"script/h_blocks/yukino_h01_01.txt:47","rid":"hb:yukino_h01_01#18","hb":"yukino_h01_01"},{"t":"breath","src":"script/h_blocks/yukino_h01_01.txt:48","level":1,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"我低下头，吻了吻那一圈戒痕。","src":"script/h_blocks/yukino_h01_01.txt:49","rid":"hb:yukino_h01_01#19","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……哎？等、等一下……这种，应该是姐姐来……","src":"script/h_blocks/yukino_h01_01.txt:50","rid":"hb:yukino_h01_01#20","expr":"shy","voice":"yukino_h01_0021","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"今晚，您说过不先出手。","src":"script/h_blocks/yukino_h01_01.txt:51","rid":"hb:yukino_h01_01#21","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……说、说是说过……那、那就……让你来。","src":"script/h_blocks/yukino_h01_01.txt:52","rid":"hb:yukino_h01_01#22","expr":"shy","voice":"yukino_h01_0047","blip":"off","hb":"yukino_h01_01"},{"t":"breath","src":"script/h_blocks/yukino_h01_01.txt:53","level":2,"fade":4},{"t":"se","src":"script/h_blocks/yukino_h01_01.txt:54","name":"kiss_a","vol":0.22,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻她。从唇，到下巴，到颈侧那一缕散落的酒红色卷发。","src":"script/h_blocks/yukino_h01_01.txt:55","rid":"hb:yukino_h01_01#23","hb":"yukino_h01_01"},{"t":"se","src":"script/h_blocks/yukino_h01_01.txt:56","name":"kiss_c","vol":0.2,"loop":false,"pan":0.15},{"t":"say","who":null,"disp":null,"br":null,"text":"她正要把颈侧送过来——我却直接吻上了左眼下那颗泪痣。","src":"script/h_blocks/yukino_h01_01.txt:57","rid":"hb:yukino_h01_01#24","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……！那、那里要留到最后的……！","src":"script/h_blocks/yukino_h01_01.txt:58","rid":"hb:yukino_h01_01#25","expr":"shy","voice":"yukino_h01_0022","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我等不到最后。","src":"script/h_blocks/yukino_h01_01.txt:59","rid":"hb:yukino_h01_01#26","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……你、你这孩子……什么时候，变得这么……","src":"script/h_blocks/yukino_h01_01.txt:60","rid":"hb:yukino_h01_01#27","expr":"shy","voice":"yukino_h01_0023","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"话没说完。我托起她的乳房，沉甸甸地从指缝间满溢出来。","src":"script/h_blocks/yukino_h01_01.txt:61","rid":"hb:yukino_h01_01#28","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"拇指抚过顶端。它在我指下一下子挺立，颜色深得像花苞。","src":"script/h_blocks/yukino_h01_01.txt:62","rid":"hb:yukino_h01_01#29","hb":"yukino_h01_01"},{"t":"se","src":"script/h_blocks/yukino_h01_01.txt:63","name":"touch_c","vol":0.2,"loop":false},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯、啊……！？等……怎么、这么……！","src":"script/h_blocks/yukino_h01_01.txt:64","rid":"hb:yukino_h01_01#30","expr":"shy","voice":"yukino_h01_0024","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那个总是慢悠悠逗人的低音，第一次，破了调。","src":"script/h_blocks/yukino_h01_01.txt:65","rid":"hb:yukino_h01_01#31","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她自己也吓了一跳。用手背捂住嘴，眼睛瞪得圆圆的。","src":"script/h_blocks/yukino_h01_01.txt:66","rid":"hb:yukino_h01_01#32","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"您捂着嘴，我就听不见了。","src":"script/h_blocks/yukino_h01_01.txt:67","rid":"hb:yukino_h01_01#33","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我低头含住那里，舌尖一圈一圈地绕，再轻轻一吸。","src":"script/h_blocks/yukino_h01_01.txt:68","rid":"hb:yukino_h01_01#34","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手指插进我的头发。想把我拉开——却变成了按得更紧。","src":"script/h_blocks/yukino_h01_01.txt:69","rid":"hb:yukino_h01_01#35","hb":"yukino_h01_01"},{"t":"se","src":"script/h_blocks/yukino_h01_01.txt:70","name":"cloth_rustle_a","vol":0.3,"loop":false,"pan":0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"睡袍完全散开了。我的手沿着她的小腹往下，探进大腿之间。","src":"script/h_blocks/yukino_h01_01.txt:71","rid":"hb:yukino_h01_01#36","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那里，热得像雨夜里唯一的一处炉火。早已湿透了。","src":"script/h_blocks/yukino_h01_01.txt:72","rid":"hb:yukino_h01_01#37","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不、不是的……这是、下雨……湿气太重……","src":"script/h_blocks/yukino_h01_01.txt:73","rid":"hb:yukino_h01_01#38","expr":"shy","voice":"yukino_h01_0025","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"雪乃小姐。","src":"script/h_blocks/yukino_h01_01.txt:74","rid":"hb:yukino_h01_01#39","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……呜。……是因为你。……一直，都在等。","src":"script/h_blocks/yukino_h01_01.txt:75","rid":"hb:yukino_h01_01#40","expr":"shy","voice":"yukino_h01_0026","blip":"off","hb":"yukino_h01_01"},{"t":"breath","src":"script/h_blocks/yukino_h01_01.txt:76","level":3,"fade":2},{"t":"bgm","src":"script/h_blocks/yukino_h01_01.txt:77","name":"h_scene","vol":0.5,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"指尖分开柔软的花瓣，缓缓滑进去。她的腰猛地一挺。","src":"script/h_blocks/yukino_h01_01.txt:78","rid":"hb:yukino_h01_01#41","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她伸手覆上我的手背，想带着我，教我她喜欢的节奏。","src":"script/h_blocks/yukino_h01_01.txt:79","rid":"hb:yukino_h01_01#42","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我没有跟她走。找到那一点，按我自己的节奏，慢慢地揉。","src":"script/h_blocks/yukino_h01_01.txt:80","rid":"hb:yukino_h01_01#43","hb":"yukino_h01_01"},{"t":"breath","src":"script/h_blocks/yukino_h01_01.txt:81","level":4,"fade":1.5},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不、不是那样……那、那里……好奇怪……可是……别停……！","src":"script/h_blocks/yukino_h01_01.txt:82","rid":"hb:yukino_h01_01#44","expr":"shy","voice":"yukino_h01_0048","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……啊、啊……！{hero}君……姐姐、要……！","src":"script/h_blocks/yukino_h01_01.txt:83","rid":"hb:yukino_h01_01#45","expr":"tender","voice":"yukino_h01_0027","blip":"off","nameCall":["hero"],"hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的腰弹了起来。酒红色的长发在枕上散开，像打翻的葡萄酒。","src":"script/h_blocks/yukino_h01_01.txt:84","rid":"hb:yukino_h01_01#46","hb":"yukino_h01_01"},{"t":"se","src":"script/h_blocks/yukino_h01_01.txt:85","name":"sheets_a","vol":0.25,"loop":false,"pan":-0.1},{"t":"say","who":null,"disp":null,"br":null,"text":"大腿死死夹住我的手，一下、又一下地抽紧。","src":"script/h_blocks/yukino_h01_01.txt:86","rid":"hb:yukino_h01_01#47","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"……那个永远从容的人，只用我的手指，就到了。","src":"script/h_blocks/yukino_h01_01.txt:87","rid":"hb:yukino_h01_01#48","hb":"yukino_h01_01"},{"t":"breath","src":"script/h_blocks/yukino_h01_01.txt:88","level":2,"fade":2},{"t":"bgm","src":"script/h_blocks/yukino_h01_01.txt:89","name":"h_scene","vol":0.45,"fade":3},{"t":"ambient","src":"script/h_blocks/yukino_h01_01.txt:90","name":"heavy_rain_loop","vol":0.12,"fade":1.5,"muffle":"wall"},{"t":"say","who":null,"disp":null,"br":null,"text":"她睁着湿漉漉的眼睛看我，像是还没弄明白发生了什么。","src":"script/h_blocks/yukino_h01_01.txt:91","rid":"hb:yukino_h01_01#49","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"窗外的雨，忽然安静了一拍。","src":"script/h_blocks/yukino_h01_01.txt:92","rid":"hb:yukino_h01_01#50","hb":"yukino_h01_01"},{"t":"hstage","src":"script/h_blocks/yukino_h01_01.txt:94","stage":"end","char":"yukino","fade":2},{"t":"hb_end","id":"yukino_h01_01","src":"script/scene_13.txt:100"},{"t":"se","src":"script/scene_13.txt:102","name":"phone_vibe","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"枕边，她的手机震了一下。","src":"script/scene_13.txt:103","rid":"scene_13_rh01#27"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了一眼，把它翻过来，屏幕朝下。动作，比平时慢了半拍。","src":"script/scene_13.txt:104","rid":"scene_13_rh01#28"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……今晚，不管它。","src":"script/scene_13.txt:105","rid":"scene_13_rh01#29","expr":"tender","voice":"yukino_h01_0012","blip":"off"},{"t":"hb_begin","id":"yukino_h01_02","src":"script/scene_13.txt:107","stages":[{"stage":"build","label":"渐入","pc":3395}]},{"t":"ambient","src":"script/h_blocks/yukino_h01_02.txt:13","name":"heavy_rain_loop","vol":0.3,"fade":3,"muffle":"wall"},{"t":"filter","src":"script/h_blocks/yukino_h01_02.txt:14","name":"softglow","strength":0.35,"time":1.2},{"t":"hstage","src":"script/h_blocks/yukino_h01_02.txt:16","stage":"build","char":"yukino","fade":null},{"t":"bgm","src":"script/h_blocks/yukino_h01_02.txt:17","name":"h_scene","vol":0.5,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"手机在枕边，屏幕朝下，再也没有亮起来。","src":"script/h_blocks/yukino_h01_02.txt:18","rid":"hb:yukino_h01_02#0","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她深吸一口气，撑起身子，想把我推倒在床上。","src":"script/h_blocks/yukino_h01_02.txt:19","rid":"hb:yukino_h01_02#1","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……刚才那个，不算。这回，让姐姐，好好地——","src":"script/h_blocks/yukino_h01_02.txt:20","rid":"hb:yukino_h01_02#2","expr":"smile","voice":"yukino_h01_0028","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手还按在我胸口。我握住那只手腕，轻轻一翻。","src":"script/h_blocks/yukino_h01_02.txt:21","rid":"hb:yukino_h01_02#3","hb":"yukino_h01_02"},{"t":"flash","src":"script/h_blocks/yukino_h01_02.txt:23","color":"#eef4ff","time":0.12,"count":1},{"t":"se","src":"script/h_blocks/yukino_h01_02.txt:25","name":"sheets_c","vol":0.32,"loop":false,"pan":0.2},{"t":"breath","src":"script/h_blocks/yukino_h01_02.txt:26","level":3,"fade":0.3},{"t":"say","who":null,"disp":null,"br":null,"text":"下一秒，被按在枕上的，是她。","src":"script/h_blocks/yukino_h01_02.txt:27","rid":"hb:yukino_h01_02#4","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……哎？……诶？……不、不对，应该是我……","src":"script/h_blocks/yukino_h01_02.txt:28","rid":"hb:yukino_h01_02#5","expr":"shy","voice":"yukino_h01_0029","blip":"off","hb":"yukino_h01_02"},{"t":"breath","src":"script/h_blocks/yukino_h01_02.txt:29","level":2,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"酒红的长发散了一枕。她眨着眼看我，嘴唇张着，半天合不上。","src":"script/h_blocks/yukino_h01_02.txt:30","rid":"hb:yukino_h01_02#6","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"那张总是半垂着眼逗人的脸，第一次，露出了不知所措的表情。","src":"script/h_blocks/yukino_h01_02.txt:31","rid":"hb:yukino_h01_02#7","hb":"yukino_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"雪乃小姐。我想要您。……可以吗？","src":"script/h_blocks/yukino_h01_02.txt:32","rid":"hb:yukino_h01_02#8","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她咬住嘴唇。目光躲开一下，又自己转回来，直直地看着我。","src":"script/h_blocks/yukino_h01_02.txt:33","rid":"hb:yukino_h01_02#9","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……想要。不是『姐姐』。……桐谷雪乃，想要你。","src":"script/h_blocks/yukino_h01_02.txt:34","rid":"hb:yukino_h01_02#10","expr":"shy","voice":"yukino_h01_0030","blip":"off","hb":"yukino_h01_02"},{"t":"se","src":"script/h_blocks/yukino_h01_02.txt:35","name":"sheets_rustle","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"她自己把膝盖分开了。我抵上去，前端陷进那片湿热里。","src":"script/h_blocks/yukino_h01_02.txt:36","rid":"hb:yukino_h01_02#11","hb":"yukino_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"如果难受，就告诉我。会停的。","src":"script/h_blocks/yukino_h01_02.txt:37","rid":"hb:yukino_h01_02#12","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯，会说的。……慢、慢一点……刚才的，还没缓过来……","src":"script/h_blocks/yukino_h01_02.txt:38","rid":"hb:yukino_h01_02#13","expr":"shy","voice":"yukino_h01_0031","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我一点一点地推进去。","src":"script/h_blocks/yukino_h01_02.txt:39","rid":"hb:yukino_h01_02#14","hb":"yukino_h01_02"},{"t":"se","src":"script/h_blocks/yukino_h01_02.txt:40","name":"sheets_a","vol":0.25,"loop":false},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯、……啊、啊……！？好、好满……！","src":"script/h_blocks/yukino_h01_02.txt:41","rid":"hb:yukino_h01_02#15","expr":"shy","voice":"yukino_h01_0032","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的指甲陷进我的手臂。刚到过的里面又热又紧，一阵阵地痉挛。","src":"script/h_blocks/yukino_h01_02.txt:42","rid":"hb:yukino_h01_02#16","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我停下来等她。她大口喘着气，想像平时那样冲我挑眉——","src":"script/h_blocks/yukino_h01_02.txt:43","rid":"hb:yukino_h01_02#17","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"眉毛却怎么也挑不起来。眼角，先红了。","src":"script/h_blocks/yukino_h01_02.txt:44","rid":"hb:yukino_h01_02#18","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……没、没关系……全部……全部，给我……","src":"script/h_blocks/yukino_h01_02.txt:45","rid":"hb:yukino_h01_02#19","expr":"tender","voice":"yukino_h01_0033","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"直到完全没入。她的身体猛地一颤，像一朵花，在雨里被彻底打开。","src":"script/h_blocks/yukino_h01_02.txt:46","rid":"hb:yukino_h01_02#20","hb":"yukino_h01_02"},{"t":"cg","src":"script/h_blocks/yukino_h01_02.txt:47","id":"yukino_h01","diff":"b","trans":"crossfade","time":1.6,"hb":"yukino_h01_02"},{"t":"zoom","src":"script/h_blocks/yukino_h01_02.txt:49","target":"cg","time":5,"ease":"inout","wait":false,"scale":1.05,"x":0.5,"y":0.5},{"t":"say","who":null,"disp":null,"br":null,"text":"酒红色的长发散在枕上。枕边的小瓶里，那一枝铃兰垂着小小的白铃铛。","src":"script/h_blocks/yukino_h01_02.txt:50","rid":"hb:yukino_h01_02#21","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我们的手交握着，十指扣紧，压在铃兰旁边。","src":"script/h_blocks/yukino_h01_02.txt:51","rid":"hb:yukino_h01_02#22","hb":"yukino_h01_02"},{"t":"cg","src":"script/h_blocks/yukino_h01_02.txt:52","id":"yukino_h01","diff":"b_e1","trans":"crossfade","time":1.6,"hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我开始动。很慢，很深。每一次都退到快要离开，再整根没进去。","src":"script/h_blocks/yukino_h01_02.txt:53","rid":"hb:yukino_h01_02#23","hb":"yukino_h01_02"},{"t":"ambient","src":"script/h_blocks/yukino_h01_02.txt:54","name":"rhythm_creak_l1","vol":0.18,"fade":2,"muffle":2500},{"t":"breath","src":"script/h_blocks/yukino_h01_02.txt:55","level":3,"fade":2},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……啊、这、这样……太深……姐姐、会……！","src":"script/h_blocks/yukino_h01_02.txt:56","rid":"hb:yukino_h01_02#24","expr":"shy","voice":"yukino_h01_0034","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"会怎样？","src":"script/h_blocks/yukino_h01_02.txt:57","rid":"hb:yukino_h01_02#25","hb":"yukino_h01_02"},{"t":"cg","src":"script/h_blocks/yukino_h01_02.txt:58","id":"yukino_h01","diff":"b_e2","trans":"crossfade","time":1.5,"hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……会、变得奇怪……不许看……不许看我这种脸……！","src":"script/h_blocks/yukino_h01_02.txt:59","rid":"hb:yukino_h01_02#26","expr":"shy","voice":"yukino_h01_0035","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她想抽出手去遮脸。我扣紧她的手指，按回铃兰旁边。","src":"script/h_blocks/yukino_h01_02.txt:60","rid":"hb:yukino_h01_02#27","hb":"yukino_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我想一直这样看着您。","src":"script/h_blocks/yukino_h01_02.txt:61","rid":"hb:yukino_h01_02#28","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……呜……坏孩子……明明，一直是我在逗你的……","src":"script/h_blocks/yukino_h01_02.txt:62","rid":"hb:yukino_h01_02#29","expr":"tender","voice":"yukino_h01_0036","blip":"off","hb":"yukino_h01_02"},{"t":"ambient","src":"script/h_blocks/yukino_h01_02.txt:63","name":"heavy_rain_loop","vol":0.4,"fade":2,"muffle":"wall"},{"t":"ambient","src":"script/h_blocks/yukino_h01_02.txt:64","name":"rhythm_creak_l2","vol":0.22,"fade":2,"xfade":"rhythm_creak_l1","muffle":3500},{"t":"bgm","src":"script/h_blocks/yukino_h01_02.txt:65","name":"h_scene","vol":0.55,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"湿润的声音一下一下地响着，被窗外的雨声盖住一半。","src":"script/h_blocks/yukino_h01_02.txt:66","rid":"hb:yukino_h01_02#30","hb":"yukino_h01_02"},{"t":"se","src":"script/h_blocks/yukino_h01_02.txt:67","name":"kiss_b","vol":0.2,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻她的泪痣。她浑身一颤，内里猛地缠紧我。","src":"script/h_blocks/yukino_h01_02.txt:68","rid":"hb:yukino_h01_02#31","hb":"yukino_h01_02"},{"t":"breath","src":"script/h_blocks/yukino_h01_02.txt:69","level":4,"fade":2},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……{hero}。","src":"script/h_blocks/yukino_h01_02.txt:70","rid":"hb:yukino_h01_02#32","expr":"tender","voice":"yukino_h01_0037","blip":"off","nameCall":["hero"],"hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"没有「君」。她这才发现自己叫了什么，睁大了眼睛。","src":"script/h_blocks/yukino_h01_02.txt:71","rid":"hb:yukino_h01_02#33","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，像是放弃了什么似的，又叫了一遍。","src":"script/h_blocks/yukino_h01_02.txt:72","rid":"hb:yukino_h01_02#34","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"{hero}……{hero}……！","src":"script/h_blocks/yukino_h01_02.txt:73","rid":"hb:yukino_h01_02#35","expr":"tender","voice":"yukino_h01_0039","blip":"off","nameCall":["hero"],"hb":"yukino_h01_02"},{"t":"cg","src":"script/h_blocks/yukino_h01_02.txt:74","id":"yukino_h01","diff":"b_e3","trans":"crossfade","time":1.4,"hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的腰不再想带着节奏走了。只是一下一下地，迎上来。","src":"script/h_blocks/yukino_h01_02.txt:75","rid":"hb:yukino_h01_02#36","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"从容、坏笑、「姐姐」——一样一样，从她脸上掉下去。","src":"script/h_blocks/yukino_h01_02.txt:76","rid":"hb:yukino_h01_02#37","hb":"yukino_h01_02"},{"t":"se","src":"script/h_blocks/yukino_h01_02.txt:77","name":"sheets_d","vol":0.25,"loop":false,"pan":-0.2},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……输了。……我，输给你了。","src":"script/h_blocks/yukino_h01_02.txt:78","rid":"hb:yukino_h01_02#38","expr":"shy","voice":"yukino_h01_0040","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"好喜欢你。……这句，不是逗你的。","src":"script/h_blocks/yukino_h01_02.txt:79","rid":"hb:yukino_h01_02#39","expr":"tender","voice":"yukino_h01_0041","blip":"off","hb":"yukino_h01_02"},{"t":"cg","src":"script/h_blocks/yukino_h01_02.txt:80","id":"yukino_h01","diff":"b_e4","trans":"crossfade","time":1.2,"hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她红着眼睛笑了。第一次，笑得一点余裕都没有。","src":"script/h_blocks/yukino_h01_02.txt:81","rid":"hb:yukino_h01_02#40","hb":"yukino_h01_02"},{"t":"ambientstop","src":"script/h_blocks/yukino_h01_02.txt:83","name":"rhythm_creak_l2","fade":2},{"t":"hstage","src":"script/h_blocks/yukino_h01_02.txt:84","stage":"end","char":"yukino","fade":2},{"t":"zoom","src":"script/h_blocks/yukino_h01_02.txt:85","target":"cg","time":1.2,"ease":"inout","wait":true,"reset":true,"all":false},{"t":"hb_end","id":"yukino_h01_02","src":"script/scene_13.txt:107"},{"t":"if","src":"script/scene_13.txt:110","c":{"v":"f_yukino_lead"},"f":3465},{"t":"cg","src":"script/scene_13.txt:111","id":"yukino_h01","diff":"c2","trans":"crossfade","time":1.4},{"t":"goto","to":3466,"src":"script/scene_13.txt:112"},{"t":"cg","src":"script/scene_13.txt:113","id":"yukino_h01","diff":"c","trans":"crossfade","time":1.4},{"t":"hb_begin","id":"yukino_h01_03","src":"script/scene_13.txt:115","stages":[{"stage":"build","label":"渐入","pc":3468},{"stage":"climax","label":"高潮","pc":3498},{"stage":"after","label":"余韵","pc":3515}]},{"t":"filter","src":"script/h_blocks/yukino_h01_03.txt:13","name":"softglow","strength":0.5,"time":1.2},{"t":"hstage","src":"script/h_blocks/yukino_h01_03.txt:15","stage":"build","char":"yukino","fade":null},{"t":"breath","src":"script/h_blocks/yukino_h01_03.txt:16","level":3,"fade":2},{"t":"ambient","src":"script/h_blocks/yukino_h01_03.txt:17","name":"rhythm_creak_l2","vol":0.22,"fade":2,"muffle":3500},{"t":"bgm","src":"script/h_blocks/yukino_h01_03.txt:18","name":"h_scene","vol":0.55,"fade":2},{"t":"zoom","src":"script/h_blocks/yukino_h01_03.txt:20","target":"cg","time":14,"ease":"soft","wait":false,"scale":1.06,"x":0.5,"y":0.45},{"t":"say","who":null,"disp":null,"br":null,"text":"我抱紧她。","src":"script/h_blocks/yukino_h01_03.txt:21","rid":"hb:yukino_h01_03#0","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的双腿缠上我的腰，手臂环住我的脖子，整个人贴了上来。","src":"script/h_blocks/yukino_h01_03.txt:22","rid":"hb:yukino_h01_03#1","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"不是要锁住我。是怕被我放开。","src":"script/h_blocks/yukino_h01_03.txt:23","rid":"hb:yukino_h01_03#2","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……别松开。……求你，再抱紧一点。","src":"script/h_blocks/yukino_h01_03.txt:24","rid":"hb:yukino_h01_03#3","expr":"tender","voice":"yukino_h01_0042","blip":"off","hb":"yukino_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"不松开。","src":"script/h_blocks/yukino_h01_03.txt:25","rid":"hb:yukino_h01_03#4","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……这样，算听话吗？……我、不太会……被这样对待……","src":"script/h_blocks/yukino_h01_03.txt:26","rid":"hb:yukino_h01_03#5","expr":"shy","voice":"yukino_h01_0049","blip":"off","hb":"yukino_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"很听话。很可爱。","src":"script/h_blocks/yukino_h01_03.txt:27","rid":"hb:yukino_h01_03#6","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……可、可爱……对三十五岁的人说这种……呜……","src":"script/h_blocks/yukino_h01_03.txt:28","rid":"hb:yukino_h01_03#7","expr":"shy","voice":"yukino_h01_0050","blip":"off","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她把烧红的脸埋进我的肩膀。里面却诚实地，一下一下吸紧了我。","src":"script/h_blocks/yukino_h01_03.txt:29","rid":"hb:yukino_h01_03#8","hb":"yukino_h01_03"},{"t":"breath","src":"script/h_blocks/yukino_h01_03.txt:30","level":4,"fade":4},{"t":"ambient","src":"script/h_blocks/yukino_h01_03.txt:31","name":"rhythm_creak_l3","vol":0.26,"fade":2,"xfade":"rhythm_creak_l2"},{"t":"bgm","src":"script/h_blocks/yukino_h01_03.txt:32","name":"h_scene","vol":0.6,"fade":2,"intensity":"high"},{"t":"say","who":null,"disp":null,"br":null,"text":"我加快了节奏。她的喘息越来越短，越来越乱，指尖在我背上留下一道道痕。","src":"script/h_blocks/yukino_h01_03.txt:33","rid":"hb:yukino_h01_03#9","hb":"yukino_h01_03"},{"t":"se","src":"script/h_blocks/yukino_h01_03.txt:34","name":"sheets_c","vol":0.28,"loop":false,"pan":0.2},{"t":"say","who":"yukino","disp":null,"br":"「","text":"啊、啊……！不、又……又要……刚才明明、才……！","src":"script/h_blocks/yukino_h01_03.txt:35","rid":"hb:yukino_h01_03#10","expr":"shy","voice":"yukino_h01_0051","blip":"off","hb":"yukino_h01_03"},{"t":"se","src":"script/h_blocks/yukino_h01_03.txt:36","name":"thunder_distant","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"远处响了一声雷。她却只顾着把我抱得更紧。","src":"script/h_blocks/yukino_h01_03.txt:37","rid":"hb:yukino_h01_03#11","hb":"yukino_h01_03"},{"t":"breath","src":"script/h_blocks/yukino_h01_03.txt:38","level":5,"fade":1.5},{"t":"bgm","src":"script/h_blocks/yukino_h01_03.txt:39","name":"h_scene","vol":0.62,"fade":1.5},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……要你。……还要。……全部，都给我……！","src":"script/h_blocks/yukino_h01_03.txt:40","rid":"hb:yukino_h01_03#12","expr":"tender","voice":"yukino_h01_0052","blip":"off","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……{hero}……要、……要去了……！","src":"script/h_blocks/yukino_h01_03.txt:41","rid":"hb:yukino_h01_03#13","expr":"tender","voice":"yukino_h01_0043","blip":"off","nameCall":["hero"],"hb":"yukino_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我也是……雪乃。","src":"script/h_blocks/yukino_h01_03.txt:42","rid":"hb:yukino_h01_03#14","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"第一次，我只叫了她的名字。","src":"script/h_blocks/yukino_h01_03.txt:43","rid":"hb:yukino_h01_03#15","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的眼睛一下子湿了。最后一点余裕，被这两个字拿走了。","src":"script/h_blocks/yukino_h01_03.txt:44","rid":"hb:yukino_h01_03#16","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯。一起……留在我这里……","src":"script/h_blocks/yukino_h01_03.txt:45","rid":"hb:yukino_h01_03#17","expr":"tender","voice":"yukino_h01_0044","blip":"off","hb":"yukino_h01_03"},{"t":"hstage","src":"script/h_blocks/yukino_h01_03.txt:46","stage":"climax","char":"yukino","fade":null},{"t":"hush","src":"script/h_blocks/yukino_h01_03.txt:48","dur":0,"keep":["heartbeat"]},{"t":"ambientstop","src":"script/h_blocks/yukino_h01_03.txt:49","name":"rhythm_creak_l3","fade":0.5},{"t":"wait","src":"script/h_blocks/yukino_h01_03.txt:51","time":0.8},{"t":"flash","src":"script/h_blocks/yukino_h01_03.txt:52","color":"#fff0f3","time":0.2,"count":1},{"t":"wait","src":"script/h_blocks/yukino_h01_03.txt:53","time":0.5},{"t":"flash","src":"script/h_blocks/yukino_h01_03.txt:54","color":"#fff0f3","time":0.15,"count":1},{"t":"wait","src":"script/h_blocks/yukino_h01_03.txt:55","time":0.35},{"t":"flash","src":"script/h_blocks/yukino_h01_03.txt:56","color":"#fff0f3","time":0.12,"count":1},{"t":"wait","src":"script/h_blocks/yukino_h01_03.txt:57","time":0.38},{"t":"flash","src":"script/h_blocks/yukino_h01_03.txt:59","color":"#fff0f3","time":1.2,"count":1},{"t":"hush","src":"script/h_blocks/yukino_h01_03.txt:60","dur":0.3,"keep":["bgm","ambient","se","breath","heartbeat","rhythm"]},{"t":"ambient","src":"script/h_blocks/yukino_h01_03.txt:61","name":"heavy_rain_loop","vol":0.3,"fade":0.3,"muffle":"wall"},{"t":"say","who":null,"disp":null,"br":null,"text":"她在我怀里剧烈地颤抖起来，背弓起，内里一阵阵死死地绞紧。","src":"script/h_blocks/yukino_h01_03.txt:62","rid":"hb:yukino_h01_03#18","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"我再也忍不住，抵在她最深处，把一切都留在了那里。","src":"script/h_blocks/yukino_h01_03.txt:63","rid":"hb:yukino_h01_03#19","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她带着哭腔，一遍一遍地叫我。很久，很久，都没有放开。","src":"script/h_blocks/yukino_h01_03.txt:64","rid":"hb:yukino_h01_03#20","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"……","src":"script/h_blocks/yukino_h01_03.txt:65","rid":"hb:yukino_h01_03#21","hb":"yukino_h01_03"},{"t":"hstage","src":"script/h_blocks/yukino_h01_03.txt:67","stage":"after","char":"yukino","fade":null},{"t":"filter","src":"script/h_blocks/yukino_h01_03.txt:68","name":"softglow","strength":0.45,"time":1.2},{"t":"zoom","src":"script/h_blocks/yukino_h01_03.txt:69","target":"cg","time":2,"ease":"inout","wait":false,"reset":true,"all":false},{"t":"bgm","src":"script/h_blocks/yukino_h01_03.txt:70","name":"h_scene","vol":0.45,"fade":1.2},{"t":"say","who":null,"disp":null,"br":null,"text":"喘息慢慢平复下来。","src":"script/h_blocks/yukino_h01_03.txt:71","rid":"hb:yukino_h01_03#22","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她蜷在我怀里，额头抵着我的胸口。晚香玉的香气淡了。","src":"script/h_blocks/yukino_h01_03.txt:72","rid":"hb:yukino_h01_03#23","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"剩下的是她自己的味道——温热的，像雨后泥土里的花。","src":"script/h_blocks/yukino_h01_03.txt:73","rid":"hb:yukino_h01_03#24","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……哎呀。……输了呢。输得，一塌糊涂。","src":"script/h_blocks/yukino_h01_03.txt:74","rid":"hb:yukino_h01_03#25","expr":"shy","voice":"yukino_h01_0045","blip":"off","hb":"yukino_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"后悔吗？","src":"script/h_blocks/yukino_h01_03.txt:75","rid":"hb:yukino_h01_03#26","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不后悔。……下次，也想这样输给你。","src":"script/h_blocks/yukino_h01_03.txt:76","rid":"hb:yukino_h01_03#27","expr":"tender","voice":"yukino_h01_0046","blip":"off","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她小声说完，又把脸埋了回去。手指还扣在我的指缝间。","src":"script/h_blocks/yukino_h01_03.txt:77","rid":"hb:yukino_h01_03#28","hb":"yukino_h01_03"},{"t":"bgmfade","src":"script/h_blocks/yukino_h01_03.txt:78","time":2},{"t":"wait","src":"script/h_blocks/yukino_h01_03.txt:79","time":0.5},{"t":"ambientstop","src":"script/h_blocks/yukino_h01_03.txt:80","name":"heavy_rain_loop","fade":4},{"t":"say","who":null,"disp":null,"br":null,"text":"窗外的雨声，一点一点地远了。","src":"script/h_blocks/yukino_h01_03.txt:81","rid":"hb:yukino_h01_03#29","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"枕边的铃兰，轻轻晃了一下。","src":"script/h_blocks/yukino_h01_03.txt:82","rid":"hb:yukino_h01_03#30","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，一切都安静了下来。","src":"script/h_blocks/yukino_h01_03.txt:83","rid":"hb:yukino_h01_03#31","hb":"yukino_h01_03"},{"t":"hstage","src":"script/h_blocks/yukino_h01_03.txt:85","stage":"end","char":"yukino","fade":3},{"t":"filter","src":"script/h_blocks/yukino_h01_03.txt:86","name":"none","strength":0.8,"time":1.2},{"t":"hb_end","id":"yukino_h01_03","src":"script/scene_13.txt:115"},{"t":"fadeout","src":"script/scene_13.txt:117","color":"black","time":1.5},{"t":"bgm","src":"script/scene_13.txt:118","name":"yukino_theme","vol":1,"fade":2},{"t":"ambientstop","src":"script/scene_13.txt:119","name":"heavy_rain_loop","fade":3},{"t":"wait","src":"script/scene_13.txt:120","time":1},{"t":"bg","src":"script/scene_13.txt:121","id":"room_yukino_night_green","trans":"none","time":null,"hold":null,"keep":false},{"t":"fadein","src":"script/scene_13.txt:122","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"雨，停了。","src":"script/scene_13.txt:123","rid":"scene_13_rh01#30"},{"t":"filter","src":"script/scene_13.txt:124","name":"softglow","strength":0.3,"time":1.2},{"t":"if","src":"script/scene_13.txt:125","c":{"v":"f_yukino_lead"},"f":3550},{"t":"cg","src":"script/scene_13.txt:126","id":"yukino_h01","diff":"after2","trans":"crossfade","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"她侧躺着，把我的手拉过去，贴在自己的脸颊上。","src":"script/scene_13.txt:127","rid":"scene_13_rh01#31"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……下次，节奏归姐姐。从第一下开始，一步都不让你——","src":"script/scene_13.txt:128","rid":"scene_13_rh01#32","expr":"smile","voice":"yukino_h01_0013","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"说到一半，她自己先「噗」地笑出了声，一把抓过枕头，把脸整个埋了进去。","src":"script/scene_13.txt:129","rid":"scene_13_rh01#33"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不行。光是想一想，就又要被你带走了。……不许看！","src":"script/scene_13.txt:130","rid":"scene_13_rh01#34","expr":"shy","voice":"yukino_h01_0014","blip":"off"},{"t":"goto","to":3556,"src":"script/scene_13.txt:131"},{"t":"cg","src":"script/scene_13.txt:132","id":"yukino_h01","diff":"after","trans":"crossfade","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"清晨。窗外的光是淡蓝色的。枕边，铃兰的小铃铛垂着。","src":"script/scene_13.txt:133","rid":"scene_13_rh01#35"},{"t":"say","who":null,"disp":null,"br":null,"text":"床头柜上，那瓶晚香玉的香水，她拿起来，又放下了。","src":"script/scene_13.txt:134","rid":"scene_13_rh01#36"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……以后不用了。","src":"script/scene_13.txt:135","rid":"scene_13_rh01#37","expr":"tender","voice":"yukino_h01_0015","blip":"off"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……昨晚的话，还算数吗？","src":"script/scene_13.txt:136","rid":"scene_13_rh01#38"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。清醒时说的，都算哦。……输了就是输了。你要怎么负责？","src":"script/scene_13.txt:137","rid":"scene_13_rh01#39","expr":"smile","voice":"yukino_h01_0016","blip":"off"},{"t":"if","src":"script/scene_13.txt:139","c":{"v":"f_yukino_promise"},"f":3558},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那天你说『下次让我来约您』。……约到了哦。","src":"script/scene_13.txt:140","rid":"scene_13_rh01#40","expr":"smile","voice":"yukino_h01_0017","blip":"off"},{"t":"filter","src":"script/scene_13.txt:142","name":"none","strength":0.8,"time":1},{"t":"cghide","src":"script/scene_13.txt:143","trans":"fade","time":null},{"t":"endrecall","id":"yukino_rh01","src":"script/scene_13.txt:144"},{"t":"ambientstop","src":"script/scene_13.txt:146","nam :null,"br":null,"text":"远处的坡上，是白石家的方向。","src":"script/scene_15.txt:20","rid":"scene_15_start#7"},{"t":"if","src":"script/scene_15.txt:21","c":{"o":"==","a":{"v":"aff_top"},"b":{"c":"ayaka"}},"f":3696},{"t":"say","who":"hero","disp":null,"br":"（","text":"最在意的，大概是——那个总在等别人的人。","src":"script/scene_15.txt:22","rid":"scene_15_start#8"},{"t":"say","who":"hero","disp":null,"br":"（","text":"她今晚，也在替谁留着灯吧。","src":"script/scene_15.txt:23","rid":"scene_15_start#9"},{"t":"goto","to":3702,"src":"script/scene_15.txt:24"},{"t":"if","c":{"o":"==","a":{"v":"aff_top"},"b":{"c":"makoto"}},"f":3700,"src":"script/scene_15.txt:24"},{"t":"say","who":"hero","disp":null,"br":"（","text":"最在意的，大概是——墙那边，那个嘴硬的人。","src":"script/scene_15.txt:25","rid":"scene_15_start#10"},{"t":"say","who":"hero","disp":null,"br":"（","text":"她的表，现在还快五分钟吗。","src":"script/scene_15.txt:26","rid":"scene_15_start#11"},{"t":"goto","to":3702,"src":"script/scene_15.txt:27"},{"t":"say","who":"hero","disp":null,"br":"（","text":"最在意的，大概是——楼下，那个总是先出手的人。","src":"script/scene_15.txt:28","rid":"scene_15_start#12"},{"t":"say","who":"hero","disp":null,"br":"（","text":"那个花瓶，今晚还空着吧。","src":"script/scene_15.txt:29","rid":"scene_15_start#13"},{"t":"say","who":null,"disp":null,"br":null,"text":"每一扇窗后面，都有一个人，在过着自己的夜晚。","src":"script/scene_15.txt:31","rid":"scene_15_start#14"},{"t":"say","who":null,"disp":null,"br":null,"text":"我只是，从旁边经过而已。","src":"script/scene_15.txt:32","rid":"scene_15_start#15"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……下一次，我想认真地选择。","src":"script/scene_15.txt:33","rid":"scene_15_start#16"},{"t":"ambientstop","src":"script/scene_15.txt:34","name":"all","fade":2},{"t":"bgm","src":"script/scene_15.txt:35","name":"ending","vol":1,"fade":2},{"t":"chapter","src":"script/scene_15.txt:36","title":"Demo 到此结束","sub":"《夜樱与邻人》正式版 敬请期待"},{"t":"ending","src":"script/scene_15.txt:37","id":"end_normal","title":"各自的灯"},{"t":"eof","src":"script/scene_15.txt:38"},{"t":"prefetch","se":["door_open","shop_bell","heavy_rain_loo
