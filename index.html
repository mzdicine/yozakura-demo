ayaka","disp":null,"br":"「","text":"……明天，也请空着肚子来。","src":"script/scene_08.txt:42","rid":"scene_08_start#13","expr":"shy","voice":"ayaka_e01_0032"},{"t":"goto","to":2150,"src":"script/scene_08.txt:43"},{"t":"ambientstop","src":"script/scene_08.txt:44","name":"office_amb","fade":1.5},{"t":"hide","src":"script/scene_08.txt:45","id":"all","trans":"fade","time":null},{"t":"bg","src":"script/scene_08.txt:46","id":"black","trans":"black","time":null,"hold":0.6,"keep":false},{"t":"say","who":null,"disp":null,"br":null,"text":"四月二十五日，星期六。上午十点，樱见町站。","src":"script/scene_08.txt:48","rid":"scene_08_start#14"},{"t":"say","who":null,"disp":null,"br":null,"text":"检票口那边，有一个人在等。","src":"script/scene_08.txt:49","rid":"scene_08_start#15"},{"t":"bg","src":"script/scene_08.txt:50","id":"park_wisteria_day","trans":"fade","time":null,"hold":null,"keep":false},{"t":"chara","src":"script/scene_08.txt:51","id":"ayaka","expr":"smile","outfit":"day","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"浅色的开衫，盘起的黑发。手里提着一个藤纹的风吕敷包。","src":"script/scene_08.txt:52","rid":"scene_08_start#16"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"早川さん。早上好。","src":"script/scene_08.txt:53","rid":"scene_08_start#17","voice":"ayaka_e01_0001"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"这是我第一次，为自己决定要去哪里呢。","src":"script/scene_08.txt:54","rid":"scene_08_start#18","voice":"ayaka_e01_0002"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……上次来樱见町，是替部长买和果子。","src":"script/scene_08.txt:55","rid":"scene_08_start#19"},{"t":"say","who":null,"disp":null,"br":null,"text":"上午，我们在商店街转了三圈。","src":"script/scene_08.txt:56","rid":"scene_08_start#20"},{"t":"say","who":null,"disp":null,"br":null,"text":"她想挑一份结婚纪念日的礼物。四月二十九日。","src":"script/scene_08.txt:57","rid":"scene_08_start#21"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"这个……他会不会觉得多余呢。","src":"script/scene_08.txt:58","rid":"scene_08_start#22","expr":"sad","voice":"ayaka_e01_0003"},{"t":"say","who":null,"disp":null,"br":null,"text":"每拿起一样东西，她都这样问。","src":"script/scene_08.txt:59","rid":"scene_08_start#23"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……那，您自己喜欢哪个？","src":"script/scene_08.txt:60","rid":"scene_08_start#24"},{"t":"say","who":null,"disp":null,"br":null,"text":"她愣了一下，好像从来没人问过她。","src":"script/scene_08.txt:61","rid":"scene_08_start#25"},{"t":"say","who":null,"disp":null,"br":null,"text":"最后，她选了一对藤色的夫妻茶碗。","src":"script/scene_08.txt:62","rid":"scene_08_start#26"},{"t":"say","who":null,"disp":null,"br":null,"text":"付钱的时候，她小声说「我喜欢这个颜色」。","src":"script/scene_08.txt:63","rid":"scene_08_start#27"},{"t":"recall","src":"script/scene_08.txt:65","id":"ayaka_r01","title":"不是替谁的便当","chara":"ayaka","type":"event","thumb":"ayaka_01","end":2197},{"t":"bg","src":"script/scene_08.txt:66","id":"park_wisteria_day","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_08.txt:67","name":"ayaka_theme","vol":1,"fade":1.5},{"t":"ambient","src":"script/scene_08.txt:68","name":"wind_loop","vol":0.35,"fade":2},{"t":"chara","src":"script/scene_08.txt:69","id":"ayaka","expr":"normal","outfit":"day","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"河畔的藤棚，花刚开到一半。紫色的花穗，一串串垂下来。","src":"script/scene_08.txt:70","rid":"scene_08_start#28"},{"t":"say","who":null,"disp":null,"br":null,"text":"她在长椅上坐下，解开了风吕敷的结。","src":"script/scene_08.txt:71","rid":"scene_08_start#29"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"今天的便当……","src":"script/scene_08.txt:72","rid":"scene_08_start#30","expr":"shy","voice":"ayaka_e01_0004"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"不是替谁做的。","src":"script/scene_08.txt:73","rid":"scene_08_start#31","expr":"shy","voice":"ayaka_e01_0005"},{"t":"cg","src":"script/scene_08.txt:74","id":"ayaka_01","diff":null,"trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"风吹落了她一缕头发。她双手捧着便当盒，递到我面前。","src":"script/scene_08.txt:75","rid":"scene_08_start#32"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"是我想做，所以做了。……请用。","src":"script/scene_08.txt:76","rid":"scene_08_start#33","voice":"ayaka_e01_0006"},{"t":"say","who":null,"disp":null,"br":null,"text":"甜的玉子烧。和上次一样，只有我的那份是甜的。","src":"script/scene_08.txt:77","rid":"scene_08_start#34"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……您不吃吗？","src":"script/scene_08.txt:78","rid":"scene_08_start#35"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"我……一直不习惯在别人面前吃东西。","src":"script/scene_08.txt:79","rid":"scene_08_start#36","voice":"ayaka_e01_0007"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"家里的规矩。嫁过来以后，就更……","src":"script/scene_08.txt:80","rid":"scene_08_start#37","voice":"ayaka_e01_0008"},{"t":"say","who":"hero","disp":null,"br":"「","text":"这里没有规矩。只有藤花，和我。","src":"script/scene_08.txt:81","rid":"scene_08_start#38"},{"t":"cg","src":"script/scene_08.txt:82","id":"ayaka_01","diff":"b","trans":"crossfade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她犹豫了很久，夹起一小块，放进嘴里。","src":"script/scene_08.txt:83","rid":"scene_08_start#39"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，用手背掩着嘴，笑了。","src":"script/scene_08.txt:84","rid":"scene_08_start#40"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……好好吃。自己做的，原来是这个味道。","src":"script/scene_08.txt:85","rid":"scene_08_start#41","expr":"smile","voice":"ayaka_e01_0009"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的眼角，有一点湿。","src":"script/scene_08.txt:86","rid":"scene_08_start#42"},{"t":"cghide","src":"script/scene_08.txt:87","trans":"crossfade","time":null},{"t":"chara","src":"script/scene_08.txt:88","id":"ayaka","expr":"lonely","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"结婚第一年，他说，每年都一起去看夜樱。","src":"script/scene_08.txt:89","rid":"scene_08_start#43","expr":"lonely","voice":"ayaka_e01_0010"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"只去过那一次。","src":"script/scene_08.txt:90","rid":"scene_08_start#44","voice":"ayaka_e01_0011"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"我不怪他。他很忙，他是个好人。","src":"script/scene_08.txt:91","rid":"scene_08_start#45","voice":"ayaka_e01_0012"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"只是……好像我一直在等的，是一个约定的形状。","src":"script/scene_08.txt:92","rid":"scene_08_start#46","expr":"sad","voice":"ayaka_e01_0013"},{"t":"endrecall","id":"ayaka_r01","src":"script/scene_08.txt:93"},{"t":"choice","src":"script/scene_08.txt:95","opts":[{"text":"「……那您自己，想被怎样对待？」","fx":[{"n":"aff_ayaka","op":"+=","val":2},{"n":"f_ayaka_herself","op":"=","val":true}],"target":null,"cond":null,"body":2199,"src":"script/scene_08.txt:96"},{"text":"「纪念日，部长一定会记得的。」","fx":[{"n":"aff_ayaka","op":"+=","val":1},{"n":"f_ayaka_comfort","op":"=","val":true}],"target":null,"cond":null,"body":2205,"src":"script/scene_08.txt:102"}],"end":2210},{"t":"chara","src":"script/scene_08.txt:97","id":"ayaka","expr":"tears","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……我，自己？","src":"script/scene_08.txt:98","rid":"scene_08_start#47","expr":"tears","voice":"ayaka_e01_0014"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的眼泪，掉下来一颗。她没有擦。","src":"script/scene_08.txt:99","rid":"scene_08_start#48"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……想被，好好地看着。","src":"script/scene_08.txt:100","rid":"scene_08_start#49","expr":"smile","voice":"ayaka_e01_0015"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"不是作为谁的妻子。是作为，我。","src":"script/scene_08.txt:101","rid":"scene_08_start#50","voice":"ayaka_e01_0016"},{"t":"goto","to":2210,"src":"script/scene_08.txt:102"},{"t":"chara","src":"script/scene_08.txt:103","id":"ayaka","expr":"sad","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……是啊。一定会的。","src":"script/scene_08.txt:104","rid":"scene_08_start#51","expr":"sad","voice":"ayaka_e01_0017"},{"t":"say","who":null,"disp":null,"br":null,"text":"她笑了。嘴角在笑，眼睛没有。","src":"script/scene_08.txt:105","rid":"scene_08_start#52"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"谢谢您。早川さん，真是温柔的人。","src":"script/scene_08.txt:106","rid":"scene_08_start#53","expr":"smile","voice":"ayaka_e01_0018"},{"t":"goto","to":2210,"src":"script/scene_08.txt:107"},{"t":"if","src":"script/scene_08.txt:109","c":{"v":"f_ayaka_secret"},"f":2224},{"t":"recall","src":"script/scene_08.txt:110","id":"ayaka_r02","title":"两人的暗号","chara":"ayaka","type":"event","thumb":"ayaka_01","end":2223},{"t":"bg","src":"script/scene_08.txt:111","id":"park_wisteria_day","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_08.txt:112","name":"ayaka_theme","vol":1,"fade":1},{"t":"chara","src":"script/scene_08.txt:113","id":"ayaka","expr":"shy","outfit":"day","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她抬起手，碰了碰盘发的一侧。","src":"script/scene_08.txt:114","rid":"scene_08_start#54"},{"t":"say","who":null,"disp":null,"br":null,"text":"那里，别着一枚珍珠发夹。","src":"script/scene_08.txt:115","rid":"scene_08_start#55"},{"t":"cg","src":"script/scene_08.txt:116","id":"ayaka_01","diff":"c","trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"那天在家里，您什么都没有说。","src":"script/scene_08.txt:117","rid":"scene_08_start#56","expr":"shy","voice":"ayaka_e01_0019"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"所以今天……我把它戴来了。","src":"script/scene_08.txt:118","rid":"scene_08_start#57","expr":"shy","voice":"ayaka_e01_0020"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"这是只有您知道的，暗号。","src":"script/scene_08.txt:119","rid":"scene_08_start#58","expr":"smile","voice":"ayaka_e01_0021"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……樱花树下的那个人，和她，是同一个人。只有我知道。","src":"script/scene_08.txt:120","rid":"scene_08_start#59"},{"t":"cghide","src":"script/scene_08.txt:121","trans":"crossfade","time":null},{"t":"endrecall","id":"ayaka_r02","src":"script/scene_08.txt:122"},{"t":"ambientstop","src":"script/scene_08.txt:125","name":"wind_loop","fade":1.5},{"t":"bg","src":"script/scene_08.txt:126","id":"flower_shop_day","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_08.txt:127","name":"daily","vol":1,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"回去的路上，我拐进雪月花，取桐谷小姐留给我的花肥。","src":"script/scene_08.txt:128","rid":"scene_08_start#60"},{"t":"say","who":null,"disp":null,"br":null,"text":"店门上挂着牌子：「送货中，马上回来」。","src":"script/scene_08.txt:129","rid":"scene_08_start#61"},{"t":"say","who":null,"disp":null,"br":null,"text":"柜台上摊着那本预订簿。","src":"script/scene_08.txt:130","rid":"scene_08_start#62"},{"t":"say","who":null,"disp":null,"br":null,"text":"翻开的那页，有一行熟悉的字。","src":"script/scene_08.txt:131","rid":"scene_08_start#63"},{"t":"say","who":null,"disp":null,"br":null,"text":"「白石様　4/29　藤花」","src":"script/scene_08.txt:132","rid":"scene_08_start#64"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……白石。四月二十九日。","src":"script/scene_08.txt:133","rid":"scene_08_start#65"},{"t":"say","who":"hero","disp":null,"br":"（","text":"部长……订了花？","src":"script/scene_08.txt:134","rid":"scene_08_start#66"},{"t":"say","who":null,"disp":null,"br":null,"text":"我从店里出来的时候，她正在门口看芍药。","src":"script/scene_08.txt:135","rid":"scene_08_start#67"},{"t":"chara","src":"script/scene_08.txt:136","id":"ayaka","expr":"normal","outfit":"day","pos":"center","trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"好香的店呢。早川さん，常来吗？","src":"script/scene_08.txt:137","rid":"scene_08_start#68","voice":"ayaka_e01_0022"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……嗯。偶尔。","src":"script/scene_08.txt:138","rid":"scene_08_start#69"},{"t":"say","who":null,"disp":null,"br":null,"text":"我没有说。她，也没有往柜台里看。","src":"script/scene_08.txt:139","rid":"scene_08_start#70"},{"t":"bg","src":"script/scene_08.txt:141","id":"apt_front_day_green","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"chara","src":"script/scene_08.txt:142","id":"ayaka","expr":"normal","outfit":"day","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"夕灯荘前，再往前走五分钟，就是车站。","src":"script/scene_08.txt:143","rid":"scene_08_start#71"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"就送到这里吧。……被人看见的话，不太好。","src":"script/scene_08.txt:144","rid":"scene_08_start#72","voice":"ayaka_e01_0023"},{"t":"say","who":null,"disp":null,"br":null,"text":"她这样说着，脚步却没有动。","src":"script/scene_08.txt:145","rid":"scene_08_start#73"},{"t":"choice","src":"script/scene_08.txt:147","opts":[{"text":"「……送您到检票口。」","fx":[{"n":"risk_ayaka","op":"+=","val":1},{"n":"f_ayaka_station","op":"=","val":true}],"target":null,"cond":null,"body":2245,"src":"script/scene_08.txt:148"},{"text":"「那就在这里。路上小心。」","fx":[{"n":"f_ayaka_careful","op":"=","val":true}],"target":null,"cond":null,"body":2260,"src":"script/scene_08.txt:163"}],"end":2263},{"t":"se","src":"script/scene_08.txt:149","name":"footsteps","vol":0.6,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我们并肩走到车站。周六的站前，人很多。","src":"script/scene_08.txt:150","rid":"scene_08_start#74"},{"t":"if","src":"script/scene_08.txt:151","c":{"o":">=","a":{"v":"risk_ayaka"},"b":{"v":"th_risk"}},"f":2251},{"t":"ambient","src":"script/scene_08.txt:152","name":"heartbeat_heavy","vol":0.7,"fade":2,"xfade":"heartbeat_light"},{"t":"shake","src":"script/scene_08.txt:153","power":"weak","time":0.3,"target":"screen"},{"t":"goto","to":2253,"src":"script/scene_08.txt:154"},{"t":"if","c":{"o":">=","a":{"v":"risk_ayaka"},"b":{"c":2}},"f":2253,"src":"script/scene_08.txt:154"},{"t":"ambient","src":"script/scene_08.txt:155","name":"heartbeat_light","vol":0.45,"fade":0.3},{"t":"say","who":null,"disp":null,"br":null,"text":"人群里，有一件和部长很像的灰色西装。","src":"script/scene_08.txt:157","rid":"scene_08_start#75"},{"t":"say","who":null,"disp":null,"br":null,"text":"不是他。可是她的手，在我袖口上停了一下。","src":"script/scene_08.txt:158","rid":"scene_08_start#76"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……心跳，好快呢。","src":"script/scene_08.txt:159","rid":"scene_08_start#77","expr":"shy","voice":"ayaka_e01_0024"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"我的。不是您的。","src":"script/scene_08.txt:160","rid":"scene_08_start#78","expr":"smile","voice":"ayaka_e01_0025"},{"t":"ambientstop","src":"script/scene_08.txt:161","name":"heartbeat_light","fade":1.5},{"t":"ambientstop","src":"script/scene_08.txt:162","name":"heartbeat_heavy","fade":1.5},{"t":"goto","to":2263,"src":"script/scene_08.txt:163"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……您总是，替我想得很周到。","src":"script/scene_08.txt:164","rid":"scene_08_start#79","expr":"smile","voice":"ayaka_e01_0026"},{"t":"say","who":null,"disp":null,"br":null,"text":"她鞠了一躬。走了几步，又回过头。","src":"script/scene_08.txt:165","rid":"scene_08_start#80"},{"t":"goto","to":2263,"src":"script/scene_08.txt:166"},{"t":"chara","src":"script/scene_08.txt:168","id":"ayaka","expr":"normal","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"下周六，五月二日。家里有企划部的家宴。","src":"script/scene_08.txt:169","rid":"scene_08_start#81","voice":"ayaka_e01_0027"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"外子说，请新人也一定要来。","src":"script/scene_08.txt:170","rid":"scene_08_start#82","voice":"ayaka_e01_0028"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……我也，希望您来。","src":"script/scene_08.txt:171","rid":"scene_08_start#83","expr":"shy","voice":"ayaka_e01_0029"},{"t":"say","who":null,"disp":null,"br":null,"text":"她垂下眼，浅浅地笑了。","src":"script/scene_08.txt:172","rid":"scene_08_start#84"},{"t":"say","who":null,"disp":null,"br":null,"text":"这一次，那个笑，到了眼底。","src":"script/scene_08.txt:173","rid":"scene_08_start#85"},{"t":"hide","src":"script/scene_08.txt:174","id":"ayaka","trans":"fade","time":null},{"t":"bgmfade","src":"script/scene_08.txt:176","time":2},{"t":"jump","src":"script/scene_08.txt:177","label":"scene_09_start"},{"t":"eof","src":"script/scene_08.txt:178"},{"t":"prefetch","se":["dish_clink","clock_tick","heartbeat_heavy","heartbeat_light","house_night_amb","shishiodoshi","furin","cloth_rustle","cloth_off_a","cloth_rustle_b","touch_a","cloth_rustle_a","kiss_a","touch_b","cloth_rustle_c","cloth_off_b","sheets_rustle","tatami_creak","kiss_b","footsteps_corridor_loop","footsteps_corridor_approach","footsteps_corridor_leave","rhythm_creak_l1","kiss_c","rhythm_creak_l2","creak_b","sheets_c","rhythm_creak_l3","sheets_d","turn_over_loop","footsteps"],"src":"script/scene_09.txt:1"},{"t":"label","src":"script/scene_09.txt:18","name":"scene_09_start"},{"t":"chapter","src":"script/scene_09.txt:19","title":"绫香","sub":"藤色的夜"},{"t":"bg","src":"script/scene_09.txt:20","id":"shirogane_living_evening","trans":"black","time":null,"hold":1,"keep":false},{"t":"bgm","src":"script/scene_09.txt:21","name":"daily","vol":1,"fade":1.5},{"t":"se","src":"script/scene_09.txt:22","name":"dish_clink","vol":1,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"五月二日，星期六。白石家的家宴。","src":"script/scene_09.txt:24","rid":"scene_09_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"长桌上摆满了菜。炖菜、天妇罗、一整条盐烤鲷鱼。全是她一个人做的。","src":"script/scene_09.txt:25","rid":"scene_09_start#1"},{"t":"chara","src":"script/scene_09.txt:26","id":"bucho","expr":"smile","outfit":"vest","pos":"left","trans":"fade","time":null},{"t":"say","who":"bucho","disp":null,"br":"「","text":"今天是家宴。不谈工作。早川，喝！","src":"script/scene_09.txt:27","rid":"scene_09_start#2","voice":"bucho_h01_0001"},{"t":"say","who":"hero","disp":null,"br":"「","text":"谢谢部长。……我明天一早要交企划书，喝乌龙茶就好。","src":"script/scene_09.txt:28","rid":"scene_09_start#3"},{"t":"say","who":null,"disp":null,"br":null,"text":"干杯的时候，我只让啤酒碰了一下嘴唇。之后整晚，杯子里都是乌龙茶。","src":"script/scene_09.txt:29","rid":"scene_09_start#4"},{"t":"chara","src":"script/scene_09.txt:30","id":"ayaka","expr":"smile","outfit":"kimono","pos":"right","trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"早川さん，请多吃一点。","src":"script/scene_09.txt:31","rid":"scene_09_start#5","voice":"ayaka_h01_0001"},{"t":"say","who":null,"disp":null,"br":null,"text":"淡藤色的和服，珍珠项链。左手的婚戒。","src":"script/scene_09.txt:32","rid":"scene_09_start#6"},{"t":"say","who":null,"disp":null,"br":null,"text":"她一直在给每个人添菜、换盘子。自己的杯子里，只有麦茶。","src":"script/scene_09.txt:33","rid":"scene_09_start#7"},{"t":"say","who":null,"disp":"大森","br":"「","text":"夫人做的菜，每年都是全公司最好的！","src":"script/scene_09.txt:34","rid":"scene_09_start#8"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"……嗯。绫香的菜，是最好的。","src":"script/scene_09.txt:35","rid":"scene_09_start#9","voice":"bucho_h01_0002"},{"t":"say","who":null,"disp":null,"br":null,"text":"那句话，他是看着鲷鱼说的。","src":"script/scene_09.txt:36","rid":"scene_09_start#10"},{"t":"bg","src":"script/scene_09.txt:38","id":"shirogane_kitchen_night","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"chara","src":"script/scene_09.txt:39","id":"ayaka","expr":"normal","outfit":"kimono","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"我把空盘子送到厨房。她正在洗碗，袖子用带子束了起来。","src":"script/scene_09.txt:40","rid":"scene_09_start#11"},{"t":"say","who":null,"disp":null,"br":null,"text":"橱柜的最上层，放着一个包装好的盒子。缎带还系着。","src":"script/scene_09.txt:41","rid":"scene_09_start#12"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……藤色的包装纸。那天在商店街……","src":"script/scene_09.txt:42","rid":"scene_09_start#13"},{"t":"say","who":"hero","disp":null,"br":"「","text":"那个，是……","src":"script/scene_09.txt:43","rid":"scene_09_start#14"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"四月二十九日，他加班到很晚。","src":"script/scene_09.txt:44","rid":"scene_09_start#15","expr":"normal","voice":"ayaka_h01_0002"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……他很忙。","src":"script/scene_09.txt:45","rid":"scene_09_start#16","expr":"smile","voice":"ayaka_h01_0003"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手没有停。水流的声音，很大。","src":"script/scene_09.txt:46","rid":"scene_09_start#17"},{"t":"ambient","src":"script/scene_09.txt:47","name":"clock_tick","vol":0.35,"fade":1},{"t":"say","who":"hero","disp":null,"br":"（","text":"日历上那个铅笔圈。雪月花的预订簿。「白石様，藤花」。","src":"script/scene_09.txt:48","rid":"scene_09_start#18"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……说不出口。","src":"script/scene_09.txt:49","rid":"scene_09_start#19"},{"t":"ambientstop","src":"script/scene_09.txt:50","name":"clock_tick","fade":1},{"t":"choice","src":"script/scene_09.txt:52","opts":[{"text":"（卷起袖子，站到她旁边帮忙洗碗）","fx":[{"n":"aff_ayaka","op":"+=","val":1},{"n":"f_ayaka_kitchen","op":"=","val":true}],"target":null,"cond":null,"body":2306,"src":"script/scene_09.txt:53"},{"text":"（把盘子放下，回客厅去）","fx":[{"n":"f_ayaka_hall","op":"=","val":true}],"target":null,"cond":null,"body":2321,"src":"script/scene_09.txt:68"}],"end":2325},{"t":"say","who":null,"disp":null,"br":null,"text":"我拿起一只盘子。她愣了一下，往旁边让了半步。","src":"script/scene_09.txt:54","rid":"scene_09_start#20"},{"t":"say","who":null,"disp":null,"br":null,"text":"两个人的手肘，隔着一拳的距离。","src":"script/scene_09.txt:55","rid":"scene_09_start#21"},{"t":"say","who":null,"disp":"大森","br":"「","text":"早川——？跑哪儿去了？","src":"script/scene_09.txt:56","rid":"scene_09_start#22"},{"t":"if","src":"script/scene_09.txt:57","c":{"o":">=","a":{"v":"risk_ayaka"},"b":{"v":"th_risk"}},"f":2313},{"t":"ambient","src":"script/scene_09.txt:58","name":"heartbeat_heavy","vol":0.7,"fade":2,"xfade":"heartbeat_light"},{"t":"shake","src":"script/scene_09.txt:59","power":"weak","time":0.3,"target":"screen"},{"t":"goto","to":2315,"src":"script/scene_09.txt:60"},{"t":"if","c":{"o":">=","a":{"v":"risk_ayaka"},"b":{"c":2}},"f":2315,"src":"script/scene_09.txt:60"},{"t":"ambient","src":"script/scene_09.txt:61","name":"heartbeat_light","vol":0.45,"fade":0.3},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手，在水里停住了。","src":"script/scene_09.txt:63","rid":"scene_09_start#23"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……来了！在帮夫人收盘子！","src":"script/scene_09.txt:64","rid":"scene_09_start#24"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……谢谢您。","src":"script/scene_09.txt:65","rid":"scene_09_start#25","expr":"shy","voice":"ayaka_h01_0004","blip":"off"},{"t":"ambientstop","src":"script/scene_09.txt:66","name":"heartbeat_light","fade":1.5},{"t":"ambientstop","src":"script/scene_09.txt:67","name":"heartbeat_heavy","fade":1.5},{"t":"goto","to":2325,"src":"script/scene_09.txt:68"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……我再去拿几个盘子。","src":"script/scene_09.txt:69","rid":"scene_09_start#26"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"好。……麻烦您了。","src":"script/scene_09.txt:70","rid":"scene_09_start#27","expr":"smile","voice":"ayaka_h01_0005"},{"t":"say","who":null,"disp":null,"br":null,"text":"背后，水流的声音一直没有停。","src":"script/scene_09.txt:71","rid":"scene_09_start#28"},{"t":"goto","to":2325,"src":"script/scene_09.txt:72"},{"t":"bg","src":"script/scene_09.txt:74","id":"shirogane_living_night","trans":"black","time":null,"hold":0.8,"keep":false},{"t":"bgm","src":"script/scene_09.txt:75","name":"night","vol":1,"fade":2},{"t":"ambient","src":"script/scene_09.txt:76","name":"house_night_amb","vol":0.4,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"十点多，同事们赶末班车，一个个走了。","src":"script/scene_09.txt:77","rid":"scene_09_start#29"},{"t":"chara","src":"script/scene_09.txt:78","id":"bucho","expr":"drunk","outfit":"vest","pos":"left","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"部长倒在客厅的沙发上，已经睡熟了。","src":"script/scene_09.txt:79","rid":"scene_09_start#30"},{"t":"chara","src":"script/scene_09.txt:80","id":"ayaka","expr":"normal","outfit":"kimono","pos":"right","trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"每年家宴，他都会这样睡到天亮。","src":"script/scene_09.txt:81","rid":"scene_09_start#31","voice":"ayaka_h01_0006"},{"t":"say","who":null,"disp":null,"br":null,"text":"她给他盖上毯子，掖好肩膀的地方。","src":"script/scene_09.txt:82","rid":"scene_09_start#32"},{"t":"say","who":null,"disp":null,"br":null,"text":"很温柔。像照顾一位年长的亲人。","src":"script/scene_09.txt:83","rid":"scene_09_start#33"},{"t":"hide","src":"script/scene_09.txt:84","id":"bucho","trans":"fade","time":null},{"t":"say","who":"hero","disp":null,"br":"「","text":"那我也该——","src":"script/scene_09.txt:85","rid":"scene_09_start#34"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"早川さん。","src":"script/scene_09.txt:86","rid":"scene_09_start#35","expr":"normal","voice":"ayaka_h01_0007"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"客用的被褥……能帮我搬回和室吗？我一个人，搬不动。","src":"script/scene_09.txt:87","rid":"scene_09_start#36","voice":"ayaka_h01_0008"},{"t":"recall","src":"script/scene_09.txt:89","id":"ayaka_rh01","title":"藤色的夜","chara":"ayaka","type":"h","thumb":"ayaka_h01","end":2655},{"t":"bg","src":"script/scene_09.txt:94","id":"shirogane_washitsu_night","trans":"fade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_09.txt:95","name":"ayaka_theme","vol":1,"fade":2},{"t":"ambient","src":"script/scene_09.txt:96","name":"house_night_amb","vol":0.35,"fade":2},{"t":"se","src":"script/scene_09.txt:97","name":"shishiodoshi","vol":0.4,"loop":false},{"t":"chara","src":"script/scene_09.txt:98","id":"ayaka","expr":"normal","outfit":"kimono","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"庭院边的和室。行灯的光，是暖暖的橙色。","src":"script/scene_09.txt:99","rid":"scene_09_start#37"},{"t":"say","who":null,"disp":null,"br":null,"text":"檐廊外，藤花架在夜色里垂着花穗。远处，惊鹿轻轻响了一声。","src":"script/scene_09.txt:100","rid":"scene_09_start#38"},{"t":"se","src":"script/scene_09.txt:101","name":"furin","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"风铃，也跟着摇了一下。","src":"script/scene_09.txt:102","rid":"scene_09_start#39"},{"t":"say","who":null,"disp":null,"br":null,"text":"我们把被褥叠好，靠墙放下。","src":"script/scene_09.txt:103","rid":"scene_09_start#40"},{"t":"say","who":null,"disp":null,"br":null,"text":"矮桌上，铺着一块叠得整整齐齐的风吕敷。藤纹的。","src":"script/scene_09.txt:104","rid":"scene_09_start#41"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……藤棚下，包便当的那一块。","src":"script/scene_09.txt:105","rid":"scene_09_start#42"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"那块风吕敷，我一直放在这里。","src":"script/scene_09.txt:106","rid":"scene_09_start#43","voice":"ayaka_h01_0009"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"这间屋子，他很少进来。","src":"script/scene_09.txt:107","rid":"scene_09_start#44","voice":"ayaka_h01_0010"},{"t":"say","who":null,"disp":null,"br":null,"text":"她背对着我，抬起手，拔下了发簪。","src":"script/scene_09.txt:108","rid":"scene_09_start#45"},{"t":"chara","src":"script/scene_09.txt:109","id":"ayaka","expr":"shy","outfit":"night","pos":"center","trans":"fade","time":0.8},{"t":"say","who":null,"disp":null,"br":null,"text":"黑发，一下子落到了背上。","src":"script/scene_09.txt:110","rid":"scene_09_start#46"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，她解开颈后的搭扣。珍珠项链，滑进她的掌心。","src":"script/scene_09.txt:111","rid":"scene_09_start#47"},{"t":"say","who":null,"disp":null,"br":null,"text":"她跪坐下来，把它轻轻放在榻榻米上。","src":"script/scene_09.txt:112","rid":"scene_09_start#48"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……夫人。这样不行。部长就在——","src":"script/scene_09.txt:113","rid":"scene_09_start#49"},{"t":"chara","src":"script/scene_09.txt:114","id":"ayaka","expr":"normal","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"我今晚，一滴酒都没有喝。","src":"script/scene_09.txt:115","rid":"scene_09_start#50","voice":"ayaka_h01_0011"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"我很清醒。清醒地知道，自己在做什么。","src":"script/scene_09.txt:116","rid":"scene_09_start#51","voice":"ayaka_h01_0012"},{"t":"cg","src":"script/scene_09.txt:117","id":"ayaka_h01","diff":null,"trans":"crossfade","time":1.4},{"t":"say","who":null,"disp":null,"br":null,"text":"她仰起脸，看着我。眼睛里有害怕，也有决心。","src":"script/scene_09.txt:118","rid":"scene_09_start#52"},{"t":"filter","src":"script/scene_09.txt:119","name":"softglow","strength":0.4,"time":1},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"是我自己想要的。{w=0.4}请不要替我找理由。","src":"script/scene_09.txt:120","rid":"scene_09_start#53","voice":"ayaka_h01_0013","emph":"zoom"},{"t":"say","who":null,"disp":null,"br":null,"text":"很长的沉默。只有行灯的芯，轻轻地响了一下。","src":"script/scene_09.txt:121","rid":"scene_09_start#54"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……您真的，想好了吗？","src":"script/scene_09.txt:122","rid":"scene_09_start#55"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……想好了。","src":"script/scene_09.txt:123","rid":"scene_09_start#56","voice":"ayaka_h01_0014"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我也是。我今晚只喝了乌龙茶，很清楚自己在说什么。","src":"script/scene_09.txt:124","rid":"scene_09_start#57"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我想和您在一起。……一直都是。","src":"script/scene_09.txt:125","rid":"scene_09_start#58"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……谢谢您。选了我。","src":"script/scene_09.txt:126","rid":"scene_09_start#59","expr":"tears","voice":"ayaka_h01_0015"},{"t":"if","src":"script/scene_09.txt:129","c":{"o":"==","a":{"v":"rb_style"},"b":{"c":"light"}},"f":2376},{"t":"set","src":"script/scene_09.txt:130","fx":[{"n":"f_ayaka_light","op":"=","val":true}]},{"t":"goto","to":2382,"src":"script/scene_09.txt:131"},{"t":"if","c":{"o":"==","a":{"v":"rb_style"},"b":{"c":"dark"}},"f":2379,"src":"script/scene_09.txt:131"},{"t":"set","src":"script/scene_09.txt:132","fx":[{"n":"f_ayaka_dark","op":"=","val":true}]},{"t":"goto","to":2382,"src":"script/scene_09.txt:133"},{"t":"choice","src":"script/scene_09.txt:134","opts":[{"text":"（拉门留着一道缝，灯也不熄）「……就这样。我想看着您。」","fx":[{"n":"risk_ayaka","op":"+=","val":1},{"n":"f_ayaka_light","op":"=","val":true}],"target":null,"cond":null,"body":2380,"src":"script/scene_09.txt:135"},{"text":"（把拉门关紧，把灯调暗）","fx":[{"n":"f_ayaka_dark","op":"=","val":true}],"target":null,"cond":null,"body":2381,"src":"script/scene_09.txt:136"}],"end":2382},{"t":"goto","to":2382,"src":"script/scene_09.txt:136"},{"t":"goto","to":2382,"src":"script/scene_09.txt:137"},{"t":"if","src":"script/scene_09.txt:139","c":{"v":"f_ayaka_light"},"f":2391},{"t":"set","src":"script/scene_09.txt:140","fx":[{"n":"g_seen_ayaka_rh01_light","op":"=","val":true}]},{"t":"cg","src":"script/scene_09.txt:141","id":"ayaka_h01","diff":"a","trans":"crossfade","time":1.4},{"t":"say","who":null,"disp":null,"br":null,"text":"拉门没有关紧。走廊的黑暗，就在那一道缝的外面。","src":"script/scene_09.txt:142","rid":"scene_09_start#60"},{"t":"say","who":null,"disp":null,"br":null,"text":"行灯的光，把两个人的影子投在纸门上。","src":"script/scene_09.txt:143","rid":"scene_09_start#61"},{"t":"say","who":null,"disp":null,"br":null,"text":"她闭上眼睛。我捧住她的脸颊，额头轻轻相抵。","src":"script/scene_09.txt:144","rid":"scene_09_start#62"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……这样的话，会被看见的。","src":"script/scene_09.txt:145","rid":"scene_09_start#63","expr":"shy","voice":"ayaka_h01_0016","blip":"off"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……可是，我也想看着您。","src":"script/scene_09.txt:146","rid":"scene_09_start#64","expr":"shy","voice":"ayaka_h01_0017","blip":"off"},{"t":"goto","to":2397,"src":"script/scene_09.txt:147"},{"t":"set","src":"script/scene_09.txt:148","fx":[{"n":"g_seen_ayaka_rh01_dark","op":"=","val":true}]},{"t":"cg","src":"script/scene_09.txt:149","id":"ayaka_h01","diff":"c","trans":"crossfade","time":1.4},{"t":"say","who":null,"disp":null,"br":null,"text":"我把拉门推到底，合紧。她把行灯的芯拧到最小。","src":"script/scene_09.txt:150","rid":"scene_09_start#65"},{"t":"say","who":null,"disp":null,"br":null,"text":"一豆昏黄的光。剩下的，是从纸门格子里漏进来的月光。","src":"script/scene_09.txt:151","rid":"scene_09_start#66"},{"t":"say","who":null,"disp":null,"br":null,"text":"黑暗里，她的手指碰到了我的手腕内侧。很凉，在发抖。","src":"script/scene_09.txt:152","rid":"scene_09_start#67"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……这样，就只有月亮知道了。","src":"script/scene_09.txt:153","rid":"scene_09_start#68","expr":"shy","voice":"ayaka_h01_0018","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻了她。很轻，像怕弄碎什么。","src":"script/scene_09.txt:156","rid":"scene_09_start#69"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手，攥住了我的衬衫。然后，慢慢松开，绕到我的背后。","src":"script/scene_09.txt:157","rid":"scene_09_start#70"},{"t":"bgm","src":"script/scene_09.txt:158","name":"h_scene","vol":0.6,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"带缔，松开了一点。和服的后襟，露出一截白皙的颈。","src":"script/scene_09.txt:160","rid":"scene_09_start#71"},{"t":"filter","src":"script/scene_09.txt:161","name":"none","strength":0.8,"time":1},{"t":"hb_begin","id":"ayaka_h01_01","src":"script/scene_09.txt:163","stages":[{"stage":"intro","label":"前戏","pc":2403}]},{"t":"hstage","src":"script/h_blocks/ayaka_h01_01.txt:3","stage":"intro","char":"ayaka","fade":null},{"t":"bgm","src":"script/h_blocks/ayaka_h01_01.txt:4","name":"h_scene","vol":0.45,"fade":3},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:5","name":"cloth_rustle","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"带缔滑落在榻榻米上，发出很轻的一声。","src":"script/h_blocks/ayaka_h01_01.txt:6","rid":"hb:ayaka_h01_01#0","hb":"ayaka_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她没有躲。只是垂着眼，看着我的手指找到名古屋带的结。","src":"script/h_blocks/ayaka_h01_01.txt:7","rid":"hb:ayaka_h01_01#1","hb":"ayaka_h01_01"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……从后面，往左边拉。……我自己，来吧。","src":"script/h_blocks/ayaka_h01_01.txt:8","rid":"hb:ayaka_h01_01#2","expr":"shy","voice":"ayaka_h01_0028","blip":"off","hb":"ayaka_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"请让我来。","src":"script/h_blocks/ayaka_h01_01.txt:9","rid":"hb:ayaka_h01_01#3","hb":"ayaka_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她咬住下唇，点了点头。","src":"script/h_blocks/ayaka_h01_01.txt:10","rid":"hb:ayaka_h01_01#4","hb":"ayaka_h01_01"},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:11","name":"cloth_off_a","vol":0.3,"loop":false,"pan":0.1},{"t":"say","who":null,"disp":null,"br":null,"text":"结一松，带子一圈一圈地落下来。小纹和服的前襟，像花瓣一样，自己分开了。","src":"script/h_blocks/ayaka_h01_01.txt:12","rid":"hb:ayaka_h01_01#5","hb":"ayaka_h01_01"},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:13","name":"cloth_rustle_b","vol":0.35,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"里面只有一层薄薄的长襦袢。行灯的光透过去，勾出她胸口饱满的弧度。","src":"script/h_blocks/ayaka_h01_01.txt:14","rid":"hb:ayaka_h01_01#6","hb":"ayaka_h01_01"},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:15","name":"touch_a","vol":0.22,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我把手掌贴上去。隔着那层布，能感觉到她的心跳，快得不像那个永远端正的部长夫人。","src":"script/h_blocks/ayaka_h01_01.txt:16","rid":"hb:ayaka_h01_01#7","hb":"ayaka_h01_01"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……好烫。早川さん的手。","src":"script/h_blocks/ayaka_h01_01.txt:17","rid":"hb:ayaka_h01_01#8","expr":"shy","voice":"ayaka_h01_0029","blip":"off","hb":"ayaka_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"您的心跳，也很快。","src":"script/h_blocks/ayaka_h01_01.txt:18","rid":"hb:ayaka_h01_01#9","hb":"ayaka_h01_01"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……请不要说出来。","src":"script/h_blocks/ayaka_h01_01.txt:19","rid":"hb:ayaka_h01_01#10","expr":"shy","voice":"ayaka_h01_0030","blip":"off","hb":"ayaka_h01_01"},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:20","name":"cloth_rustle_a","vol":0.3,"loop":false,"pan":-0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"我解开襦袢的细带。布料从她的肩头滑下去，露出白得几乎发光的肌肤。","src":"script/h_blocks/ayaka_h01_01.txt:21","rid":"hb:ayaka_h01_01#11","hb":"ayaka_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她下意识想用手臂遮住胸口，停在半空，又慢慢放了下来。","src":"script/h_blocks/ayaka_h01_01.txt:22","rid":"hb:ayaka_h01_01#12","hb":"ayaka_h01_01"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……我已经，不想再遮了。","src":"script/h_blocks/ayaka_h01_01.txt:23","rid":"hb:ayaka_h01_01#13","expr":"shy","voice":"ayaka_h01_0031","blip":"off","hb":"ayaka_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那对丰盈的乳房在灯下轻轻起伏，顶端因为紧张而微微挺立。","src":"script/h_blocks/ayaka_h01_01.txt:24","rid":"hb:ayaka_h01_01#14","hb":"ayaka_h01_01"},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:25","name":"kiss_a","vol":0.25,"loop":false,"pan":-0.1},{"t":"say","who":null,"disp":null,"br":null,"text":"我俯下身，吻她的锁骨，吻她颈侧那一缕散落的发。她的呼吸一下子乱了。","src":"script/h_blocks/ayaka_h01_01.txt:26","rid":"hb:ayaka_h01_01#15","hb":"ayaka_h01_01"},{"t":"breath","src":"script/h_blocks/ayaka_h01_01.txt:27","level":2,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"手掌托住她的乳房时，她轻轻「啊」了一声，又慌忙用手背掩住嘴。","src":"script/h_blocks/ayaka_h01_01.txt:28","rid":"hb:ayaka_h01_01#16","hb":"ayaka_h01_01"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……对不起。……我没有，被这样碰过……很久了。","src":"script/h_blocks/ayaka_h01_01.txt:29","rid":"hb:ayaka_h01_01#17","expr":"shy","voice":"ayaka_h01_0032","blip":"off","hb":"ayaka_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"不用道歉。我想听。","src":"script/h_blocks/ayaka_h01_01.txt:30","rid":"hb:ayaka_h01_01#18","hb":"ayaka_h01_01"},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:31","name":"touch_b","vol":0.2,"loop":false,"pan":0.1},{"t":"say","who":null,"disp":null,"br":null,"text":"我用拇指慢慢抚过那一点，她的腰便不由自主地弓起来，膝盖蹭着我的腿。","src":"script/h_blocks/ayaka_h01_01.txt:32","rid":"hb:ayaka_h01_01#19","hb":"ayaka_h01_01"},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:33","name":"cloth_rustle_c","vol":0.3,"loop":false,"pan":0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"襦袢的下摆散开了。她修长的腿从布料里露出来，大腿内侧的肌肤又软又烫。","src":"script/h_blocks/ayaka_h01_01.txt:34","rid":"hb:ayaka_h01_01#20","hb":"ayaka_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我的手沿着那里往上，她夹紧了一下，然后——自己，一点一点地松开了。","src":"script/h_blocks/ayaka_h01_01.txt:35","rid":"hb:ayaka_h01_01#21","hb":"ayaka_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"指尖碰到的地方，已经湿透了。","src":"script/h_blocks/ayaka_h01_01.txt:36","rid":"hb:ayaka_h01_01#22","hb":"ayaka_h01_01"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……请不要看我的脸。我现在，一定很不像样。","src":"script/h_blocks/ayaka_h01_01.txt:37","rid":"hb:ayaka_h01_01#23","expr":"tears","voice":"ayaka_h01_0033","blip":"off","hb":"ayaka_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"很美。比我见过的任何时候都美。","src":"script/h_blocks/ayaka_h01_01.txt:38","rid":"hb:ayaka_h01_01#24","hb":"ayaka_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她终于睁开眼睛。那双总是笑不到眼底的眼睛里，第一次，只映着我一个人。","src":"script/h_blocks/ayaka_h01_01.txt:39","rid":"hb:ayaka_h01_01#25","hb":"ayaka_h01_01"},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:40","name":"cloth_off_b","vol":0.28,"loop":false,"pan":0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"她伸出手，解开我的衬衫纽扣，一颗，又一颗。手指在发抖，却很坚定。","src":"script/h_blocks/ayaka_h01_01.txt:41","rid":"hb:ayaka_h01_01#26","hb":"ayaka_h01_01"},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:42","name":"sheets_rustle","vol":0.35,"loop":false},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:43","name":"tatami_creak","vol":0.2,"loop":false,"pan":-0.3},{"t":"say","who":null,"disp":null,"br":null,"text":"我们一起倒进她刚铺好的被褥里。","src":"script/h_blocks/ayaka_h01_01.txt:44","rid":"hb:ayaka_h01_01#27","hb":"ayaka_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的腿缠上来，赤裸的胸口贴着我的胸口，肌肤与肌肤之间，连一张纸也放不进去。","src":"script/h_blocks/ayaka_h01_01.txt:45","rid":"hb:ayaka_h01_01#28","hb":"ayaka_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"就这样停住了。","src":"script/h_blocks/ayaka_h01_01.txt:46","rid":"hb:ayaka_h01_01#29","hb":"ayaka_h01_01"},{"t":"se","src":"script/h_blocks/ayaka_h01_01.txt:47","name":"kiss_b","vol":0.2,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"额头相抵，呼吸交错。谁也没有再动，只是听着彼此的心跳，在同一个节拍里，越来越响。","src":"script/h_blocks/ayaka_h01_01.txt:48","rid":"hb:ayaka_h01_01#30","hb":"ayaka_h01_01"},{"t":"hstage","src":"script/h_blocks/ayaka_h01_01.txt:50","stage":"end","char":"ayaka","fade":2},{"t":"hb_end","id":"ayaka_h01_01","src":"script/scene_09.txt:163"},{"t":"if","src":"script/scene_09.txt:166","c":{"o":"||","a":{"o":"==","a":{"v":"rb_nm"},"b":{"c":"nearmiss"}},"b":{"o":"&&","a":{"o":"&&","a":{"o":"!=","a":{"v":"rb_nm"},"b":{"c":"calm"}},"b":{"o":">","a":{"v":"th_risk"},"b":{"c":0}}},"b":{"o":">=","a":{"v":"risk_ayaka"},"b":{"v":"th_risk"}}}},"f":2493},{"t":"set","src":"script/scene_09.txt:167","fx":[{"n":"g_seen_ayaka_rh01_nearmiss","op":"=","val":true}]},{"t":"set","src":"script/scene_09.txt:168","fx":[{"n":"f_ayaka_nearmiss","op":"=","val":true}]},{"t":"if","src":"script/scene_09.txt:169","c":{"o":"<","a":{"v":"risk_ayaka"},"b":{"c":3}},"f":2456},{"t":"set","src":"script/scene_09.txt:170","fx":[{"n":"risk_ayaka","op":"=","val":3}]},{"t":"bgm","src":"script/scene_09.txt:172","name":"tension","vol":1,"fade":1},{"t":"ambient","src":"script/scene_09.txt:173","name":"heartbeat_light","vol":0.45,"fade":0.3},{"t":"shake","src":"script/scene_09.txt:174","power":"weak","time":0.4,"target":"screen"},{"t":"say","who":null,"disp":null,"br":null,"text":"——吱呀。","src":"script/scene_09.txt:175","rid":"scene_09_start#72"},{"t":"ambient","src":"script/scene_09.txt:176","name":"footsteps_corridor_loop","vol":0.25,"fade":1,"muffle":"corridor"},{"t":"say","who":null,"disp":null,"br":null,"text":"走廊那头，传来了木地板被踩响的声音。","src":"script/scene_09.txt:177","rid":"scene_09_start#73"},{"t":"cghide","src":"script/scene_09.txt:178","trans":"fade","time":0.4},{"t":"bg","src":"script/scene_09.txt:179","id":"shirogane_hallway_night","trans":"crossfade","time":0.6,"hold":null,"keep":false},{"t":"ambientstop","src":"script/scene_09.txt:180","name":"footsteps_corridor_loop","fade":0.8},{"t":"se","src":"script/scene_09.txt:181","name":"footsteps_corridor_approach","vol":0.6,"loop":false,"muffle":"door"},{"t":"say","who":null,"disp":null,"br":null,"text":"昏暗的木走廊。尽头，和室的纸门透着一点昏黄的光——一道人影，挡在了光前面。","src":"script/scene_09.txt:182","rid":"scene_09_start#74"},{"t":"say","who":"bucho","disp":null,"br":"「","text":"……水……","src":"script/scene_09.txt:183","rid":"scene_09_start#75","voice":"bucho_h01_0003","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"含糊的声音。拖鞋，一步，一步。","src":"script/scene_09.txt:184","rid":"scene_09_start#76"},{"t":"ambient","src":"script/scene_09.txt:186","name":"heartbeat_heavy","vol":0.7,"fade":2,"xfade":"heartbeat_light"},{"t":"zoom","src":"script/scene_09.txt:187","target":"bg","time":2,"ease":"soft","wait":true,"scale":1.3,"x":0.8,"y":0.5},{"t":"shake","src":"script/scene_09.txt:188","power":"weak","time":0.4,"target":"screen"},{"t":"wait","src":"script/scene_09.txt:189","time":0.3},{"t":"say","who":null,"disp":null,"br":null,"text":"脚步，停在了和室的拉门外。","src":"script/scene_09.txt:190","rid":"scene_09_start#77"},{"t":"cg","src":"script/scene_09.txt:191","id":"ayaka_h01","diff":"nm","trans":"crossfade","time":0.6},{"t":"say","who":null,"disp":null,"br":null,"text":"隔着一层纸。月光照着门格，一动不动。","src":"script/scene_09.txt:192","rid":"scene_09_start#78"},{"t":"say","who":null,"disp":null,"br":null,"text":"她捂住了自己的嘴。我把她揽进怀里，连呼吸都停了。","src":"script/scene_09.txt:193","rid":"scene_09_start#79"},{"t":"wait","src":"script/scene_09.txt:194","time":1.5},{"t":"se","src":"script/scene_09.txt:195","name":"footsteps_corridor_leave","vol":0.5,"loop":false,"muffle":"corridor"},{"t":"zoom","src":"script/scene_09.txt:196","target":"stage","time":1.5,"ease":"inout","wait":true,"reset":true,"all":true},{"t":"say","who":null,"disp":null,"br":null,"text":"……脚步，又响了。往厕所的方向，慢慢走远了。","src":"script/scene_09.txt:197","rid":"scene_09_start#80"},{"t":"say","who":null,"disp":null,"br":null,"text":"过了很久，远处传来冲水的声音。然后，是沙发吱呀一声。","src":"script/scene_09.txt:198","rid":"scene_09_start#81"},{"t":"ambientstop","src":"script/scene_09.txt:199","name":"heartbeat_heavy","fade":2},{"t":"bg","src":"script/scene_09.txt:200","id":"shirogane_washitsu_night","trans":"crossfade","time":0.6,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_09.txt:201","name":"h_scene","vol":0.6,"fade":2},{"t":"if","src":"script/scene_09.txt:202","c":{"v":"f_ayaka_light"},"f":2488},{"t":"cg","src":"script/scene_09.txt:203","id":"ayaka_h01","diff":"a","trans":"crossfade","time":1.4},{"t":"goto","to":2489,"src":"script/scene_09.txt:204"},{"t":"cg","src":"script/scene_09.txt:205","id":"ayaka_h01","diff":"c","trans":"crossfade","time":1.4},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……没有进来。","src":"script/scene_09.txt:207","rid":"scene_09_start#82","expr":"tears","voice":"ayaka_h01_0019","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"她在发抖。却没有推开我。","src":"script/scene_09.txt:208","rid":"scene_09_start#83"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……不要停下。请，不要停下。","src":"script/scene_09.txt:209","rid":"scene_09_start#84","expr":"shy","voice":"ayaka_h01_0020","blip":"off"},{"t":"goto","to":2503,"src":"script/scene_09.txt:210"},{"t":"set","src":"script/scene_09.txt:211","fx":[{"n":"g_seen_ayaka_rh01_calm","op":"=","val":true}]},{"t":"se","src":"script/scene_09.txt:212","name":"shishiodoshi","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"——咚。檐廊外，惊鹿又响了一声。","src":"script/scene_09.txt:213","rid":"scene_09_start#85"},{"t":"cg","src":"script/scene_09.txt:214","id":"ayaka_h01","diff":"calm","trans":"crossfade","time":1},{"t":"say","who":null,"disp":null,"br":null,"text":"她轻轻笑了。笑自己被吓到的样子。","src":"script/scene_09.txt:215","rid":"scene_09_start#86"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……没关系。只是竹筒。","src":"script/scene_09.txt:216","rid":"scene_09_start#87","expr":"shy","voice":"ayaka_h01_0021","blip":"off"},{"t":"if","src":"script/scene_09.txt:217","c":{"v":"f_ayaka_light"},"f":2502},{"t":"cg","src":"script/scene_09.txt:218","id":"ayaka_h01","diff":"a","trans":"crossfade","time":1},{"t":"goto","to":2503,"src":"script/scene_09.txt:219"},{"t":"cg","src":"script/scene_09.txt:220","id":"ayaka_h01","diff":"c","trans":"crossfade","time":1},{"t":"hb_begin","id":"ayaka_h01_02","src":"script/scene_09.txt:224","stages":[{"stage":"build","label":"渐入","pc":2504}]},{"t":"hstage","src":"script/h_blocks/ayaka_h01_02.txt:3","stage":"build","char":"ayaka","fade":null},{"t":"bgm","src":"script/h_blocks/ayaka_h01_02.txt:4","name":"h_scene","vol":0.5,"fade":3},{"t":"ambient","src":"script/h_blocks/ayaka_h01_02.txt:5","name":"house_night_amb","vol":0.12,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"她抓住我的手腕，引着它，按在自己的小腹上。","src":"script/h_blocks/ayaka_h01_02.txt:6","rid":"hb:ayaka_h01_02#0","hb":"ayaka_h01_02"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……这里。……我想要早川さん，到这里来。","src":"script/h_blocks/ayaka_h01_02.txt:7","rid":"hb:ayaka_h01_02#1","expr":"shy","voice":"ayaka_h01_0034","blip":"off","hb":"ayaka_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"如果痛，或者想停下，就告诉我。","src":"script/h_blocks/ayaka_h01_02.txt:8","rid":"hb:ayaka_h01_02#2","hb":"ayaka_h01_02"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……嗯。我会说的。……所以，请不要再犹豫了。","src":"script/h_blocks/ayaka_h01_02.txt:9","rid":"hb:ayaka_h01_02#3","expr":"shy","voice":"ayaka_h01_0035","blip":"off","hb":"ayaka_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我分开她的腿，慢慢抵上去。那里又热又湿，轻轻一碰，她的脚趾就蜷了起来。","src":"script/h_blocks/ayaka_h01_02.txt:10","rid":"hb:ayaka_h01_02#4","hb":"ayaka_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"一点一点地，进入她的身体。","src":"script/h_blocks/ayaka_h01_02.txt:11","rid":"hb:ayaka_h01_02#5","hb":"ayaka_h01_02"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……啊……嗯……！","src":"script/h_blocks/ayaka_h01_02.txt:12","rid":"hb:ayaka_h01_02#6","expr":"tears","voice":"ayaka_h01_0036","blip":"off","hb":"ayaka_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她仰起脖子，手指深深陷进我的背。很紧，紧得我几乎喘不过气。","src":"script/h_blocks/ayaka_h01_02.txt:13","rid":"hb:ayaka_h01_02#7","hb":"ayaka_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我停下来，等她。她摇头，用腿勾住我的腰，把我往更深的地方带。","src":"script/h_blocks/ayaka_h01_02.txt:14","rid":"hb:ayaka_h01_02#8","hb":"ayaka_h01_02"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……不要停。……我说过的，是我自己想要的。","src":"script/h_blocks/ayaka_h01_02.txt:15","rid":"hb:ayaka_h01_02#9","expr":"shy","voice":"ayaka_h01_0037","blip":"off","hb":"ayaka_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"直到完全没入。她长长地吐出一口气，像是把六年来压在胸口的什么，一起吐了出来。","src":"script/h_blocks/ayaka_h01_02.txt:16","rid":"hb:ayaka_h01_02#10","hb":"ayaka_h01_02"},{"t":"breath","src":"script/h_blocks/ayaka_h01_02.txt:17","level":3,"fade":2},{"t":"se","src":"script/h_blocks/ayaka_h01_02.txt:18","name":"tatami_creak","vol":0.15,"loop":false,"pan":0.8},{"t":"cg","src":"script/h_blocks/ayaka_h01_02.txt:19","id":"ayaka_h01","diff":"b","trans":"crossfade","time":1.5,"hb":"ayaka_h01_02"},{"t":"zoom","src":"script/h_blocks/ayaka_h01_02.txt:20","target":"cg","time":6,"ease":"inout","wait":false,"scale":1.06,"x":0.5,"y":0.5},{"t":"say","who":null,"disp":null,"br":null,"text":"纸门上，行灯把两个人的影子投成一个。","src":"script/h_blocks/ayaka_h01_02.txt:21","rid":"hb:ayaka_h01_02#11","hb":"ayaka_h01_02"},{"t":"ambient","src":"script/h_blocks/ayaka_h01_02.txt:22","name":"rhythm_creak_l1","vol":0.18,"fade":2,"muffle":2500},{"t":"say","who":null,"disp":null,"br":null,"text":"我十指扣住她的手，按在枕边。开始动的时候，她的影子在纸门上轻轻晃动。","src":"script/h_blocks/ayaka_h01_02.txt:23","rid":"hb:ayaka_h01_02#12","hb":"ayaka_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"每一次深入，她都咬着唇把声音咽回去。每一次退出，她又追着我抬起腰。","src":"script/h_blocks/ayaka_h01_02.txt:24","rid":"hb:ayaka_h01_02#13","hb":"ayaka_h01_02"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……嗯、嗯……早川さん……好深……","src":"script/h_blocks/ayaka_h01_02.txt:25","rid":"hb:ayaka_h01_02#14","expr":"shy","voice":"ayaka_h01_0038","blip":"off","hb":"ayaka_h01_02"},{"t":"cg","src":"script/h_blocks/ayaka_h01_02.txt:26","id":"ayaka_h01","diff":"b_e1","trans":"crossfade","time":1.5,"hb":"ayaka_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"湿润的声音，在安静的和室里格外清楚。她自己也听见了，羞得把脸转向一边，内里却缠得更紧。","src":"script/h_blocks/ayaka_h01_02.txt:27","rid":"hb:ayaka_h01_02#15","hb":"ayaka_h01_02"},{"t":"se","src":"script/h_blocks/ayaka_h01_02.txt:28","name":"kiss_c","vol":0.2,"loop":false,"pan":0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻她耳后，吻那颗嘴角下的小痣。她浑身一颤。","src":"script/h_blocks/ayaka_h01_02.txt:29","rid":"hb:ayaka_h01_02#16","hb":"ayaka_h01_02"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……那里、不行……会、会变得奇怪的……","src":"script/h_blocks/ayaka_h01_02.txt:30","rid":"hb:ayaka_h01_02#17","expr":"tears","voice":"ayaka_h01_0039","blip":"off","hb":"ayaka_h01_02"},{"t":"se","src":"script/h_blocks/ayaka_h01_02.txt:31","name":"sheets_rustle","vol":0.25,"loop":false,"pan":-0.2},{"t":"say","who":"hero","disp":null,"br":"「","text":"变得奇怪也没关系。这里只有我。","src":"script/h_blocks/ayaka_h01_02.txt:32","rid":"hb:ayaka_h01_02#18","hb":"ayaka_h01_02"},{"t":"ambient","src":"script/h_blocks/ayaka_h01_02.txt:33","name":"rhythm_creak_l2","vol":0.22,"fade":2,"xfade":"rhythm_creak_l1","muffle":3500},{"t":"bgm","src":"script/h_blocks/ayaka_h01_02.txt:34","name":"h_scene","vol":0.55,"fade":2},{"t":"cg","src":"script/h_blocks/ayaka_h01_02.txt:35","id":"ayaka_h01","diff":"b_e2","trans":"crossfade","time":1.4,"hb":"ayaka_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我加快了一点。她丰满的乳房随着节奏摇晃，汗湿的发丝贴在颈间，和服早已散落在身下，像一滩藤色的水。","src":"script/h_blocks/ayaka_h01_02.txt:36","rid":"hb:ayaka_h01_02#19","hb":"ayaka_h01_02"},{"t":"breath","src":"script/h_blocks/ayaka_h01_02.txt:37","level":4,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"她的呼吸越来越短，越来越急。交握的手，指节都发白了。","src":"script/h_blocks/ayaka_h01_02.txt:38","rid":"hb:ayaka_h01_02#20","hb":"ayaka_h01_02"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……我一直、一直在忍……忍着不出声……忍着不去想……","src":"script/h_blocks/ayaka_h01_02.txt:39","rid":"hb:ayaka_h01_02#21","expr":"shy","voice":"ayaka_h01_0040","blip":"off","hb":"ayaka_h01_02"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……可是……今晚，我不想再忍了——","src":"script/h_blocks/ayaka_h01_02.txt:40","rid":"hb:ayaka_h01_02#22","expr":"tears","voice":"ayaka_h01_0041","blip":"off","hb":"ayaka_h01_02"},{"t":"se","src":"script/h_blocks/ayaka_h01_02.txt:41","name":"creak_b","vol":0.25,"loop":false,"pan":0.3},{"t":"se","src":"script/h_blocks/ayaka_h01_02.txt:42","name":"sheets_c","vol":0.28,"loop":false,"pan":-0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"我深深顶进去。她猛地弓起身子，终于，第一次没有压低声音。","src":"script/h_blocks/ayaka_h01_02.txt:43","rid":"hb:ayaka_h01_02#23","hb":"ayaka_h01_02"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"——啊啊……！","src":"script/h_blocks/ayaka_h01_02.txt:44","rid":"hb:ayaka_h01_02#24","expr":"tears","voice":"ayaka_h01_0042","blip":"off","hb":"ayaka_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"那声音穿过纸门，落进庭院的夜色里。她没有去捂嘴。她只是看着我，一边流泪，一边笑了。","src":"script/h_blocks/ayaka_h01_02.txt:45","rid":"hb:ayaka_h01_02#25","hb":"ayaka_h01_02"},{"t":"zoom","src":"script/h_blocks/ayaka_h01_02.txt:46","target":"cg","time":1.5,"ease":"inout","wait":true,"reset":true,"all":false},{"t":"hstage","src":"script/h_blocks/ayaka_h01_02.txt:48","stage":"end","char":"ayaka","fade":1},{"t":"hb_end","id":"ayaka_h01_02","src":"script/scene_09.txt:224"},{"t":"hb_begin","id":"ayaka_h01_03","src":"script/scene_09.txt:226","stages":[{"stage":"build","label":"渐入","pc":2551},{"stage":"climax","label":"高潮","pc":2568},{"stage":"after","label":"余韵","pc":2586}]},{"t":"hstage","src":"script/h_blocks/ayaka_h01_03.txt:3","stage":"build","char":"ayaka","fade":null},{"t":"breath","src":"script/h_blocks/ayaka_h01_03.txt:4","level":5,"fade":1.5},{"t":"ambient","src":"script/h_blocks/ayaka_h01_03.txt:5","name":"rhythm_creak_l3","vol":0.24,"fade":1.5,"xfade":"rhythm_creak_l2"},{"t":"bgm","src":"script/h_blocks/ayaka_h01_03.txt:6","name":"h_scene","vol":0.62,"fade":1.5,"intensity":"high"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的双腿紧紧缠住我，不让我离开半分。","src":"script/h_blocks/ayaka_h01_03.txt:7","rid":"hb:ayaka_h01_03#0","hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"身体相连的地方又热又软，每一次碰撞都带出她压不住的轻喘。","src":"script/h_blocks/ayaka_h01_03.txt:8","rid":"hb:ayaka_h01_03#1","hb":"ayaka_h01_03"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……再、再抱紧一点……请把我、抱紧……","src":"script/h_blocks/ayaka_h01_03.txt:9","rid":"hb:ayaka_h01_03#2","expr":"tears","voice":"ayaka_h01_0043","blip":"off","hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"我把她整个揽进怀里。她的胸口贴着我，心跳快得乱成一片，分不清是谁的。","src":"script/h_blocks/ayaka_h01_03.txt:10","rid":"hb:ayaka_h01_03#3","hb":"ayaka_h01_03"},{"t":"se","src":"script/h_blocks/ayaka_h01_03.txt:11","name":"sheets_d","vol":0.25,"loop":false,"pan":0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"她内里一阵一阵地收紧，像在挽留，又像在催促。","src":"script/h_blocks/ayaka_h01_03.txt:12","rid":"hb:ayaka_h01_03#4","hb":"ayaka_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"绫香さん……我快要……","src":"script/h_blocks/ayaka_h01_03.txt:13","rid":"hb:ayaka_h01_03#5","hb":"ayaka_h01_03"},{"t":"zoom","src":"script/h_blocks/ayaka_h01_03.txt:15","target":"cg","time":14,"ease":"soft","wait":false,"scale":1.06,"x":0.5,"y":0.45},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……嗯……我也……一起……","src":"script/h_blocks/ayaka_h01_03.txt:16","rid":"hb:ayaka_h01_03#6","expr":"shy","voice":"ayaka_h01_0044","blip":"off","hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她捧住我的脸，额头抵着额头。那双湿漉漉的眼睛，一眨不眨地看着我。","src":"script/h_blocks/ayaka_h01_03.txt:17","rid":"hb:ayaka_h01_03#7","hb":"ayaka_h01_03"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……可以吗……叫你的、名字……","src":"script/h_blocks/ayaka_h01_03.txt:18","rid":"hb:ayaka_h01_03#8","expr":"tears","voice":"ayaka_h01_0046","blip":"off","hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，她轻轻地、清清楚楚地，叫了那个名字。","src":"script/h_blocks/ayaka_h01_03.txt:19","rid":"hb:ayaka_h01_03#9","hb":"ayaka_h01_03"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"——{hero}。","src":"script/h_blocks/ayaka_h01_03.txt:20","rid":"hb:ayaka_h01_03#10","expr":"tears","voice":"ayaka_h01_0045","blip":"off","nameCall":["hero"],"hb":"ayaka_h01_03"},{"t":"hstage","src":"script/h_blocks/ayaka_h01_03.txt:21","stage":"climax","char":"ayaka","fade":null},{"t":"hush","src":"script/h_blocks/ayaka_h01_03.txt:23","dur":0,"keep":["heartbeat"]},{"t":"ambientstop","src":"script/h_blocks/ayaka_h01_03.txt:24","name":"rhythm_creak_l3","fade":0.5},{"t":"wait","src":"script/h_blocks/ayaka_h01_03.txt:25","time":0.8},{"t":"flash","src":"script/h_blocks/ayaka_h01_03.txt:26","color":"#efe6f7","time":0.2,"count":1},{"t":"wait","src":"script/h_blocks/ayaka_h01_03.txt:27","time":0.5},{"t":"flash","src":"script/h_blocks/ayaka_h01_03.txt:28","color":"#efe6f7","time":0.15,"count":1},{"t":"wait","src":"script/h_blocks/ayaka_h01_03.txt:29","time":0.35},{"t":"flash","src":"script/h_blocks/ayaka_h01_03.txt:30","color":"#efe6f7","time":0.12,"count":1},{"t":"wait","src":"script/h_blocks/ayaka_h01_03.txt:31","time":0.38},{"t":"hush","src":"script/h_blocks/ayaka_h01_03.txt:33","dur":0.3,"keep":["bgm","ambient","se","breath","heartbeat","rhythm"]},{"t":"flash","src":"script/h_blocks/ayaka_h01_03.txt:34","color":"#efe6f7","time":1.2,"count":1},{"t":"cg","src":"script/h_blocks/ayaka_h01_03.txt:35","id":"ayaka_h01","diff":"b_e3","trans":"crossfade","time":1.3,"hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"那一瞬间，什么都断了线。","src":"script/h_blocks/ayaka_h01_03.txt:36","rid":"hb:ayaka_h01_03#11","hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她在我怀里剧烈地颤抖，背弓得像一张拉满的弓，内里死死地绞紧。我再也忍不住，把一切都留在了她的最深处。","src":"script/h_blocks/ayaka_h01_03.txt:37","rid":"hb:ayaka_h01_03#12","hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的指甲在我背上留下细细的痕。很久，很久，都没有松开。","src":"script/h_blocks/ayaka_h01_03.txt:38","rid":"hb:ayaka_h01_03#13","hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"……","src":"script/h_blocks/ayaka_h01_03.txt:39","rid":"hb:ayaka_h01_03#14","hb":"ayaka_h01_03"},{"t":"se","src":"script/h_blocks/ayaka_h01_03.txt:40","name":"shishiodoshi","vol":0.3,"loop":false},{"t":"hstage","src":"script/h_blocks/ayaka_h01_03.txt:41","stage":"after","char":"ayaka","fade":null},{"t":"bgm","src":"script/h_blocks/ayaka_h01_03.txt:43","name":"h_scene","vol":0.45,"fade":1.2},{"t":"filter","src":"script/h_blocks/ayaka_h01_03.txt:44","name":"softglow","strength":0.45,"time":1.2},{"t":"zoom","src":"script/h_blocks/ayaka_h01_03.txt:45","target":"cg","time":2,"ease":"inout","wait":false,"reset":true,"all":false},{"t":"cg","src":"script/h_blocks/ayaka_h01_03.txt:46","id":"ayaka_h01","diff":"b_e4","trans":"crossfade","time":1.2,"hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"颤抖慢慢平息下来。只剩下两个人交叠的喘息，和檐廊外，惊鹿遥远的一声「咚」。","src":"script/h_blocks/ayaka_h01_03.txt:47","rid":"hb:ayaka_h01_03#15","hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她没有说话。只是把脸埋进我的肩窝，像一个终于可以停下来的人。","src":"script/h_blocks/ayaka_h01_03.txt:48","rid":"hb:ayaka_h01_03#16","hb":"ayaka_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"温热的眼泪，一滴一滴，落在我的锁骨上。","src":"script/h_blocks/ayaka_h01_03.txt:49","rid":"hb:ayaka_h01_03#17","hb":"ayaka_h01_03"},{"t":"hstage","src":"script/h_blocks/ayaka_h01_03.txt:51","stage":"end","char":"ayaka","fade":3},{"t":"bgmfade","src":"script/h_blocks/ayaka_h01_03.txt:52","time":3},{"t":"ambient","src":"script/h_blocks/ayaka_h01_03.txt:53","name":"house_night_amb","vol":0.35,"fade":3},{"t":"filter","src":"script/h_blocks/ayaka_h01_03.txt:54","name":"none","strength":0.8,"time":1.2},{"t":"hb_end","id":"ayaka_h01_03","src":"script/scene_09.txt:226"},{"t":"fadeout","src":"script/scene_09.txt:228","color":"black","time":1.5},{"t":"bgm","src":"script/scene_09.txt:229","name":"ayaka_theme","vol":1,"fade":2},{"t":"wait","src":"script/scene_09.txt:230","time":1},{"t":"bg","src":"script/scene_09.txt:231","id":"shirogane_washitsu_night","trans":"none","time":null,"hold":null,"keep":false},{"t":"fadein","src":"script/scene_09.txt:232","time":1.5},{"t":"chara","src":"script/scene_09.txt:233","id":"ayaka","expr":"shy","outfit":"night","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"行灯的芯，快烧完了。","src":"script/scene_09.txt:234","rid":"scene_09_start#88"},{"t":"say","who":null,"disp":null,"br":null,"text":"她枕着我的手臂，头发散在榻榻米上。","src":"script/scene_09.txt:235","rid":"scene_09_start#89"},{"t":"ambient","src":"script/scene_09.txt:237","name":"turn_over_loop","vol":0.35,"fade":3,"pan":-0.6,"muffle":"corridor"},{"t":"bgm","src":"script/scene_09.txt:238","name":"ayaka_theme","vol":0.2,"fade":0.3},{"t":"say","who":null,"disp":null,"br":null,"text":"——走廊的那一头，传来翻身的声音。","src":"script/scene_09.txt:239","rid":"scene_09_start#90"},{"t":"if","src":"script/scene_09.txt:241","c":{"o":"||","a":{"v":"f_ayaka_nearmiss"},"b":{"o":">=","a":{"v":"risk_ayaka"},"b":{"c":2}}},"f":2612},{"t":"ambient","src":"script/scene_09.txt:242","name":"heartbeat_light","vol":0.45,"fade":1},{"t":"say","who":null,"disp":null,"br":null,"text":"我们同时屏住了呼吸。","src":"script/scene_09.txt:244","rid":"scene_09_start#91"},{"t":"se","src":"script/scene_09.txt:245","name":"furin","vol":0.3,"loop":false,"pan":0.4},{"t":"ambientstop","src":"script/scene_09.txt:246","name":"turn_over_loop","fade":2},{"t":"ambientstop","src":"script/scene_09.txt:247","name":"heartbeat_light","fade":2.5},{"t":"bgm","src":"script/scene_09.txt:248","name":"ayaka_theme","vol":1,"fade":1},{"t":"filter","src":"script/scene_09.txt:249","name":"softglow","strength":0.3,"time":1.2},{"t":"say","who":null,"disp":null,"br":null,"text":"……然后，又什么都没有了。只有远处平稳的鼾声。","src":"script/scene_09.txt:250","rid":"scene_09_start#92"},{"t":"if","src":"script/scene_09.txt:251","c":{"v":"f_ayaka_nearmiss"},"f":2623},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……刚才的脚步声。我以为，一切都要结束了。","src":"script/scene_09.txt:252","rid":"scene_09_start#93","expr":"sad","voice":"ayaka_h01_0022","blip":"off"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"可是，我一点都没有后悔。……这样，很坏吧。","src":"script/scene_09.txt:253","rid":"scene_09_start#94","expr":"smile","voice":"ayaka_h01_0023","blip":"off"},{"t":"goto","to":2625,"src":"script/scene_09.txt:254"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……他每年，都会睡到天亮。","src":"script/scene_09.txt:255","rid":"scene_09_start#95","expr":"smile","voice":"ayaka_h01_0024","blip":"off"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"每年都是。连今天，也一样。","src":"script/scene_09.txt:256","rid":"scene_09_start#96","expr":"lonely","voice":"ayaka_h01_0025","blip":"off"},{"t":"se","src":"script/scene_09.txt:259","name":"shishiodoshi","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"天快亮了。纸门的格子，一点点变成青色。","src":"script/scene_09.txt:260","rid":"scene_09_start#97"},{"t":"if","src":"script/scene_09.txt:262","c":{"o":"||","a":{"o":"==","a":{"v":"rb_after"},"b":{"c":"pin"}},"b":{"o":"&&","a":{"o":"!=","a":{"v":"rb_after"},"b":{"c":"leave"}},"b":{"v":"f_ayaka_herself"}}},"f":2641},{"t":"set","src":"script/scene_09.txt:263","fx":[{"n":"g_seen_ayaka_rh01_pin","op":"=","val":true}]},{"t":"cg","src":"script/scene_09.txt:264","id":"ayaka_h01","diff":"after","trans":"crossfade","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"她披着深紫的羽织，站在檐廊的柱子边。","src":"script/scene_09.txt:265","rid":"scene_09_start#98"},{"t":"say","who":null,"disp":null,"br":null,"text":"背对着我，把珍珠项链，重新戴回了颈间。搭扣，咔嗒一声。","src":"script/scene_09.txt:266","rid":"scene_09_start#99"},{"t":"if","src":"script/scene_09.txt:267","c":{"o":"==","a":{"v":"f_hairpin"},"b":{"c":"hero"}},"f":2636},{"t":"say","who":null,"disp":null,"br":null,"text":"我从口袋里拿出那枚珍珠发夹。樱花树下捡到的，一直没还。","src":"script/scene_09.txt:268","rid":"scene_09_start#100"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看着它，笑了。然后，把我的手指一根根合上。","src":"script/scene_09.txt:269","rid":"scene_09_start#101"},{"t":"goto","to":2637,"src":"script/scene_09.txt:270"},{"t":"say","who":null,"disp":null,"br":null,"text":"她从发间取下那枚珍珠发夹，放进我的手心。","src":"script/scene_09.txt:271","rid":"scene_09_start#102"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"请替我保管。","src":"script/scene_09.txt:273","rid":"scene_09_start#103","expr":"smile","voice":"ayaka_h01_0026"},{"t":"say","who":"ayaka","disp":null,"br":"「","text":"……这是我们的秘密。","src":"script/scene_09.txt:274","rid":"scene_09_start#104","expr":"shy","voice":"ayaka_h01_0027"},{"t":"set","src":"script/scene_09.txt:275","fx":[{"n":"f_hairpin","op":"=","val":"kept"}]},{"t":"goto","to":2653,"src":"script/scene_09.txt:276"},{"t":"set","src":"script/scene_09.txt:277","fx":[{"n":"g_seen_ayaka_rh01_leave","op":"=","val":true}]},{"t":"cg","src":"script/scene_09.txt:278","id":"ayaka_h01","diff":"after2","trans":"crossfade","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"醒来的时候，身边已经空了。被褥叠好了，靠在墙边。","src":"script/scene_09.txt:279","rid":"scene_09_start#105"},{"t":"say","who":null,"disp":null,"br":null,"text":"矮桌上，那块藤纹的风吕敷，还在。","src":"script/scene_09.txt:280","rid":"scene_09_start#106"},{"t":"say","who":null,"disp":null,"br":null,"text":"走廊里，她背对着这边，正把珍珠项链戴回颈间。","src":"script/scene_09.txt:281","rid":"scene_09_start#107"},{"t":"if","src":"script/scene_09.txt:282","c":{"o":"==","a":{"v":"f_hairpin"},"b":{"c":"hero"}},"f":2649},{"t":"say","who":"hero","disp":null,"br":"（","text":"口袋里的发夹……又一次，没来得及还给她。","src":"script/scene_09.txt:283","rid":"scene_09_start#108"},{"t":"goto","to":2650,"src":"script/scene_09.txt:284"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的发间，别着那枚珍珠发夹。","src":"script/scene_09.txt:285","rid":"scene_09_start#109"},{"t":"say","who":null,"disp":null,"br":null,"text":"她回过头，朝我深深地鞠了一躬。什么也没说。","src":"script/scene_09.txt:287","rid":"scene_09_start#110"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，拉门无声地合上了。","src":"script/scene_09.txt:288","rid":"scene_09_start#111"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……没有一句告别。也没有一句后悔。","src":"script/scene_09.txt:289","rid":"scene_09_start#112"},{"t":"filter","src":"script/scene_09.txt:291","name":"none","strength":0.8,"time":1},{"t":"cghide","src":"script/scene_09.txt:292","trans":"fade","time":null},{"t":"endrecall","id":"ayaka_rh01","src":"script/scene_09.txt:293"},{"t":"bg","src":"script/scene_09.txt:295","id":"shirogane_house_night","trans":"black","time ":"scene_10_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"雨从傍晚就没停过。窗玻璃被打得噼啪作响。","src":"script/scene_10.txt:15","rid":"scene_10_start#1"},{"t":"se","src":"script/scene_10.txt:16","name":"thunder_distant","vol":0.5,"loop":false},{"t":"se","src":"script/scene_10.txt:17","name":"window_rattle","vol":0.4,"loop":false},{"t":"se","src":"script/scene_10.txt:19","name":"wall_thud","vol":0.8,"loop":false,"pan":0.5,"muffle":"wall"},{"t":"shake","src":"script/scene_10.txt:20","power":"weak","time":0.2,"target":"screen"},{"t":"say","who":null,"disp":null,"br":null,"text":"——咚。","src":"script/scene_10.txt:21","rid":"scene_10_start#2"},{"t":"say","who":null,"disp":null,"br":null,"text":"墙的那一边，有什么东西倒了。","src":"script/scene_10.txt:22","rid":"scene_10_start#3"},{"t":"zoom","src":"script/scene_10.txt:23","target":"bg","time":1.2,"ease":"soft","wait":true,"scale":1.25,"x":0.35,"y":0.45},{"t":"say","who":"hero","disp":null,"br":"「","text":"……椎名小姐？","src":"script/scene_10.txt:24","rid":"scene_10_start#4"},{"t":"say","who":null,"disp":null,"br":null,"text":"没有回答。只有雨声。","src":"script/scene_10.txt:25","rid":"scene_10_start#5"},{"t":"say","who":"hero","disp":null,"br":"（","text":"……她今晚，好像没开灯。","src":"script/scene_10.txt:26","rid":"scene_10_start#6"},{"t":"zoom","src":"script/scene_10.txt:27","target":"stage","time":1,"ease":"inout","wait":true,"reset":true,"all":true},{"t":"say","who":null,"disp":null,"br":null,"text":"我在厨房煮了一锅味噌汤。豆腐，裙带菜，葱。","src":"script/scene_10.txt:28","rid":"scene_10_start#7"},{"t":"se","src":"script/scene_10.txt:29","name":"dish_clink","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"煮好了才发现，自己根本没想好要用什么理由送过去。","src":"script/scene_10.txt:30","rid":"scene_10_start#8"},{"t":"bg","src":"script/scene_10.txt:32","id":"corridor_night_storm","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"ambient","src":"script/scene_10.txt:33","name":"storm_loop","vol":0.65,"fade":1},{"t":"say","who":null,"disp":null,"br":null,"text":"外 o","disp":null,"br":"「","text":"……进来吧。别看乱的地方。","src":"script/scene_10.txt:51","rid":"scene_10_start#19","expr":"sad","voice":"makoto_e01_0004"},{"t":"recall","src":"script/scene_10.txt:53","id":"makoto_r01","title":"深夜的汤与签名","chara":"makoto","type":"event","thumb":"makoto_01","end":2766},{"t":"bg","src":"script/scene_10.txt:54","id":"room_makoto_night","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_10.txt:55","name":"makoto_theme","vol":1,"fade":2},{"t":"ambient","src":"script/scene_10.txt:56","name":"storm_loop","vol":0.35,"fade":1.5,"muffle":"corridor"},{"t":"chara","src":"script/scene_10.txt:57","id":"makoto","expr":"tired","outfit":"casual","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"和我的房间左右对称。只是，这里的书架是空的。","src":"script/scene_10.txt:58","rid":"scene_10_start#20"},{"t":"say","who":null,"disp":null,"br":null,"text":"地板上一个纸箱翻倒了，散了一地的旧文件。","src":"script/scene_10.txt:59","rid":"scene_10_start#21"},{"t":"say","who":null,"disp":null,"br":null,"text":"矮桌正中央，摊着一张纸。离婚协议书。","src":"script/scene_10.txt:60","rid":"scene_10_start#22"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的那一栏，是空的。","src":"script/scene_10.txt:61","rid":"scene_10_start#23"},{"t":"se","src":"script/scene_10.txt:62","name":"dish_clink","vol":0.4,"loop":false},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……冰箱里只有气泡水。要吗？","src":"script/scene_10.txt:63","rid":"scene_10_start#24","expr":"normal","voice":"makoto_e01_0005"},{"t":"say","who":null,"disp":null,"br":null,"text":"冰箱里，整整齐齐地排着一排气泡水。没有一罐啤酒。","src":"script/scene_10.txt:64","rid":"scene_10_start#25"},{"t":"say","who":null,"disp":null,"br":null,"text":"她喝了一口汤。然后，又喝了一口。","src":"script/scene_10.txt:65","rid":"scene_10_start#26"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……他去新加坡，已经一年了。","src":"script/scene_10.txt:66","rid":"scene_10_start#27","expr":"sad","voice":"makoto_e01_0006"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"上个月寄来这个。说，『你也该往前走了』。","src":"script/scene_10.txt:67","rid":"scene_10_start#28","voice":"makoto_e01_0007"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……先往前走的，是他。那边，早就有别人了。","src":"script/scene_10.txt:69","rid":"scene_10_start#29","expr":"sad","voice":"makoto_e01_0026"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"说得好像，是我一直停在原地一样。","src":"script/scene_10.txt:70","rid":"scene_10_start#30","expr":"annoyed","voice":"makoto_e01_0008"},{"t":"se","src":"script/scene_10.txt:71","name":"thunder_distant","vol":0.6,"loop":false},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……其实，就是我。","src":"script/scene_10.txt:72","rid":"scene_10_start#31","expr":"sad","voice":"makoto_e01_0009"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"我不签，不是因为还爱他。","src":"script/scene_10.txt:73","rid":"scene_10_start#32","voice":"makoto_e01_0010"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"是因为不想承认，我选错了。","src":"script/scene_10.txt:74","rid":"scene_10_start#33","voice":"makoto_e01_0011","emph":"on"},{"t":"chara","src":"script/scene_10.txt:75","id":"makoto","expr":"sad","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"那件衬衫的袖口，被她攥得皱巴巴的。","src":"script/scene_10.txt:76","rid":"scene_10_start#34"},{"t":"choice","src":"script/scene_10.txt:78","opts":[{"text":"「签不签都由你决定。我在这里。」","fx":[{"n":"aff_makoto","op":"+=","val":2},{"n":"f_makoto_wait","op":"=","val":true}],"target":null,"cond":null,"body":2736,"src":"script/scene_10.txt:79"},{"text":"「……不想签就别签。」","fx":[{"n":"aff_makoto","op":"+=","val":1},{"n":"f_makoto_push","op":"=","val":true}],"target":null,"cond":null,"body":2741,"src":"script/scene_10.txt:84"}],"end":2745},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你在这里，有什么用。","src":"script/scene_10.txt:80","rid":"scene_10_start#35","expr":"surprised","voice":"makoto_e01_0012"},{"t":"say","who":"hero","disp":null,"br":"「","text":"没什么用。只是隔壁的人，在这里。","src":"script/scene_10.txt:81","rid":"scene_10_star ":0.5},{"t":"se","src":"script/scene_10.txt:99","name":"pen_write","vol":1,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"椎名，真琴。一笔一画。","src":"script/scene_10.txt:100","rid":"scene_10_start#47"},{"t":"say","who":null,"disp":null,"br":null,"text":"她放下笔，摘下了左手的戒指，轻轻放在签好的名字旁边。","src":"script/scene_10.txt:101","rid":"scene_10_start#48"},{"t":"cg","src":"script/scene_10.txt:102","id":"makoto_01","diff":"b","trans":"crossfade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……好了。","src":"script/scene_10.txt:103","rid":"scene_10_start#49","expr":"soft","voice":"makoto_e01_0019"},{"t":"say","who":null,"disp":null,"br":null,"text":"她笑了。很小，很笨拙。是第一次没有用嘴硬遮起来的笑。","src":"script/scene_10.txt:104","rid":"scene_10_start#50"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"这支笔，写起来真顺。……不愧是我们公司的客户。","src":"script/scene_10.txt:105","rid":"scene_10_start#51","expr":"soft","voice":"makoto_e01_0020"},{"t":"say","who":null,"disp":null,"br":null,"text":"她拿起手腕上的表。那块永远快五分钟的表。","src":"script/scene_10.txt:107","rid":"scene_10_start#52"},{"t":"say","who":null,"disp":null,"br":null,"text":"把指针，拨回了正确的时间。","src":"script/scene_10.txt:108","rid":"scene_10_start#53"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"以前，总怕错过他的电话。所以拨快了五分钟。","src":"script/scene_10.txt:109","rid":"scene_10_start#54","expr":"soft","voice":"makoto_e01_0021"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"从今天开始，不用再等谁了。","src":"script/scene_10.txt:110","rid":"scene_10_start#55","expr":"smile","voice":"makoto_e01_0022"},{"t":"cghide","src":"script/scene_10.txt:111","trans":"fade","time":null},{"t":"endrecall","id":"makoto_r01","src":"script/scene_10.txt:112"},{"t":"if","src":"script/scene_10.txt:114","c":{"v":"f_makoto_coffee"},"f":2781},{"t":"recall","src":"script/scene_10.txt:115","id":"makoto_r02","title":"凌晨两点的黑咖啡","chara":"makoto","type":"event","thumb":"makoto_01","end":2780},{"t":"bg","src":"script/scene_10.txt:116","id":"room_makoto_night","trans":"crossfade","tim ","src":"script/scene_11.txt:115","rid":"scene_11_rh01#39"},{"t":"cg","src":"script/scene_11.txt:116","id":"makoto_h01","diff":"a","trans":"crossfade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"先吻上来的，是她。","src":"script/scene_11.txt:117","rid":"scene_11_rh01#40"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……别误会。只是不想让你先。","src":"script/scene_11.txt:118","rid":"scene_11_rh01#41","expr":"annoyed","voice":"makoto_h01_0018","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"嘴上这样说，攥着我衬衫的手，却在发抖。","src":"script/scene_11.txt:119","rid":"scene_11_rh01#42"},{"t":"ambientstop","src":"script/scene_11.txt:121","name":"wall_tv","fade":2},{"t":"bgm","src":"script/scene_11.txt:122","name":"h_scene","vol":0.45,"fade":3},{"t":"ambient","src":"script/scene_11.txt:123","name":"storm_loop","vol":0.25,"fade":2,"muffle":"corridor"},{"t":"se","src":"script/scene_11.txt:124","name":"cloth_rustle","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"外套，从她的肩膀上滑了下去。","src":"script/scene_11.txt:125","rid":"scene_11_rh01#43"},{"t":"hb_begin","id":"makoto_h01_01","src":"script/scene_11.txt:127","stages":[{"stage":"intro","label":"前戏","pc":2899}]},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:16","name":"cloth_rustle","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"唇分开的时候，她的呼吸已经乱了。","src":"script/h_blocks/makoto_h01_01.txt:17","rid":"hb:makoto_h01_01#0","hb":"makoto_h01_01"},{"t":"hstage","src":"script/h_blocks/makoto_h01_01.txt:19","stage":"intro","char":"makoto","fade":null},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:20","name":"kiss_b","vol":0.28,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"炭灰色的外套落在地板上，像一份被随手丢下的文件。","src":"script/h_blocks/makoto_h01_01.txt:21","rid":"hb:makoto_h01_01#1","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她还穿着那件白色丝质衬衫。第一颗扣子，扣得一丝不苟。","src":"script/h_blocks/makoto_h01_01.txt:22","rid":"hb:makoto_h01_01#2","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"白天在会议室里，那颗扣子就是她的盔甲。","src":"script/h_blocks/makoto_h01_01.txt:23","rid":"hb:makoto_h01_01#3","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"眼镜还握在她手里。她低头看了一眼，把它折好，放在枕边。","src":"script/h_blocks/makoto_h01_01.txt:24","rid":"hb:makoto_h01_01#4","hb":"makoto_h01_01"},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:25","name":"touch_soft","vol":0.25,"loop":false},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……看什么。放好而已。","src":"script/h_blocks/makoto_h01_01.txt:26","rid":"hb:makoto_h01_01#5","expr":"annoyed","voice":"makoto_h01_0029","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"那颗扣子。……可以吗？","src":"script/h_blocks/makoto_h01_01.txt:27","rid":"hb:makoto_h01_01#6","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的喉咙动了一下。","src":"script/h_blocks/makoto_h01_01.txt:28","rid":"hb:makoto_h01_01#7","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……问这种问题，扣分。","src":"script/h_blocks/makoto_h01_01.txt:29","rid":"hb:makoto_h01_01#8","expr":"shy","voice":"makoto_h01_0030","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……可以。","src":"script/h_blocks/makoto_h01_01.txt:30","rid":"hb:makoto_h01_01#9","expr":"shy","voice":"makoto_h01_0031","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"指尖碰到那颗小小的贝母扣。她颈侧很烫，脉搏一下一下地撞着我的指节。","src":"script/h_blocks/makoto_h01_01.txt:31","rid":"hb:makoto_h01_01#10","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"一颗。她闭上了眼睛。","src":"script/h_blocks/makoto_h01_01.txt:32","rid":"hb:makoto_h01_01#11","hb":"makoto_h01_01"},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:33","name":"cloth_rustle_a","vol":0.35,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"两颗，三颗。丝绸从中间分开，露出锁骨，和比西装下看起来更丰满的胸口。","src":"script/h_blocks/makoto_h01_01.txt:34","rid":"hb:makoto_h01_01#12","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"黑色的内衣，窄窄的蕾丝边，没有一点多余的装饰——很像她。","src":"script/h_blocks/makoto_h01_01.txt:35","rid":"hb:makoto_h01_01#13","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不是为了今天才穿的。别得意。","src":"script/h_blocks/makoto_h01_01.txt:36","rid":"hb:makoto_h01_01#14","expr":"annoyed","voice":"makoto_h01_0032","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"嗯。","src":"script/h_blocks/makoto_h01_01.txt:37","rid":"hb:makoto_h01_01#15","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你那个『嗯』，一点都不像相信的样子。","src":"script/h_blocks/makoto_h01_01.txt:38","rid":"hb:makoto_h01_01#16","expr":"shy","voice":"makoto_h01_0033","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻她的锁骨。她的手抓住我的肩，指甲隔着衬衫陷进来。","src":"script/h_blocks/makoto_h01_01.txt:39","rid":"hb:makoto_h01_01#17","hb":"makoto_h01_01"},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:40","name":"kiss_c","vol":0.22,"loop":false,"pan":-0.1},{"t":"breath","src":"script/h_blocks/makoto_h01_01.txt:41","level":2,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"解开背后的搭扣时，她下意识抬起手臂想挡，又在半空停住，慢慢放下，像在对自己下命令。","src":"script/h_blocks/makoto_h01_01.txt:42","rid":"hb:makoto_h01_01#18","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不挡。今天，不挡。","src":"script/h_blocks/makoto_h01_01.txt:43","rid":"hb:makoto_h01_01#19","expr":"shy","voice":"makoto_h01_0034","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"沉甸甸的乳房落进我的掌心。白得晃眼，顶端是浅浅的豆沙色，在我的拇指下一点点硬起来。","src":"script/h_blocks/makoto_h01_01.txt:44","rid":"hb:makoto_h01_01#20","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她咬着唇，不出声。可我低头含住那里的时候，她的腰猛地一弹。","src":"script/h_blocks/makoto_h01_01.txt:45","rid":"hb:makoto_h01_01#21","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「",
