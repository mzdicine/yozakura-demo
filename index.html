s/trio_h01_03.txt:65","name":"rain_loop","vol":0.3,"fade":0.3,"muffle":"wall"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴的背猛地弓起，内里一阵阵死死绞紧。我抵在她最深处，把一切都留在了那里。","src":"script/h_blocks/trio_h01_03.txt:66","rid":"hb:trio_h01_03#20","hb":"trio_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃在她身下颤抖着，十指和她扣在一起，同时到了。","src":"script/h_blocks/trio_h01_03.txt:67","rid":"hb:trio_h01_03#21","hb":"trio_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"三个人的喘息，叠成了一个声音。","src":"script/h_blocks/trio_h01_03.txt:68","rid":"hb:trio_h01_03#22","hb":"trio_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"……","src":"script/h_blocks/trio_h01_03.txt:69","rid":"hb:trio_h01_03#23","hb":"trio_h01_03"},{"t":"hstage","src":"script/h_blocks/trio_h01_03.txt:71","stage":"after","char":"trio","fade":null},{"t":"filter","src":"script/h_blocks/trio_h01_03.txt:72","name":"softglow","strength":0.45,"time":1.2},{"t":"zoom","src":"script/h_blocks/trio_h01_03.txt:73","target":"cg","time":2,"ease":"inout","wait":false,"reset":true,"all":false},{"t":"bgmfade","src":"script/h_blocks/trio_h01_03.txt:74","time":2.5},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴软软地侧躺下来。雪乃拨开她汗湿的额发，在她额头上亲了一下。","src":"script/h_blocks/trio_h01_03.txt:75","rid":"hb:trio_h01_03#24","hb":"trio_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……辛苦了。真琴，好棒。","src":"script/h_blocks/trio_h01_03.txt:76","rid":"hb:trio_h01_03#25","expr":"tender","voice":"yukino_th1_0023","blip":"off","hb":"trio_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……别、别夸。……会想再来一次的。","src":"script/h_blocks/trio_h01_03.txt:77","rid":"hb:trio_h01_03#26","expr":"soft","voice":"makoto_th1_0022","blip":"off","hb":"trio_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……还有。刚才，雪乃小姐……输了吧。","src":"script/h_blocks/trio_h01_03.txt:78","rid":"hb:trio_h01_03#27","expr":"shy","voice":"makoto_th1_0026","blip":"off","hb":"trio_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯。输了。……输给你们两个了。","src":"script/h_blocks/trio_h01_03.txt:79","rid":"hb:trio_h01_03#28","expr":"shy","voice":"yukino_th1_0024","blip":"off","hb":"trio_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……所以，再来一次的话。……也可以哦。","src":"script/h_blocks/trio_h01_03.txt:80","rid":"hb:trio_h01_03#29","expr":"tender","voice":"yukino_th1_0029","blip":"off","hb":"trio_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"三个人，挤在一张不够宽的床上。谁都不肯先睡着。","src":"script/h_blocks/trio_h01_03.txt:81","rid":"hb:trio_h01_03#30","hb":"trio_h01_03"},{"t":"wait","src":"script/h_blocks/trio_h01_03.txt:82","time":1},{"t":"ambient","src":"script/h_blocks/trio_h01_03.txt:83","name":"rain_loop","vol":0.15,"fade":4,"muffle":"wall"},{"t":"say","who":null,"disp":null,"br":null,"text":"窗外的雨，一点一点地小了。","src":"script/h_blocks/trio_h01_03.txt:84","rid":"hb:trio_h01_03#31","hb":"trio_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"柜子上的铃兰，轻轻晃了一下。","src":"script/h_blocks/trio_h01_03.txt:85","rid":"hb:trio_h01_03#32","hb":"trio_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，一切都安静了下来。","src":"script/h_blocks/trio_h01_03.txt:86","rid":"hb:trio_h01_03#33","hb":"trio_h01_03"},{"t":"hstage","src":"script/h_blocks/trio_h01_03.txt:88","stage":"end","char":"trio","fade":3},{"t":"filter","src":"script/h_blocks/trio_h01_03.txt:89","name":"none","strength":0.8,"time":1.2},{"t":"hb_end","id":"trio_h01_03","src":"script/scene_18.txt:153"},{"t":"fadeout","src":"script/scene_18.txt:155","color":"white","time":1.2},{"t":"bgm","src":"script/scene_18.txt:156","name":"yukino_theme","vol":1,"fade":2},{"t":"ambientstop","src":"script/scene_18.txt:157","name":"rain_loop","fade":3},{"t":"wait","src":"script/scene_18.txt:158","time":1},{"t":"fadein","src":"script/scene_18.txt:159","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"雨，停了。","src":"script/scene_18.txt:160","rid":"scene_18_rh01#56"},{"t":"filter","src":"script/scene_18.txt:161","name":"softglow","strength":0.3,"time":1.2},{"t":"if","src":"script/scene_18.txt:162","c":{"v":"f_trio_ylead"},"f":4365},{"t":"cg","src":"script/scene_18.txt:163","id":"trio_h01","diff":"after","trans":"crossfade","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"雪乃靠在床头，把真琴的头，轻轻放在自己的肩上。","src":"script/scene_18.txt:164","rid":"scene_18_rh01#57"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……说好姐姐带路的。结果，被你们两个带走了。","src":"script/scene_18.txt:165","rid":"scene_18_rh01#58","voice":"yukino_t01_0070","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不过，下一次，姐姐要带回来哦。两个都牵好，谁都不许——","src":"script/scene_18.txt:166","rid":"scene_18_rh01#59","voice":"yukino_t01_0071","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"真琴在她肩上抬起眼，看了她一下。雪乃自己先笑出了声，把脸埋进真琴的头发里，肩膀抖个不停。","src":"script/scene_18.txt:167","rid":"scene_18_rh01#60"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……下一次，是什么时候。","src":"script/scene_18.txt:168","rid":"scene_18_rh01#61","voice":"makoto_t01_0063","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。真琴酱，问得好急。","src":"script/scene_18.txt:169","rid":"scene_18_rh01#62","voice":"yukino_t01_0072","blip":"off"},{"t":"goto","to":4370,"src":"script/scene_18.txt:170"},{"t":"cg","src":"script/scene_18.txt:171","id":"trio_h01","diff":"after2","trans":"crossfade","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"我被夹在中间。三个人的手，叠在我胸口，谁都没有松开。","src":"script/scene_18.txt:172","rid":"scene_18_rh01#63"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你，照顾得太认真了。","src":"script/scene_18.txt:173","rid":"scene_18_rh01#64","voice":"makoto_t01_0064","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"嗯。认真到，姐姐一点余裕都不剩了。","src":"script/scene_18.txt:174","rid":"scene_18_rh01#65","voice":"yukino_t01_0073","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"两个人隔着我，对看了一眼。然后，一起笑我。","src":"script/scene_18.txt:175","rid":"scene_18_rh01#66"},{"t":"say","who":null,"disp":null,"br":null,"text":"柜子上，两只花瓶。一枚戒指，一副眼镜。","src":"script/scene_18.txt:177","rid":"scene_18_rh01#67"},{"t":"wait","src":"script/scene_18.txt:178","time":0.8},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……雪乃小姐。现在几点。","src":"script/scene_18.txt:179","rid":"scene_18_rh01#68","voice":"makoto_t01_0065","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"按姐姐的钟，还早。","src":"script/scene_18.txt:180","rid":"scene_18_rh01#69","voice":"yukino_t01_0074","blip":"off"},{"t":"filter","src":"script/scene_18.txt:181","name":"none","strength":0.8,"time":1},{"t":"cghide","src":"script/scene_18.txt:182","trans":"fade","time":null},{"t":"endrecall","id":"trio_rh01","src":"script/scene_18.txt:183"},{"t":"ambientstop","src":"script/scene_18.txt:184","name":"all","fade":2},{"t":"bgmfade","src":"script/scene_18.txt:185","time":2},{"t":"jump","src":"script/scene_18.txt:186","label":"scene_19_start"},{"t":"eof","src":"script/scene_18.txt:187"},{"t":"prefetch","se":["clock_tick","wind_loop","door_lock"],"src":"script/scene_19.txt:1"},{"t":"label","src":"script/scene_19.txt:10","name":"scene_19_start"},{"t":"chapter","src":"script/scene_19.txt:11","title":"真琴 × 雪乃","sub":"同一场雨"},{"t":"bg","src":"script/scene_19.txt:12","id":"apt_front_evening_green","trans":"black","time":null,"hold":1,"keep":false},{"t":"bgm","src":"script/scene_19.txt:13","name":"daily","vol":1,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"五月五日。儿童节。傍晚六点。","src":"script/scene_19.txt:14","rid":"scene_19_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"夕灯荘的门口，停着一辆小小的搬家车。","src":"script/scene_19.txt:15","rid":"scene_19_start#1"},{"t":"say","who":null,"disp":null,"br":null,"text":"201 的纸箱，和 202 的纸箱，一起搬进了 102。","src":"script/scene_19.txt:16","rid":"scene_19_start#2"},{"t":"say","who":null,"disp":"房东太太","br":"「","text":"哎呀呀。三个人，住一间？","src":"script/scene_19.txt:17","rid":"scene_19_start#3"},{"t":"chara","src":"script/scene_19.txt:18","id":"yukino","expr":"smile","outfit":"apronnoring","pos":"right","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"是的。三个人，住一间。","src":"script/scene_19.txt:19","rid":"scene_19_start#4","expr":"smile","voice":"yukino_t01_0075"},{"t":"chara","src":"script/scene_19.txt:20","id":"makoto","expr":"normal","outfit":"suitnoring","pos":"left","trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"租约，下周一来改。三个人的名字。","src":"script/scene_19.txt:21","rid":"scene_19_start#5","expr":"normal","voice":"makoto_t01_0066"},{"t":"say","who":null,"disp":"房东太太","br":"「","text":"……现在的年轻人啊。","src":"script/scene_19.txt:22","rid":"scene_19_start#6"},{"t":"say","who":null,"disp":"房东太太","br":"「","text":"好啦好啦。腌菜，记得也分我一份。","src":"script/scene_19.txt:23","rid":"scene_19_start#7"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"当然。……小哥会腌的。","src":"script/scene_19.txt:24","rid":"scene_19_start#8","expr":"smile","voice":"yukino_t01_0076"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我不会。","src":"script/scene_19.txt:25","rid":"scene_19_start#9"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那就，从明天开始学。","src":"script/scene_19.txt:26","rid":"scene_19_start#10","expr":"smug","voice":"yukino_t01_0077"},{"t":"say","who":null,"disp":null,"br":null,"text":"おはぎ蹲在纸箱上，看着我们。像在审核。","src":"script/scene_19.txt:27","rid":"scene_19_start#11"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……おはぎ様，以后也请多关照。","src":"script/scene_19.txt:28","rid":"scene_19_start#12","expr":"normal","voice":"makoto_t01_0067"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。对猫用敬语？","src":"script/scene_19.txt:29","rid":"scene_19_start#13","expr":"smile","voice":"yukino_t01_0078"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……习惯了。","src":"script/scene_19.txt:30","rid":"scene_19_start#14","expr":"annoyed","voice":"makoto_t01_0068"},{"t":"bg","src":"script/scene_19.txt:32","id":"flower_shop_night_green","trans":"crossfade","time":1.5,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_19.txt:       if (ui.modalOpen) return; const k = e.key;
      if (k === 'ArrowRight' || k === 'PageDown' || k === 'Enter' || k === ' ') { e.preventDefault(); e.stopPropagation(); go(1, k !== 'PageDown'); }
      else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); e.stopPropagation(); go(-1); }
      else if (k === 'h' || k === 'H') { e.preventDefault(); e.stopPropagation(); toggleHud(); }
    };
    addEventListener('keydown', onKey, true);
    let lastWheel = 0;
    v.addEventListener('wheel', (e) => { e.preventDefault(); e.stopPropagation(); const now = performance.now(); if (now - lastWheel < 220) return; const dd = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY; if (!dd) return; lastWheel = now; go(dd > 0 ? 1 : -1); }, { passive: false });
    let pd = null, lp = null, suppress = false;
    v.addEventListener('pointerdown', (e) => { if (e.button !== 0 || e.target.closest('button')) return; pd = { x: e.clientX, y: e.clientY }; suppress = false; clearTimeout(lp); lp = setTimeout(() => { lp = null; suppress = true; toggleHud(); }, 500); });
    v.addEventListener('pointermove', (e) => { if (pd && lp && Math.hypot(e.clientX - pd.x, e.clientY - pd.y) > 12) { clearTimeout(lp); lp = null; } });
    const up = (e) => { clearTimeout(lp); lp = null; if (!pd) return; const dx = e.clientX - pd.x, dy = e.clientY - pd.y; pd = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) { suppress = true; go(dx < 0 ? 1 : -1); } };
    v.addEventListener('pointerup', up); v.addEventListener('pointercancel', () => { clearTimeout(lp); lp = null; pd = null; });
    v.onclick = (e) => { e.stopPropagation(); if (suppress) { suppress = false; return; } go(1, true); };
    v.oncontextmenu = (e) => { e.preventDefault(); close(); };
    hud.querySelector('.cg-close').onclick = (e) => { e.stopPropagation(); close(); };
    hud.querySelector('.cg-hide').onclick = (e) => { e.stopPropagation(); toggleHud(true); };
    toggleHud(false); render(false);
    S().L.modal.appendChild(v);
  }
  // ---------- 回想 ----------
  // kind = 'h'：标题「H 场景」（只列 type=h）；页签 .recall-tabs > .rt-tab[data-c]：绫香 → 真琴 → 雪乃 → 修罗场 → trio；一条都没解锁的线不渲染页签（防剧透）
  const TAB_ORDER = ['ayaka', 'makoto', 'yukino', 'shura', 'trio'];
  const tabLabel = (c) => { const ch = D().chars.find(x => x.id === c); return CHARA_LABEL[c] || (ch && (ch.short || ch.name)) || charaLabel(c); };
  function openRecall(kind) {
    ui.recallKind = kind === 'h' ? 'h' : null; const H = ui.recallKind === 'h';
    openScreen('recall', H ? 'H场景' : '回想', H ? 'H SCENES' : 'MEMORIES', H ? 'hscene-screen' : 'recall-screen', (body) => {
      if (H) body.parentElement.classList.add('scr-hscene');
      const all = D().recalls.filter(r => !H || r.type === 'h');
      const nOk = all.filter(r => Gal.store.glob.recall[r.id]).length;
      const sum = el('p', 'scr-progress', `已解锁 <b>${nOk}</b> / ${all.length} 条${Gal.debug ? '（调试模式：全部可播放）' : unlockAllOn() ? '（全部解锁：仅显示）' : ''}`); tid(sum, 'recall-progress'); body.appendChild(sum);
      const cs = [...new Set(all.map(r => r.chara || ''))].sort((a, b) => ((TAB_ORDER.indexOf(a) + 1) || 99) - ((TAB_ORDER.indexOf(b) + 1) || 99));
      const vis = cs.filter(c => all.some(r => (r.chara || '') === c && recallOk(r)));
      const rp = ui.recallPos; const want = rp && all.find(x => x.id === rp.id); let cur = (want && vis.includes(want.chara || '') && (want.chara || '')) || (vis.includes(ui.recallTab) ? ui.recallTab : vis[0]);
      const tabs = el('div', 'recall-tabs'); tabs.setAttribute('role', 'tablist'); tid(tabs, 'recall-tabs');
      tabs.innerHTML = cs.map(c => `<button class="rt-tab" role="tab" data-testid="recall-tab" data-c="${esc(c)}" ${vis.includes(c) ? '' : 'hidden'}>${esc(tabLabel(c) || '其他')}</button>`).join('');
      if (vis.length) body.appendChild(tabs);
      const list = el('div', 'replay-list'); body.appendChild(list);
      const showTab = (c) => { cur = c; ui.recallTab = c; tabs.querySelectorAll('.rt-tab').forEach(t => { const on = t.dataset.c === c; t.classList.toggle('is-on', on); t.setAttribute('aria-selected', on ? 'true' : 'false'); });
        list.querySelectorAll('.gal-replay-item').forEach(d => { d.hidden = vis.length > 0 && (d.dataset.c || '') !== c; }); list.dataset.c = c || ''; };
      tabs.querySelectorAll('.rt-tab').forEach(t => t.onclick = () => { sfx('select'); showTab(t.dataset.c); const sc = scrollerOf(list); if (sc) sc.scrollTop = 0; });
      for (const r of all) {
        const ok = recallOk(r);
        const d = el('div', 'gal-replay-item' + (ok ? '' : ' is-locked')); tid(d, 'recall-item'); d.dataset.recall = r.id; d.dataset.type = r.type; if (r.chara) d.dataset.c = r.chara; if (!ok) d.dataset.locked = '1';
        d.innerHTML = `<div class="rthumb" style="${ok ? artVar(thumbRecall(r)) : ''}"></div><div><div class="rtitle">${esc(ok ? r.title : '？？？')}</div><div class="rsub">${esc(charaLabel(r.chara))} · ${r.type === 'h' ? 'H' : 'EVENT'}</div></div><i class="ico ico-play"></i>`;
        if (ok) d.onclick = async () => {
          const vars = await pickBranches(r); if (!vars) return; // 取消
          { const sc = scrollerOf(d); ui.recallPos = { id: r.id, top: sc ? sc.scrollTop : 0 }; }   // 7(d) 回想结束后回到列表原位置
          closeScreen(true); enterGame(); VM().start(r.start, null, { vars, recall: true });
        };
        list.appendChild(d);
      }
      if (!all.length) body.appendChild(el('p', 'scr-empty', H ? '尚无 H 场景' : '尚无回想'));
      showTab(cur);
      const it = rp && list.querySelector(`.gal-replay-item[data-recall="${rp.id}"]`);
      if (it) { it.classList.add('is-last'); it.dataset.last = '1'; it.tabIndex = -1;
        requestAnimationFrame(() => { const sc = scrollerOf(it); if (sc) sc.scrollTop = rp.top; try { it.focus({ preventScroll: true }); } catch (e) {} }); }
    });
  }
  const scrollerOf = (n) => { for (let p = n.parentElement; p && p !== document.body; p = p.parentElement) { const o = getComputedStyle(p).overflowY; if (/auto|scroll/.test(o) && p.scrollHeight > p.clientHeight) return p; } return null; };

  // 回想分支（@branch）：g_seen_<rid>_<分支> 已见的才能选；某组已见 ≥2 才需要玩家选，否则自动取已见的那个（都没见过取第一个）
  function pickBranches(r) {
    const gs = r.branches || []; const G = Gal.store.glob.vars; const seen = (v) => !!G[v.flag] || Gal.debug || unlockAllOn();
    const auto = {}; for (const g of gs) { const s0 = g.values.filter(v => G[v.flag]); auto[g.var] = (s0[0] || g.values[0]).name; }
    if (!gs.some(g => g.values.filter(seen).length >= 2)) return Promise.resolve(auto);
    return new Promise(res => {
      const rows = gs.map(g => `<div class="rb-group" data-group="${g.group}"><div class="rb-name">${esc(g.label || g.group)}</div><div class="rb-opts">${g.values.map(v => {
        const ok = seen(v); const on = auto[g.var] === v.name;
        return `<button class="gal-btn rb-opt${on ? ' is-on' : ''}${G[v.flag] ? '' : ' is-unseen'}" data-testid="recall-branch" data-group="${g.group}" data-value="${v.name}" data-seen="${G[v.flag] ? 1 : 0}" ${ok ? '' : 'disabled'} aria-pressed="${on}">${esc(seen(v) ? v.title : '？？？')}</button>`; }).join('')}</div></div>`).join('');
      const { m, close } = modal(`<h2>${esc(r.title)}</h2><p>选择想重温的版本（未见过的分支为灰色）</p>${rows}<div class="btns"><button class="gal-btn" data-testid="confirm-cancel" data-act="cancel">取消</button><button class="gal-btn gal-btn--primary" data-testid="recall-branch-ok" data-act="ok">开始回想</button></div>`, 'recall-branch-dialog');
      const pick = Object.assign({}, auto);
      ui.modalOpen = (v) => { close(); ui.modalOpen = null; res(v ? pick : null); };
      m.querySelectorAll('.rb-opt').forEach(b => b.onclick = () => { if (b.disabled) return; sfx('select'); const g = gs.find(x => x.group === b.dataset.group); pick[g.var] = b.dataset.value;
        m.querySelectorAll(`.rb-opt[data-group="${b.dataset.group}"]`).forEach(x => { x.classList.toggle('is-on', x === b); x.setAttribute('aria-pressed', x === b); }); });
      m.querySelector('[data-act=ok]').onclick = () => { sfx('decide'); ui.modalOpen(true); };
      m.querySelector('[data-act=cancel]').onclick = () => { sfx('cancel'); ui.modalOpen(false); };
    });
  }
  ui.pickBranches = pickBranches;

  // ---------- 输入 ----------
  function advance() {
    if (!ui.inGame || ui.screen || ui.modalOpen || document.querySelector('.gal-modal-veil')) return;
    const s = S();
    if (s.userHidden) { setUserHidden(false); return; }
    if (ui.choosing) return;
    if (VM().auto) { VM().setAuto(false); return; }
    if (VM().skipping) { VM().setSkip(false); return; }
    if (s.textbox.classList.contains('gal-textbox--hfade')) { s.textbox.classList.remove('gal-textbox--hfade'); return; }   // §22.6：H 半透明时第一下只恢复不透明，不前进
    if (s.text.dataset.typing) { Gal.emit('type-skip'); Gal.emit('interrupt'); return; }
    Gal.emit('interrupt'); Gal.emit('advance');
  }
  ui.advance = advance;
  // 隐藏 UI（长按 / H 键 / 右键）：舞台根 .is-ui-hidden（进度条等跟着藏，UI_SPEC §22.7）
  function setUserHidden(h) { const s = S(); s.userHidden = !!h; if (h) s.hideText(); else s.showText(); s.stage.classList.toggle('is-ui-hidden', !!h); }
  ui.setUserHidden = setUserHidden;
  function toggleHide() { const s = S(); if (!ui.inGame || ui.screen) return; setUserHidden(!s.userHidden); }
  function bindInput() {
    const st = S().stage; let lp = null, sy = 0, sx = 0, longed = false, downId = null, downFree = false;
    const UIHIT = 'button,input,select,label,a,.gal-screen,.gal-modal-veil,.cg-viewer,.gal-quickmenu';
    st.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return; longed = false; sx = e.clientX; sy = e.clientY; downId = e.pointerId;
      downFree = !e.target.closest(UIHIT) && !document.querySelector('.gal-modal-veil'); // 只有在空白舞台上按下的才算手势
      lp = setTimeout(() => { longed = true; toggleHide(); }, 500);
    });
    st.addEventListener('pointermove', (e) => { if (lp && (Math.abs(e.clientY - sy) > 12 || Math.abs(e.clientX - sx) > 12)) { clearTimeout(lp); lp = null; } });
    st.addEventListener('pointerup', (e) => {
      clearTimeout(lp); lp = null; const paired = downId === e.pointerId; downId = null; if (e.button !== 0 || longed || !paired) return;
      // 上滑开 Backlog：按下和抬起必须成对、按下点在空白舞台、此刻没有确认框/界面（DOC：取消确认框后误开 Backlog）
      if (sy - e.clientY > 60 && Math.abs(e.clientX - sx) < 80) { if (downFree && ui.inGame && !ui.screen && !document.querySelector('.gal-modal-veil')) openBacklog(); return; }
      if (Math.abs(e.clientY - sy) > 30) return;
      if (e.target.closest('button,input,.gal-screen,.gal-modal-veil,.cg-viewer')) return;
      advance();
    });
    st.addEventListener('contextmenu', (e) => { e.preventDefault(); if (ui.screen && ui.inGame) closeScreen(); else toggleHide(); });
    st.addEventListener('wheel', (e) => { if (!ui.inGame || ui.screen) return; if (e.deltaY < 0) openBacklog(); else if (e.deltaY > 0) advance(); }, { passive: true });
    addEventListener('keydown', (e) => {
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      const k = e.key;
      if (k === 'Escape') { if (ui.modalOpen) ui.modalOpen(false); else if (document.querySelector('.cg-viewer')) document.querySelector('.cg-viewer').remove(); else if (ui.screen && ui.screen !== 'title') closeScreen(); else if (ui.inGame) openSysmenu(); return; }
      if (ui.screen || ui.modalOpen) return;
      if (!ui.inGame) return;
      if (k === 'Enter' || k === ' ') { e.preventDefault(); advance(); }
      else if (k === 'Control') { if (!VM().skipping) { VM().ctrlSkip = true; VM().setSkip(true); Gal.emit('type-skip'); Gal.emit('advance'); } }
      else if (k === 'a' || k === 'A') act('auto');
      else if (k === 's' || k === 'S') act('skip');
      else if (k === 'l' || k === 'L') openBacklog();
      else if (k === 'h' || k === 'H') toggleHide();
      else if (k === 'n' || k === 'N') act('nexth');
      else if (k === 'F5') { e.preventDefault(); act('qsave'); }
      else if (k === 'F9') { e.preventDefault(); act('qload'); }
      else if ((k === 'v' || k === 'V') && Gal.debug) openVars();
    });
    addEventListener('keyup', (e) => { if (e.key === 'Control' && VM() && VM().ctrlSkip) { VM().ctrlSkip = false; VM().setSkip(false); } });
  }
  ui.init = () => { buildQuick(); bindInput(); applyCfg(); showTitle(); };
})();

/* ==== src/engine/boot.js ==== */
// 启动：舞台 / 解释器 / 界面；开发版暴露 window.__galQA（docs/TEST_PLAN.md §7.2）
(() => {
  const Gal = window.Gal; const D = window.GAL_DATA;
  const q = new URLSearchParams(location.search);
  Gal.debug = !D.build.release || q.get('debug') === '1';
  const qa = q.getAll('qa');
  if (qa.includes('reset')) Object.keys(localStorage).filter(k => k.startsWith('yozakura_v1:')).forEach(k => localStorage.removeItem(k));
  if (qa.includes('fast')) { window.__galFast = true; document.documentElement.classList.add('qa-fast'); }
  function boot() {
    const root = document.getElementById('gal-root');
    Gal.stage = new Gal.Stage(root);
    Gal.vm = new Gal.VM(Gal.stage);
    Gal.audio.init(); Gal.audio.preloadBlips(); Gal.audio.preloadSe();
    Gal.ui.init();
    const ld = document.getElementById('gal-loading'); if (ld) ld.remove();
    const j = qa.find(x => x.startsWith('jump=')); if (j) setTimeout(() => window.__galQA && __galQA.jump(j.slice(5)), 100);
    // SW：相对路径注册，作用域 = 页面所在目录（GitHub Pages 子路径 /<repo>/ 也成立）；把实际使用的音频格式告诉 SW，只缓存这一种
    if (Gal.isHttp && 'serviceWorker' in navigator && (!Gal.debug || q.get('sw') === '1')) {
      const tell = (w) => { if (w) try { w.postMessage({ type: 'audio-format', fmt: Gal.audio.FMT }); } catch (e) {} };
      navigator.serviceWorker.register('./sw.js', { scope: './' }).then(reg => { tell(reg.active || reg.waiting || reg.installing); }).catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => tell(navigator.serviceWorker.controller));
      navigator.serviceWorker.ready.then(reg => tell(reg.active)).catch(() => {});
    }
    if (!Gal.isHttp && D && D.build && D.build.target === 'web') console.warn('[夜樱] 这是 web 构建（--web），音频需要 http(s) 托管；离线双击请用默认构建 tools/build.sh');
  }
  if (Gal.debug) {
    window.__galQA = {
      version: D.hash + (D.build.release ? '' : '-dev'),
      state() { const v = Gal.vm, u = Gal.ui; return { screen: u.screen || (u.inGame ? 'game' : 'title'), line: v.cur ? v.cur.src : null, auto: !!v.auto, skip: !!v.skipping, pc: v.pc, hblock: v.inHb || null }; },
      vars() { const v = Gal.vm; return Object.assign({}, v.vars || {}, Gal.store.glob.vars, { aff_top: v.get('aff_top') }); },
      audio() { return Gal.audio.qa(); },
      jump(label) { if (!(label in D.labels)) return false; Gal.ui.closeScreen(true); Gal.ui.inGame = true; Gal.ui.screen = null; Gal.stage.L.screen.innerHTML = ''; Gal.stage.quick.classList.remove('gal-hidden'); Gal.vm.start(D.labels[label]); return true; },
      set(name, value) { if (!/^[a-z_][a-z0-9_]*$/i.test(name)) return false; Gal.vm.set([{ n: name, op: '=', val: value }]); return Gal.vm.get(name); },
      // DIR-02 测试：改主角名（不传 = 恢复默认名）；返回当前名字
      hero(family, given) { const d = D.hero || {}; Gal.vm.hero = Object.assign({}, Gal.vm.hero, { family: family ?? d.family, given: given ?? d.given }); Gal.store.glob.hero = { family: Gal.vm.hero.family, given: Gal.vm.hero.given }; Gal.store.flush(); return { family: Gal.vm.hero.family, given: Gal.vm.hero.given, isDefault: !Gal.vm.nameCallSkip(['hero', 'hero_family']) }; },
      labels() { return (Gal.vm.visited || []).slice(); },
      unlocks() { const g = Gal.store.glob; return { cg: Object.keys(g.cg || {}).sort(), recall: Object.keys(g.recall || {}).sort(), endings: Object.keys(g.endings || {}).sort() }; },
      reset() { Object.keys(localStorage).filter(k => k.startsWith('yozakura_v1:')).forEach(k => localStorage.removeItem(k)); return true; },
      fps(ms = 2000) { return new Promise(res => { let n = 0; const t0 = performance.now(); const f = (t) => { n++; if (t - t0 < ms) requestAnimationFrame(f); else res(Math.round(n * 1000 / (t - t0))); }; requestAnimationFrame(f); }); },
      diag: D.diag, build: D.build,
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
