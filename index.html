.cg-viewer.cgv .cgv-pic{ position:absolute; inset:0; z-index:0; opacity:0; background:var(--art) center/cover no-repeat; transform:scale(1.012);
  transition:opacity 0s linear var(--cgv-ms,450ms),transform 0s linear var(--cgv-ms,450ms); }
.cg-viewer.cgv .cgv-pic.is-cur{ z-index:1; opacity:1; transform:none; transition:opacity var(--cgv-ms,450ms) var(--ease-std),transform calc(var(--cgv-ms,450ms) * 2) var(--ease-out); }
.cg-viewer.cgv[data-dir="next"] .cgv-pic:not(.is-cur){ transform:translateX(.8%) scale(1.012); }
.cg-viewer.cgv[data-dir="prev"] .cgv-pic:not(.is-cur){ transform:translateX(-.8%) scale(1.012); }
.cgv .cgv-ui{ position:absolute; inset:0; z-index:2; pointer-events:none; transition:opacity 260ms var(--ease-out),visibility 0s; }
.cgv.is-ui-hidden .cgv-ui{ opacity:0; visibility:hidden; transition:opacity 260ms var(--ease-out),visibility 0s linear 260ms; }
.cgv .cgv-top{ position:absolute; left:0; right:0; top:0; height:104px; padding:0 44px; display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(180deg,rgba(6,6,18,.72),transparent); font:500 18px/1 var(--font-serif); letter-spacing:.12em; color:var(--c-cream); text-shadow:var(--text-shadow); }

/* ⑦ v1.1.1 跟进（11/04 03:48 JST）
   (a) 温柔模式差分溶 ≥ 0.7s（STAGING §12 / §12.1）。引擎从 :root 读 --d-cgdiff（300ms）写进 --fx-dur，分不出「脚本写了 time=」，
       所以取 max(--fx-dur, 0.7s)：块内脚本写的 1.2–1.6s 照用，没写 time= 的从 0.3s 变 0.7s；不再 ×1.6。快进时引擎不播动画，不受影响 */

/* ===== 标题画面「通关记录」.title-endings —— UI/演出·结衣 11/04 JST（UI_SPEC §21）=====
   结构是引擎 ui.js endingsHtml() 输出的（.te-head + .te-item×N，带 data-got / data-total），theme.css 有葵的底样式，这里整组覆盖成老式 galgame 的「CLEAR」小铭牌：
   左边金竖线 + 渐隐暗底；「通关记录」小字 + 大号衬线 n + 「/ N」；下面一排结局签，达成 = 角色色菱形 + 名字，未达成 = 虚线 ？？？。
   theme.css 在 ui.css 之后注入，所以选择器都带 .scr-title 提权。纯展示：pointer-events:none、不进焦点、无悬停态（引擎不给它绑事件，别加）。n / N 用 attr(data-got/data-total) 画，.te-head 原文保留给读屏 */
.scr-title .title-endings{ left:56px; bottom:40px; max-width:780px; gap:8px 8px; padding:12px 20px 13px 18px; pointer-events:none; user-select:none;
  border-left:2px solid var(--c-gold); background:linear-gradient(90deg,rgba(12,14,32,.78),rgba(12,14,32,.42) 65%,rgba(12,14,32,0));
  font:400 13px/1.4 var(--font-serif); color:rgba(251,243,230,.82); text-shadow:0 1px 3px rgba(0,0,0,.7); }

.scr-title .title-endings::before{ content:attr(data-got); font-weight:600; font-size:30px; line-height:1; letter-spacing:.02em; margin-left:2px; }
.scr-title .title-endings::after{ content:"/ " attr(data-total); order:2; font-size:15px; letter-spacing:.08em; color:var(--c-gold); margin-right:14px; }

.scr-title .title-endings .te-head::after{ content:"通关记录"; font:500 14px/1 var(--font-serif); letter-spacing:.2em; color:var(--c-cream,#fbf3e6); }
.scr-title .title-endings .te-item{ order:3; --ec:var(--c-gold); position:relative; padding:3px 11px 3px 21px; border:1px solid rgba(217,191,138,.38); border-radius:2px;

.scr-title .title-endings .te-item::before{ content:""; position:absolute; left:8px; top:50%; width:6px; height:6px; margin-top:-3px; transform:rotate(45deg); background:var(--ec); box-shadow:0 0 6px var(--ec); }
.scr-title .title-endings .te-item.is-got{ border-color:color-mix(in srgb,var(--ec) 60%,transparent); color:var(--c-cream,#fbf3e6); }

/* 隐藏结局签：达成后用三人线双色细线描边（--trio-line 在下方 demo_trio 块定义），未达成跟普通 ？？？ 一样，不剧透 */

/* ========================================================================================
   ▼▼▼ 隐藏三人线 demo_trio「同一场雨」（真琴 × 雪乃）—— UI/演出·结衣 2026-11-04 JST ▼▼▼
   范围：CG 鉴赏隐藏格 / 回想 trio_r01·trio_rh01 / demo_trio 结局卡 / 标题通关小标记。说明见 UI_SPEC §20。
   只追加在文件末尾；不改上面任何规则。选择器以 data-c="trio"（引擎按 id 前缀自动给）为主，
   葵若加 data-hidden="1" / .is-secret / .is-ending / data-ending / data-clear-demo-trio 同样生效。
   锁定态原则：不出现任何女主色、纹章、角色名、"trio" 字样 → 看起来只是「还有一格未知」。

/* 三人线配色（UI_SPEC §20.1，11/04 结衣定）：a = 真琴夜蓝、b = 雪乃玫瑰（取自 --c-makoto / --c-yukino），中间用灯色金当「你」；
   绫香的藤紫不进三人线（她不在这条线上），只在修罗场 shura 组和三色细线里出现。-deep / -glow 给暗底和光晕用 */
:root{ --c-trio-a:var(--c-makoto,#8fb3e8); --c-trio-b:var(--c-yukino,#c97a8a); --c-trio-mid:#fbe3b4;
  --c-trio-a-deep:rgba(27,36,64,.92); --c-trio-b-deep:rgba(58,24,34,.92); --c-trio-a-glow:rgba(143,179,232,.5); --c-trio-b-glow:rgba(201,122,138,.55);
  --trio-line:linear-gradient(90deg,var(--c-trio-a),var(--c-trio-mid) 50%,var(--c-trio-b)); --d-ending-card:6400ms; }

/* ---- 1) CG 鉴赏：隐藏格 ---- */

  --emblem:url("assets/ui/svg/emblem-trio.svg"); --accent:var(--c-gold); --cover-fb:linear-gradient(120deg,#1b2440,#4a3f6e 50%,#7a3f55); }

.gal-cg-tile.is-locked[data-c="trio"],.gal-cg-tile.is-locked[data-hidden="1"],.gal-cg-tile.is-locked.is-secret{ border-color:rgba(217,191,138,.38); border-style:dashed; cursor:default; }

  content:"" !important; position:absolute; inset:0; z-index:1; width:auto; height:auto; left:0; top:0; transform:none; opacity:1; pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(232,236,255,.10) 48%,transparent 60%) -140% 0/240% 100% no-repeat; animation:gal-trio-sheen 9s ease-in-out 2s infinite; }
.gal-cg-tile.is-locked[data-c="trio"]::after,.gal-cg-tile.is-locked[data-hidden="1"]::after,.gal-cg-tile.is-locked.is-secret::after{ content:none !important; }
.gal-cg-tile.is-locked[data-c="trio"] .art::after,.gal-cg-tile.is-locked[data-hidden="1"] .art::after,.gal-cg-tile.is-locked.is-secret .art::after{ content:none !important; }   /* default.css 的「?」会和底图封缄里的「？」叠成两个 */

/* ---- B) CG 呼吸：只在 H 块（.mode-tender）里；用独立的 scale / translate 属性放在内层 .gal-cg 上，
        不碰 .layer-cg 的 transform/scale/translate（@shake / @zoom target=cg 用它们） ---- */
@keyframes gal-cg-breath{ from{ scale:1; translate:0 2px; } to{ scale:1.008; translate:0 -2px; } }
.gal-stage.mode-tender .layer-cg .gal-cg{ animation:gal-cg-breath 3.5s ease-in-out infinite alternate; transform-origin:50% 60%; }
/* 设置 cgBreath=off → 葵在舞台根（.layer-cg 的祖先）写 data-cg-breath="off" */

/* ---- C2) 回想页签：.recall-tabs > .rt-tab[data-c]，当前 .is-on；顺序 绫香 → 真琴 → 雪乃 → 修罗场(shura) → 真琴×雪乃(trio)；普通回想共用 ---- */

.recall-tabs > .rt-tab::before{ content:""; position:absolute; left:18%; right:18%; bottom:4px; height:2px; background:var(--rt-accent); transform:scaleX(0); transition:transform var(--d-ui) var(--ease-out); }

.recall-tabs > .rt-tab[data-c="ayaka"]{ --rt-accent:var(--c-ayaka); } .recall-tabs > .rt-tab[data-c="makoto"]{ --rt-accent:var(--c-makoto); }
.recall-tabs > .rt-tab[data-c="yukino"]{ --rt-accent:var(--c-yukino); } .recall-tabs > .rt-tab[data-c="shura"]{ --rt-accent:linear-gradient(90deg,var(--c-ayaka),var(--c-makoto),var(--c-yukino)); }

/* ---- C3) 设置：skipDaily / hFade / unlockAll / cgBreath 复用 .cfg-row.is-toggle .gal-toggle，无需新样式；unlockAll 未通关不渲染（不是灰行） ---- */

        放在 .layer-text 里、紧跟 .gal-textbox 之后（兄弟），位置在画面顶部居中 → 不碰对话框（y≥448）和名牌（y≈419） ---- */
.h-progress{ position:absolute; top:18px; left:50%; transform:translateX(-50%); display:flex; gap:6px; z-index:2; pointer-events:none;

.h-progress.is-recall > .hp-seg:focus-visible{ outline:2px solid var(--c-gold-hi); outline-offset:6px; }

<body><div id="gal-root"><div id="gal-loading" data-testid="loading" data-progress="0">夜樱与邻人 · 载入中…</div></div>
<script>/* 《夜樱与邻人》UI 辅助脚本 v1 —— UI/演出：结衣
   不依赖任何库。程序组可直接引用，或按 docs/UI_SPEC.md 自行实现。
   提供：GalUI.fitStage / petals / play / transition / shake / flash / typewriter / FX 时长表 */
(function (global) {
  'use strict';
  const FX = { // 默认时长（ms），与 ui.css :root 变量一致
    press: 80, hover: 150, ui: 240, sprite: 300, expr: 200, move: 500, bg: 800, fade: 1000, hold: 1000,
    black: 1000, white: 600, flash: 300, wipe: 900, cg: 800, cgdiff: 300, cgview: 450, titleCard: 3200,
    shake: 500, tender: 1.6,
    // 名场面 / 修罗场 扩展（UI_SPEC §17.7–17.9）
    dim: 600, insert: 500, closeup: 1200, focus: 700, lightning: 450, glow: 1500, rain: 1200, blush: 900, flinch: 260, lean: 420, swap: 560, spot: 320, spark: 1200, duck: 300, unduck: 1000
  };
  const W = 1280, H = 720;

  /** 16:9 等比缩放 + 黑边。viewport = .gal-viewport，stage = .gal-stage */
  function fitStage(stage, viewport) {
    viewport = viewport || stage.parentElement;
    const apply = () => {
      const cs = getComputedStyle(viewport);
      const vw = viewport.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const vh = viewport.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const s = Math.min(vw / W, vh / H);
      stage.style.setProperty('--stage-scale', s.toFixed(5));
      // 让舞台中心落在安全区内的中心
      stage.style.left = (parseFloat(cs.paddingLeft) + vw / 2) + 'px';
      stage.style.top = (parseFloat(cs.paddingTop) + vh / 2) + 'px';
      stage.dataset.scale = s.toFixed(3);
    };
    apply();
    addEventListener('resize', apply);
    addEventListener('orientationchange', () => setTimeout(apply, 120));
    if (global.visualViewport) visualViewport.addEventListener('resize', apply);
    return apply;
  }

  /** 屏幕坐标 → 舞台逻辑坐标（处理点击/长按位置用） */
  function toStage(stage, clientX, clientY) {
    const r = stage.getBoundingClientRect();
    return { x: (clientX - r.left) / r.width * W, y: (clientY - r.top) / r.height * H };
  }

  /** 生成飘落樱瓣 */
  function petals(container, n = 26, seed = 7) {
    let x = seed; const rnd = () => (x = (x * 9301 + 49297) % 233280) / 233280;
    container.classList.add('gal-petals'); container.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'petal' + (rnd() < .35 ? ' is-far' : '');
      const far = p.classList.contains('is-far');
      p.style.cssText = `--x:${(rnd() * 115 - 5).toFixed(1)}%;--dx:${(-60 - rnd() * 220).toFixed(0)}px;` +
        `--dur:${(far ? 12 : 8) + rnd() * 6}s;--delay:${(-rnd() * 14).toFixed(2)}s;--s:${(far ? .55 : .8) + rnd() * .6};--r:${(rnd() * 360) | 0}deg`;
      container.appendChild(p);
    }
  }

  /** 给元素播放一次 fx-* 类，返回 Promise（动画结束后移除类，keep=true 则保留） */
  function play(el, cls, opts = {}) {
    return new Promise(res => {
      if (opts.dur != null) el.style.setProperty('--fx-dur', opts.dur + 'ms');
      el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
      const done = () => { el.removeEventListener('animationend', onEnd); clearTimeout(t); if (!opts.keep) el.classList.remove(cls); res(); };
      const onEnd = e => { if (e.target === el) done(); };
      el.addEventListener('animationend', onEnd);
      const t = setTimeout(done, (opts.dur || 4000) * 2 + 200); // 兜底
    });
  }

  /** 转场：type = 'black' | 'white'；onMid 在全遮时调用（在这里换背景/立绘） */
  async function transition(fxLayer, type, { dur = type === 'white' ? FX.white : FX.black, hold = type === 'black' ? FX.hold : 0, onMid } = {}) {
    fxLayer.className = 'gal-fxlayer is-' + (type === 'fade' ? 'black' : type);
    await play(fxLayer, 'fx-cover', { dur: type === 'white' ? dur * .3 : dur / 2, keep: true });
    fxLayer.style.opacity = 1; fxLayer.classList.remove('fx-cover');
    if (onMid) await onMid();
    if (hold) await new Promise(r => setTimeout(r, hold));
    await play(fxLayer, 'fx-uncover', { dur: type === 'white' ? dur * .7 : dur / 2, keep: true });
    fxLayer.style.opacity = ''; fxLayer.className = 'gal-fxlayer';
  }
  /** @shake power=weak|normal|strong time=秒 target=screen|window → 传入对应元素（舞台内 .gal-shake 容器 或 .gal-textbox） */
  const shake = (el, power = 'normal', dur = FX.shake) => play(el, 'fx-shake-' + power, { dur });
  /** @flash color=white|black|red|#hex time=秒 count=n */
  async function flash(fxLayer, { color = 'white', dur = FX.flash, count = 1 } = {}) {
    const map = { white: '#fff8ee', black: '#000', red: '#c8304a' };
    fxLayer.className = 'gal-fxlayer is-color'; fxLayer.style.setProperty('--flash-color', map[color] || color);
    fxLayer.style.setProperty('--fx-count', count);
    fxLayer.style.setProperty('--fx-dur', dur + 'ms');
    await play(fxLayer, 'fx-flash'); // animationend 在全部 count 次后触发
    fxLayer.className = 'gal-fxlayer';
  }

  /** 打字机。msPerChar=0 即瞬间显示。返回 {skip(), done:Promise} */
  function typewriter(el, text, { msPerChar = 40, wait = 'line', onDone } = {}) {
    el.innerHTML = ''; el.dataset.typing = '1'; let i = 0, timer = null, finished = false, resolve;
    const done = new Promise(r => (resolve = r));
    const chars = Array.from(text);
    const end = () => {
      if (finished) return; finished = true; clearInterval(timer); delete el.dataset.typing;
      while (i < chars.length) addChar(chars[i++], true);
      const w = document.createElement('i'); w.className = 'gal-clickwait' + (wait === 'page' ? ' is-page' : ''); w.dataset.testid = 'clickwait'; el.appendChild(w);
      onDone && onDone(); resolve();
    };
    function addChar(c, instant) {
      if (c === '\n') { el.appendChild(document.createElement('br')); return; }
      const s = document.createElement('span'); s.textContent = c;
      if (!instant) s.className = 'ch'; el.appendChild(s);
    }
    if (!msPerChar) end();
    else timer = setInterval(() => { if (i >= chars.length) return end(); addChar(chars[i++]); }, msPerChar);
    return { skip: end, done };
  }
  /** 设置界面「文字速度」1~10 → ms/字；10=瞬间 */
  const textSpeedToMs = v => (v >= 10 ? 0 : Math.round(90 - (v - 1) * 9.5));
  /** 自动模式等待：基础 + 每字 */
  const autoWaitMs = (chars, v) => Math.round((2600 - v * 200) + chars * (70 - v * 5));

  /** 绫香危险值（DOC-30）：脚本变量 risk_ayaka（隐藏，不上屏）。来源 4 处各 +1：scene_05 ①、scene_08 ①、scene_08 新增冒险选项、scene_09 双方同意后的选项。
      上限 cap=4；脚本阈值 th_risk=3（main.txt）。演出三档：0–1 平静（无效果）/ 2 紧张 / ≥3 危险。
      ⚠ thRisk 必须与 main.txt 的 th_risk 一致——引擎若能读到脚本变量，请用 setDanger(stage, v, vars.th_risk) 传入，以脚本为准。 */
  const DANGER = { varName: 'risk_ayaka', thVar: 'th_risk', max: 4, cap: 4, thRisk: 3 /* 仅兜底；真值读脚本变量 th_risk（main.txt @set th_risk=3） */,
    tiers: ['calm', 'tense', 'danger'],
    // tier → 心跳 ambient（manifest 别名 heartbeat_light→heartbeat_light、heartbeat_heavy→heartbeat_heavy）
    heartbeat: [null, { ambient: 'heartbeat_light', vol: 0.45, fade: 1.2 }, { ambient: 'heartbeat_heavy', vol: 0.65, fade: 1.2 }],
    shakeOnRise: [null, null, 'weak'] };
  /** risk 值 → 档位 0 calm / 1 tense / 2 danger。tense = th-1，danger = ≥th */
  const dangerLevel = (v, th = DANGER.thRisk) => (v >= th ? 2 : v >= th - 1 ? 1 : 0);
  /** 只改演出（暗角 / 心跳脉冲 / 震屏），不显示数值。返回 {level, tier, rose, heartbeat}，引擎据此 @ambient 心跳 */
  function setDanger(stage, v, th = DANGER.thRisk) {
    v = Math.max(0, Math.min(DANGER.cap, v)); const prev = +(stage.dataset.danger || 0), level = dangerLevel(v, th);
    stage.dataset.danger = level; stage.dataset.dangerTier = DANGER.tiers[level];
    const sh = level > prev && DANGER.shakeOnRise[level]; if (sh) shake(stage.querySelector('.gal-shake'), sh);
    return { level, tier: DANGER.tiers[level], rose: level > prev, heartbeat: DANGER.heartbeat[level] };
  }
  /** scene_09「差点被发现」：approach（暗角收紧 + BGM 压低）→ stop（定格 + 文字停顿 + heartbeat_heavy）→ leave（慢慢释放）→ null 复原 */
  function nearMiss(stage, phase) { if (phase) stage.dataset.near = phase; else delete stage.dataset.near; return phase; }

  /* DOC-30/32：阈值单一来源——引擎把脚本变量表传进来，th_risk 从变量里读 */
  function setDangerFromVars(stage, vars) { const th = Number(vars && vars[DANGER.thVar]); return setDanger(stage, Number(vars && vars[DANGER.varName]) || 0, th > 0 ? th : DANGER.thRisk); }
  /* 火花（UI_SPEC §17.10；给引擎的 @spark 接口，FORMAT v1.1 尚未收录）：
     spark(layerSprite, 'ayaka', 'makoto', {loop, keep}) → 在两人中心 x 的中点、眼线高度放一个 .gal-spark（宽 = 两人距离 ×0.7）；
     x 读立绘当前的 left（跟随 theme.css 的站位），y 由 ui.css 决定（全尺寸 top 126 / is-trio 186）。
     非 loop：FX.spark 后自动移除；keep=true 不清掉已有火花（三人互看时可放两束）；spark(layer, null) = 全部清除。 */
  function spark(layer, a, b, opts = {}) {
    if (!layer) return null;
    if (!opts.keep || !a) layer.querySelectorAll('.gal-spark').forEach(x => x.remove());
    if (!a || !b) return null;
    const A = layer.querySelector(`.gal-sprite[data-id="${a}"]`), B = layer.querySelector(`.gal-sprite[data-id="${b}"]`);
    if (!A || !B) return null;
    const xa = parseFloat(getComputedStyle(A).left), xb = parseFloat(getComputedStyle(B).left);
    const k = document.createElement('i'); k.className = 'gal-spark' + (opts.loop ? ' is-loop' : ''); k.dataset.testid = 'fx-spark';
    k.style.setProperty('--sx', ((xa + xb) / 2).toFixed(1) + 'px'); k.style.setProperty('--sw', Math.round(Math.abs(xb - xa) * 0.7) + 'px');
    layer.appendChild(k);
    if (!opts.loop) setTimeout(() => k.remove(), (opts.dur || FX.spark) + 60);
    return k;
  }
  /* =====================================================================
     CG 鉴赏查看器 polish（UI_SPEC §19.8；结衣 11/04 03:37 JST）
     cgViewer(v)：把引擎 viewCg() 生成的 .cg-viewer 升级为——双层交叉淡化切差分 / 差分计数 / 隐藏 UI / 左右滑动 /
     ← → 键 / 上一张·下一张·隐藏·关闭按钮（热区 ≥ --hit-min，三态 + disabled，均有 data-testid）。
     不改引擎也能用：下面的 MutationObserver 在 .layer-modal 里出现 .cg-viewer 时自动升级；
     葵可在 viewCg() 末尾直接调 GalUI.cgViewer(v, {list, index}) 并删掉自己的 onclick（观察器见到 data-cgv 就跳过）。
     行为与引擎原版兼容：点画面 = 下一张，最后一张再点 = 关闭；右键 / Esc = 关闭。 */
  function cgViewer(v, opts = {}) {
    if (!v || v.dataset.cgv) return v; v.dataset.cgv = '1';
    const G = global.Gal || {}, D = global.GAL_DATA || {}, id = v.dataset.cg;
    const g = (D.cgs || []).find(x => x.id === id) || { id, diffs: [''] };
    const have = (G.store && G.store.glob && G.store.glob.cg && G.store.glob.cg[id]) || g.diffs;
    const list = opts.list || g.diffs.filter(d => have.includes(d));
    if (!list.length) list.push('');
    let i = opts.index != null ? opts.index : Math.max(0, [...v.querySelectorAll('.cg-dots i')].findIndex(x => x.classList.contains('on')));
    const key = (d) => (d ? `${id}_${d}` : id);
    const src = (d) => (G.img ? G.img('cg', key(d)) : '');
    const fast = () => !!(global.__galFast || (G.vm && G.vm.skipping)) || (global.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches);
    const locked = g.diffs.length - list.length;
    v.onclick = null; v.oncontextmenu = null;
    v.classList.add('cgv'); v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', 'CG 查看');
    const btn = (cls, tid, label, glyph) => `<button type="button" class="cgv-btn ${cls}" data-testid="${tid}" aria-label="${label}"><span class="cgv-glyph">${glyph}</span></button>`;
    v.innerHTML = `<div class="cgv-pics"><div class="cg-img cgv-pic is-cur"></div><div class="cg-img cgv-pic"></div></div>`
      + `<div class="cgv-ui">`
      + `<div class="cgv-top"><span class="cgv-name">${esc(id)}</span><span class="cgv-count" data-testid="gallery-viewer-count" aria-live="polite"></span></div>`
      + btn('cgv-prev', 'gallery-viewer-prev', '上一张', '‹') + btn('cgv-next', 'gallery-viewer-next', '下一张', '›')
      + `<div class="cgv-bar"><span class="cgv-dots" data-testid="gallery-viewer-dots">${list.map((_, j) => `<button type="button" class="cgv-dot" data-i="${j}" data-testid="gallery-viewer-dot" aria-label="第 ${j + 1} 张"><i></i></button>`).join('')}${'<span class="cgv-dot is-locked" aria-hidden="true"><i></i></span>'.repeat(Math.max(0, locked))}</span>`
      + btn('cgv-hide', 'gallery-viewer-hideui', '隐藏界面', '<i class="cgv-eye"></i>') + btn('cgv-close', 'gallery-viewer-close', '关闭', '×') + `</div></div>`;
    const pics = [...v.querySelectorAll('.cgv-pic')], q = (s) => v.querySelector(s);
    const setPic = (n, d) => { const u = src(d); n.style.setProperty('--art', `url('${u}')`); n.style.backgroundImage = `url('${u}')`; n.dataset.key = key(d); };
    const hud = () => {
      q('.cgv-count').innerHTML = `差分 <b>${i + 1}</b> / ${list.length}${locked > 0 ? `<em>未解锁 ${locked}</em>` : ''}`;
      v.dataset.index = i; v.dataset.count = list.length;
      v.querySelectorAll('.cgv-dot[data-i]').forEach((b, j) => { b.classList.toggle('on', j === i); b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
      q('.cgv-prev').disabled = i <= 0; q('.cgv-next').disabled = i >= list.length - 1;
    };
    let cur = 0, busy = 0;

1.txt:27","rid":"hb:makoto_h01_01#6","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的喉咙动了一下。","src":"script/h_blocks/makoto_h01_01.txt:28","rid":"hb:makoto_h01_01#7","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……问这种问题，扣分。","src":"script/h_blocks/makoto_h01_01.txt:29","rid":"hb:makoto_h01_01#8","expr":"shy","voice":"makoto_h01_0030","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……可以。","src":"script/h_blocks/makoto_h01_01.txt:30","rid":"hb:makoto_h01_01#9","expr":"shy","voice":"makoto_h01_0031","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"指尖碰到那颗小小的贝母扣。她颈侧很烫，脉搏一下一下地撞着我的指节。","src":"script/h_blocks/makoto_h01_01.txt:31","rid":"hb:makoto_h01_01#10","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"一颗。她闭上了眼睛。","src":"script/h_blocks/makoto_h01_01.txt:32","rid":"hb:makoto_h01_01#11","hb":"makoto_h01_01"},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:33","name":"cloth_rustle_a","vol":0.35,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"两颗，三颗。丝绸从中间分开，露出锁骨，和比西装下看起来更丰满的胸口。","src":"script/h_blocks/makoto_h01_01.txt:34","rid":"hb:makoto_h01_01#12","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"黑色的内衣，窄窄的蕾丝边，没有一点多余的装饰——很像她。","src":"script/h_blocks/makoto_h01_01.txt:35","rid":"hb:makoto_h01_01#13","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不是为了今天才穿的。别得意。","src":"script/h_blocks/makoto_h01_01.txt:36","rid":"hb:makoto_h01_01#14","expr":"annoyed","voice":"makoto_h01_0032","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"嗯。","src":"script/h_blocks/makoto_h01_01.txt:37","rid":"hb:makoto_h01_01#15","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你那个『嗯』，一点都不像相信的样子。","src":"script/h_blocks/makoto_h01_01.txt:38","rid":"hb:makoto_h01_01#16","expr":"shy","voice":"makoto_h01_0033","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻她的锁骨。她的手抓住我的肩，指甲隔着衬衫陷进来。","src":"script/h_blocks/makoto_h01_01.txt:39","rid":"hb:makoto_h01_01#17","hb":"makoto_h01_01"},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:40","name":"kiss_c","vol":0.22,"loop":false,"pan":-0.1},{"t":"breath","src":"script/h_blocks/makoto_h01_01.txt:41","level":2,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"解开背后的搭扣时，她下意识抬起手臂想挡，又在半空停住，慢慢放下，像在对自己下命令。","src":"script/h_blocks/makoto_h01_01.txt:42","rid":"hb:makoto_h01_01#18","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不挡。今天，不挡。","src":"script/h_blocks/makoto_h01_01.txt:43","rid":"hb:makoto_h01_01#19","expr":"shy","voice":"makoto_h01_0034","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"沉甸甸的乳房落进我的掌心。白得晃眼，顶端是浅浅的豆沙色，在我的拇指下一点点硬起来。","src":"script/h_blocks/makoto_h01_01.txt:44","rid":"hb:makoto_h01_01#20","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她咬着唇，不出声。可我低头含住那里的时候，她的腰猛地一弹。","src":"script/h_blocks/makoto_h01_01.txt:45","rid":"hb:makoto_h01_01#21","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……等、……不是……那里不行……","src":"script/h_blocks/makoto_h01_01.txt:46","rid":"hb:makoto_h01_01#22","expr":"shy","voice":"makoto_h01_0035","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"要停吗？","src":"script/h_blocks/makoto_h01_01.txt:47","rid":"hb:makoto_h01_01#23","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……没让你停。……笨蛋。","src":"script/h_blocks/makoto_h01_01.txt:48","rid":"hb:makoto_h01_01#24","expr":"annoyed","voice":"makoto_h01_0036","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"铅笔裙的拉链在侧面。拉下来的声音很小，在雨声里却清楚得要命。","src":"script/h_blocks/makoto_h01_01.txt:49","rid":"hb:makoto_h01_01#25","hb":"makoto_h01_01"},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:50","name":"cloth_off_a","vol":0.35,"loop":false,"pan":0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"裙子沿着她修长的腿滑下去。丝袜的边缘勒着丰腴的大腿，留下一道浅浅的红痕。","src":"script/h_blocks/makoto_h01_01.txt:51","rid":"hb:makoto_h01_01#26","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我的手掌贴上她大腿内侧。她并紧了一下——然后深吸一口气，自己分开了。","src":"script/h_blocks/makoto_h01_01.txt:52","rid":"hb:makoto_h01_01#27","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"隔着最后一层薄薄的布料，那里已经湿透，烫得惊人。","src":"script/h_blocks/makoto_h01_01.txt:53","rid":"hb:makoto_h01_01#28","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……别说出来。说出来，我就回隔壁去。","src":"script/h_blocks/makoto_h01_01.txt:54","rid":"hb:makoto_h01_01#29","expr":"shy","voice":"makoto_h01_0037","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……真琴。","src":"script/h_blocks/makoto_h01_01.txt:55","rid":"hb:makoto_h01_01#30","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……叫名字也不行。……犯规。","src":"script/h_blocks/makoto_h01_01.txt:56","rid":"hb:makoto_h01_01#31","expr":"shy","voice":"makoto_h01_0038","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"手指拨开布料滑进去的一瞬间，她整个人缩了一下，抓住我的手腕——不是推开，是按住。","src":"script/h_blocks/makoto_h01_01.txt:57","rid":"hb:makoto_h01_01#32","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那么软，那么湿。指腹轻轻碾过最敏感的那一点，她的膝盖就开始发抖。","src":"script/h_blocks/makoto_h01_01.txt:58","rid":"hb:makoto_h01_01#33","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那个在会议上一句话就能让整个房间安静下来的人，此刻把脸埋进我的肩膀，一声一声地，压着气喘。","src":"script/h_blocks/makoto_h01_01.txt:59","rid":"hb:makoto_h01_01#34","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……{hero}。……{hero}……","src":"script/h_blocks/makoto_h01_01.txt:60","rid":"hb:makoto_h01_01#35","expr":"shy","voice":"makoto_h01_0039","blip":"off","nameCall":["hero"],"hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她伸手来解我的皮带。手指抖得对不准，她低声骂了自己一句。","src":"script/h_blocks/makoto_h01_01.txt:61","rid":"hb:makoto_h01_01#36","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……平时，明明什么都做得好……","src":"script/h_blocks/makoto_h01_01.txt:62","rid":"hb:makoto_h01_01#37","expr":"annoyed","voice":"makoto_h01_0040","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我握住她的手，和她一起解开。","src":"script/h_blocks/makoto_h01_01.txt:63","rid":"hb:makoto_h01_01#38","hb":"makoto_h01_01"},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:64","name":"cloth_off_c","vol":0.3,"loop":false,"pan":-0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"衣服一件一件落在地上。赤裸的胸口贴在一起，她的心跳快得像要撞破那层薄薄的皮肤。","src":"script/h_blocks/makoto_h01_01.txt:65","rid":"hb:makoto_h01_01#39","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，我们都停了下来。","src":"script/h_blocks/makoto_h01_01.txt:66","rid":"hb:makoto_h01_01#40","hb":"makoto_h01_01"},{"t":"breath","src":"script/h_blocks/makoto_h01_01.txt:67","level":1,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"窗外的天空，无声地白了一瞬。","src":"script/h_blocks/makoto_h01_01.txt:68","rid":"hb:makoto_h01_01#41","hb":"makoto_h01_01"},{"t":"hstage","src":"script/h_blocks/makoto_h01_01.txt:70","stage":"end","char":"makoto","fade":1.5},{"t":"hb_end","id":"makoto_h01_01","src":"script/pilot_makoto/pm_m1.txt:140"},{"t":"se","src":"script/pilot_makoto/pm_m1.txt:143","name":"thunder","vol":1,"loop":false},{"t":"flash","src":"script/pilot_makoto/pm_m1.txt:144","color":"white","time":0.3,"count":1},{"t":"say","who":null,"disp":null,"br":null,"text":"雷声，近得像就在窗外。","src":"script/pilot_makoto/pm_m1.txt:145","rid":"pm_m1_rh01#44"},{"t":"say","who":null,"disp":null,"br":null,"text":"她攥紧了我的手。","src":"script/pilot_makoto/pm_m1.txt:146","rid":"pm_m1_rh01#45"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不是怕打雷。是怕，你停下来。","src":"script/pilot_makoto/pm_m1.txt:147","rid":"pm_m1_rh01#46","expr":"shy","voice":"makoto_ph1_0021","blip":"off"},{"t":"hb_begin","id":"makoto_h01_02","src":"script/pilot_makoto/pm_m1.txt:152","stages":[{"stage":"build","label":"渐入","pc":593}]},{"t":"ambient","src":"script/h_blocks/makoto_h01_02.txt:13","name":"storm_loop","vol":0.15,"fade":3,"muffle":"corridor"},{"t":"hstage","src":"script/h_blocks/makoto_h01_02.txt:14","stage":"build","char":"makoto","fade":null},{"t":"bgm","src":"script/h_blocks/makoto_h01_02.txt:16","name":"h_scene","vol":0.5,"fade":3},{"t":"say","who":"hero","disp":null,"br":"「","text":"我不会停。","src":"script/h_blocks/makoto_h01_02.txt:17","rid":"hb:makoto_h01_02#0","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"除非你说停。","src":"script/h_blocks/makoto_h01_02.txt:18","rid":"hb:makoto_h01_02#1","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不会说的。","src":"script/h_blocks/makoto_h01_02.txt:19","rid":"hb:makoto_h01_02#2","expr":"shy","voice":"makoto_h01_0041","blip":"off","hb":"makoto_h01_02"},{"t":"se","src":"script/h_blocks/makoto_h01_02.txt:20","name":"sheets_rustle","vol":0.35,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"她躺下去，黑发散在我的枕头上。没有眼镜，没有扣到顶的衬衫。灰蓝色的眼睛湿漉漉的，直直地看着我。","src":"script/h_blocks/makoto_h01_02.txt:21","rid":"hb:makoto_h01_02#3","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她勾住我的脖子，把我拉下去。","src":"script/h_blocks/makoto_h01_02.txt:22","rid":"hb:makoto_h01_02#4","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……快点。……不要让我，说第二遍。","src":"script/h_blocks/makoto_h01_02.txt:23","rid":"hb:makoto_h01_02#5","expr":"annoyed","voice":"makoto_h01_0042","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我抵上去。前端碰到那片湿热的时候，她的呼吸停了一拍。","src":"script/h_blocks/makoto_h01_02.txt:24","rid":"hb:makoto_h01_02#6","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，慢慢地推进去。","src":"script/h_blocks/makoto_h01_02.txt:25","rid":"hb:makoto_h01_02#7","hb":"makoto_h01_02"},{"t":"se","src":"script/h_blocks/makoto_h01_02.txt:26","name":"sheets_b","vol":0.3,"loop":false},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯、……啊……","src":"script/h_blocks/makoto_h01_02.txt:27","rid":"hb:makoto_h01_02#8","expr":"shy","voice":"makoto_h01_0043","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"很紧。她的身体像是忘了该怎么接纳一个人，又像是记得太清楚。","src":"script/h_blocks/makoto_h01_02.txt:28","rid":"hb:makoto_h01_02#9","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我停在一半，吻她的眼角。","src":"script/h_blocks/makoto_h01_02.txt:29","rid":"hb:makoto_h01_02#10","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"疼吗？","src":"script/h_blocks/makoto_h01_02.txt:30","rid":"hb:makoto_h01_02#11","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不疼。……只是、太满了……","src":"script/h_blocks/makoto_h01_02.txt:31","rid":"hb:makoto_h01_02#12","expr":"shy","voice":"makoto_h01_0044","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的腿缠上来，脚跟抵着我的腰，往里压。","src":"script/h_blocks/makoto_h01_02.txt:32","rid":"hb:makoto_h01_02#13","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……别停在那里。……全部。","src":"script/h_blocks/makoto_h01_02.txt:33","rid":"hb:makoto_h01_02#14","expr":"shy","voice":"makoto_h01_0045","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"直到完全进去。她长长地、颤抖地吐出一口气。","src":"script/h_blocks/makoto_h01_02.txt:34","rid":"hb:makoto_h01_02#15","hb":"makoto_h01_02"},{"t":"cg","src":"script/h_blocks/makoto_h01_02.txt:35","id":"makoto_h01","diff":"b","trans":"crossfade","time":1.2,"hb":"makoto_h01_02"},{"t":"zoom","src":"script/h_blocks/makoto_h01_02.txt:36","target":"cg","time":5,"ease":"inout","wait":false,"scale":1.05,"x":0.5,"y":0.5},{"t":"say","who":null,"disp":null,"br":null,"text":"外套还落在地上。她的手找到我的手，十指扣紧，按在枕头上。","src":"script/h_blocks/makoto_h01_02.txt:37","rid":"hb:makoto_h01_02#16","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"枕边，她的眼镜折好放着，镜片映着窗外的雨。旁边是她的手表。","src":"script/h_blocks/makoto_h01_02.txt:38","rid":"hb:makoto_h01_02#17","hb":"makoto_h01_02"},{"t":"ambient","src":"script/h_blocks/makoto_h01_02.txt:39","name":"clock_tick","vol":0.18,"fade":0.8},{"t":"say","who":null,"disp":null,"br":null,"text":"雨声里，秒针一格一格地走。调准了的，一秒也不快。","src":"script/h_blocks/makoto_h01_02.txt:40","rid":"hb:makoto_h01_02#18","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"而她的心跳，快得根本追不上它。","src":"script/h_blocks/makoto_h01_02.txt:41","rid":"hb:makoto_h01_02#19","hb":"makoto_h01_02"},{"t":"ambient","src":"script/h_blocks/makoto_h01_02.txt:42","name":"rhythm_creak_l1","vol":0.2,"fade":2,"muffle":2500},{"t":"breath","src":"script/h_blocks/makoto_h01_02.txt:43","level":3,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"我开始动。很慢。每一次退出来，她的内里都绞着不放；每一次深入，她的背就离开床单一点。","src":"script/h_blocks/makoto_h01_02.txt:44","rid":"hb:makoto_h01_02#20","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯……嗯、……{hero}……","src":"script/h_blocks/makoto_h01_02.txt:45","rid":"hb:makoto_h01_02#21","expr":"shy","voice":"makoto_h01_0046","blip":"off","nameCall":["hero"],"hb":"makoto_h01_02"},{"t":"cg","src":"script/h_blocks/makoto_h01_02.txt:46","id":"makoto_h01","diff":"b_e1","trans":"crossfade","time":1.4,"hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不许、看我的脸……","src":"script/h_blocks/makoto_h01_02.txt:47","rid":"hb:makoto_h01_02#22","expr":"annoyed","voice":"makoto_h01_0047","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"想看。","src":"script/h_blocks/makoto_h01_02.txt:48","rid":"hb:makoto_h01_02#23","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……讨厌。……讨厌你……","src":"script/h_blocks/makoto_h01_02.txt:49","rid":"hb:makoto_h01_02#24","expr":"shy","voice":"makoto_h01_0048","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"嘴上这样说，扣着我的手指却收得更紧了。","src":"script/h_blocks/makoto_h01_02.txt:50","rid":"hb:makoto_h01_02#25","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我顶得更深。湿润的声音混进雨声里，她自己也听见了，耳朵一路红到脖子。","src":"script/h_blocks/makoto_h01_02.txt:51","rid":"hb:makoto_h01_02#26","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她别过脸，咬住自己的手背，把声音咽回去。","src":"script/h_blocks/makoto_h01_02.txt:52","rid":"hb:makoto_h01_02#27","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我把那只手轻轻拿开，扣回枕边。","src":"script/h_blocks/makoto_h01_02.txt:53","rid":"hb:makoto_h01_02#28","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"不用忍。这里，只有我听得见。","src":"script/h_blocks/makoto_h01_02.txt:54","rid":"hb:makoto_h01_02#29","hb":"makoto_h01_02"},{"t":"breath","src":"script/h_blocks/makoto_h01_02.txt:55","level":4,"fade":2},{"t":"ambient","src":"script/h_blocks/makoto_h01_02.txt:56","name":"rhythm_creak_l2","vol":0.24,"fade":2,"xfade":"rhythm_creak_l1","muffle":3500},{"t":"bgm","src":"script/h_blocks/makoto_h01_02.txt:57","name":"h_scene","vol":0.55,"fade":2},{"t":"cg","src":"script/h_blocks/makoto_h01_02.txt:58","id":"makoto_h01","diff":"b_e2","trans":"crossfade","time":1.3,"hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的腰开始跟着我的节奏抬起来。先是犹豫的，然后越来越诚实。","src":"script/h_blocks/makoto_h01_02.txt:59","rid":"hb:makoto_h01_02#30","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"丰满的胸口随着每一次撞击摇晃，汗湿的发丝贴在额头上。那个永远一丝不乱的椎名真琴，此刻乱得一塌糊涂。","src":"script/h_blocks/makoto_h01_02.txt:60","rid":"hb:makoto_h01_02#31","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……那里……再、……再一下……","src":"script/h_blocks/makoto_h01_02.txt:61","rid":"hb:makoto_h01_02#32","expr":"shy","voice":"makoto_h01_0049","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"这里？","src":"script/h_blocks/makoto_h01_02.txt:62","rid":"hb:makoto_h01_02#33","hb":"makoto_h01_02"},{"t":"se","src":"script/h_blocks/makoto_h01_02.txt:63","name":"sheets_c","vol":0.3,"loop":false,"pan":0.2},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯！……就是、那里……","src":"script/h_blocks/makoto_h01_02.txt:64","rid":"hb:makoto_h01_02#34","expr":"shy","voice":"makoto_h01_0050","blip":"off","hb":"makoto_h01_02"},{"t":"cg","src":"script/h_blocks/makoto_h01_02.txt:65","id":"makoto_h01","diff":"b_e3","trans":"crossfade","time":1.2,"hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她仰起脖子。喉咙里漏出来的，再也不是会议室里那种干脆的短句，而是又软又甜、拖着尾音的呜咽。","src":"script/h_blocks/makoto_h01_02.txt:66","rid":"hb:makoto_h01_02#35","hb":"makoto_h01_02"},{"t":"se","src":"script/h_blocks/makoto_h01_02.txt:67","name":"thunder_distant","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"雷声滚过去。她连眼睛都没有眨。","src":"script/h_blocks/makoto_h01_02.txt:68","rid":"hb:makoto_h01_02#36","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……我说谎了。","src":"script/h_blocks/makoto_h01_02.txt:69","rid":"hb:makoto_h01_02#37","expr":"soft","voice":"makoto_h01_0051","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"『别误会』也好，『才没有』也好……全都是，骗你的。","src":"script/h_blocks/makoto_h01_02.txt:70","rid":"hb:makoto_h01_02#38","expr":"soft","voice":"makoto_h01_0052","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……想要你。从隔着那面墙的时候起……就一直想要。","src":"script/h_blocks/makoto_h01_02.txt:71","rid":"hb:makoto_h01_02#39","expr":"soft","voice":"makoto_h01_0053","blip":"off","hb":"makoto_h01_02"},{"t":"cg","src":"script/h_blocks/makoto_h01_02.txt:72","id":"makoto_h01","diff":"b_e4","trans":"crossfade","time":1.2,"hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看着我，嘴角在发抖。想撑出那个单边的、克制的半笑，却怎么也撑不住。","src":"script/h_blocks/makoto_h01_02.txt:73","rid":"hb:makoto_h01_02#40","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"防线，就在这一句里，彻底塌了。","src":"script/h_blocks/makoto_h01_02.txt:74","rid":"hb:makoto_h01_02#41","hb":"makoto_h01_02"},{"t":"ambientstop","src":"script/h_blocks/makoto_h01_02.txt:75","name":"clock_tick","fade":1.5},{"t":"zoom","src":"script/h_blocks/makoto_h01_02.txt:76","target":"cg","time":1.2,"ease":"inout","wait":true,"reset":true,"all":false},{"t":"hstage","src":"script/h_blocks/makoto_h01_02.txt:78","stage":"end","char":"makoto","fade":1.5},{"t":"hb_end","id":"makoto_h01_02","src":"script/pilot_makoto/pm_m1.txt:152"},{"t":"cg","src":"script/pilot_makoto/pm_m1.txt:154","id":"makoto_h01","diff":"b","trans":"crossfade","time":null},{"t":"bgm","src":"script/pilot_makoto/pm_m1.txt:157","name":"h_scene","vol":0.2,"fade":1,"intensity":"none"},{"t":"se","src":"script/pilot_makoto/pm_m1.txt:158","name":"phone_vibe","vol":0.8,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"矮桌上，被扣着的手机震了起来。","src":"script/pilot_makoto/pm_m1.txt:159","rid":"pm_m1_rh01#47"},{"t":"say","who":null,"disp":null,"br":null,"text":"屏幕的光，从桌面边缘漏出来。「隆之」。","src":"script/pilot_makoto/pm_m1.txt:160","rid":"pm_m1_rh01#48"},{"t":"say","who":null,"disp":null,"br":null,"text":"她只瞥了一眼。","src":"script/pilot_makoto/pm_m1.txt:161","rid":"pm_m1_rh01#49"},{"t":"say","who":null,"disp":null,"br":null,"text":"没有犹豫，也没有接。她伸手，长按电源键。","src":"script/pilot_makoto/pm_m1.txt:162","rid":"pm_m1_rh01#50"},{"t":"se","src":"script/pilot_makoto/pm_m1.txt:163","name":"page","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"屏幕，暗了。","src":"script/pilot_makoto/pm_m1.txt:164","rid":"pm_m1_rh01#51"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……已经不是需要接的电话了。","src":"script/pilot_makoto/pm_m1.txt:165","rid":"pm_m1_rh01#52","expr":"normal","voice":"makoto_ph1_0022","blip":"off"},{"t":"choice","src":"script/pilot_makoto/pm_m1.txt:166","opts":[{"text":"「……要停下吗？」","fx":null,"target":null,"cond":null,"bo ","disp":null,"br":"「","text":"我知道。","src":"script/h_blocks/makoto_h02_02.txt:20","rid":"hb:makoto_h02_02#2","hb":"makoto_h02_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"知道就别说出来！","src":"script/h_blocks/makoto_h02_02.txt:21","rid":"hb:makoto_h02_02#3","expr":"annoyed","voice":"makoto_h02_0012","blip":"off","hb":"makoto_h02_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她瞪了我一眼。可那一眼又湿又软，一点威力都没有。","src":"script/h_blocks/makoto_h02_02.txt:22","rid":"hb:makoto_h02_02#4","hb":"makoto_h02_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，她自己伸手来解我的皮带。这一次，手指一点都没抖。","src":"script/h_blocks/makoto_h02_02.txt:24","rid":"hb:makoto_h02_02#5","hb":"makoto_h02_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……还剩二十分钟。效率，懂吗。","src":"script/h_blocks/makoto_h02_02.txt:25","rid":"hb:makoto_h02_02#6","expr":"smile","voice":"makoto_h02_0013","blip":"off","hb":"makoto_h02_02"},{"t":"se","src":"script/h_blocks/makoto_h02_02.txt:26","name":"cloth_off_c","vol":0.3,"loop":false,"pan":-0.2},{"t":"say","who":null,"disp":null,"br":null,"text":"她背靠隔断板，一条腿勾上我的腰，把我拉到最近的地方。","src":"script/h_blocks/makoto_h02_02.txt:27","rid":"hb:makoto_h02_02#7","hb":"makoto_h02_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……进来。{hero}，我想要你。","src":"script/h_blocks/makoto_h02_02.txt:28","rid":"hb:makoto_h02_02#8","expr":"shy","voice":"makoto_h02_0014","blip":"off","nameCall":["hero"],"hb":"makoto_h02_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"前端抵上去，一点一点推进。她的指甲陷进我的背，脚尖绷得笔直。","src":"script/h_blocks/makoto_h02_02.txt:29","rid":"hb:makoto_h02_02#9","hb":"makoto_h02_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……啊、……好满……","src":"script/h_blocks/makoto_h02_02.txt:30","rid":"hb:makoto_h02_02#10","expr":"shy","voice":"makoto_h02_0015","blip":"off","hb":"makoto_h02_02"},{"t":"breath","src":"script/h_blocks/makoto_h02_02.txt:31","level":3,"fade":2},{"t":"ambient","src":"script/h_blocks/makoto_h02_02.txt:32","name":"rhythm_creak_l1","vol": _tidy_wall_green","trans":"black","time":null,"hold":0.8,"keep":false},{"t":"bgm","src":"script/pilot_makoto/pm_m3.txt:14","name":"daily","vol":1,"fade":1.5},{"t":"ambient","src":"script/pilot_makoto/pm_m3.txt:15","name":"night_room_amb","vol":0.25,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"黄金周。四月二十九日。","src":"script/pilot_makoto/pm_m3.txt:17","rid":"pm_m3_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"她周六照样上班。周日，在墙那边看一整天的书。","src":"script/pilot_makoto/pm_m3.txt:18","rid":"pm_m3_start#1"},{"t":"say","who":null,"disp":null,"br":null,"text":"那天晚上，她站在我门口，宣布了一件事。","src":"script/pilot_makoto/pm_m3.txt:19","rid":"pm_m3_start#2"},{"t":"chara","src":"script/pilot_makoto/pm_m3.txt:20","id":"makoto","expr":"normal","outfit":"suitnoring","pos":"center","trans":"fade","time":null},{"t":"chara","src":"script/pilot_makoto/pm_m3.txt:21","id":"makoto","expr":"smug","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"makoto","disp":null,"br":"「","text":"做饭这种事，看一遍教程就会了。","src":"script/pilot_makoto/pm_m3.txt:22","rid":"pm_m3_start#3","expr":"smug","voice":"makoto_ph3_0001"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"这次，换我做汤给你。","src":"script/pilot_makoto/pm_m3.txt:23","rid":"pm_m3_start#4","expr":"smug","voice":"makoto_ph3_0002","emph":"on"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……椎名小姐，上次做饭是什么时候？","src":"script/pilot_makoto/pm_m3.txt:24","rid":"pm_m3_start#5"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"真琴。……还有，不许问那种问题。","src":"script/pilot_makoto/pm_m3.txt:25","rid":"pm_m3_start#6","expr":"annoyed","voice":"makoto_ph3_0003"},{"t":"hide","src":"script/pilot_makoto/pm_m3.txt:26","id":"makoto","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"五月二日，星期六。晚上八点。","src":"script/pilot_makoto/pm_m3.txt:28","rid":"pm_m3_start#7"},{"t":"se","src":"script/pilot_makoto/pm_m3.txt:29","name":"wall_thud","vol":0.3,"loop":false,"pan":0.5,"muffle":"wall"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……那个。盐放多了的话，加什么？","src":"script/pilot_makoto/pm_m3.txt:30","rid":"pm_m3_start#8","voice":"makoto_ph3_0004","via":"wall"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……水？还是土豆？","src":"script/pilot_makoto/pm_m3.txt:31","rid":"pm_m3_start#9"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……顺便，来尝一下。只是请你试味。","src":"script/pilot_makoto/pm_m3.txt:32","rid":"pm_m3_start#10","voice":"makoto_ph3_0005","via":"wall"},{"t":"ambientstop","src":"script/pilot_makoto/pm_m3.txt:33","name":"night_room_amb","fade":1},{"t":"label","src":"script/pilot_makoto/pm_m3.txt:35","name":"pm_m3_rh03"},{"t":"recall","src":"script/pilot_makoto/pm_m3.txt:36","id":"pm_rh03","title":"咸了的汤","chara":"makoto","type":"h","thumb":"makoto_h03","end":1238},{"t":"bg","src":"script/pilot_makoto/pm_m3.txt:38","id":"room_makoto_night_green","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/pilot_makoto/pm_m3.txt:39","name":"makoto_theme","vol":1,"fade":1.5},{"t":"ambient","src":"script/pilot_makoto/pm_m3.txt:40","name":"night_room_amb","vol":0.2,"fade":1.5},{"t":"se","src":"script/pilot_makoto/pm_m3.txt:41","name":"door_open","vol":1,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"一开门，焦味就扑了过来。","src":"script/pilot_makoto/pm_m3.txt:42","rid":"pm_m3_rh03#0"},{"t":"cg","src":"script/pilot_makoto/pm_m3.txt:43","id":"makoto_h03","diff":null,"trans":"crossfade","time":1},{"t":"say","who":null,"disp":null,"br":null,"text":"厨房一片狼藉。一口锅已经焦了。她系着围裙，握着汤勺。","src":"script/pilot_makoto/pm_m3.txt:44","rid":"pm_m3_rh03#1"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……教程有问题。","src":"script/pilot_makoto/pm_m3.txt:45","rid":"pm_m3_rh03#2","expr":"annoyed","voice":"makoto_ph3_0006"},{"t":"say","who":"hero","disp":null,"br":"「","text":"第二锅呢？","src":"script/pilot_makoto/pm_m3.txt:46","rid":"pm_m3_rh03#3"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"在热。这一锅，是成功的。……大概。","src":"script/pilot_makoto/pm_m3.txt:47","rid":"pm_m3_rh03#4","expr":"normal","voice":"makoto_ph3_0007"},{"t":"say","who":null,"disp":null,"br":null,"text":"她舀了一勺，递到我嘴边。","src":"script/pilot_makoto/pm_m3.txt:48","rid":"pm_m3_rh03#5"},{"t":"if","src":"script/pilot_makoto/pm_m3.txt:49","c":{"o":"==","a":{"v":"rb_mk3_soup"},"b":{"c":"lie"}},"f":1060},{"t":"set","src":"script/pilot_makoto/pm_m3.txt:50","fx":[{"n":"pm_f_mk3_lie","op":"=","val":true}]},{"t":"goto","to":1066,"src":"script/pilot_makoto/pm_m3.txt:51"},{"t":"if","c":{"o":"==","a":{"v":"rb_mk3_soup"},"b":{"c":"honest"}},"f":1063,"src":"script/pilot_makoto/pm_m3.txt:51"},{"t":"set","src":"script/pilot_makoto/pm_m3.txt:52","fx":[{"n":"pm_f_mk3_honest","op":"=","val":true}]},{"t":"goto","to":1066,"src":"script/pilot_makoto/pm_m3.txt:53"},{"t":"choice","src":"script/pilot_makoto/pm_m3.txt:54","opts":[{"text":"「好喝。」","fx":[{"n":"pm_f_mk3_lie","op":"=","val":true}],"target":null,"cond":null,"body":1064,"src":"script/pilot_makoto/pm_m3.txt:55"},{"text":"「……咸了。」","fx":[{"n":"pm_f_mk3_honest","op":"=","val":true}],"target":null,"cond":null,"body":1065,"src":"script/pilot_makoto/pm_m3.txt:56"}],"end":1066},{"t":"goto","to":1066,"src":"script/pilot_makoto/pm_m3.txt:56"},{"t":"goto","to":1066,"src":"script/pilot_makoto/pm_m3.txt:57"},{"t":"if","src":"script/pilot_makoto/pm_m3.txt:59","c":{"v":"pm_f_mk3_honest"},"f":1074},{"t":"set","src":"script/pilot_makoto/pm_m3.txt:60","fx":[{"n":"g_seen_pm_rh03_honest","op":"=","val":true}]},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……咸了？","src":"script/pilot_makoto/pm_m3.txt:61","rid":"pm_m3_rh03#6","expr":"surprised","voice":"makoto_ph3_0008"},{"t":"say","who":null,"disp":null,"br":null,"text":"她自己尝了一口。然后，笑出了声。","src":"script/pilot_makoto/pm_m3.txt:62","rid":"pm_m3_rh03#7"},{"t":"cg","src":"script/pilot_makoto/pm_m3.txt:63","id":"makoto_h03","diff":"a2","trans":"crossfade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"额头抵着额头。两个人，一起笑。","src":"script/pilot_makoto/pm_m3.txt:64","rid":"pm_m3_rh03#8"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……真的，咸死了。","src":"script/pilot_makoto/pm_m3.txt:65","rid":"pm_m3_rh03#9","expr":"soft","voice":"makoto_ph3_0009"},{"t":"goto","to":1080,"src":"script/pilot_makoto/pm_m3.txt:66"},{"t":"set","src":"script/pilot_makoto/pm_m3.txt:67","fx":[{"n":"g_seen_pm_rh03_lie","op":"=","val":true}]},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……骗人。脸上写着『咸』。","src":"script/pilot_makoto/pm_m3.txt:68","rid":"pm_m3_rh03#10","expr":"annoyed","voice":"makoto_ph3_0010"},{"t":"say","who":null,"disp":null,"br":null,"text":"她摘下眼镜，放在碗旁边。","src":"script/pilot_makoto/pm_m3.txt:69","rid":"pm_m3_rh03#11"},{"t":"cg","src":"script/pilot_makoto/pm_m3.txt:70","id":"makoto_h03","diff":"a","trans":"crossfade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"先吻上来的，还是她。","src":"script/pilot_makoto/pm_m3.txt:71","rid":"pm_m3_rh03#12"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……骗人的嘴，要堵上。","src":"script/pilot_makoto/pm_m3.txt:72","rid":"pm_m3_rh03#13","expr":"shy","voice":"makoto_ph3_0011"},{"t":"say","who":"hero","disp":null,"br":"「","text":"今晚……可以留下吗？","src":"script/pilot_makoto/pm_m3.txt:74","rid":"pm_m3_rh03#14"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"可以。是我想让你留下。","src":"script/pilot_makoto/pm_m3.txt:75","rid":"pm_m3_rh03#15","expr":"shy","voice":"makoto_ph3_0012"},{"t":"ambient","src":"script/pilot_makoto/pm_m3.txt:76","name":"night_room_amb","vol":0.1,"fade":1.5},{"t":"bgm","src":"script/pilot_makoto/pm_m3.txt:77","name":"h_scene","vol":0.4,"fade":2,"intensity":"low"},{"t":"hb_begin","id":"makoto_h03_01","src":"script/pilot_makoto/pm_m3.txt:85","stages":[{"stage":"intro","label":"前戏","pc":1085}]},{"t":"hstage","src":"script/h_blocks/makoto_h03_01.txt:15","stage":"intro","char":"makoto","fade":null},{"t":"cg","src":"script/h_blocks/makoto_h03_01.txt:16","id":"makoto_h03","diff":"b","trans":"crossfade","time":1.2,"hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"被褥是她刚从壁橱里拖出来的，铺得歪歪扭扭。台灯拧到了最暗的一档。","src":"script/h_blocks/makoto_h03_01.txt:17","rid":"hb:makoto_h03_01#0","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"厨房那边，还飘着一点焦糊的味道。","src":"script/h_blocks/makoto_h03_01.txt:18","rid":"hb:makoto_h03_01#1","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她还系着围裙。衬衫的领口敞着——在家里，她不扣第一颗扣子。","src":"script/h_blocks/makoto_h03_01.txt:19","rid":"hb:makoto_h03_01#2","hb":"makoto_h03_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"围裙，可以解开吗？","src":"script/h_blocks/makoto_h03_01.txt:20","rid":"hb:makoto_h03_01#3","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……围裙是做饭用的。不是给你拆的。","src":"script/h_blocks/makoto_h03_01.txt:21","rid":"hb:makoto_h03_01#4","expr":"annoyed","voice":"makoto_h03_0001","blip":"off","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……可以。快点解，后面的结、我自己够不到。","src":"script/h_blocks/makoto_h03_01.txt:22","rid":"hb:makoto_h03_01#5","expr":"shy","voice":"makoto_h03_0002","blip":"off","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她系的是个死结。我解了整整半分钟，她憋笑憋得肩膀一直在抖。","src":"script/h_blocks/makoto_h03_01.txt:23","rid":"hb:makoto_h03_01#6","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……笨手笨脚。跟我的汤一样。","src":"script/h_blocks/makoto_h03_01.txt:24","rid":"hb:makoto_h03_01#7","expr":"smile","voice":"makoto_h03_0003","blip":"off","hb":"makoto_h03_01"},{"t":"se","src":"script/h_blocks/makoto_h03_01.txt:25","name":"cloth_rustle_a","vol":0.35,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"围裙落下去。剩下的扣子，这次是她自己一颗一颗解开的。","src":"script/h_blocks/makoto_h03_01.txt:26","rid":"hb:makoto_h03_01#8","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她低着头不看我，动作却快得惊人，像在赶一份今晚必须交的报告。","src":"script/h_blocks/makoto_h03_01.txt:27","rid":"hb:makoto_h03_01#9","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"衬衫滑下肩膀。里面什么都没穿。","src":"script/h_blocks/makoto_h03_01.txt:28","rid":"hb:makoto_h03_01#10","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她抓起我的手，先一步，按在了自己的胸口上。","src":"script/h_blocks/makoto_h03_01.txt:29","rid":"hb:makoto_h03_01#11","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……今天，换我来说。……摸这里。","src":"script/h_blocks/makoto_h03_01.txt:30","rid":"hb:makoto_h03_01#12","expr":"shy","voice":"makoto_h03_0004","blip":"off","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"掌心里是又软又烫的分量。她的心跳隔着皮肤，一下一下撞着我的手。","src":"script/h_blocks/makoto_h03_01.txt:31","rid":"hb:makoto_h03_01#13","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那个说「看一遍教程就会了」的人，脸红到耳根，连锁骨都泛起了粉色。","src":"script/h_blocks/makoto_h03_01.txt:32","rid":"hb:makoto_h03_01#14","hb":"makoto_h03_01"},{"t":"se","src":"script/h_blocks/makoto_h03_01.txt:33","name":"kiss_c","vol":0.25,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻她。她回吻得又笨又用力，鼻尖撞上我的鼻尖，「唔」的一声，两个人都笑了。","src":"script/h_blocks/makoto_h03_01.txt:34","rid":"hb:makoto_h03_01#15","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她推开我一点，眯起眼睛认真地盯着我，像在审一份合同。","src":"script/h_blocks/makoto_h03_01.txt:35","rid":"hb:makoto_h03_01#16","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……检查完毕。没有问题。","src":"script/h_blocks/makoto_h03_01.txt:36","rid":"hb:makoto_h03_01#17","expr":"normal","voice":"makoto_h03_0005","blip":"off","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"说完自己先绷不住了，把额头「咚」地撞在我肩上，笑个不停。","src":"script/h_blocks/makoto_h03_01.txt:37","rid":"hb:makoto_h03_01#18","hb":"makoto_h03_01"},{"t":"breath","src":"script/h_blocks/makoto_h03_01.txt:38","level":2,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"十指相扣，按在枕边。我的另一只手，沿着她的小腹往下。","src":"script/h_blocks/makoto_h03_01.txt:40","rid":"hb:makoto_h03_01#19","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"家居裤的松紧带，一拉就开。她自己抬了一下腰，配合得理直气壮。","src":"script/h_blocks/makoto_h03_01.txt:41","rid":"hb:makoto_h03_01#20","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那里已经湿透了。指尖刚碰上去，她整个人就弹了起来，紧紧夹住我的手。","src":"script/h_blocks/makoto_h03_01.txt:42","rid":"hb:makoto_h03_01#21","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……那个。教程上，没写这一步。","src":"script/h_blocks/makoto_h03_01.txt:43","rid":"hb:makoto_h03_01#22","expr":"shy","voice":"makoto_h03_0006","blip":"off","hb":"makoto_h03_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"这一步，不需要教程。","src":"script/h_blocks/makoto_h03_01.txt:44","rid":"hb:makoto_h03_01#23","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯。好像是。","src":"script/h_blocks/makoto_h03_01.txt:45","rid":"hb:makoto_h03_01#24","expr":"soft","voice":"makoto_h03_0007","blip":"off","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……刚、刚才煮汤的时候……就一直在想……","src":"script/h_blocks/makoto_h03_01.txt:46","rid":"hb:makoto_h03_01#25","expr":"shy","voice":"makoto_h03_0008","blip":"off","hb":"makoto_h03_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"想什么？","src":"script/h_blocks/makoto_h03_01.txt:47","rid":"hb:makoto_h03_01#26","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……！问、问出来是犯规的！红牌！","src":"script/h_blocks/makoto_h03_01.txt:48","rid":"hb:makoto_h03_01#27","expr":"surprised","voice":"makoto_h03_0009","blip":"off","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她一头扎进枕头里，耳朵红得快要滴血。可扣着我的那只手，一点也没松。","src":"script/h_blocks/makoto_h03_01.txt:49","rid":"hb:makoto_h03_01#28","hb":"makoto_h03_01"},{"t":"se","src":"script/h_blocks/makoto_h03_01.txt:50","name":"touch_c","vol":0.28,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我慢慢地揉。她的腰一下一下追上来，呼吸碎成一截一截。","src":"script/h_blocks/makoto_h03_01.txt:51","rid":"hb:makoto_h03_01#29","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……手指、不够了……","src":"script/h_blocks/makoto_h03_01.txt:52","rid":"hb:makoto_h03_01#30","expr":"shy","voice":"makoto_h03_0010","blip":"off","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"{hero}……我想要你。","src":"script/h_blocks/makoto_h03_01.txt:53","rid":"hb:makoto_h03_01#31","expr":"shy","voice":"makoto_h03_0011","blip":"off","nameCall":["hero"],"hb":"makoto_h03_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"嗯。我也是。","src":"script/h_blocks/makoto_h03_01.txt:54","rid":"hb:makoto_h03_01#32","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她拽着我，把我拉进被子里，在我耳边小小声地说——","src":"script/h_blocks/makoto_h03_01.txt:55","rid":"hb:makoto_h03_01#33","hb":"makoto_h03_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……来。","src":"script/h_blocks/makoto_h03_01.txt:56","rid":"hb:makoto_h03_01#34","expr":"soft","voice":"makoto_h03_0012","blip":"off","hb":"makoto_h03_01"},{"t":"hstage","src":"script/h_blocks/makoto_h03_01.txt:58","stage":"end","char":"makoto","fade":0.6},{"t":"say","who":null,"disp":null,"br":null,"text":"就在那一刻。","src":"script/h_blocks/makoto_h03_01.txt:59","rid":"hb:makoto_h03_01#35","hb":"makoto_h03_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"厨房里，响起了「嘀」的一声。","src":"script/h_blocks/makoto_h03_01.txt:60","rid":"hb:makoto_h03_01#36","hb":"makoto_h03_01"},{"t":"hb_end","id":"makoto_h03_01","src":"script/pilot_makoto/pm_m3.txt:85"},{"t":"bgm","src":"script/pilot_makoto/pm_m3.txt:88","name":"h_scene","vol":0.15,"fade":0.5,"intensity":"none"},{"t":"se","src":"script/pilot_makoto/pm_m3.txt:89","name":"smoke_alarm","vol":0.8,"loop":false},{"t":"shake","src":"script/pilot_makoto/pm_m3.txt:90","power":"normal","time":0.6,"target":"screen"},{"t":"flash","src":"script/pilot_makoto/pm_m3.txt:91","color":"#ffe0d0","time":0.3,"count":1},{"t":"say","who":null,"disp":null,"br":null,"text":"——厨房里，报警器尖叫起来。第二锅，忘了关火。","src":"script/pilot_makoto/pm_m3.txt:92","rid":"pm_m3_rh03#16"},{"t":"se","src":"script/pilot_makoto/pm_m3.txt:93","name":"knock","vol":0.8,"loop":false,"muffle":"door"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"真琴酱，开门。报警器在叫。——着火了吗？","src":"script/pilot_makoto/pm_m3.txt:94","rid":"pm_m3_rh03#17","voice":"yukino_ph3_0001","via":"door"},{"t":"say","who":null,"disp":null,"br":null,"text":"她裹着被子冲向玄关。我被留在门后的死角里。","src":"script/pilot_makoto/pm_m3.txt:95","rid":"pm_m3_rh03#18"},{"t":"se","src":"script/pilot_makoto/pm_m3.txt:96","name":"door_lock","vol":0.5,"loop":false},{"t":"cg","src":"script/pilot_makoto/pm_m3.txt:97","id":"makoto_h03","diff":"door","trans":"crossfade","time":0.4},{"t":"say","who":null,"disp":null,"br":null,"text":"挂着门链，门只开了一条缝。她只露出半张脸。","src":"script/pilot_makoto/pm_m3.txt:98","rid":"pm_m3_rh03#19"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"没、没事！是、是在做……实验！料理实验！","src":"script/pilot_makoto/pm_m3.txt:100","rid":"pm_m3_rh03#20","expr":"surprised","voice":"makoto_ph3_0013"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……哦～。料理实验。","src":"script/pilot_makoto/pm_m3.txt:101","rid":"pm_m3_rh03#21","voice":"yukino_ph3_0002","via":"door"},{"t":"say","who":null,"disp":null,"br":null,"text":"停了很久的一拍。","src":"script/pilot_makoto/pm_m3.txt:102","rid":"pm_m3_rh03#22"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀，脸红了？——火关掉。","src":"script/pilot_makoto/pm_m3.txt:103","rid":"pm_m3_rh03#23","voice":"yukino_ph3_0003","via":"door"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"锅明天拿下来，我教你。不许不来。","src":"script/pilot_makoto/pm_m3.txt:104","rid":"pm_m3_rh03#24","voice":"yukino_ph3_0004","via":"door"},{"t":"se","src":"script/pilot_makoto/pm_m3.txt:105","name":"footsteps","vol":0.4,"loop":false,"pan":-0.5},{"t":"say","who":null,"disp":null,"br":null,"text":"脚步声，下楼去了。门缝外，从头到尾只有走廊的灯光。","src":"script/pilot_makoto/pm_m3.txt:106","rid":"pm_m3_rh03#25"},{"t":"se","src":"script/pilot_makoto/pm_m3.txt:107","name":"door_close","vol":0.5,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"她靠着门滑坐下去，用被子蒙住了头。","src":"script/pilot_makoto/pm_m3.txt:108","rid":"pm_m3_rh03#26"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……被桐谷小姐看见脸了……人生结束了……","src":"script/pilot_makoto/pm_m3.txt:109","rid":"pm_m3_rh03#27","expr":"shy","voice":"makoto_ph3_0014","blip":"off"},{"t":"choice","src":"script/pilot_makoto/pm_m3.txt:110","opts":[{"text":"「那，今天就——」","fx":null,"target":null,"cond":null,"body":1152,"src":"script/pilot_makoto/pm_m3.txt:111"},{"text":"「……要停下吗？」","fx":null,"target":null,"cond":null,"body":1153,"src":"script/pilot_makoto/pm_m3.txt:112"}],"end":1154},{"t":"goto","to":1154,"src":"script/pilot_makoto/pm_m3.txt:112"},{"t":"goto","to":1154,"src":"script/pilot_makoto/pm_m3.txt:113"},{"t":"say","who":null,"disp":null,"br":null,"text":"被子里，伸出一只手，抓住了我。","src":"script/pilot_makoto/pm_m3.txt:114","rid":"pm_m3_rh03#28"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"不、不要停。汤糊了，脸也丢光了……","src":"script/pilot_makoto/pm_m3.txt:115","rid":"pm_m3_rh03#29","expr":"shy","voice":"makoto_ph3_0015","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"这样还停下来就太亏了。……我想要。","src":"script/pilot_makoto/pm_m3.txt:116","rid":"pm_m3_rh03#30","expr":"shy","voice":"makoto_ph3_0016","blip":"off"},{"t":"say","who":"hero","disp":null,"br":"「","text":"嗯。","src":"script/pilot_makoto/pm_m3.txt:117","rid":"pm_m3_rh03#31"},{"t":"bgm","src":"script/pilot_makoto/pm_m3.txt:118","name":"h_scene","vol":0.4,"fade":1.5,"intensity":"mid"},{"t":"hb_begin","id":"makoto_h03_02","src":"script/pilot_makoto/pm_m3.txt:126","stages":[{"stage":"build","label":"渐入","pc":1161},{"stage":"climax","label":"高潮","pc":1199},{"stage":"after","label":"余韵","pc":1215}]},{"t":"cg","src":"script/h_blocks/makoto_h03_02.txt:14","id":"makoto_h03","diff":"b","trans":"crossfade","time":0.8,"hb":"makoto_h03_02"},{"t":"hstage","src":"script/h_blocks/makoto_h03_02.txt:16","stage":"build","char":"makoto","fade":null},{"t":"bgm","src":"script/h_blocks/makoto_h03_02.txt:17","name":"h_scene","vol":0.42,"fade":3},{"t":"say","who":null,"disp":null,"br":null,"text":"报警器终于安静了。窗开着，夜风把最后一缕烟吹了出去。","src":"script/h_blocks/makoto_h03_02.txt:18","rid":"hb:makoto_h03_02#0","hb":"makoto_h03_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她还裹着被子，只露出一双红通通的眼睛。","src":"script/h_blocks/makoto_h03_02.txt:19","rid":"hb:makoto_h03_02#1","hb":"makoto_h03_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……桐谷小姐，一定全都猜到了。","src":"script/h_blocks/makoto_h03_02.txt:20","rid":"hb:makoto_h03_02#2","expr":"annoyed","voice":"makoto_h03_0013","blip":"off","hb":"makoto_h03_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"大概吧。","src":"script/h_blocks/makoto_h03_02.txt:21","rid":"hb:makoto_h03_02#3","hb":"makoto_h03_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"明天还要去她店里拿锅……我要用什么脸去啊……！","src":"script/h_blocks/makoto_h03_02.txt:22","rid":"hb:makoto_h03_02#4","expr":"shy","voice":"makoto_h03_0014","blip":"off","hb":"makoto_h03_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我掀开被子钻进去。她「呀」地叫了一声——然后，自己把被子拉过头顶，把两个人都盖住。","src":"script/h_blocks/makoto_h03_02.txt:23","rid":"hb:makoto_h03_02#5","hb":"makoto_h03_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……这样，谁都看不见了。{hero}，进来。","src":"script/h_blocks/makoto_h03_02.txt:24","rid":"hb:makoto_h03_02#6","expr":"shy","voice":"makoto_h03_0015","blip":"off","nameCall":["hero"],"hb":"makoto_h03_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"被子里又暗又热，全是她的味道。还混着一点焦糊的汤味。","src":"script/h_blocks/makoto_h03_02.txt:25","rid":"hb:makoto_h03_02#7","hb":"makoto_h03_02"},{"t":"se","src":"script/h_blocks/makoto_h03_02.txt:26","name":"sheets_b","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"我抵上去，慢慢推进。她的呼吸在被子里撞来撞去，烫得像蒸汽。","src":"script/h_blocks/makoto_h03_02.txt:27","rid":"hb:makoto_h03_02#8","hb":"makoto_h03_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯、……啊……好深……","src":"script/h_blocks/makoto_h03_02.txt:28","rid":"hb:makoto_h03_02#9","expr":"shy","voice":"makoto_h03_0016","blip": …刚、刚才那句！刚才那句是——！","src":"script/h_blocks/makoto_h03_02.txt:40","rid":"hb:makoto_h03_02#19","expr":"surprised","voice":"makoto_h03_0020","blip":"off","hb":"makoto_h03_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"听见了。","src":"script/h_blocks/makoto_h03_02.txt:41","rid":"hb:makoto_h03_02#20","hb":"makoto_h03_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"撤、撤回……！……不。……不撤回。","src":"script/h_blocks/makoto_h03_02.txt:42","rid":"hb:makoto_h03_02#21","expr":"shy","voice":"makoto_h03_0021","blip":"off","hb":"makoto_h03_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……喜欢。{hero}，喜欢你。","src":"script/h_blocks/makoto_h03_02.txt:43","rid":"hb:makoto_h03_02#22","expr":"shy","voice":"makoto_h03_0022","blip":"off","nameCall":["hero"],"hb":"makoto_h03_02"},{"t":"breath","src":"script/h_blocks/makoto_h03_02.txt:44","level":4,"fade":2},{"t":"ambient","src":"script/h_blocks/makoto_h03_02.txt:45","name":"rhythm_creak_l2","vol":0.2,"fade":2,"xfade":"rhythm_creak_l1","muffle":3500},{"t":"bgm","src":"script/h_blocks/makoto_h03_02.txt:46","name":"h_scene","vol":0.55,"fade":2,"intensity":"high"},{"t":"zoom","src":"script/h_blocks/makoto_h03_02.txt:47","target":"cg","time":12,"ease":"soft","wait":false,"scale":1.06,"x":0.5,"y":0.45},{"t":"say","who":null,"disp":null,"br":null,"text":"像是终于找到了开关，她一遍一遍地说。每说一次，里面就收紧一次。","src":"script/h_blocks/makoto_h03_02.txt:48","rid":"hb:makoto_h03_02#23","hb":"makoto_h03_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"那个连「早川」都叫得生硬的人，现在连这种话都关不住了。","src":"script/h_blocks/makoto_h03_02.txt:49","rid":"hb:makoto_h03_02#24","hb":"makoto_h03_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……受不了……脑子、变得好奇怪……可是、别停……","src":"script/h_blocks/makoto_h03_02.txt:50","rid":"hb:makoto_h03_02#25","expr":"shy","voice":"makoto_h03_0023","blip":"off","hb":"makoto_h03_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"真琴……","src":"script/h_blocks/makoto_h03_02.txt:51","rid":"hb:makoto_h03_02#26","hb":"makoto_h03_02"},
