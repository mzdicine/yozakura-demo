l,"br":"「","text":"是我想要的。……不要让我说第二遍。","src":"script/scene_11.txt:89","rid":"scene_11_rh01#31","voice":"makoto_h01_0015"},{"t":"if","src":"script/scene_11.txt:92","c":{"o":"==","a":{"v":"rb_style"},"b":{"c":"tough"}},"f":1310},{"t":"set","src":"script/scene_11.txt:93","fx":[{"n":"f_makoto_tough","op":"=","val":true}]},{"t":"goto","to":1316,"src":"script/scene_11.txt:94"},{"t":"if","c":{"o":"==","a":{"v":"rb_style"},"b":{"c":"fluster"}},"f":1313,"src":"script/scene_11.txt:94"},{"t":"set","src":"script/scene_11.txt:95","fx":[{"n":"f_makoto_fluster","op":"=","val":true}]},{"t":"goto","to":1316,"src":"script/scene_11.txt:96"},{"t":"choice","src":"script/scene_11.txt:97","opts":[{"text":"（什么都不说，等她）","fx":[{"n":"f_makoto_tough","op":"=","val":true}],"target":null,"cond":null,"body":1314,"src":"script/scene_11.txt:98"},{"text":"「……你在发抖。」","fx":[{"n":"f_makoto_fluster","op":"=","val":true}],"target":null,"cond":null,"body":1315,"src":"script/scene_11.txt:99"}],"end":1316},{"t":"goto","to":1316,"src":"script/scene_11.txt:99"},{"t":"goto","to":1316,"src":"script/scene_11.txt:100"},{"t":"if","src":"script/scene_11.txt:102","c":{"v":"f_makoto_fluster"},"f":1325},{"t":"set","src":"script/scene_11.txt:103","fx":[{"n":"g_seen_makoto_rh01_fluster","op":"=","val":true}]},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……才、才没有。","src":"script/scene_11.txt:104","rid":"scene_11_rh01#32","expr":"annoyed","voice":"makoto_h01_0016","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"我先吻了她。","src":"script/scene_11.txt:105","rid":"scene_11_rh01#33"},{"t":"cg","src":"script/scene_11.txt:106","id":"makoto_h01","diff":"a2","trans":"crossfade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她整个人僵住了。握着眼镜的手，悬在半空。","src":"script/scene_11.txt:107","rid":"scene_11_rh01#34"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你，犯规。","src":"script/scene_11.txt:108","rid":"scene_11_rh01#35","expr":"shy","voice":"makoto_h01_0017","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"耳朵，红到了脖子。","src":"script/scene_11.txt:109","rid":"scene_11_rh01#36"},{"t":"goto","to":1331,"src":"script/scene_11.txt:110"},{"t":"set","src":"script/scene_11.txt:111","fx":[{"n":"g_seen_makoto_rh01_tough","op":"=","val":true}]},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了我很久。然后，踮起了脚。","src":"script/scene_11.txt:112","rid":"scene_11_rh01#37"},{"t":"cg","src":"script/scene_11.txt:113","id":"makoto_h01","diff":"a","trans":"crossfade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"先吻上来的，是她。","src":"script/scene_11.txt:114","rid":"scene_11_rh01#38"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……别误会。只是不想让你先。","src":"script/scene_11.txt:115","rid":"scene_11_rh01#39","expr":"annoyed","voice":"makoto_h01_0018","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"嘴上这样说，攥着我衬衫的手，却在发抖。","src":"script/scene_11.txt:116","rid":"scene_11_rh01#40"},{"t":"bgm","src":"script/scene_11.txt:118","name":"h_scene","vol":1,"fade":2},{"t":"ambient","src":"script/scene_11.txt:119","name":"storm_loop","vol":0.25,"fade":2,"muffle":"corridor"},{"t":"se","src":"script/scene_11.txt:120","name":"cloth_rustle","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"外套，从她的肩膀上滑了下去。","src":"script/scene_11.txt:121","rid":"scene_11_rh01#41"},{"t":"hb_begin","id":"makoto_h01_01","src":"script/scene_11.txt:123"},{"t":"se","src":"script/h_blocks/makoto_h01_01.txt:16","name":"cloth_rustle","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"唇分开的时候，她的呼吸已经乱了。","src":"script/h_blocks/makoto_h01_01.txt:17","rid":"hb:makoto_h01_01#0","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"炭灰色的外套落在地板上，像一份被随手丢下的文件。","src":"script/h_blocks/makoto_h01_01.txt:18","rid":"hb:makoto_h01_01#1","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她还穿着那件白色丝质衬衫。第一颗扣子，扣得一丝不苟。","src":"script/h_blocks/makoto_h01_01.txt:19","rid":"hb:makoto_h01_01#2","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"白天在会议室里，那颗扣子就是她的盔甲。","src":"script/h_blocks/makoto_h01_01.txt:20","rid":"hb:makoto_h01_01#3","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"眼镜还握在她手里。她低头看了一眼，把它折好，放在枕边。","src":"script/h_blocks/makoto_h01_01.txt:21","rid":"hb:makoto_h01_01#4","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……看什么。放好而已。","src":"script/h_blocks/makoto_h01_01.txt:22","rid":"hb:makoto_h01_01#5","expr":"annoyed","voice":"makoto_h01_0029","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"那颗扣子。……可以吗？","src":"script/h_blocks/makoto_h01_01.txt:23","rid":"hb:makoto_h01_01#6","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的喉咙动了一下。","src":"script/h_blocks/makoto_h01_01.txt:24","rid":"hb:makoto_h01_01#7","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……问这种问题，扣分。","src":"script/h_blocks/makoto_h01_01.txt:25","rid":"hb:makoto_h01_01#8","expr":"shy","voice":"makoto_h01_0030","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……可以。","src":"script/h_blocks/makoto_h01_01.txt:26","rid":"hb:makoto_h01_01#9","expr":"shy","voice":"makoto_h01_0031","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"指尖碰到那颗小小的贝母扣。她颈侧很烫，脉搏一下一下地撞着我的指节。","src":"script/h_blocks/makoto_h01_01.txt:27","rid":"hb:makoto_h01_01#10","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"一颗。她闭上了眼睛。","src":"script/h_blocks/makoto_h01_01.txt:28","rid":"hb:makoto_h01_01#11","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"两颗，三颗。丝绸从中间分开，露出锁骨，和比西装下看起来更丰满的胸口。","src":"script/h_blocks/makoto_h01_01.txt:29","rid":"hb:makoto_h01_01#12","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"黑色的内衣，窄窄的蕾丝边，没有一点多余的装饰——很像她。","src":"script/h_blocks/makoto_h01_01.txt:30","rid":"hb:makoto_h01_01#13","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不是为了今天才穿的。别得意。","src":"script/h_blocks/makoto_h01_01.txt:31","rid":"hb:makoto_h01_01#14","expr":"annoyed","voice":"makoto_h01_0032","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"嗯。","src":"script/h_blocks/makoto_h01_01.txt:32","rid":"hb:makoto_h01_01#15","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你那个『嗯』，一点都不像相信的样子。","src":"script/h_blocks/makoto_h01_01.txt:33","rid":"hb:makoto_h01_01#16","expr":"shy","voice":"makoto_h01_0033","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻她的锁骨。她的手抓住我的肩，指甲隔着衬衫陷进来。","src":"script/h_blocks/makoto_h01_01.txt:34","rid":"hb:makoto_h01_01#17","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"解开背后的搭扣时，她下意识抬起手臂想挡，又在半空停住，慢慢放下，像在对自己下命令。","src":"script/h_blocks/makoto_h01_01.txt:35","rid":"hb:makoto_h01_01#18","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不挡。今天，不挡。","src":"script/h_blocks/makoto_h01_01.txt:36","rid":"hb:makoto_h01_01#19","expr":"shy","voice":"makoto_h01_0034","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"沉甸甸的乳房落进我的掌心。白得晃眼，顶端是浅浅的豆沙色，在我的拇指下一点点硬起来。","src":"script/h_blocks/makoto_h01_01.txt:37","rid":"hb:makoto_h01_01#20","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她咬着唇，不出声。可我低头含住那里的时候，她的腰猛地一弹。","src":"script/h_blocks/makoto_h01_01.txt:38","rid":"hb:makoto_h01_01#21","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……等、……不是……那里不行……","src":"script/h_blocks/makoto_h01_01.txt:39","rid":"hb:makoto_h01_01#22","expr":"shy","voice":"makoto_h01_0035","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"要停吗？","src":"script/h_blocks/makoto_h01_01.txt:40","rid":"hb:makoto_h01_01#23","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……没让你停。……笨蛋。","src":"script/h_blocks/makoto_h01_01.txt:41","rid":"hb:makoto_h01_01#24","expr":"annoyed","voice":"makoto_h01_0036","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"铅笔裙的拉链在侧面。拉下来的声音很小，在雨声里却清楚得要命。","src":"script/h_blocks/makoto_h01_01.txt:42","rid":"hb:makoto_h01_01#25","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"裙子沿着她修长的腿滑下去。丝袜的边缘勒着丰腴的大腿，留下一道浅浅的红痕。","src":"script/h_blocks/makoto_h01_01.txt:43","rid":"hb:makoto_h01_01#26","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我的手掌贴上她大腿内侧。她并紧了一下——然后深吸一口气，自己分开了。","src":"script/h_blocks/makoto_h01_01.txt:44","rid":"hb:makoto_h01_01#27","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"隔着最后一层薄薄的布料，那里已经湿透，烫得惊人。","src":"script/h_blocks/makoto_h01_01.txt:45","rid":"hb:makoto_h01_01#28","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……别说出来。说出来，我就回隔壁去。","src":"script/h_blocks/makoto_h01_01.txt:46","rid":"hb:makoto_h01_01#29","expr":"shy","voice":"makoto_h01_0037","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……真琴。","src":"script/h_blocks/makoto_h01_01.txt:47","rid":"hb:makoto_h01_01#30","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……叫名字也不行。……犯规。","src":"script/h_blocks/makoto_h01_01.txt:48","rid":"hb:makoto_h01_01#31","expr":"shy","voice":"makoto_h01_0038","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"手指拨开布料滑进去的一瞬间，她整个人缩了一下，抓住我的手腕——不是推开，是按住。","src":"script/h_blocks/makoto_h01_01.txt:49","rid":"hb:makoto_h01_01#32","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那么软，那么湿。指腹轻轻碾过最敏感的那一点，她的膝盖就开始发抖。","src":"script/h_blocks/makoto_h01_01.txt:50","rid":"hb:makoto_h01_01#33","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那个在会议上一句话就能让整个房间安静下来的人，此刻把脸埋进我的肩膀，一声一声地，压着气喘。","src":"script/h_blocks/makoto_h01_01.txt:51","rid":"hb:makoto_h01_01#34","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……{hero}。……{hero}……","src":"script/h_blocks/makoto_h01_01.txt:52","rid":"hb:makoto_h01_01#35","expr":"shy","voice":"makoto_h01_0039","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她伸手来解我的皮带。手指抖得对不准，她低声骂了自己一句。","src":"script/h_blocks/makoto_h01_01.txt:53","rid":"hb:makoto_h01_01#36","hb":"makoto_h01_01"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……平时，明明什么都做得好……","src":"script/h_blocks/makoto_h01_01.txt:54","rid":"hb:makoto_h01_01#37","expr":"annoyed","voice":"makoto_h01_0040","blip":"off","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我握住她的手，和她一起解开。","src":"script/h_blocks/makoto_h01_01.txt:55","rid":"hb:makoto_h01_01#38","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"衣服一件一件落在地上。赤裸的胸口贴在一起，她的心跳快得像要撞破那层薄薄的皮肤。","src":"script/h_blocks/makoto_h01_01.txt:56","rid":"hb:makoto_h01_01#39","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，我们都停了下来。","src":"script/h_blocks/makoto_h01_01.txt:57","rid":"hb:makoto_h01_01#40","hb":"makoto_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"窗外的天空，无声地白了一瞬。","src":"script/h_blocks/makoto_h01_01.txt:58","rid":"hb:makoto_h01_01#41","hb":"makoto_h01_01"},{"t":"hb_end","id":"makoto_h01_01","src":"script/scene_11.txt:123"},{"t":"se","src":"script/scene_11.txt:125","name":"thunder","vol":1,"loop":false},{"t":"flash","src":"script/scene_11.txt:126","color":"white","time":0.3,"count":1},{"t":"say","who":null,"disp":null,"br":null,"text":"雷声，近得像就在窗外。","src":"script/scene_11.txt:127","rid":"scene_11_rh01#42"},{"t":"say","who":null,"disp":null,"br":null,"text":"她攥紧了我的手。","src":"script/scene_11.txt:128","rid":"scene_11_rh01#43"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不是怕打雷。","src":"script/scene_11.txt:129","rid":"scene_11_rh01#44","expr":"shy","voice":"makoto_h01_0019","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"是怕，你停下来。","src":"script/scene_11.txt:130","rid":"scene_11_rh01#45","expr":"shy","voice":"makoto_h01_0020","blip":"off"},{"t":"hb_begin","id":"makoto_h01_02","src":"script/scene_11.txt:132"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我不会停。","src":"script/h_blocks/makoto_h01_02.txt:13","rid":"hb:makoto_h01_02#0","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"除非你说停。","src":"script/h_blocks/makoto_h01_02.txt:14","rid":"hb:makoto_h01_02#1","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不会说的。","src":"script/h_blocks/makoto_h01_02.txt:15","rid":"hb:makoto_h01_02#2","expr":"shy","voice":"makoto_h01_0041","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她躺下去，黑发散在我的枕头上。没有眼镜，没有扣到顶的衬衫。灰蓝色的眼睛湿漉漉的，直直地看着我。","src":"script/h_blocks/makoto_h01_02.txt:16","rid":"hb:makoto_h01_02#3","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她勾住我的脖子，把我拉下去。","src":"script/h_blocks/makoto_h01_02.txt:17","rid":"hb:makoto_h01_02#4","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……快点。……不要让我，说第二遍。","src":"script/h_blocks/makoto_h01_02.txt:18","rid":"hb:makoto_h01_02#5","expr":"annoyed","voice":"makoto_h01_0042","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我抵上去。前端碰到那片湿热的时候，她的呼吸停了一拍。","src":"script/h_blocks/makoto_h01_02.txt:19","rid":"hb:makoto_h01_02#6","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，慢慢地推进去。","src":"script/h_blocks/makoto_h01_02.txt:20","rid":"hb:makoto_h01_02#7","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯、……啊……","src":"script/h_blocks/makoto_h01_02.txt:21","rid":"hb:makoto_h01_02#8","expr":"shy","voice":"makoto_h01_0043","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"很紧。她的身体像是忘了该怎么接纳一个人，又像是记得太清楚。","src":"script/h_blocks/makoto_h01_02.txt:22","rid":"hb:makoto_h01_02#9","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我停在一半，吻她的眼角。","src":"script/h_blocks/makoto_h01_02.txt:23","rid":"hb:makoto_h01_02#10","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"疼吗？","src":"script/h_blocks/makoto_h01_02.txt:24","rid":"hb:makoto_h01_02#11","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不疼。……只是、太满了……","src":"script/h_blocks/makoto_h01_02.txt:25","rid":"hb:makoto_h01_02#12","expr":"shy","voice":"makoto_h01_0044","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的腿缠上来，脚跟抵着我的腰，往里压。","src":"script/h_blocks/makoto_h01_02.txt:26","rid":"hb:makoto_h01_02#13","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……别停在那里。……全部。","src":"script/h_blocks/makoto_h01_02.txt:27","rid":"hb:makoto_h01_02#14","expr":"shy","voice":"makoto_h01_0045","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"直到完全进去。她长长地、颤抖地吐出一口气。","src":"script/h_blocks/makoto_h01_02.txt:28","rid":"hb:makoto_h01_02#15","hb":"makoto_h01_02"},{"t":"cg","src":"script/h_blocks/makoto_h01_02.txt:29","id":"makoto_h01","diff":"b","trans":"fade","time":0.8,"hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"外套还落在地上。她的手找到我的手，十指扣紧，按在枕头上。","src":"script/h_blocks/makoto_h01_02.txt:30","rid":"hb:makoto_h01_02#16","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"枕边，她的眼镜折好放着，镜片映着窗外的雨。旁边是她的手表。","src":"script/h_blocks/makoto_h01_02.txt:31","rid":"hb:makoto_h01_02#17","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"雨声里，秒针一格一格地走。调准了的，一秒也不快。","src":"script/h_blocks/makoto_h01_02.txt:32","rid":"hb:makoto_h01_02#18","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"而她的心跳，快得根本追不上它。","src":"script/h_blocks/makoto_h01_02.txt:33","rid":"hb:makoto_h01_02#19","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我开始动。很慢。每一次退出来，她的内里都绞着不放；每一次深入，她的背就离开床单一点。","src":"script/h_blocks/makoto_h01_02.txt:34","rid":"hb:makoto_h01_02#20","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯……嗯、……{hero}……","src":"script/h_blocks/makoto_h01_02.txt:35","rid":"hb:makoto_h01_02#21","expr":"shy","voice":"makoto_h01_0046","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……不许、看我的脸……","src":"script/h_blocks/makoto_h01_02.txt:36","rid":"hb:makoto_h01_02#22","expr":"annoyed","voice":"makoto_h01_0047","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"想看。","src":"script/h_blocks/makoto_h01_02.txt:37","rid":"hb:makoto_h01_02#23","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……讨厌。……讨厌你……","src":"script/h_blocks/makoto_h01_02.txt:38","rid":"hb:makoto_h01_02#24","expr":"shy","voice":"makoto_h01_0048","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"嘴上这样说，扣着我的手指却收得更紧了。","src":"script/h_blocks/makoto_h01_02.txt:39","rid":"hb:makoto_h01_02#25","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我顶得更深。湿润的声音混进雨声里，她自己也听见了，耳朵一路红到脖子。","src":"script/h_blocks/makoto_h01_02.txt:40","rid":"hb:makoto_h01_02#26","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她别过脸，咬住自己的手背，把声音咽回去。","src":"script/h_blocks/makoto_h01_02.txt:41","rid":"hb:makoto_h01_02#27","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我把那只手轻轻拿开，扣回枕边。","src":"script/h_blocks/makoto_h01_02.txt:42","rid":"hb:makoto_h01_02#28","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"不用忍。这里，只有我听得见。","src":"script/h_blocks/makoto_h01_02.txt:43","rid":"hb:makoto_h01_02#29","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的腰开始跟着我的节奏抬起来。先是犹豫的，然后越来越诚实。","src":"script/h_blocks/makoto_h01_02.txt:44","rid":"hb:makoto_h01_02#30","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"丰满的胸口随着每一次撞击摇晃，汗湿的发丝贴在额头上。那个永远一丝不乱的椎名真琴，此刻乱得一塌糊涂。","src":"script/h_blocks/makoto_h01_02.txt:45","rid":"hb:makoto_h01_02#31","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……那里……再、……再一下……","src":"script/h_blocks/makoto_h01_02.txt:46","rid":"hb:makoto_h01_02#32","expr":"shy","voice":"makoto_h01_0049","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"这里？","src":"script/h_blocks/makoto_h01_02.txt:47","rid":"hb:makoto_h01_02#33","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯！……就是、那里……","src":"script/h_blocks/makoto_h01_02.txt:48","rid":"hb:makoto_h01_02#34","expr":"shy","voice":"makoto_h01_0050","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她仰起脖子。喉咙里漏出来的，再也不是会议室里那种干脆的短句，而是又软又甜、拖着尾音的呜咽。","src":"script/h_blocks/makoto_h01_02.txt:49","rid":"hb:makoto_h01_02#35","hb":"makoto_h01_02"},{"t":"se","src":"script/h_blocks/makoto_h01_02.txt:50","name":"thunder_distant","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"雷声滚过去。她连眼睛都没有眨。","src":"script/h_blocks/makoto_h01_02.txt:51","rid":"hb:makoto_h01_02#36","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……我说谎了。","src":"script/h_blocks/makoto_h01_02.txt:52","rid":"hb:makoto_h01_02#37","expr":"soft","voice":"makoto_h01_0051","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"『别误会』也好，『才没有』也好……全都是，骗你的。","src":"script/h_blocks/makoto_h01_02.txt:53","rid":"hb:makoto_h01_02#38","expr":"soft","voice":"makoto_h01_0052","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……想要你。从隔着那面墙的时候起……就一直想要。","src":"script/h_blocks/makoto_h01_02.txt:54","rid":"hb:makoto_h01_02#39","expr":"soft","voice":"makoto_h01_0053","blip":"off","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看着我，嘴角在发抖。想撑出那个单边的、克制的半笑，却怎么也撑不住。","src":"script/h_blocks/makoto_h01_02.txt:55","rid":"hb:makoto_h01_02#40","hb":"makoto_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"防线，就在这一句里，彻底塌了。","src":"script/h_blocks/makoto_h01_02.txt:56","rid":"hb:makoto_h01_02#41","hb":"makoto_h01_02"},{"t":"hb_end","id":"makoto_h01_02","src":"script/scene_11.txt:132"},{"t":"cg","src":"script/scene_11.txt:135","id":"makoto_h01","diff":"c","trans":"fade","time":0.8},{"t":"hb_begin","id":"makoto_h01_03","src":"script/scene_11.txt:136"},{"t":"say","who":null,"disp":null,"br":null,"text":"她不再忍了。","src":"script/h_blocks/makoto_h01_03.txt:12","rid":"hb:makoto_h01_03#0","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"双腿紧紧缠着我。每一次我顶进去，她就迎上来，像是要把这些年空掉的时间，一口气全部补回来。","src":"script/h_blocks/makoto_h01_03.txt:13","rid":"hb:makoto_h01_03#1","hb":"makoto_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……{hero}、……{hero}……","src":"script/h_blocks/makoto_h01_03.txt:14","rid":"hb:makoto_h01_03#2","expr":"soft","voice":"makoto_h01_0054","blip":"off","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她一遍一遍地叫这个名字。明明不久之前，连「早川」都叫得那么生硬。","src":"script/h_blocks/makoto_h01_03.txt:15","rid":"hb:makoto_h01_03#3","hb":"makoto_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"真琴……我快要……","src":"script/h_blocks/makoto_h01_03.txt:16","rid":"hb:makoto_h01_03#4","hb":"makoto_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……嗯。……不要出去。","src":"script/h_blocks/makoto_h01_03.txt:17","rid":"hb:makoto_h01_03#5","expr":"shy","voice":"makoto_h01_0055","blip":"off","hb":"makoto_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"就这样，在我里面……我要清醒地、记住。","src":"script/h_blocks/makoto_h01_03.txt:18","rid":"hb:makoto_h01_03#6","expr":"soft","voice":"makoto_h01_0056","blip":"off","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她扣着我的手，指节发白。内里一阵一阵地收紧，越来越急，像在催促，又像在挽留。","src":"script/h_blocks/makoto_h01_03.txt:19","rid":"hb:makoto_h01_03#7","hb":"makoto_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……啊、……要、……{hero}——！","src":"script/h_blocks/makoto_h01_03.txt:20","rid":"hb:makoto_h01_03#8","expr":"shy","voice":"makoto_h01_0057","blip":"off","hb":"makoto_h01_03"},{"t":"flash","src":"script/h_blocks/makoto_h01_03.txt:21","color":"white","time":0.4,"count":1},{"t":"say","who":null,"disp":null,"br":null,"text":"她的背弓起来，整个人在我身下剧烈地颤抖。内里死死地绞住我，我再也忍不住，深深抵进去，把一切都释放在她身体最深的地方。","src":"script/h_blocks/makoto_h01_03.txt:22","rid":"hb:makoto_h01_03#9","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的指甲在我手背上掐出几道细细的月牙。很久，都没有松开。","src":"script/h_blocks/makoto_h01_03.txt:23","rid":"hb:makoto_h01_03#10","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"……","src":"script/h_blocks/makoto_h01_03.txt:24","rid":"hb:makoto_h01_03#11","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"颤抖一点点平息下来。","src":"script/h_blocks/makoto_h01_03.txt:25","rid":"hb:makoto_h01_03#12","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的胸口贴着我，起伏渐渐变缓。汗湿的额头抵在我的颈窝里，呼吸烫烫的。","src":"script/h_blocks/makoto_h01_03.txt:26","rid":"hb:makoto_h01_03#13","hb":"makoto_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……喂。","src":"script/h_blocks/makoto_h01_03.txt:27","rid":"hb:makoto_h01_03#14","expr":"soft","voice":"makoto_h01_0058","blip":"off","hb":"makoto_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"嗯？","src":"script/h_blocks/makoto_h01_03.txt:28","rid":"hb:makoto_h01_03#15","hb":"makoto_h01_03"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……没什么。只是想叫你。","src":"script/h_blocks/makoto_h01_03.txt:29","rid":"hb:makoto_h01_03#16","expr":"soft","voice":"makoto_h01_0059","blip":"off","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她笑了。不是眼镜后面那种单边嘴角的、克制的半笑——是整张脸都松开的、有点傻气的笑。","src":"script/h_blocks/makoto_h01_03.txt:30","rid":"hb:makoto_h01_03#17","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"我第一次见到。大概，也没有别人见过。","src":"script/h_blocks/makoto_h01_03.txt:31","rid":"hb:makoto_h01_03#18","hb":"makoto_h01_03"},{"t":"bgmfade","src":"script/h_blocks/makoto_h01_03.txt:32","time":1},{"t":"wait","src":"script/h_blocks/makoto_h01_03.txt:33","time":0.5},{"t":"say","who":null,"disp":null,"br":null,"text":"枕边，秒针还在走。","src":"script/h_blocks/makoto_h01_03.txt:34","rid":"hb:makoto_h01_03#19","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"一格，一格。和我们的心跳，终于慢慢走到了同一个节拍上。","src":"script/h_blocks/makoto_h01_03.txt:35","rid":"hb:makoto_h01_03#20","hb":"makoto_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"窗外的雨，还在下。","src":"script/h_blocks/makoto_h01_03.txt:36","rid":"hb:makoto_h01_03#21","hb":"makoto_h01_03"},{"t":"hb_end","id":"makoto_h01_03","src":"script/scene_11.txt:136"},{"t":"fadeout","src":"script/scene_11.txt:138","color":"black","time":1.5},{"t":"bgm","src":"script/scene_11.txt:139","name":"makoto_theme","vol":1,"fade":2},{"t":"wait","src":"script/scene_11.txt:140","time":1},{"t":"bg","src":"script/scene_11.txt:141","id":"room_hero_night_tidy","trans":"none","time":null,"hold":null,"keep":false},{"t":"ambientstop","src":"script/scene_11.txt:142","name":"storm_loop","fade":3},{"t":"ambient","src":"script/scene_11.txt:143","name":"rain_loop","vol":0.3,"fade":2},{"t":"fadein","src":"script/scene_11.txt:144","time":1.5},{"t":"se","src":"script/scene_11.txt:145","name":"thunder_distant","vol":0.25,"loop":false,"pan":-0.4},{"t":"say","who":null,"disp":null,"br":null,"text":"雷声走远了。只剩下小雨。","src":"script/scene_11.txt:146","rid":"scene_11_rh01#46"},{"t":"if","src":"script/scene_11.txt:147","c":{"v":"f_makoto_fluster"},"f":1476},{"t":"cg","src":"script/scene_11.txt:148","id":"makoto_h01","diff":"after2","trans":"fade","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"她背对着我，蜷着。手却攥着我的手腕，没有松开。","src":"script/scene_11.txt:149","rid":"scene_11_rh01#47"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……别看。我现在的脸，不能看。","src":"script/scene_11.txt:150","rid":"scene_11_rh01#48","expr":"shy","voice":"makoto_h01_0021","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"我其实……一直很怕一个人。","src":"script/scene_11.txt:151","rid":"scene_11_rh01#49","expr":"sad","voice":"makoto_h01_0022","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……你听见了也要当没听见。","src":"script/scene_11.txt:152","rid":"scene_11_rh01#50","expr":"soft","voice":"makoto_h01_0023","blip":"off"},{"t":"goto","to":1481,"src":"script/scene_11.txt:153"},{"t":"cg","src":"script/scene_11.txt:154","id":"makoto_h01","diff":"after","trans":"fade","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"枕边，并排放着两块表。她的，和我的。","src":"script/scene_11.txt:155","rid":"scene_11_rh01#51"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……刚才那些，不许说出去。","src":"script/scene_11.txt:156","rid":"scene_11_rh01#52","expr":"annoyed","voice":"makoto_h01_0024","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"这面墙很薄。隔壁……隔壁是我家，算了。","src":"script/scene_11.txt:157","rid":"scene_11_rh01#53","expr":"annoyed","voice":"makoto_h01_0025","blip":"off"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……笨蛋。笑什么。","src":"script/scene_11.txt:158","rid":"scene_11_rh01#54","expr":"soft","voice":"makoto_h01_0026","blip":"off"},{"t":"if","src":"script/scene_11.txt:160","c":{"v":"f_makoto_wait"},"f":1483},{"t":"say","who":"makoto","disp":null,"br":"「","text":"那天你说『我在这里』。……你真的在。","src":"script/scene_11.txt:161","rid":"scene_11_rh01#55","expr":"soft","voice":"makoto_h01_0027","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了一眼枕边的表。指针，走得一秒都不差。","src":"script/scene_11.txt:163","rid":"scene_11_rh01#56"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"现在的时间，是我们两个人的。","src":"script/scene_11.txt:164","rid":"scene_11_rh01#57","expr":"soft","voice":"makoto_h01_0028"},{"t":"cghide","src":"script/scene_11.txt:165","trans":"fade","time":null},{"t":"endrecall","id":"makoto_rh01","src":"script/scene_11.txt:166"},{"t":"ambientstop","src":"script/scene_11.txt:168","name":"all","fade":2},{"t":"bgmfade","src":"script/scene_11.txt:169","time":2},{"t":"jump","src":"script/scene_11.txt:170","label":"scene_14_start"},{"t":"eof","src":"script/scene_11.txt:171"},{"t":"prefetch","se":["knock","shop_bell","box_drop","storm_loop","thunder","window_rattle","thunder_distant","dish_clink"],"src":"script/scene_12.txt:1"},{"t":"label","src":"script/scene_12.txt:11","name":"scene_12_start"},{"t":"chapter","src":"script/scene_12.txt:12","title":"雪乃","sub":"空了五年的花瓶"},{"t":"bg","src":"script/scene_12.txt:13","id":"room_hero_day","trans":"black","time":null,"hold":0.8,"keep":false},{"t":"bgm","src":"script/scene_12.txt:14","name":"daily","vol":1,"fade":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"四月二十五日，星期六。早上九点。","src":"script/scene_12.txt:15","rid":"scene_12_start#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"楼下传来卷帘门哗啦啦拉起的声音。","src":"script/scene_12.txt:16","rid":"scene_12_start#1"},{"t":"if","src":"script/scene_12.txt:18","c":{"v":"f_lily"},"f":1519},{"t":"recall","src":"script/scene_12.txt:19","id":"yukino_r02","title":"还活着的铃兰","chara":"yukino","type":"event","thumb":"yukino_01","end":1518},{"t":"bg","src":"script/scene_12.txt:20","id":"room_hero_day","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_12.txt:21","name":"yukino_theme","vol":1,"fade":1.5},{"t":"se","src":"script/scene_12.txt:22","name":"knock","vol":1,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"敲门声。开门，是系着墨绿围裙的她。","src":"script/scene_12.txt:23","rid":"scene_12_start#2"},{"t":"chara","src":"script/scene_12.txt:24","id":"yukino","expr":"smile","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"早安，小哥。来接壮丁了——","src":"script/scene_12.txt:25","rid":"scene_12_start#3","voice":"yukino_e01_0001"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的视线越过我的肩膀，停在窗台上。","src":"script/scene_12.txt:26","rid":"scene_12_start#4"},{"t":"say","who":null,"disp":null,"br":null,"text":"那一小盆铃兰。白色的小铃铛，一串串挂着。","src":"script/scene_12.txt:27","rid":"scene_12_start#5"},{"t":"chara","src":"script/scene_12.txt:28","id":"yukino","expr":"surprised","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……还开着。","src":"script/scene_12.txt:29","rid":"scene_12_start#6","expr":"surprised","voice":"yukino_e01_0002"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"你说过，一定不让它死。","src":"script/scene_12.txt:30","rid":"scene_12_start#7","expr":"normal","voice":"yukino_e01_0003"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……说过的话，总得算数吧。","src":"script/scene_12.txt:31","rid":"scene_12_start#8"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……哎呀。这句，是姐姐的台词才对。","src":"script/scene_12.txt:32","rid":"scene_12_start#9","expr":"shy","voice":"yukino_e01_0004"},{"t":"say","who":null,"disp":null,"br":null,"text":"她蹲在窗台前，看了很久。像在看一件很久以前的东西。","src":"script/scene_12.txt:33","rid":"scene_12_start#10"},{"t":"cg","src":"script/scene_12.txt:34","id":"yukino_01","diff":"c","trans":"fade","time":null},{"t":"say","who":"hero","disp":null,"br":"（","text":"……她的侧脸，比那盆铃兰还要安静。","src":"script/scene_12.txt:35","rid":"scene_12_start#11"},{"t":"cghide","src":"script/scene_12.txt:36","trans":"fade","time":null},{"t":"hide","src":"script/scene_12.txt:37","id":"yukino","trans":"fade","time":null},{"t":"endrecall","id":"yukino_r02","src":"script/scene_12.txt:38"},{"t":"bg","src":"script/scene_12.txt:41","id":"flower_shop_day","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"se","src":"script/scene_12.txt:42","name":"shop_bell","vol":0.5,"loop":false},{"t":"bgm","src":"script/scene_12.txt:43","name":"daily","vol":1,"fade":1.5},{"t":"chara","src":"script/scene_12.txt:44","id":"yukino","expr":"smile","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"店门口停着一辆小货车。车斗里，塞满了白色的花。","src":"script/scene_12.txt:45","rid":"scene_12_start#12"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"婚礼会场的花。两百枝玫瑰，八十枝百合。","src":"script/scene_12.txt:46","rid":"scene_12_start#13","voice":"yukino_e01_0005"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"来，小哥。报酬是晚饭，先说好的哦。","src":"script/scene_12.txt:47","rid":"scene_12_start#14","voice":"yukino_e01_0006"},{"t":"se","src":"script/scene_12.txt:48","name":"box_drop","vol":0.5,"loop":false},{"t":"shake","src":"script/scene_12.txt:49","power":"weak","time":0.2,"target":"screen"},{"t":"say","who":null,"disp":null,"br":null,"text":"第一箱就差点脱手。花比想象的重得多。","src":"script/scene_12.txt:50","rid":"scene_12_start#15"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"腰要用力，不是手。……哎呀，好笨拙。","src":"script/scene_12.txt:51","rid":"scene_12_start#16","expr":"smile","voice":"yukino_e01_0007"},{"t":"if","src":"script/scene_12.txt:52","c":{"o":"!=","a":{"v":"f_yukino_flower"},"b":{"c":"none"}},"f":1534},{"t":"say","who":"yukino","disp":null,"br":"「","text":"公司桌上那枝，还活着吗？","src":"script/scene_12.txt:53","rid":"scene_12_start#17","voice":"yukino_e01_0008"},{"t":"say","who":"hero","disp":null,"br":"「","text":"每天换水。被前辈笑了三次。","src":"script/scene_12.txt:54","rid":"scene_12_start#18"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"三次呀。那就是，被羡慕了三次。","src":"script/scene_12.txt:55","rid":"scene_12_start#19","expr":"smile","voice":"yukino_e01_0009"},{"t":"say","who":null,"disp":null,"br":null,"text":"中午，我们坐在花桶中间，吃她做的饭团。","src":"script/scene_12.txt:57","rid":"scene_12_start#20"},{"t":"say","who":null,"disp":null,"br":null,"text":"柜台旁边，那个细长的花瓶，还是空的。","src":"script/scene_12.txt:58","rid":"scene_12_start#21"},{"t":"bg","src":"script/scene_12.txt:60","id":"flower_shop_storm_night","trans":"crossfade","time":1.5,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_12.txt:61","name":"night","vol":1,"fade":2},{"t":"ambient","src":"script/scene_12.txt:62","name":"storm_loop","vol":0.6,"fade":2},{"t":"se","src":"script/scene_12.txt:63","name":"thunder","vol":1,"loop":false},{"t":"flash","src":"script/scene_12.txt:64","color":"white","time":0.3,"count":1},{"t":"say","who":null,"disp":null,"br":null,"text":"晚上七点。天气预报没说的暴风雨，忽然来了。","src":"script/scene_12.txt:65","rid":"scene_12_start#22"},{"t":"chara","src":"script/scene_12.txt:66","id":"yukino","expr":"serious","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"——外面的花架！","src":"script/scene_12.txt:67","rid":"scene_12_start#23","expr":"serious","voice":"yukino_e01_0010"},{"t":"say","who":null,"disp":null,"br":null,"text":"门口，明天要送的花，还摆在雨里。","src":"script/scene_12.txt:68","rid":"scene_12_start#24"},{"t":"choice","src":"script/scene_12.txt:69","opts":[{"text":"（冲进雨里，把花架抱回来）","fx":[{"n":"aff_yukino","op":"+=","val":2},{"n":"f_yukino_rescue","op":"=","val":true}],"target":null,"cond":null,"body":1546,"src":"script/scene_12.txt:70"},{"text":"（先帮她拉下卷帘门，再从里面一桶桶搬）","fx":[{"n":"aff_yukino","op":"+=","val":1},{"n":"f_yukino_shutter","op":"=","val":true}],"target":null,"cond":null,"body":1552,"src":"script/scene_12.txt:76"}],"end":1557},{"t":"se","src":"script/scene_12.txt:71","name":"window_rattle","vol":0.6,"loop":false},{"t":"shake","src":"script/scene_12.txt:72","power":"normal","time":0.4,"target":"screen"},{"t":"say","who":null,"disp":null,"br":null,"text":"风把雨水横着打在脸上。我抱起花桶，一趟，两趟。","src":"script/scene_12.txt:73","rid":"scene_12_start#25"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"小哥！先回来——","src":"script/scene_12.txt:74","rid":"scene_12_start#26","expr":"surprised","voice":"yukino_e01_0011"},{"t":"say","who":null,"disp":null,"br":null,"text":"最后一桶抱进门的时候，我浑身都湿透了。","src":"script/scene_12.txt:75","rid":"scene_12_start#27"},{"t":"goto","to":1557,"src":"script/scene_12.txt:76"},{"t":"se","src":"script/scene_12.txt:78","name":"window_rattle","vol":0.6,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"卷帘门哗啦啦落下一半。我们从缝隙里，把花桶拖进来。","src":"script/scene_12.txt:79","rid":"scene_12_start#28"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……冷静的男人，不讨厌哦。","src":"script/scene_12.txt:80","rid":"scene_12_start#29","expr":"serious","voice":"yukino_e01_0012"},{"t":"say","who":null,"disp":null,"br":null,"text":"可最后，我们两个还是都湿透了。","src":"script/scene_12.txt:81","rid":"scene_12_start#30"},{"t":"goto","to":1557,"src":"script/scene_12.txt:82"},{"t":"recall","src":"script/scene_12.txt:84","id":"yukino_r01","title":"空了五年的花瓶","chara":"yukino","type":"event","thumb":"yukino_01","end":1585},{"t":"bg","src":"script/scene_12.txt:85","id":"flower_shop_storm_inside_night","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_12.txt:86","name":"yukino_theme","vol":1,"fade":2},{"t":"ambient","src":"script/scene_12.txt:88","name":"storm_loop","vol":0.4,"fade":1.5,"muffle":"door"},{"t":"chara","src":"script/scene_12.txt:89","id":"yukino","expr":"normal","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"店里的灯，只开了柜台那一盏。雨敲着卷帘门。","src":"script/scene_12.txt:90","rid":"scene_12_start#31"},{"t":"se","src":"script/scene_12.txt:91","name":"window_rattle","vol":0.35,"loop":false},{"t":"cg","src":"script/scene_12.txt:92","id":"yukino_01","diff":null,"trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她拿毛巾给我擦头发。左手的无名指上，银戒指闪了一下。","src":"script/scene_12.txt:93","rid":"scene_12_start#32"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……傻瓜。花倒了就倒了。","src":"script/scene_12.txt:94","rid":"scene_12_start#33","voice":"yukino_e01_0013"},{"t":"say","who":"hero","disp":null,"br":"「","text":"可您会难过吧。","src":"script/scene_12.txt:95","rid":"scene_12_start#34"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手，停了。","src":"script/scene_12.txt:96","rid":"scene_12_start#35"},{"t":"se","src":"script/scene_12.txt:97","name":"thunder_distant","vol":0.4,"loop":false},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……我丈夫，以前是做摄影的。","src":"script/scene_12.txt:98","rid":"scene_12_start#36","expr":"sad","voice":"yukino_e01_0014"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"海边的小工作室。五年前的夏天，他没有回来。","src":"script/scene_12.txt:99","rid":"scene_12_start#37","expr":"sad","voice":"yukino_e01_0015"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那个花瓶，是他送的。说要插第一枝……就走了。","src":"script/scene_12.txt:100","rid":"scene_12_start#38","voice":"yukino_e01_0016"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"所以啊，姐姐总是先出手。逗别人，宠别人。","src":"script/scene_12.txt:101","rid":"scene_12_start#39","expr":"smile","voice":"yukino_e01_0017"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"被别人看穿之前，先把人推开一点点。","src":"script/scene_12.txt:102","rid":"scene_12_start#40","expr":"sad","voice":"yukino_e01_0018"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……预订簿上那行『藤花』，也是吗？","src":"script/scene_12.txt:103","rid":"scene_12_start#41"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"那位客人呀，每年都只付钱、不取花。","src":"script/scene_12.txt:104","rid":"scene_12_start#42","voice":"yukino_e01_0019"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"我每年都照样扎好，等着有人来取。然后，自己看着它谢掉。","src":"script/scene_12.txt:105","rid":"scene_12_start#43","expr":"sad","voice":"yukino_e01_0020"},{"t":"say","who":null,"disp":null,"br":null,"text":"我站起来。柜台上散着抢救回来的铃兰，我拢起一小把。","src":"script/scene_12.txt:106","rid":"scene_12_start#44"},{"t":"say","who":null,"disp":null,"br":null,"text":"放进了那个空着的玻璃花瓶。","src":"script/scene_12.txt:107","rid":"scene_12_start#45"},{"t":"cg","src":"script/scene_12.txt:108","id":"yukino_01","diff":"b","trans":"fade","time":null},{"t":"bg","src":"script/scene_12.txt:109","id":"flower_shop_storm_inside_night_lily","trans":"none","time":null,"hold":null,"keep":false},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……","src":"script/scene_12.txt:110","rid":"scene_12_start#46","expr":"surprised","voice":"yukino_e01_0021","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看着那枝花。看了很久，很久。","src":"script/scene_12.txt:111","rid":"scene_12_start#47"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……五年了。第一次，有花。","src":"script/scene_12.txt:112","rid":"scene_12_start#48","expr":"tender","voice":"yukino_e01_0022"},{"t":"endrecall","id":"yukino_r01","src":"script/scene_12.txt:113"},{"t":"cghide","src":"script/scene_12.txt:115","trans":"fade","time":null},{"t":"chara","src":"script/scene_12.txt:116","id":"yukino","expr":"shy","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"choice","src":"script/scene_12.txt:117","opts":[{"text":"「下次，让我来约您。」","fx":[{"n":"aff_yukino","op":"+=","val":2},{"n":"f_yukino_promise","op":"=","val":true}],"target":null,"cond":null,"body":1589,"src":"script/scene_12.txt:118"},{"text":"「……今天的晚饭，我很期待。」","fx":[{"n":"aff_yukino","op":"+=","val":1},{"n":"f_yukino_dinner","op":"=","val":true}],"target":null,"cond":null,"body":1593,"src":"script/scene_12.txt:122"}],"end":1596},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……约姐姐？","src":"script/scene_12.txt:119","rid":"scene_12_start#49","expr":"surprised","voice":"yukino_e01_0023"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。被小哥抢先了呢。","src":"script/scene_12.txt:120","rid":"scene_12_start#50","expr":"shy","voice":"yukino_e01_0024"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的耳朵，红了。这次，是她先移开了视线。","src":"script/scene_12.txt:121","rid":"scene_12_start#51"},{"t":"goto","to":1596,"src":"script/scene_12.txt:122"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"对哦。报酬还没付呢。","src":"script/scene_12.txt:123","rid":"scene_12_start#52","expr":"smile","voice":"yukino_e01_0025"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"姐姐说话，向来算数的。","src":"script/scene_12.txt:124","rid":"scene_12_start#53","expr":"smile","voice":"yukino_e01_0026"},{"t":"goto","to":1596,"src":"script/scene_12.txt:125"},{"t":"ambient","src":"script/scene_12.txt:127","name":"storm_loop","vol":0.25,"fade":2,"muffle":"door"},{"t":"say","who":null,"disp":null,"br":null,"text":"晚饭是店里后间的小锅。土锅里煮着豆腐和蛤蜊。","src":"script/scene_12.txt:128","rid":"scene_12_start#54"},{"t":"se","src":"script/scene_12.txt:129","name":"dish_clink","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"她倒了一小杯梅酒。抿了一口，就放下了。","src":"script/scene_12.txt:130","rid":"scene_12_start#55"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……醉了说的话，算不得数。","src":"script/scene_12.txt:131","rid":"scene_12_start#56","expr":"normal","voice":"yukino_e01_0027"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"所以今晚，不说。","src":"script/scene_12.txt:132","rid":"scene_12_start#57","expr":"tender","voice":"yukino_e01_0028"},{"t":"say","who":"hero","disp":null,"br":"「","text":"……那，下次呢？","src":"script/scene_12.txt:133","rid":"scene_12_start#58"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"下次呀。姐姐清醒的时候，再说给你听。","src":"script/scene_12.txt:134","rid":"scene_12_start#59","expr":"smile","voice":"yukino_e01_0029"},{"t":"if","src":"script/scene_12.txt:135","c":{"v":"f_yukino_promise"},"f":1606},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……是小哥约的那天哦。","src":"script/scene_12.txt:136","rid":"scene_12_start#60","expr":"shy","voice":"yukino_e01_0030"},{"t":"say","who":null,"disp":null,"br":null,"text":"她把我送到楼梯口。雨，小了很多。","src":"script/scene_12.txt:138","rid":"scene_12_start#61"},{"t":"ambientstop","src":"script/scene_12.txt:139","name":"all","fade":2},{"t":"hide","src":"script/scene_12.txt:140","id":"all","trans":"fade","time":null},{"t":"bgmfade","src":"script/scene_12.txt:141","time":2},{"t":"jump","src":"script/scene_12.txt:142","label":"scene_13_start"},{"t":"eof","src":"script/scene_12.txt:143"},{"t":"prefetch","se":["heavy_rain_loop","thunder_distant","phone_vibe","footsteps","cloth_rustle"],"src":"script/scene_13.txt:1"},{"t":"label","src":"script/scene_13.txt:13","name":"scene_13_start"},{"t":"chapter","src":"script/scene_13.txt:14","title":"雪乃","sub":"这次，让我来说"},{"t":"bg","src":"script/scene_13.txt:15","id":"flower_shop_storm_inside_night_lily","trans":"black","time":null,"hold":1,"keep":false},{"t":"bgm","src":"script/scene_13.txt:16","name":"night","vol":1,"fade":2},{"t":"ambient","src":"script/scene_13.txt:17","name":"heavy_rain_loop","vol":0.45,"fade":2,"muffle":"door"},{"t":"say","who":null,"disp":null,"br":null,"text":"五月二日，星期六。晚上八点。又是一场大雨。","src":"script/scene_13.txt:18","rid":"scene_13_start#0"},{"t":"se","src":"script/scene_13.txt:19","name":"thunder_distant","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"打烊后的店里。花瓶里的铃兰，已经换过三次水。","src":"script/scene_13.txt:20","rid":"scene_13_start#1"},{"t":"chara","src":"script/scene_13.txt:21","id":"yukino","expr":"normal","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她在柜台后面讲电话。声音，比平时低。","src":"script/scene_13.txt:22","rid":"scene_13_start#2"},{"t":"say","who":null,"disp":"律师（电话）","br":"「","text":"……那么，海边工作室的转让手续，下周就能办完了。","src":"script/scene_13.txt:23","rid":"scene_13_start#3"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"嗯。麻烦您了。……是的，我想好了。","src":"script/scene_13.txt:24","rid":"scene_13_start#4","expr":"serious","voice":"yukino_h01_0001"},{"t":"se","src":"script/scene_13.txt:25","name":"phone_vibe","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"她挂了电话，长长地吐了一口气。","src":"script/scene_13.txt:26","rid":"scene_13_start#5"},{"t":"label","src":"script/scene_13.txt:28","name":"scene_13_rh01"},{"t":"recall","src":"script/scene_13.txt:29","id":"yukino_rh01","title":"这次，让我来说","chara":"yukino","type":"h","thumb":"yukino_h01","end":1829},{"t":"bg","src":"script/scene_13.txt:32","id":"flower_shop_storm_inside_night_lily","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"bgm","src":"script/scene_13.txt:33","name":"yukino_theme","vol":1,"fade":2},{"t":"ambient","src":"script/scene_13.txt:34","name":"heavy_rain_loop","vol":0.4,"fade":1.5,"muffle":"door"},{"t":"chara","src":"script/scene_13.txt:35","id":"yukino","expr":"smile","outfit":"apron","pos":"center","trans":"fade","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀，被你听见了？","src":"script/scene_13.txt:36","rid":"scene_13_rh01#0","expr":"smile","voice":"yukino_h01_0002"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"小哥今天也好可爱呢。来，让姐姐——","src":"script/scene_13.txt:37","rid":"scene_13_rh01#1","expr":"smile","voice":"yukino_h01_0003"},{"t":"say","who":null,"disp":null,"br":null,"text":"她像往常一样，伸手要捏我的脸。","src":"script/scene_13.txt:38","rid":"scene_13_rh01#2"},{"t":"say","who":null,"disp":null,"br":null,"text":"我握住了她的手腕。","src":"script/scene_13.txt:39","rid":"scene_13_rh01#3"},{"t":"zoom","src":"script/scene_13.txt:40","target":"yukino","time":0.8,"ease":"soft","wait":true,"scale":1.3,"x":0.5,"y":0.3},{"t":"say","who":"hero","disp":null,"br":"「","text":"这次，让我来说。","src":"script/scene_13.txt:41","rid":"scene_13_rh01#4"},{"t":"chara","src":"script/scene_13.txt:42","id":"yukino","expr":"shy","outfit":null,"pos":null,"trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她愣住了。耳朵，一点点红起来。","src":"script/scene_13.txt:43","rid":"scene_13_rh01#5"},{"t":"zoom","src":"script/scene_13.txt:44","target":"stage","time":0.8,"ease":"inout","wait":true,"reset":true,"all":true},{"t":"say","who":"hero","disp":null,"br":"「","text":"我喜欢您。不是被逗的那种喜欢。","src":"script/scene_13.txt:46","rid":"scene_13_rh01#6"},{"t":"say","who":"hero","disp":null,"br":"「","text":"是想站在您旁边，替您看着这些花的那种。","src":"script/scene_13.txt:47","rid":"scene_13_rh01#7"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……犯规。明明一直是姐姐先出手的。","src":"script/scene_13.txt:48","rid":"scene_13_rh01#8","expr":"shy","voice":"yukino_h01_0004","blip":"off"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……这一次，我不先出手。","src":"script/scene_13.txt:49","rid":"scene_13_rh01#9","expr":"shy","voice":"yukino_h01_0038","blip":"off"},{"t":"say","who":null,"disp":null,"br":null,"text":"她低下头，看着自己的左手。","src":"script/scene_13.txt:50","rid":"scene_13_rh01#10"},{"t":"zoom","src":"script/scene_13.txt:51","target":"yukino","time":1.2,"ease":"soft","wait":true,"scale":2,"x":0.565,"y":0.79},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，慢慢地，把那枚银戒指摘了下来。","src":"script/scene_13.txt:52","rid":"scene_13_rh01#11"},{"t":"zoom","src":"script/scene_13.txt:53","target":"stage","time":1,"ease":"inout","wait":true,"reset":true,"all":true},{"t":"say","who":null,"disp":null,"br":null,"text":"放在花瓶旁边。那个曾经空了五年的玻璃花瓶，插着铃兰。","src":"script/scene_13.txt:54","rid":"scene_13_rh01#12"},{"t":"filter","src":"script/scene_13.txt:55","name":"softglow","strength":0.4,"time":1},{"t":"say","who":"yukino","disp":null,"br":"「","text":"这次，是我自己选的。","src":"script/scene_13.txt:56","rid":"scene_13_rh01#13","expr":"tender","voice":"yukino_h01_0005","emph":"zoom"},{"t":"filter","src":"script/scene_13.txt:57","name":"none","strength":0.8,"time":1},{"t":"bg","src":"script/scene_13.txt:59","id":"room_yukino_night","trans":"crossfade","time":null,"hold":null,"keep":false},{"t":"se","src":"script/scene_13.txt:60","name":"footsteps","vol":0.4,"loop":false},{"t":"ambient","src":"script/scene_13.txt:61","name":"heavy_rain_loop","vol":0.3,"fade":1.5,"muffle":"wall"},{"t":"chara","src":"script/scene_13.txt:62","id":"yukino","expr":"tender","outfit":"robe","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"店楼上的小房间。窗外是雨。枕边的小瓶里，插着一枝铃兰。","src":"script/scene_13.txt:63","rid":"scene_13_rh01#14"},{"t":"say","who":null,"disp":null,"br":null,"text":"她在床沿坐下，习惯性地朝我伸出手——","src":"script/scene_13.txt:64","rid":"scene_13_rh01#15"},{"t":"say","who":null,"disp":null,"br":null,"text":"我又一次，轻轻握住了她的手腕。","src":"script/scene_13.txt:65","rid":"scene_13_rh01#16"},{"t":"cg","src":"script/scene_13.txt:66","id":"yukino_h01","diff":null,"trans":"fade","time":1.2},{"t":"hide","src":"script/scene_13.txt:67","id":"yukino","trans":"none","time":null},{"t":"say","who":"yukino","disp":null,"br":"「","text":"我今晚，没碰酒。","src":"script/scene_13.txt:68","rid":"scene_13_rh01#17","expr":"normal","voice":"yukino_h01_0006"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"醉了说的话不算数——所以，现在说的都算。","src":"script/scene_13.txt:69","rid":"scene_13_rh01#18","voice":"yukino_h01_0007"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……请你，好好地看着我。","src":"script/scene_13.txt:70","rid":"scene_13_rh01#19","expr":"shy","voice":"yukino_h01_0008"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我也很清醒。我想要您。……可以吗？","src":"script/scene_13.txt:71","rid":"scene_13_rh01#20"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯。我想要。","src":"script/scene_13.txt:72","rid":"scene_13_rh01#21","expr":"tender","voice":"yukino_h01_0009"},{"t":"if","src":"script/scene_13.txt:75","c":{"o":"==","a":{"v":"rb_style"},"b":{"c":"spoil"}},"f":1671},{"t":"set","src":"script/scene_13.txt:76","fx":[{"n":"f_yukino_spoil","op":"=","val":true}]},{"t":"goto","to":1677,"src":"script/scene_13.txt:77"},{"t":"if","c":{"o":"==","a":{"v":"rb_style"},"b":{"c":"lead"}},"f":1674,"src":"script/scene_13.txt:77"},{"t":"set","src":"script/scene_13.txt:78","fx":[{"n":"f_yukino_lead","op":"=","val":true}]},{"t":"goto","to":1677,"src":"script/scene_13.txt:79"},{"t":"choice","src":"script/scene_13.txt:80","opts":[{"text":"「今晚，交给我。」","fx":[{"n":"f_yukino_spoil","op":"=","val":true}],"target":null,"cond":null,"body":1675,"src":"script/scene_13.txt:81"},{"text":"「一起，慢慢来。」","fx":[{"n":"f_yukino_lead","op":"=","val":true}],"target":null,"cond":null,"body":1676,"src":"script/scene_13.txt:82"}],"end":1677},{"t":"goto","to":1677,"src":"script/scene_13.txt:82"},{"t":"goto","to":1677,"src":"script/scene_13.txt:83"},{"t":"if","src":"script/scene_13.txt:85","c":{"v":"f_yukino_lead"},"f":1683},{"t":"set","src":"script/scene_13.txt:86","fx":[{"n":"g_seen_yukino_rh01_lead","op":"=","val":true}]},{"t":"cg","src":"script/scene_13.txt:87","id":"yukino_h01","diff":"a2","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她笑了。牵起我的手，十指扣紧。","src":"script/scene_13.txt:88","rid":"scene_13_rh01#22"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……一起。嗯，这个词好。","src":"script/scene_13.txt:89","rid":"scene_13_rh01#23","expr":"smile","voice":"yukino_h01_0010","blip":"off"},{"t":"goto","to":1687,"src":"script/scene_13.txt:90"},{"t":"set","src":"script/scene_13.txt:91","fx":[{"n":"g_seen_yukino_rh01_spoil","op":"=","val":true}]},{"t":"cg","src":"script/scene_13.txt:92","id":"yukino_h01","diff":"a","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"她怔了一下。然后，把额头抵在我的肩上。","src":"script/scene_13.txt:93","rid":"scene_13_rh01#24"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……被宠的那一方，原来是这种感觉。","src":"script/scene_13.txt:94","rid":"scene_13_rh01#25","expr":"shy","voice":"yukino_h01_0011","blip":"off"},{"t":"bgm","src":"script/scene_13.txt:96","name":"h_scene","vol":1,"fade":2},{"t":"say","who":null,"disp":null,"br":null,"text":"睡袍的带子，松开了。","src":"script/scene_13.txt:97","rid":"scene_13_rh01#26"},{"t":"hb_begin","id":"yukino_h01_01","src":"script/scene_13.txt:99"},{"t":"se","src":"script/h_blocks/yukino_h01_01.txt:15","name":"cloth_rustle","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"酒红色的缎面，顺着她的肩头滑开了一半。","src":"script/h_blocks/yukino_h01_01.txt:16","rid":"hb:yukino_h01_01#0","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"晚香玉的香气混着雨的湿气，一下子浓了起来。","src":"script/h_blocks/yukino_h01_01.txt:17","rid":"hb:yukino_h01_01#1","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"睡袍底下，什么也没有穿。","src":"script/h_blocks/yukino_h01_01.txt:18","rid":"hb:yukino_h01_01#2","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"哎呀。……小哥的眼睛，不知道往哪里放了？","src":"script/h_blocks/yukino_h01_01.txt:19","rid":"hb:yukino_h01_01#3","expr":"smile","voice":"yukino_h01_0018","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她半垂着眼看我，嘴角只扬起一边。是那个熟悉的、逗人的坏笑。","src":"script/h_blocks/yukino_h01_01.txt:20","rid":"hb:yukino_h01_01#4","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"刚说完「不先出手」，嘴上却还是先逗了一句。大概是改不掉的习惯——不这样，她就不知道该怎么待在这里。","src":"script/h_blocks/yukino_h01_01.txt:21","rid":"hb:yukino_h01_01#5","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"可是，她攥着前襟的手指，在微微发抖。","src":"script/h_blocks/yukino_h01_01.txt:22","rid":"hb:yukino_h01_01#6","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"知道往哪里放。","src":"script/h_blocks/yukino_h01_01.txt:23","rid":"hb:yukino_h01_01#7","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"放在您身上。","src":"script/h_blocks/yukino_h01_01.txt:24","rid":"hb:yukino_h01_01#8","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我轻轻拨开她的手。没有用力，她却自己松开了。","src":"script/h_blocks/yukino_h01_01.txt:25","rid":"hb:yukino_h01_01#9","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"缎面滑落到腰间。台灯下，她的身体完全展开——饱满得沉甸甸的乳房，柔软的腰线，丰腴的臀和大腿。","src":"script/h_blocks/yukino_h01_01.txt:26","rid":"hb:yukino_h01_01#10","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"每一处，都像被细心养护过、开到最好时候的花。","src":"script/h_blocks/yukino_h01_01.txt:27","rid":"hb:yukino_h01_01#11","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……怎么样？姐姐的身体，还拿得出手吧。","src":"script/h_blocks/yukino_h01_01.txt:28","rid":"hb:yukino_h01_01#12","expr":"smile","voice":"yukino_h01_0019","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"很美。","src":"script/h_blocks/yukino_h01_01.txt:29","rid":"hb:yukino_h01_01#13","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不要在这种时候，用那么认真的声音说话。","src":"script/h_blocks/yukino_h01_01.txt:30","rid":"hb:yukino_h01_01#14","expr":"shy","voice":"yukino_h01_0020","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她习惯性地抬手，想来捏我的脸。抬到一半——又停住了。","src":"script/h_blocks/yukino_h01_01.txt:31","rid":"hb:yukino_h01_01#15","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"左手的无名指上，只剩一圈比别处略白的皮肤。","src":"script/h_blocks/yukino_h01_01.txt:32","rid":"hb:yukino_h01_01#16","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看着那道痕迹，慢慢把手放下，搭在我的手背上。","src":"script/h_blocks/yukino_h01_01.txt:33","rid":"hb:yukino_h01_01#17","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……今晚，不先出手。我说过的。","src":"script/h_blocks/yukino_h01_01.txt:34","rid":"hb:yukino_h01_01#18","expr":"tender","voice":"yukino_h01_0021","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻她。从唇，到下巴，到颈侧那一缕散落的酒红色卷发。","src":"script/h_blocks/yukino_h01_01.txt:35","rid":"hb:yukino_h01_01#19","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"吻到左眼下那颗泪痣的时候，她轻轻缩了一下。","src":"script/h_blocks/yukino_h01_01.txt:36","rid":"hb:yukino_h01_01#20","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……那里，不许。","src":"script/h_blocks/yukino_h01_01.txt:37","rid":"hb:yukino_h01_01#21","expr":"shy","voice":"yukino_h01_0022","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"为什么？","src":"script/h_blocks/yukino_h01_01.txt:38","rid":"hb:yukino_h01_01#22","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……会被你，看穿的。","src":"script/h_blocks/yukino_h01_01.txt:39","rid":"hb:yukino_h01_01#23","expr":"shy","voice":"yukino_h01_0023","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我托起她的乳房。那么沉，那么软，从指缝间满溢出来。拇指抚过顶端，它在我指下慢慢挺立，颜色像花苞一样深了一层。","src":"script/h_blocks/yukino_h01_01.txt:40","rid":"hb:yukino_h01_01#24","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她仰起头，喉咙里漏出一声低低的叹息。","src":"script/h_blocks/yukino_h01_01.txt:41","rid":"hb:yukino_h01_01#25","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯。好会呢，{hero}君。跟谁学的？","src":"script/h_blocks/yukino_h01_01.txt:42","rid":"hb:yukino_h01_01#26","expr":"smile","voice":"yukino_h01_0024","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"跟谁也没学。只是一直在看您。","src":"script/h_blocks/yukino_h01_01.txt:43","rid":"hb:yukino_h01_01#27","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她不说话了。","src":"script/h_blocks/yukino_h01_01.txt:44","rid":"hb:yukino_h01_01#28","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我低头含住那里，舌尖一圈一圈地绕。她的手指插进我的头发，先是想把我推开，然后——按得更紧。","src":"script/h_blocks/yukino_h01_01.txt:45","rid":"hb:yukino_h01_01#29","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"睡袍完全散开了。我的手沿着她的小腹往下，滑过柔软的毛发，探进大腿之间。","src":"script/h_blocks/yukino_h01_01.txt:46","rid":"hb:yukino_h01_01#30","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"那里，热得像雨夜里唯一的一处炉火。早已湿透了。","src":"script/h_blocks/yukino_h01_01.txt:47","rid":"hb:yukino_h01_01#31","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……别、别摸得那么仔细……","src":"script/h_blocks/yukino_h01_01.txt:48","rid":"hb:yukino_h01_01#32","expr":"shy","voice":"yukino_h01_0025","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……平时，明明都是姐姐看你脸红的……","src":"script/h_blocks/yukino_h01_01.txt:49","rid":"hb:yukino_h01_01#33","expr":"shy","voice":"yukino_h01_0026","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":"hero","disp":null,"br":"「","text":"今晚，换我看。","src":"script/h_blocks/yukino_h01_01.txt:50","rid":"hb:yukino_h01_01#34","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"指尖分开柔软的花瓣，缓缓滑进去。她的腰一下子绷紧，大腿夹住我的手腕，又一点一点地放松。","src":"script/h_blocks/yukino_h01_01.txt:51","rid":"hb:yukino_h01_01#35","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"我找到那一点，慢慢地揉。她的呼吸碎成一片一片，酒红色的长发在枕上散开，像打翻的葡萄酒。","src":"script/h_blocks/yukino_h01_01.txt:52","rid":"hb:yukino_h01_01#36","hb":"yukino_h01_01"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……啊……嗯……{hero}君……","src":"script/h_blocks/yukino_h01_01.txt:53","rid":"hb:yukino_h01_01#37","expr":"shy","voice":"yukino_h01_0027","blip":"off","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手覆在我的手背上。没有阻止，也没有带路。只是贴着，像在确认这一切是真的。","src":"script/h_blocks/yukino_h01_01.txt:54","rid":"hb:yukino_h01_01#38","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，她轻轻按住了我。","src":"script/h_blocks/yukino_h01_01.txt:55","rid":"hb:yukino_h01_01#39","hb":"yukino_h01_01"},{"t":"say","who":null,"disp":null,"br":null,"text":"四目相对。窗外的雨，忽然安静了一拍。","src":"script/h_blocks/yukino_h01_01.txt:56","rid":"hb:yukino_h01_01#40","hb":"yukino_h01_01"},{"t":"hb_end","id":"yukino_h01_01","src":"script/scene_13.txt:99"},{"t":"se","src":"script/scene_13.txt:101","name":"phone_vibe","vol":0.4,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"枕边，她的手机震了一下。","src":"script/scene_13.txt:102","rid":"scene_13_rh01#27"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了一眼，把它翻过来，屏幕朝下。","src":"script/scene_13.txt:103","rid":"scene_13_rh01#28"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……今晚，不管它。","src":"script/scene_13.txt:104","rid":"scene_13_rh01#29","expr":"tender","voice":"yukino_h01_0012","blip":"off"},{"t":"hb_begin","id":"yukino_h01_02","src":"script/scene_13.txt:106"},{"t":"say","who":null,"disp":null,"br":null,"text":"手机在枕边，屏幕朝下，再也没有亮起来。","src":"script/h_blocks/yukino_h01_02.txt:11","rid":"hb:yukino_h01_02#0","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……来吧。让姐姐，好好地——","src":"script/h_blocks/yukino_h01_02.txt:12","rid":"hb:yukino_h01_02#1","expr":"smile","voice":"yukino_h01_0028","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她说到一半，停住了。","src":"script/h_blocks/yukino_h01_02.txt:13","rid":"hb:yukino_h01_02#2","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"那个游刃有余的语调，像一件穿惯了的外衣，被她自己脱了下来。","src":"script/h_blocks/yukino_h01_02.txt:14","rid":"hb:yukino_h01_02#3","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……不对。不是『姐姐』。","src":"script/h_blocks/yukino_h01_02.txt:15","rid":"hb:yukino_h01_02#4","expr":"tender","voice":"yukino_h01_0029","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"是我。……桐谷雪乃，想要你。","src":"script/h_blocks/yukino_h01_02.txt:16","rid":"hb:yukino_h01_02#5","expr":"tender","voice":"yukino_h01_0030","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我也想要您。不是被逗的那种。","src":"script/h_blocks/yukino_h01_02.txt:17","rid":"hb:yukino_h01_02#6","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她笑了一下，眼眶却红了。","src":"script/h_blocks/yukino_h01_02.txt:18","rid":"hb:yukino_h01_02#7","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她躺下，膝盖慢慢分开。我抵上去，前端陷进那片湿热的柔软里。","src":"script/h_blocks/yukino_h01_02.txt:19","rid":"hb:yukino_h01_02#8","hb":"yukino_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"如果难受，就告诉我。","src":"script/h_blocks/yukino_h01_02.txt:20","rid":"hb:yukino_h01_02#9","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯。我会说的。……五年了，可能，会有一点……","src":"script/h_blocks/yukino_h01_02.txt:21","rid":"hb:yukino_h01_02#10","expr":"shy","voice":"yukino_h01_0031","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我一点一点地推进去。","src":"script/h_blocks/yukino_h01_02.txt:22","rid":"hb:yukino_h01_02#11","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯、……啊……！","src":"script/h_blocks/yukino_h01_02.txt:23","rid":"hb:yukino_h01_02#12","expr":"shy","voice":"yukino_h01_0032","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的指甲陷进我的手臂。里面又热又紧，像是在小心地确认什么，又像是怎么也不肯放开。","src":"script/h_blocks/yukino_h01_02.txt:24","rid":"hb:yukino_h01_02#13","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我停下来等她。她闭着眼深深地呼吸，然后睁开——","src":"script/h_blocks/yukino_h01_02.txt:25","rid":"hb:yukino_h01_02#14","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……没关系。……全部，给我。","src":"script/h_blocks/yukino_h01_02.txt:26","rid":"hb:yukino_h01_02#15","expr":"tender","voice":"yukino_h01_0033","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"直到完全没入。她的身体轻轻一颤，像一朵花，在雨里终于完全打开。","src":"script/h_blocks/yukino_h01_02.txt:27","rid":"hb:yukino_h01_02#16","hb":"yukino_h01_02"},{"t":"cg","src":"script/h_blocks/yukino_h01_02.txt:28","id":"yukino_h01","diff":"b","trans":"fade","time":0.8,"hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"酒红色的长发散在枕上。枕边的小瓶里，那一枝铃兰垂着小小的白铃铛。","src":"script/h_blocks/yukino_h01_02.txt:29","rid":"hb:yukino_h01_02#17","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我们的手交握着，十指扣紧，压在铃兰旁边。","src":"script/h_blocks/yukino_h01_02.txt:30","rid":"hb:yukino_h01_02#18","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我开始动。很慢，很深。每一次都退到快要离开，再整根没进去。","src":"script/h_blocks/yukino_h01_02.txt:31","rid":"hb:yukino_h01_02#19","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她仰起脖子，泪痣在灯下一闪一闪。","src":"script/h_blocks/yukino_h01_02.txt:32","rid":"hb:yukino_h01_02#20","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯……嗯……好深……{hero}君，好深……","src":"script/h_blocks/yukino_h01_02.txt:33","rid":"hb:yukino_h01_02#21","expr":"shy","voice":"yukino_h01_0034","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"丰满的乳房随着节奏晃动。她想用手臂去遮，被我握住手腕，轻轻放回枕边。","src":"script/h_blocks/yukino_h01_02.txt:34","rid":"hb:yukino_h01_02#22","hb":"yukino_h01_02"},{"t":"say","who":"hero","disp":null,"br":"「","text":"不要遮。我想好好看着您。","src":"script/h_blocks/yukino_h01_02.txt:35","rid":"hb:yukino_h01_02#23","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……被、被这样看着……好奇怪……","src":"script/h_blocks/yukino_h01_02.txt:36","rid":"hb:yukino_h01_02#24","expr":"shy","voice":"yukino_h01_0035","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……明明一直都是我……在看别人的……","src":"script/h_blocks/yukino_h01_02.txt:37","rid":"hb:yukino_h01_02#25","expr":"shy","voice":"yukino_h01_0036","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她说「我」。不是「姐姐」。","src":"script/h_blocks/yukino_h01_02.txt:38","rid":"hb:yukino_h01_02#26","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"湿润的声音一下一下地响着，被窗外的雨声盖住一半。她的脚趾蜷起来，大腿内侧绷得发抖。","src":"script/h_blocks/yukino_h01_02.txt:39","rid":"hb:yukino_h01_02#27","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"我吻她的泪痣。这一次，她没有躲。","src":"script/h_blocks/yukino_h01_02.txt:40","rid":"hb:yukino_h01_02#28","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……{hero}。","src":"script/h_blocks/yukino_h01_02.txt:41","rid":"hb:yukino_h01_02#29","expr":"tender","voice":"yukino_h01_0037","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"没有「君」。她自己好像也愣了一下，然后像是认了命似的，又叫了一遍。","src":"script/h_blocks/yukino_h01_02.txt:42","rid":"hb:yukino_h01_02#30","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"{hero}……{hero}……","src":"script/h_blocks/yukino_h01_02.txt:43","rid":"hb:yukino_h01_02#31","expr":"tender","voice":"yukino_h01_0039","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她不再笑了。不再说半真半假的话，不再问「脸红了？」。","src":"script/h_blocks/yukino_h01_02.txt:44","rid":"hb:yukino_h01_02#32","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"她只是看着我。眼泪顺着眼角滑进酒红色的发间，内里一阵一阵地缠紧我。","src":"script/h_blocks/yukino_h01_02.txt:45","rid":"hb:yukino_h01_02#33","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……喜欢。","src":"script/h_blocks/yukino_h01_02.txt:46","rid":"hb:yukino_h01_02#34","expr":"tender","voice":"yukino_h01_0040","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"好喜欢你。……这句，不是逗你的。","src":"script/h_blocks/yukino_h01_02.txt:47","rid":"hb:yukino_h01_02#35","expr":"tender","voice":"yukino_h01_0041","blip":"off","hb":"yukino_h01_02"},{"t":"say","who":null,"disp":null,"br":null,"text":"那是她第一次，不带任何保护色地，把真心递到我手里。","src":"script/h_blocks/yukino_h01_02.txt:48","rid":"hb:yukino_h01_02#36","hb":"yukino_h01_02"},{"t":"hb_end","id":"yukino_h01_02","src":"script/scene_13.txt:106"},{"t":"cg","src":"script/scene_13.txt:109","id":"yukino_h01","diff":"c","trans":"fade","time":0.8},{"t":"hb_begin","id":"yukino_h01_03","src":"script/scene_13.txt:110"},{"t":"say","who":null,"disp":null,"br":null,"text":"我抱紧她。","src":"script/h_blocks/yukino_h01_03.txt:11","rid":"hb:yukino_h01_03#0","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的双腿缠上我的腰，手臂环住我的脖子，整个人贴上来，像是怕我会被雨带走。","src":"script/h_blocks/yukino_h01_03.txt:12","rid":"hb:yukino_h01_03#1","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……再、再抱紧一点……不要松开……","src":"script/h_blocks/yukino_h01_03.txt:13","rid":"hb:yukino_h01_03#2","expr":"shy","voice":"yukino_h01_0042","blip":"off","hb":"yukino_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"不松开。","src":"script/h_blocks/yukino_h01_03.txt:14","rid":"hb:yukino_h01_03#3","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"我加快了节奏。她的喘息越来越短，越来越乱，指尖在我背上胡乱地抓。","src":"script/h_blocks/yukino_h01_03.txt:15","rid":"hb:yukino_h01_03#4","hb":"yukino_h01_03"},{"t":"se","src":"script/h_blocks/yukino_h01_03.txt:16","name":"thunder_distant","vol":0.3,"loop":false},{"t":"say","who":null,"disp":null,"br":null,"text":"远处响了一声雷。她却只是把我抱得更紧。","src":"script/h_blocks/yukino_h01_03.txt:17","rid":"hb:yukino_h01_03#5","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……{hero}……要、……要去了……","src":"script/h_blocks/yukino_h01_03.txt:18","rid":"hb:yukino_h01_03#6","expr":"shy","voice":"yukino_h01_0043","blip":"off","hb":"yukino_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"我也是……雪乃。","src":"script/h_blocks/yukino_h01_03.txt:19","rid":"hb:yukino_h01_03#7","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"第一次，我只叫了她的名字。","src":"script/h_blocks/yukino_h01_03.txt:20","rid":"hb:yukino_h01_03#8","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她睁大眼睛，然后——哭着笑了出来。","src":"script/h_blocks/yukino_h01_03.txt:21","rid":"hb:yukino_h01_03#9","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……嗯。一起……留在我这里……","src":"script/h_blocks/yukino_h01_03.txt:22","rid":"hb:yukino_h01_03#10","expr":"tender","voice":"yukino_h01_0044","blip":"off","hb":"yukino_h01_03"},{"t":"flash","src":"script/h_blocks/yukino_h01_03.txt:23","color":"white","time":0.4,"count":1},{"t":"say","who":null,"disp":null,"br":null,"text":"她在我怀里剧烈地颤抖起来，背弓起，内里一阵阵死死地绞紧。我再也忍不住，抵在她最深处，把一切都留在了那里。","src":"script/h_blocks/yukino_h01_03.txt:24","rid":"hb:yukino_h01_03#11","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的指甲在我背上留下几道细细的痕。很久，很久，都没有放开。","src":"script/h_blocks/yukino_h01_03.txt:25","rid":"hb:yukino_h01_03#12","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"……","src":"script/h_blocks/yukino_h01_03.txt:26","rid":"hb:yukino_h01_03#13","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"喘息慢慢平复下来。","src":"script/h_blocks/yukino_h01_03.txt:27","rid":"hb:yukino_h01_03#14","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她把脸埋进我的颈窝。晚香玉的香气淡了，剩下的是她自己的味道——温热的，像雨后泥土里的花。","src":"script/h_blocks/yukino_h01_03.txt:28","rid":"hb:yukino_h01_03#15","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……原来，被人认真地看着……是这种感觉啊。","src":"script/h_blocks/yukino_h01_03.txt:29","rid":"hb:yukino_h01_03#16","expr":"tender","voice":"yukino_h01_0045","blip":"off","hb":"yukino_h01_03"},{"t":"say","who":"hero","disp":null,"br":"「","text":"以后，每天都这样看。","src":"script/h_blocks/yukino_h01_03.txt:30","rid":"hb:yukino_h01_03#17","hb":"yukino_h01_03"},{"t":"say","who":"yukino","disp":null,"br":"「","text":"……哎呀。这下，脸红的变成我了。","src":"script/h_blocks/yukino_h01_03.txt:31","rid":"hb:yukino_h01_03#18","expr":"shy","voice":"yukino_h01_0046","blip":"off","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"她小声地笑着。手指却还扣在我的指缝间，没有松开。","src":"script/h_blocks/yukino_h01_03.txt:32","rid":"hb:yukino_h01_03#19","hb":"yukino_h01_03"},{"t":"bgmfade","src":"script/h_blocks/yukino_h01_03.txt:33","time":1},{"t":"wait","src":"script/h_blocks/yukino_h01_03.txt:34","time":0.5},{"t":"say","who":null,"disp":null,"br":null,"text":"窗外的雨声，一点一点地远了。","src":"script/h_blocks/yukino_h01_03.txt:35","rid":"hb:yukino_h01_03#20","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"枕边的铃兰，轻轻晃了一下。","src":"script/h_blocks/yukino_h01_03.txt:36","rid":"hb:yukino_h01_03#21","hb":"yukino_h01_03"},{"t":"say","who":null,"disp":null,"br":null,"text":"然后，一切都安静了下来。","src":"script/h_blocks/yukino_h01_03.txt:37","rid":"hb:yukino_h01_03#22","hb":"yukino_h01_03"},{"t":"hb_end","id":"yukino_h01_03","src":"script/scene_13.txt:110"},{"t":"fadeout","src":"script/scene_13.txt:112","color":"black","time":1.5},{"t":"bgm","src":"script/scene_13.txt:113","name":"yukino_theme","vol":1,"fade":2},{"t":"ambientstop","src":"script/scene_13.txt:114","name":"heavy_rain_loop","fade":3},{"t":"wait","src":"script/scene_13.txt:115","time":1},{"t":"bg","src":"script/scene_13.txt:116","id":"room_yukino_night","trans":"none","time":null,"hold":null,"keep":false},{"t":"fadein","src":"script/scene_13.txt:117","time":1.5},{"t":"say","who":null,"disp":null,"br":null,"text":"雨，停了。","src":"script/scene_13.txt:118","rid":"scene_13_rh01#30"},{"t":"if","src":"script/scene_13.txt:119","c":{"v":"f_yukino_lead"},"f":1820},{"t":"cg","src":"script/scene_13.txt:120","id":"yukino_ "scene_14_ayaka#14"},{"t":"say","who":null,"disp":null,"br":null,"text":"叶樱的夜风，吹过河面。","src":"script/scene_14.txt:47","rid":"scene_14_ayaka#15"},{"t":"say","who":"hero","disp":null,"br":"（","text":"这个春天，我搬进了樱见町。","src":"script/scene_14.txt:48","rid":"scene_14_ayaka#16"},{"t":"ambientstop","src":"script/scene_14.txt:49","name":"all","fade":2},{"t":"chapter","src":"script/scene_14.txt:50","title":"Demo 到此结束","sub":"《夜樱与邻人》正式版 敬请期待"},{"t":"ending","src":"script/scene_14.txt:51","id":"demo_ayaka","title":"夜樱的秘密"},{"t":"label","src":"script/scene_14.txt:54","name":"scene_14_makoto"},{"t":"bg","src":"script/scene_14.txt:55","id":"street_sakura_night","trans":"black","time":null,"hold":1,"keep":false},{"t":"bgm","src":"script/scene_14.txt:56","name":"sakura","vol":1,"fade":2},{"t":"ambient","src":"script/scene_14.txt:57","name":"wind_loop","vol":0.3,"fade":2},{"t":"chara","src":"script/scene_14.txt:58","id":"makoto","expr":"normal","outfit":"suit","pos":"center","trans":"fade","time":null},{"t":"say","who":null,"disp":null,"br":null,"text":"五月五日。夜里九点。我们从车站，并肩走回夕灯荘。","src":"script/scene_14.txt:59","rid":"scene_14_makoto#0"},{"t":"say","who":null,"disp":null,"br":null,"text":"樱花早就谢了。河边的树，全是新叶。","src":"script/scene_14.txt:60","rid":"scene_14_makoto#1"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"……现在几点？","src":"script/scene_14.txt:61","rid":"scene_14_makoto#2","voice":"makoto_ed1_0001"},{"t":"say","who":"hero","disp":null,"br":"「","text":"九点零二分。","src":"script/scene_14.txt:62","rid":"scene_14_makoto#3"},{"t":"say","who":null,"disp":null,"br":null,"text":"她看了一眼自己的手表。","src":"script/scene_14.txt:63","rid":"scene_14_makoto#4"},{"t":"say","who":"makoto","disp":null,"br":"「","text":"九点零二分。","src":"script/scene_14.txt:64","rid":"scene_14_makoto#5","expr":"smile","voice":"makoto_ed1_0002"},{"t":"say","who":null,"disp":null,"br":null,"text":"一分不差。两块表，走着同一个时间。","src":"script/scene_14.txt:65","rid":"scene_14_makoto#6"},{"t":"say","who":null,"disp":null,"br":null,"text":"她的手，碰 // 通用工具
const Gal = window.Gal = window.Gal || {};

Gal.el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
Gal.esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 可被「快进/点击」打断的等待
Gal.sleep = (ms) => new Promise(res => {
  if (ms <= 0 || Gal.fast()) return res();
  const t = setTimeout(done, ms); const h = () => done();
  function done() { clearTimeout(t); Gal.off('interrupt', h); res(); }
  Gal.on('interrupt', h);
});

// 播放一次 CSS 动画类（与 art/ui/ui.js 的 GalUI.play 相同约定）
Gal.play = (el, cls, dur, keep) => new Promise(res => {
  if (Gal.fast() || dur === 0) { if (keep) el.classList.add(cls); return res(); }
  if (dur != null) el.style.setProperty('--fx-dur', dur + 'ms');
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);

  const onEnd = (e) => { if (e.target === el) done(); };
  el.addEventListener('animationend', onEnd); Gal.on('interrupt', done);

// 文本变量展开：返回片段数组 [{t:'text',v}|{t:'wait',v:秒}]
Gal.expandText = (text, hero) => {
  const segs = []; let buf = ''; let em = false;
  const s = text.replace(/\{\{/g, '\u0001').replace(/\}\}/g, '\u0002');
  s.replace(/\{([^{}]*)\}|([^{]+|\{)/g, (m, tag, plain) => {
    if (plain !== undefined) { buf += plain; return ''; }
    if (tag === 'hero' || tag === 'name') buf += hero.given;
    else if (tag === 'hero_family' || tag === 'sei') buf += hero.family;
    else if (tag === 'hero_full') buf += hero.family + ' ' + hero.given;
    else if (tag === 'n') buf += '\n';
    else if (tag === 'em' || tag === '/em') { if (buf) segs.push({ t: 'text', v: buf, em }); buf = ''; em = tag === 'em'; }
    else if (/^w=/.test(tag)) { segs.push({ t: 'text', v: buf, em }); buf = ''; segs.push({ t: 'wait', v: parseFloat(tag.slice(2)) || 0 }); }
    return '';
  });
  segs.push({ t: 'text', v: buf, em });
  return segs.map(x => x.t === 'text' ? { t: 'text', em: x.em || undefined, v: x.v.replace(/\u0001/g, '{').replace(/\u0002/g, '}') } : x).filter(x => x.t !== 'text' || x.v);
};
Gal.plainText = (text, hero) => Gal.expandText(text, hero).filter(x => x.t === 'text').map(x => x.v).join('');

/* ==== src/engine/store.js ==== */
// 本地存储：设置 / 全局进度（已读、CG、回想、g_ 变量）。存档槽在下一阶段实现。
(() => {
  const Gal = window.Gal; const KEY = 'yozakura_v1';
  const mem = {};
  const ls = { get(k) { try { return JSON.parse(localStorage.getItem(KEY + ':' + k)); } catch (e) { return mem[k] ?? null; } },
    set(k, v) { mem[k] = v; try { localStorage.setItem(KEY + ':' + k, JSON.stringify(v)); } catch (e) { /* 隐私模式等 */ } } };
  const DEF_CFG = { textSpeed: 6, autoSpeed: 5, vol: { master: 0.8, bgm: 0.7, se: 0.8, voice: 1.0 }, windowAlpha: 0.8, skipUnread: false, blip: true, voiceInterrupt: false };
  const cfg = Object.assign({}, DEF_CFG, ls.get('cfg') || {}); cfg.vol = Object.assign({}, DEF_CFG.vol, cfg.vol || {});
  const glob = Object.assign({ read: {}, cg: {}, recall: {}, vars: {}, endings: {}, hero: null }, ls.get('global') || {});
  let tSave = 0; const flush = () => { clearTimeout(tSave); tSave = setTimeout(() => ls.set('global', glob), 300); };
  Gal.store = {
    ls, cfg, glob, DEF_CFG,
    saveCfg() { ls.set('cfg', cfg); Gal.emit('cfg'); },
    markRead(rid) { if (!glob.read[rid]) { glob.read[rid] = 1; flush(); } },
    isRead(rid) { return !!glob.read[rid]; },
    unlockCg(id, diff) { const g = glob.cg[id] = glob.cg[id] || []; if (!g.includes(diff)) { g.push(diff); flush(); return true; } return false; },
    unlockRecall(id) { if (!glob.recall[id]) { glob.recall[id] = 1; flush(); } },
    setG(n, v) { glob.vars[n] = v; flush(); },
    flush: () => ls.set('global', glob),

})();

            if (e.target.closest('.del')) { if (await ui.confirm(`删除存档 No.${n}？`, '删除')) { localStorage.removeItem('yozakura_v1:save:' + n); render(); } return; }
